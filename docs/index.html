<style>
/* Layout: one calm reading column; sticky top bar (brand, save status, tabs); three palettes × light/dark. Default palette 石榴紅. */
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#1c2533; --muted:#6b778a; --line:#e1e7f0;
  --acc:#3b6ea8; --onacc:#ffffff; --soft:#e8eff9; --verse:#eef3fa; --bar:#8fb0d8; --ok:#3a8a63; --warn:#b86e1f;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --latin:Georgia,"Times New Roman",serif;
  --fs:18px;
  --k:1; /* 字體大小倍率＝字體大小÷18（小 .89／中 1／大 1.11／特大 1.22），整個網站的字都跟著縮放 */
  --acct:var(--acc); /* 文字用的強調色；黃色配色另設較深的金色，讓字看得清楚 */
}
:root[data-palette="a"]{--bg:#f4f8f7;--card:#ffffff;--ink:#1e2b29;--muted:#667a76;--line:#dfe9e6;--acc:#2f7f73;--onacc:#ffffff;--soft:#e7f2ef;--verse:#edf5f3;--bar:#7fb3a8;--ok:#2f7f73;--warn:#b86e1f}
:root[data-palette="r"]{--bg:#ffffff;--card:#ffffff;--ink:#222222;--muted:#76696a;--line:#ece4e4;--acc:#7a1f2b;--onacc:#ffffff;--soft:#f6eeee;--verse:#f7f3ea;--bar:#b08a4a;--ok:#3a8a63;--warn:#b86e1f}
:root[data-palette="y"]{--bg:#ffffff;--card:#ffffff;--ink:#2b2617;--muted:#7a7158;--line:#f1e7c8;--acc:#f2b705;--onacc:#2b2200;--acct:#a26f00;--soft:#fff5d1;--verse:#fff8e0;--bar:#f2b705;--ok:#3a8a63;--warn:#c0631a}
:root[data-palette="c"]{--bg:#f7f6fb;--card:#ffffff;--ink:#24223a;--muted:#73708b;--line:#e7e5f2;--acc:#5f5aa2;--onacc:#ffffff;--soft:#efeef9;--verse:#f1f0f9;--bar:#a9a5d6;--ok:#3a8a63;--warn:#b86e1f}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0f141c;--card:#161d28;--ink:#e3e9f2;--muted:#95a1b3;--line:#243042;--acc:#90b8ea;--onacc:#0f141c;--soft:#1b2636;--verse:#18212f;--bar:#5b7fae;--ok:#7cc7a0;--warn:#e0a865;color-scheme:dark}
  :root[data-palette="a"]:not([data-theme="light"]){--bg:#111917;--card:#18221f;--ink:#e2ece9;--muted:#93a6a1;--line:#26332f;--acc:#86cdbd;--onacc:#111917;--soft:#1d2c28;--verse:#1a2925;--bar:#4f8f82;--ok:#86cdbd;--warn:#e0a865}
  :root[data-palette="r"]:not([data-theme="light"]){--bg:#171112;--card:#201819;--ink:#ece6e3;--muted:#a89c9a;--line:#352a2b;--acc:#d6b06e;--onacc:#171112;--soft:#2a2020;--verse:#241c1c;--bar:#9a7536;--ok:#7cc7a0;--warn:#e0a865}
  :root[data-palette="y"]:not([data-theme="light"]){--bg:#15140f;--card:#1e1c15;--ink:#f1ecdc;--muted:#ada591;--line:#332f22;--acc:#f5c84a;--onacc:#1a1606;--acct:#f5c84a;--soft:#2a261a;--verse:#24211a;--bar:#c99a1e;--ok:#7cc7a0;--warn:#e0a865}
  :root[data-palette="c"]:not([data-theme="light"]){--bg:#14131c;--card:#1c1b27;--ink:#e8e6f3;--muted:#a19eb8;--line:#2c2a3c;--acc:#b7b2ec;--onacc:#14131c;--soft:#232136;--verse:#211f30;--bar:#6f6aae;--ok:#7cc7a0;--warn:#e0a865}
}
:root[data-theme="dark"]{--bg:#0f141c;--card:#161d28;--ink:#e3e9f2;--muted:#95a1b3;--line:#243042;--acc:#90b8ea;--onacc:#0f141c;--soft:#1b2636;--verse:#18212f;--bar:#5b7fae;--ok:#7cc7a0;--warn:#e0a865;color-scheme:dark}
:root[data-theme="dark"][data-palette="a"]{--bg:#111917;--card:#18221f;--ink:#e2ece9;--muted:#93a6a1;--line:#26332f;--acc:#86cdbd;--onacc:#111917;--soft:#1d2c28;--verse:#1a2925;--bar:#4f8f82;--ok:#86cdbd;--warn:#e0a865}
:root[data-theme="dark"][data-palette="r"]{--bg:#171112;--card:#201819;--ink:#ece6e3;--muted:#a89c9a;--line:#352a2b;--acc:#d6b06e;--onacc:#171112;--soft:#2a2020;--verse:#241c1c;--bar:#9a7536;--ok:#7cc7a0;--warn:#e0a865}
:root[data-theme="dark"][data-palette="y"]{--bg:#15140f;--card:#1e1c15;--ink:#f1ecdc;--muted:#ada591;--line:#332f22;--acc:#f5c84a;--onacc:#1a1606;--acct:#f5c84a;--soft:#2a261a;--verse:#24211a;--bar:#c99a1e;--ok:#7cc7a0;--warn:#e0a865}
:root[data-theme="dark"][data-palette="c"]{--bg:#14131c;--card:#1c1b27;--ink:#e8e6f3;--muted:#a19eb8;--line:#2c2a3c;--acc:#b7b2ec;--onacc:#14131c;--soft:#232136;--verse:#211f30;--bar:#6f6aae;--ok:#7cc7a0;--warn:#e0a865}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
/* iPhone：輸入框字小於 16px 時，點下去 Safari 會自動放大畫面且不縮回，所以所有輸入框至少 16px */
input,select,textarea{font-size:max(16px,1em)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:calc(15px*var(--k));line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-family:var(--serif);font-weight:700;font-size:calc(19px*var(--k));color:var(--acct);letter-spacing:.14em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand .logo{width:28px;height:28px;flex:none}
.chip{border:1px solid currentColor;background:transparent;border-radius:999px;padding:1px 9px;font-size:calc(12px*var(--k));white-space:nowrap}
.chip.warn{color:var(--warn)} .chip.ok{color:var(--ok)}
.tabs{margin-left:auto;display:flex;gap:2px}
.tabs button{touch-action:manipulation}
.tabs button{white-space:nowrap;border:none;background:none;padding:6px 10px;border-radius:999px;font-size:calc(14px*var(--k));color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.tabs .ti{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--onacc)}
.pop{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0 0;font-size:calc(14px*var(--k));display:grid;gap:8px}
main{padding-block:18px 90px}
.card{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:20px;display:grid;gap:10px}
.card h2{margin:0;font-size:calc(17px*var(--k))}
.card p{margin:0}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--onacc);padding:8px 14px;border-radius:8px;font-size:calc(14px*var(--k))}
.btn.ghost{background:transparent;color:var(--acct)}
.btn.small{padding:5px 10px;font-size:calc(13px*var(--k))}
.btn.plain{border-color:var(--line);background:var(--card);color:var(--ink)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:calc(13px*var(--k))}
.num{background:var(--acc);color:var(--onacc);border-radius:4px;padding:1px 9px;font-weight:700;letter-spacing:.05em;font-variant-numeric:tabular-nums}
.tagline{color:var(--muted)}
.art{border-top:2px solid var(--acc);padding-top:10px}
.art h1{font-family:var(--serif);font-weight:700;letter-spacing:.04em;font-size:calc(var(--fs) + 9px);line-height:1.35;margin:8px 0 14px;text-wrap:balance}
.reading{font-family:var(--serif);font-size:var(--fs);line-height:1.95}
.reading p{margin:0 0 .9em;text-indent:2em;text-align:justify}
.verse{background:var(--verse);border-left:3px solid var(--bar);padding:10px 14px;margin:14px 0;border-radius:0 8px 8px 0}
.verse .zh{font-weight:600}
.verse .en{font-family:var(--latin);font-style:italic;font-size:calc(var(--fs) - 3px);color:var(--muted);line-height:1.55;margin-top:4px}
.hymn{border:1px dashed var(--bar);border-radius:8px;padding:10px 14px;margin:18px 0;font-size:calc(var(--fs) - 2px);line-height:1.8}
.hymn .ht{font-family:var(--sans);font-weight:700;font-size:calc(14px*var(--k));color:var(--acct);margin-bottom:4px}
.lyric{display:flex;flex-wrap:wrap;column-gap:1.6em}
.lyric span:empty{display:none}
.lyric span.n{color:var(--acct);min-width:1.4em}
.done-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
.check{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-size:calc(15px*var(--k))}
.check[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.nav{display:flex;gap:8px}
.backtoday{margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px}
.opener{text-align:center;padding:20px 8px 24px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.opener .k{color:var(--acct);letter-spacing:.3em;font-size:calc(13px*var(--k))}
.opener .t{font-family:var(--serif);font-weight:700;font-size:calc(30px*var(--k));color:var(--acct);letter-spacing:.2em;margin:4px 0}
.opener .verse{border:none;text-align:center;border-radius:8px;max-width:520px;margin:12px auto 0;font-family:var(--serif)}
.opener .ref{font-size:calc(13px*var(--k));color:var(--acct);margin-top:4px}
.opener .eref{font-size:calc(12px*var(--k));color:var(--muted);font-family:var(--latin);font-style:italic}
.note{font-size:calc(12.5px*var(--k));color:var(--muted)}
.theme-block{margin-bottom:22px}
.theme-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--acc);padding-bottom:4px;margin-bottom:6px}
.theme-head h2{font-family:var(--serif);font-size:calc(20px*var(--k));color:var(--acct);margin:0}
.theme-head .c{font-size:calc(12.5px*var(--k));color:var(--muted);font-variant-numeric:tabular-nums}
.prog{flex:1 1 80px;height:5px;background:var(--line);border-radius:3px;overflow:hidden;min-width:60px;align-self:center}
.prog i{display:block;height:100%;background:var(--ok)}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));column-gap:16px}
.list button{width:100%;text-align:left;background:none;border:none;padding:6px 4px;display:flex;gap:8px;align-items:baseline;border-bottom:1px dotted var(--line);font-size:calc(14.5px*var(--k));min-width:0}
.list button:hover{background:var(--soft)}
.list .n{font-variant-numeric:tabular-nums;color:var(--acct);font-size:calc(12.5px*var(--k));flex:none}
.list .tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.list .d{flex:none;color:var(--ok);font-size:calc(12px*var(--k))}
.list .today .tt{color:var(--acct);font-weight:700}
.sbox{display:flex;gap:8px;margin-bottom:14px}
.inp{flex:1 1 8em;min-width:0;width:0;font:inherit;font-size:max(16px,calc(16px*var(--k)));padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.hit{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.hit .h{font-weight:700}
.hit .s{font-family:var(--serif);font-size:calc(14px*var(--k));color:var(--muted);margin-top:2px}
mark{background:color-mix(in srgb,var(--acc) 25%,transparent);color:inherit;border-radius:2px}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
/* 上面 minmax(0,1fr)：卡片內容一律不能比卡片寬（iPhone 的輸入框預設很寬，曾把整張卡片撐出螢幕） */
.panel h3{margin:0;font-size:calc(15px*var(--k))}
.panel .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.panel label.l{font-size:calc(14px*var(--k));color:var(--muted);min-width:5.5em}
.datebox{position:relative;display:inline-flex;align-items:center;font-size:max(16px,calc(16px*var(--k)));padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer}
/* 日期顯示成 yyyy/MM/dd：系統的日期欄位格式跟著手機設定改不了，所以自己顯示文字，透明的日期欄位蓋在上面，點了照樣跳出系統的日期選擇器 */
.datebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;font-size:16px;cursor:pointer}
.datebox:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:none;padding:6px 12px;font-size:calc(14px*var(--k))}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--onacc)}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 12px 6px 6px;font-size:calc(14px*var(--k))}
.sw button[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.sw i{display:inline-flex;width:30px;height:30px;border-radius:7px;overflow:hidden}
.sw i b{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 6px 24px color-mix(in srgb,var(--ink) 15%,transparent);display:grid;gap:8px;z-index:30;font-size:calc(14px*var(--k))}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:calc(13px*var(--k));flex-wrap:wrap}
.steps{margin:0;padding-left:1.3em;display:grid;gap:4px}
@media (max-width:520px){ .art h1{font-size:calc(var(--fs) + 6px)} .brand{font-size:calc(17px*var(--k));letter-spacing:.08em} .brand .logo{width:24px;height:24px} }
/* 窄螢幕（手機）：分頁列移到螢幕下方（像一般 App），圖示＋字 */
@media (max-width:700px){
  header.bar{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;margin:0;gap:0;justify-content:space-around;background:var(--bg);box-shadow:0 -2px 10px color-mix(in srgb,var(--ink) 6%,transparent);border-top:1px solid var(--line);padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px))}
  .tabs button{flex:1;max-width:96px;flex-direction:column;gap:2px;padding:5px 0 4px;border-radius:12px;font-size:calc(12px*var(--k))}
  .tabs .ti{width:24px;height:24px}
  .tabs button[aria-pressed="true"]{background:var(--soft);color:var(--acct);font-weight:700}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:no-preference){ .view{animation:fade .2s ease} @keyframes fade{from{opacity:.5}to{opacity:1}} }
.a2box{display:grid;gap:12px;margin-top:10px}
/* 動畫裡的「重新播放」層級是 10，用 isolation 把它關在動畫裡，不會蓋到下方分頁列（Android 曾發生） */
.a2hs{isolation:isolate;position:relative;z-index:0}
.a2box .one{font-size:calc(16px*var(--k));padding:10px 18px;text-decoration:none;display:inline-block}
.a2box details summary{cursor:pointer;color:var(--muted);font-size:calc(13.5px*var(--k))}
/* 按鈕、分頁、選項的字一律不換行（字體特大時也一樣；放不下時整顆按鈕換到下一行，不是字斷開） */
.btn,.seg button,.sw button,.check,.chip,.tabs button,.a2hs .ctl button{white-space:nowrap}
.seg{max-width:100%}
.fsprev{font-family:var(--serif);font-size:var(--fs);line-height:1.8;background:var(--verse);border-left:3px solid var(--bar);border-radius:0 8px 8px 0;padding:8px 12px}
.a2box details[open] summary{margin-bottom:12px}
/* ===== 共用：手機外框、手指、重新播放、步驟說明 ===== */
.a2hs{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
@media (max-width:520px){.a2hs{grid-template-columns:1fr;justify-items:center}}
.a2hs .phone{position:relative;width:200px;height:400px;border-radius:30px;background:#111;padding:8px;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 18%,transparent)}
.a2hs .scr{position:relative;width:100%;height:100%;border-radius:23px;overflow:hidden;background:#f2f2f7;font-family:-apple-system,Roboto,"PingFang TC","Noto Sans TC","Noto Sans CJK TC",sans-serif;color:#111}
.a2hs .ly{position:absolute;inset:0;transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
.a2hs i.lg{font-style:normal;background:var(--acc);color:var(--onacc,#fff);display:grid;place-items:center;flex:none}

<script id="data" type="application/json">[{"n":"早起","i":0,"intro":[["V","每早晨這些都是新的；你的信實，極其廣大。（耶利米哀歌三章二十三節）"],["E","They are new every morning; great is Your faithfulness. (Lamentations 3:23)"]],"a":[{"no":1,"t":"清早享受主","b":[["V","耶和華阿，早晨你必聽我的聲音；早晨我必向你陳明我的心意，並要守望。（詩5:3）"],["E","O Jehovah, in the morning You will hear my voice; in the morning I will set forth my words in order to You, and I will watch. (Psalm 5:3)"],["P","有一位聖徒曾說過幾句很好的話：「一個人愛主的心有多少，第一就看他在床和主中間的揀選。你愛你的床多，還是愛主多？愛床多，就多睡一點；愛主多，就早起一點。」這位聖徒到死，沒有一天是在五點以後起床的，幾十年都是這樣。"],["P","為什麼基督徒應當清早起來？因為清晨是人遇見主最好的時候。健康的人，總是越早起越好。因為清早是遇見主，與主有來往、與主有交通最好的時候。嗎哪總是在日出以前收取的。日頭一出來，嗎哪融化了，就吃不到了。信徒在神面前要得著屬靈的培養，要有屬靈的交通，要有屬靈的糧食，就得早一點起來。起遲了就吃不到嗎哪。在清早的時候，神特別要將祂屬靈的食物，聖潔的交通，分給祂的兒女。誰太遲來拿，就拿不到。"],["P","清早，是一天最好的時候。我們不應當把最好的時候用在別的事情上，應當把我們一天之中最好的時候，清晨的時候，用在神面前。（初信造就）"]]},{"no":2,"t":"早起為著認識神","b":[["V","耶和華阿，我…呼求你；早晨我的禱告要達到你面前。（詩88:13）"],["E","But I, O Jehovah, have cried out to You; and in the morning my prayer comes before You. (Psalm 88:13)"],["P","有好些神的兒女過著一種病態的生活，並不是因為他們有什麼別的屬靈難處，就是因為他們起得太遲。有許多神的兒女，奉獻也好，熱心也好，愛心也好，就是因為他們起得太遲，就活不出基督徒正常的生活。我們沒有認識一個會禱告的人是遲起來的，我們沒有認識一個與神交通親密的人是遲起來的。所有認識神的人，都是經常的在清早起來，到神面前去交通。"],["P","箴言二十六章十四節說，「門在樞紐上轉動，懶惰人在床上也是如此。」懶惰的人一直在床上轉，一直離不開床。他轉到裡面去，也是睡在床上；轉到外面來，也是睡在床上。翻來翻去，就是在床上。許多人，就是捨不得那張床。翻到裡面，那張床是可愛的；翻到外面，那張床又是可愛的。他總是愛睡，離不開床。但是，要學習事奉神，要學習作好基督徒，就得天天早起，總要清早起來。（初信造就）"]]},{"no":3,"t":"每早晨得復興","b":[["V","義人的途徑好像黎明的光，越照越明，直到日午。（箴4:18）"],["E","The path of the righteous is like the light of dawn, which shines brighter and brighter until the full day. (Proverbs 4:18)"],["P","在馬太十三章四十三節，主將得勝者比作太陽，在他們父的國裡發光。每早晨太陽都重新升起。我們若要成為得勝者，就是太陽，我們也必須每早晨起來得主復興。箴言四章十八節說，「義人的途徑好像黎明的光，越照越明，直到日午。」我們應當跟隨太陽，每早晨得復興，有新的開始。我們的路，就好像黎明的光，越照越明，直到日午。基督徒的生活不是僅有一日。我們是日日在更新。這就是說我們必須日復一日得主復興。我們昨天早晨也許有一次復興，可是今天早晨我們還需要另一次復興，明天早晨更需要另一次復興。每一年，我們都需要三百六十五個復興，好叫我們日日都得更新。（日日在更新）"],["H","羨慕－為主捨己（詩305）"],["L","我求你賜每日恩澤，|使我能常受教；"],["L","心能從裡與外調和，|當我與你契交；"],["L","滿意只佔微小旁側，|若你能得榮耀。"]]},{"no":4,"t":"先見神的面","b":[["V","我趁天未亮呼求；我仰望了你的言語。（詩119:147）"],["E","I anticipated the dawn and cried out; I hoped in Your words. (Psalm 119:147)"],["P","司布真（Charles Spurgeon, 1834～1892）非常看重早晨與主交通。他說，「熱心愛主的人，都很重視早晨與主交通，他們有一個屬靈的規律：沒有看見神的面，絕不先見人的面。」"],["P","又有一位主的僕人說，「每天最早的三十分鐘，是個人與主交通的時候。在我尚未聽到別人的聲音之前，必須先聽到主的聲音，就是我所愛的妻子，也不能例外。當然我更不能先將我的腦子裝滿無線電收音機聲，或新聞報紙之後，才進到神的面前。並且一天之中，只有這一次的禱告是不夠的，必須時時回到主前，不過清晨的三十分鐘乃是全天最好的時間。」"],["H","羨慕－活在主面前（詩290）"],["L","主耶穌，我羨慕活在你面前，|在早晨，在晚上，只有一世間；"],["L","不讓我心快樂，若我在愛慕、|在感覺、或思想無你的事物。"],["L","每一刻，每一天，不論何痛苦，|當世上正沒有什麼可鼓舞，"],["L","當嘆息正不禁，眼淚流滴滴，|主，擦乾我眼淚，平靜我嘆息。"]]},{"no":5,"t":"先為裡面的人尋求食物","b":[["V","我趁夜更未換，將眼睜開，為要默想你的話語。（詩119:148）"],["P","慕勒（George Muller, 1805～1898）將近去世之時，寫了一段關於他自己的經歷，非常寶貴。他說，他多年來每天早晨都是先禱告，後讀經。他禱告的時間是從清早起床開始，一直到吃早餐的時候；但他要禱告到一刻鐘或半點鐘之後，才能感覺神的同在。後來他把次序更換，先讀經，後禱告。讀經成為他起床後的第一件事。"],["P","他讀神的話，默想神的話，從其中尋找他裡面的人所需要的食物，不到幾分鐘，他就感覺神的同在，結果就是承認自己的軟弱，或是感恩，或是讚美，或是祈求。因此他的結論是，神的兒女，每日早晨第一件事，應當先為裡面的人尋求食物，裡面的人獨一的食物就是神的話語。若是沒有神的話語，禱告就會成為空的。"]]},{"no":6,"t":"與耶穌見面事事輕鬆","b":[["V","神阿，我的魂切慕你，如鹿切慕溪水。（詩42:1）"],["E","As the hart pants after the streams of water, so my soul pants for You, O God. (Psalm 42:1)"],["P","石美玉醫師是中國第一位留美的女醫師，身材嬌小，體重不到四十五公斤。但她一面從事醫治人身體疾病的工作，一面拯救人的靈魂，孜孜不倦，許多人從她得到幫助。有人問她：「你怎能擔負這麼巨大的責任，每日工作不倦呢？」她的答覆是：「我要不是在每早晨作事以前先去見耶穌的面，我就支持不住；與耶穌見了面，事事就輕鬆了。」"],["H","與主相見在清晨（補425）"],["L","曙光初現，心清靈明，|與主相見在清晨，"],["L","回到靈中，進入交通，|何等甘甜，何等親近；"],["L","祂聖名，祂恩言，|是我每晨新供應；"],["L","飢渴盡除，全人明亮，|讚美主，恩典夠我用！"]]},{"no":7,"t":"先調正中音","b":[["V","我的魂渴想神，就是活神。我幾時才可以來朝見神呢？（詩42:2）"],["E","My soul thirsts for God, for the living God. When will I come and appear before God? (Psalm 42:2)"],["P","一日清晨，一位主的僕人進入一座大教堂，默讀主的話語，向主禱告。不久，聽見大風琴那裡傳出琴聲，先是單音，再是一句，後是一首。他就走到大風琴那裡，看看聲音從何而來。原來有位修琴的人，正在那裡調音。於是這位神的僕人就問他：「這樣大的一座風琴，上面琴鍵如此之多，你怎樣調音，使它們音色和諧呢？」修琴的人回答說，「我先將最中間的『C』音調到正確，然後再使其他的琴鍵都與它調和。」"],["P","信徒必須早起，與神親近，同祂調至和諧，然後才能在一天中與所接觸的人、事、物和諧。戴德生也說過：「那有先開音樂會，然後才調和樂器呢？每天讀經、禱告，先與神調和，然後再與人見面辦事。」"]]},{"no":8,"t":"忽然止步","b":[["V","他還說話的時候，看哪，有一朵光明的雲彩遮蓋他們；看哪，又有聲音從雲彩裡出來，說，這是我的愛子，我所喜悅的，你們要聽祂。（太17:5）"],["E","While he was still speaking, behold, a bright cloud overshadowed them, and behold, a voice out of the cloud, saying, This is My Son, the Beloved, in whom I have found My delight. Hear Him! (Matthew 17:5)"],["P","一位著名的昆蟲學家和他的一位商人朋友在野地散步。昆蟲學家忽然止步，走向附近樹林裡去，像在尋找一件東西；但他的朋友不知他在尋找什麼。不久，昆蟲學家找到看起來像是蟋蟀的小蟲，給他的朋友看，並說，他聽見那隻蟲的鳴叫聲，所以止步去找。他的朋友覺得十分希奇，那隻蟲發出的聲音非常微小，他根本聽不見，昆蟲學家竟然聽得見。不久，他們離開野地，走在熱鬧馬路旁的人行道上。那位商人也忽然止步，彎身拾起一個五分的銀幣。昆蟲學家卻一路走去，絲毫未聽見那銀幣落地的聲音。"],["P","由此可見，什麼樣的人就聽什麼樣的聲音；屬世界的人就聽世界的聲音，屬神的人就聽神的聲音。一位愛主的基督徒會聽裡面神微小的聲音，並且必定早起先聽神的聲音，不願在此之先聽到世界的聲音。"]]},{"no":9,"t":"跪聽孩子哭聲","b":[["V","但你們的眼睛是有福的，因為看見了；你們的耳朵也是有福的，因為聽見了。（太13:16）"],["E","But blessed are your eyes because they see, and your ears because they hear. (Matthew 13:16)"],["P","在美洲大沙漠上，有一個印第安小孩失蹤了。眾人成群出去尋找，找了許久沒有結果。最後，尋找的人全都失望，灰心的回去了。惟獨一人沒有灰心，就是那個小孩的母親。她說，「我要一直找他，到死不休。」她在沙漠上，走來走去，最後竟用膝蓋跪爬行。因此她的耳朵與地接近，聽見了小孩微弱的哭聲。她就立刻跳起來，說，「我聽到了他的哭聲。」隨即順著聲音的方向前去尋找。不久，母子互相擁抱，轉哀為喜。"],["P","我們若是愛主，必會常常俯伏在祂腳前，聆聽祂的聲音；尤其早起，更是如此。"],["H","慈愛天父保守一夜（兒504）"],["L","慈愛天父，保守一夜，|清晨起來，首先感謝；"],["L","新的一天，交託你手，|一直引我跟隨你走。"]]},{"no":10,"t":"浮到水面呼吸空氣","b":[["V","願你吸引我，我們就快跑跟隨你－王帶我進了他的內室－我們必因你歡喜快樂。（歌1:4）"],["E","Draw me; we will run after you — The king has brought me into his chambers — We will be glad and rejoice in you. (Song of Songs 1:4)"],["P","有一個人坐在河岸上，看見一群魚兒張著嘴浮在水面，起初以為它們是在找小魚吃。後來他才知道，它們是在那裡呼吸空氣。雖然它們在水底下也可呼吸，然而有時必須上到水面。"],["P","基督徒也和這些魚一樣；在他們工作的時候，雖然也可和神親近，但在一天之內還得劃出時間，單獨進入內室親近神。清晨這一段時間是單獨親近神最好的時間。"],["H","主耶穌我喜歡看見這清晨（兒503）"],["L","主耶穌，我喜歡看見這清晨，|百花開，小鳥叫，都在讚美神，"],["L","我的心真快樂，當我親近你，|我唱歌，我禱告，要討你歡喜；"],["L","感謝你，又賜我這美麗一天，|懇求你，保守我活在你面前，"],["L","每一刻，每一時，求你不稍離，|直等到晚星起，仍在你懷裡！"]]},{"no":11,"t":"系網的長絲","b":[["V","因你有力量，心中想往錫安大道的，這人便為有福。（詩84:5）"],["E","Blessed is the man whose strength is in You, in whose heart are the highways to Zion. (Psalm 84:5)"],["P","一隻蜘蛛在穀倉裡結網，它從屋頂一條椽子上垂下一條長絲來。它的網便靠這條長絲支持。它產了卵，孵化出來許多小蜘蛛。這群小蜘蛛在網上開心的戲耍。有隻小蜘蛛偶然瞥見那條從房頂椽子上垂下來的長絲。它不曉得這條長絲的重要性，而把長絲弄斷了，結果造成全網的破滅。"],["P","基督徒也有一條長絲通到天上，靠此維持基督徒的生活。早起晨興就是與天上交通，吸取能力，維繫一天的生活；否則，一天的生活就不行。"],["H","與主相見在清晨（補425）"],["L","黎明即起，受主餵養，|我得復興在清晨，"],["L","新的照耀，新的加力，|得享基督作我福分；"],["L","祂慈愛，祂憐憫，|每個早晨都新鮮，"],["L","我全人再次得更新，|憑信、愛跟隨主向前！"]]},{"no":12,"t":"天天操練","b":[["V","我的榮耀阿，你當醒起；琴瑟阿，你們當醒起！我要極早醒起。（詩57:8）"],["E","Awake, my glory; awake, O harp and lyre! I will awaken the dawn. (Psalm 57:8)"],["P","波蘭著名音樂家帕得勒說，「我如果一天不練習鋼琴，手便生澀，但只有我個人感覺得出；我若間斷兩天不練琴，我的家人就能聽出彈奏的差別；我若停止練習三天，我的朋友能夠知道；倘或我七天手不彈琴，連一般聽眾也瞞不過。」"],["P","早起晨興也是如此。只要一天沒有弄好，你自己知道；二天沒有弄好，你的妻子會知道；三天沒有弄好，全世界都會知道。"],["H","清早起來就晨興親近主（兒834）"],["L","清早起來就晨興親近主，|全家一同來過健康生活；"],["L","呼主名，禱主話，享豐富，|靈飽足，整天靈中聯於主。"],["L","交通關切靈敞開，|若有虧欠就悔改，"],["L","彼此相愛多擔待，|充滿主同在。"]]},{"no":13,"t":"不肯起來開門","b":[["V","看哪，我站在門外叩門；若有聽見我聲音就開門的，我要進到他那裡，我與他，他與我要一同坐席。（啟3:20）"],["E","Behold, I stand at the door and knock; if anyone hears My voice and opens the door, then I will come in to him and dine with him and he with Me. (Revelation 3:20)"],["P","在南印度有一個窮人，他原是個懶人，不會賺錢。他負債太多，無力償還。債主們想要把他下在監裡。同村有一位慈善的財主，聽說他這種困難的情形，就想幫助他。但他不願叫人知道，就在夜裡帶著五千盧比，（足以還債有餘，）和一些食物，到他門前敲門。財主敲了一會兒，但這懶人卻不起來開門，他認為這人不配受此幫助，就回家去了。第二天早晨，懶人聽見這事，非常懊悔，然而還有什麼用呢？"],["P","神在清晨把嗎哪賜給以色列人，他們必須早起拾取。基督徒不能懶惰，必須早起讀經，領受神所賜的生命糧食；否則就會過貧窮的生活。問題不是神不給，乃是人懶惰，不肯起來接受。"]]},{"no":14,"t":"醒來大聲讚美神","b":[["V","我一生要讚美耶和華；我還活著的時候，要歌頌我的神。（詩146:2）"],["E","I will praise Jehovah while I live; I will sing psalms to my God while I yet have being. (Psalm 146:2)"],["P","有一位弟兄作見證說，「我有一個心願，就是早起晨興，我多次為此禱告，但是早上總起不來。我每天早晨醒來之後，又想再睡一會兒，那知一睡，就睡過了頭，再醒過來，已經很晚。起來之後，匆忙梳洗，準備上學，再沒時間來晨興。後來經過幾位弟兄的交通，利用幾種方法操練早起，都不成功。一次聽見一位弟兄說，當神垂聽我們禱告之時，就該感謝讚美神。我就覺得，每天早晨能按時醒來，是神聽了我的禱告；我豈不也該好好的讚美神麼？於是第二天早晨一醒過來，我就大聲感謝讚美神。奇怪，經過這樣一感謝，一讚美，也就不想再多睡一會兒了。多年以來，我一直是用這個方法，天天毫無困難的起來晨興了。」"]]},{"no":15,"t":"桑頓的機器被","b":[["V","願愛你的人如日頭出現，光輝烈烈。（士5:31）"],["E","May those who love Him be like the sun when it rises in its might. (Judges 5:31)"],["P","英國有一位傳道人，名叫桑頓（Thornton），對於機械很有研究。他剛信主時，很想早起，就是爬不起來。後來他就利用鬧鐘，掛上一根繩子，穿過滑輪，往上面去，在上面繫上石頭，再穿過釘在天花板上的滑輪，垂下來繫住棉被的四角。早上鬧鐘一響，繩子脫離鬧鐘，石頭就從上面落了下來。石頭一落下來，棉被就被提了上去。沒有被子，就只好起床了。因為他起先只用鬧鐘，鬧鐘響完還是不起來，他就想，不能單用鬧鐘，總得把棉被掀起來，這樣就不能不起來了。一連幾年的工夫，他天天晚上把機器預備好，早晨鬧鐘一響，就把棉被拉到天花板上。因他這樣約束自己，所以神重用他，使他作工很有能力。"],["H","經歷基督－與祂交通（詩417）"],["L","夜影尚存，晨光未現，|重新來到恩主面前；"],["L","祂在裡面放明、照耀，|我得看見祂的榮顏。"],["L","向我發言、給我看見：|祂的豐富是為今天；"],["L","甜美、歡樂，將祂享受，|所有飢餓全變飽滿。"]]}]},{"n":"讀經","i":1,"intro":[["V","你的話是我腳前的燈，是我路上的光。（詩篇一一九篇一〇五節）"],["E","Your word is a lamp to my feet and a light to my path. (Psalm 119:105)"]],"a":[{"no":16,"t":"神的話是我們屬靈的食糧","b":[["V","耶和華萬軍之神阿，我得著你的言語，就當食物吃了；你的言語成了我心中的歡喜快樂；因我是稱為你名下的人。（耶15:16）"],["E","Your words were found and I ate them, and Your word became to me the gladness and joy of my heart, for I am called by Your name, O Jehovah, God of hosts. (Jeremiah 15:16)"],["P","聖經裡至少有三個事例，啟示了人吃神的話這件事。頭一個是耶利米，他說，「我得著你的言語，就當食物吃了。」（耶十五16。）吃東西不僅是接受，並且是吸收。吸收是把東西接受到你裡面，消化它，使它成為你的一部分。第二個事例，記載在以西結書，說到申言者以西結吃神的話。（三1～3。）第三個事例是在啟示錄第十章，也說到使徒約翰吃神的話。（10。）"],["P","耶利米說，「你的言語成了我心中的歡喜快樂。」（耶十五16。）話吃進來，就成為心中的歡喜快樂。神的話是一種享受；經過吃，吸收，就成為我們裡面的歡喜，外面的快樂。難怪大衛說，「你的言語在我上膛何等甘美！在我口中比蜜更甜！」（詩一一九103。）吃神的話的確是一種享受，在我們口中比蜜更甜。"],["P","從以上經節我們能領會，神的話不僅是為著給我們學習的，更是為著給我們嘗、吃、享受和消化的。主耶穌甚至說，神的話就是屬靈的食物：「經上記著，『人活著不是單靠食物，乃是靠神口裡所出的一切話。』」（太四4。）凡從神口裡所出的一切話，都是屬靈的食物，用來餵養我們的。這就是我們基督徒靠著養生的食物。（禱讀神的話）"]]},{"no":17,"t":"慕勒清早享受靈糧的經歷","b":[["V","耶穌…回答說，經上記著，「人活著不是單靠食物，乃是靠神口裡所出的一切話。」（太4:4）"],["E","He answered and said, It is written, Man shall not live on bread alone, but on every word that proceeds out through the mouth of God. (Matthew 4:4)"],["P","慕勒弟兄曾對人分享，他清早享受靈糧的經歷。他說，「我所當作最要緊的事，乃是讀神的話，默想神的話，使我的心能得著安慰、激勵、警戒、責備和教訓。當我這樣默想神的話時，我的心就能與主有經歷上的交通。所以，我每天清早默想新約。當我用幾句話，求主祝福祂寶貴的話語之後，我所最先作的，就是默想神的話。我在一節聖經中尋求，要從其中得著祝福；並非為著在公眾面前的講道，也不是為要傳講我所默想的話，乃是要使我自己的靈魂得著糧食。我所遇見、不改變的結果，就是幾分鐘之後，我就開始認罪，或者感謝，或者代禱，或者懇求。這樣作的結果，天天都有許多的認罪、感謝、懇求或代禱，調和在我的默想裡，使我裡面的人，常有一種能感覺得出來的滋養和供應。到了早餐時間，很少有例外的，我心的光景如果不是喜樂，就是平安。」"],["P","神的兒女每天早晨所當作的第一件事，就是要為著他裡面的人去得糧食。我們外面的人不能不吃東西而作工；照樣，每天早晨，我們裡面的人也當有糧食。什麼是裡面的人的糧食呢？乃是神的話。（如何享受靈糧）"]]},{"no":18,"t":"地圖背面一個大人","b":[["V","並且知道你是從小明白聖經；這聖經能使你藉著相信基督耶穌，有得救的智慧。（提後3:15）"],["E","And that from a babe you have known the sacred writings, which are able to make you wise unto salvation through the faith which is in Christ Jesus. (2 Timothy 3:15)"],["P","某晚，一位父親想要安靜看書，小女兒則在旁邊吵著要玩。父親想出一個方法，拿了一把剪刀，將一張世界地圖剪成許多小片，然後對小女孩說，「孩子，若是你把這些碎片小心拼合，便有一張世界地圖出來。」父親以為小女孩必要花去許多時間，才能拼得出來，好讓他能安靜多看些書。"],["P","可是小女孩只花些許時間，就把地圖拼好。父親一看，果然在地板上鋪好了一張世界地圖。父親十分驚奇，就問她怎能拼得如此之快。小女孩回答：「因為這張地圖的背面畫著一個大人，我把這個大人的像先拼好，然後再翻過來，這張地圖便出來了。」"],["P","照樣，聖經乃是啟示一位偉大人物耶穌基督，人若找到了祂，一切問題便可迎刃而解。"]]},{"no":19,"t":"沒有基督的講章","b":[["V","你們查考聖經，因你們以為其中有永遠的生命，為我作見證的就是這經。（約5:39）"],["E","You search the Scriptures, because you think that in them you have eternal life; and it is these that testify concerning Me. (John 5:39)"],["P","有一個青年，在一位多年忠心的神僕人面前講道。講完之後，他就來問這位老人：「先生！你看我的講章如何？」老人回答說，「很沒有意味。」青年人不服氣的說，「沒有意味？我費了多少工夫才預備好的。」「阿！那就不足怪了。」青年人又問：「你說沒有意味，是不是因為聖經題目講的不對？」「不，講的很對。」「那你為何說沒有意味？是我用的比喻不適當麼？」「不，很適當。」青年人忍不住，再問：「那麼你說沒有意味，到底是什麼意思呢？」老人回答說，「因為裡頭沒有基督。」青年人說，「這題目裡本來就沒有基督，我們總不能僅講基督；題目是什麼，就當講什麼。」老人回答說，「弟兄，你不知道，全英國每一座城，每一個鄉村，都有一條道路通到倫敦麼？」青年人說，「是阿。」老人說，「聖經中無論那一個題目，都有一條大道，引到聖經的中心，就是基督身上。我傳道幾十年，沒有遇見一個題目，不能引到基督身上的。」"],["P","聖經是給基督作見證的；所以，讀經應該讀出基督，而不該只讀一些教訓和道理。"]]},{"no":20,"t":"空白聖經","b":[["V","我將你的話珍藏在心裡，免得我得罪你。（詩119:11）"],["E","In my heart I have treasured up Your word that I might not sin against You. (Psalm 119:11)"],["P","羅傑是英國著名的傳道人。有一次他見證說，「一天我在家中，打開聖經一看，全是空白的，一點文字也沒有。我很希奇，就到鄰居那裡，看見他們的聖經，也是空白的。當時基督徒中就亂了起來，因為世界所有的聖經全都成了空白。神將祂賜給人類最寶貝的話收回去了。於是，各處都急忙去尋求那些熟悉聖經的人，請他們將所記得的寫出來；然而，湊齊後也不足數。信徒因而懊悔平時沒有詳細查讀聖經；有的甚至哭泣，懇切求神，仍將祂的話賜給人。"],["P","就在我心裡最難受時，忽然醒來，原來是一夢。晨光由玻璃窗射進屋內，當看見聖經擺在桌上時，我急忙下床，打開聖經一看，只見一字不缺，我便流淚感恩，虔誠讀神的話語。」"],["H","主阿我一心尋求你（兒519）"],["L","主阿，我一心尋求你，|別叫我偏離你命令；"],["L","我將你話藏在心裡，|免得我得罪你。"]]},{"no":21,"t":"藏在心裡不能奪去","b":[["V","當用各樣的智慧，讓基督的話豐豐富富的住在你們裡面，用詩章、頌辭、靈歌，彼此教導，互相勸戒，心被恩感歌頌神。（西3:16）"],["E","Let the word of Christ dwell in you richly in all wisdom, teaching and admonishing one another with psalms and hymns and spiritual songs, singing with grace in your hearts to God. (Colossians 3:16)"],["P","某城裡有一個回教出身的女子，有一次她聽見福音，被主遇見，就得救了。後來，有一位基督徒送了她一本新舊約全書。她以聖經為至寶，就用一個盒子藏在她的衣箱裡；經常在四下無人時，單獨在房子裡一段一段的細讀。有一天，那位送她聖經的基督徒知道這事，就問她為什麼這樣用功？她說，「我的親屬若知道我有聖經，就必定會拿去，不准我讀；所以我要把聖經讀熟，藏在心裡，這樣他們就奪不去了。」"],["H","讀經－從主話得餵養（詩589）"],["L","「活著不是單靠食物，|乃靠神口所出的話；」"],["L","因此須將神話|當作生命之糧，時常吃下。"]]},{"no":22,"t":"佩帶聖經","b":[["V","我今日所吩咐你的這些話，要放在心上。…你也要將這些話系在手上為記號，戴在額上為頭帶。（申6:6,8）"],["E","And these words, which I command you today, shall be upon your heart; …and you shall bind them on your hand as a sign, and they shall be as frontlets between your eyes. (Deuteronomy 6:6,8)"],["P","在英國伯明罕有位女學生，在佈道會裡受感而接受救主。得救後，她就立志要去救別人。後來她升入大學，經常對同學講論主耶穌。有一次，她和同學談論福音，想要引聖經證明耶穌的話；但那時她身邊沒有帶聖經，就走上樓去取。不料下樓後，同學已經走了。她很懊悔失去了大好機會。從那天起，她定意把聖經放在衣袋裡，以備不時之需。當時許多人都仿效她，一一佩帶聖經。"],["P","然而，信徒不僅需要經常帶著聖經，更要讓神的話豐豐富富的住在心裡，以備不時能供應人的需要，也能隨時供應自己的需要。"],["H","這寶貴的聖經（兒523）"],["L","一|這寶貴的聖經，|是神的話可信，"],["L","|我靠這話得站立穩固，|我最愛這聖經。"],["L","二|聖經是神的話，|是我腳前的燈，"],["L","|聖經也是我路上的光，|我最愛這聖經。"]]},{"no":23,"t":"沾光走路","b":[["V","你的話是我腳前的燈，是我路上的光。（詩119:105）"],["E","Your word is a lamp to my feet and a light to my path. (Psalm 119:105)"],["P","早期四川的交通不便，常常需要走石板路，或是山上的羊腸小徑。若在夜間，又下著雨，走這樣的路，真是非有亮光不可；有時即使是一點小火光也是寶貴的。一次，有位弟兄就在這樣一個雨夜走路。他住在山頂，當時手裡沒有手電筒，連一點小火光也沒有。在黝黑的夜裡，路上都是爛泥漿和小水窪；他又戴著一副不合度數的眼鏡，摸索著前進，真是舉步維艱。正在這時，忽然看見後面遠處有人拿著燈火過來。他就決意停下來，讓那人先行，這樣便可沾他一點光。可是走不到幾步，那人轉入另一條小路上，他只好「望火興嘆」。沒過多久，又有另一個人，拿著手電筒趕上了他。他緊跟在那人後面，希望趕快結束這次可怕艱苦的行路。然而，亮光究竟不在自己手中；所以不到半里路，已被那人遠遠拋在後面。就這樣沾了好幾個人的光，直到深夜，方才滿身泥漿，疲憊不堪的回到家。"],["P","聖經說，「黑夜已深，白晝將近。」（羅十三12。）信徒處於今天的世代，是在黑夜裡趕路，必須自己有亮光。可惜許多信徒，在神的話語上自己沒有亮光和啟示，總是沾著別人的「光」行路，聽聽這人，跟跟那人，始終不會直接跟從神。弟兄姊妹，只有神的話是我們腳前的燈，路上的光；我們必須殷勤虔讀祂的話語。"]]},{"no":24,"t":"從未打開看過","b":[["V","耶和華的教訓潔淨，…耶和華的典章真實，…都比金子可羨慕，且比極多的精金可羨慕。（詩19:9-10）"],["E","The fear of Jehovah is pure, …the judgments of Jehovah are truth…More to be desired are they than gold, even much refined gold. (Psalm 19:9-10)"],["P","美國紐澤西有一位老人，從聖經中找到五千元美金的現鈔。一八七四年，在他姑媽遺留給他的遺囑上說，「我親愛的侄兒司提反，我將我家中的聖經，並其中所有的給你；其餘的產業可以變賣，好還我當還的債，料理我的後事，剩下的也歸你享用。」結果，他所得餘下的產業不過數百元，不久就用完；以後過了三十五年貧苦的日子。"],["P","他姑媽所留下的聖經是皮面的，外面有銅鈕釦著，其中夾著五千美金，他並不知道。這本聖經整天擺在桌上；他有時看一眼，有時用手摸一摸，卻從未打開看過。後來，實在生活不下去，想要遷到他兒子家去住。就在整理行李，準備將聖經裝箱的時候，打開聖經一看，才發現這個寶藏。"],["P","那時他心中的懊悔，無法言喻。三十五年空空過去，若是早發現，好好運用這筆款項，到現在不知會有多大的富足；若是放在銀行生息，也可得到五萬美金。"],["P","許多信徒所以貧窮，虛度年日，就是因為不讀聖經，沒有發現其中的寶藏。"]]},{"no":25,"t":"老爺我要聖經","b":[["V","你口中的律法與我有益，勝過千萬的金銀。（詩119:72）"],["E","The law of Your mouth is better to me than thousands of pieces of gold and silver. (Psalm 119:72)"],["P","有個基督徒，在他八十大壽的時候，要送一些禮物給他的用人。他把用人都叫了來，手裡拿著一本皮面金邊，極其好看的聖經，問廚子說，「我這裡有一本聖經，又有二十塊錢，隨你們選，要那一樣。」廚子回答：「先生，我不大認識字；我要錢吧。」於是老人給他二十塊錢。又問老用人：「張媽，你認識字，給你聖經吧。」張媽說，「老爺，我終日忙碌，沒有工夫讀，還是請你給我錢吧。」末了問到一個掃地送信的少年人：「給你二十塊錢，拿回家去，請你媽媽為你作一件新衣服。」小孩子說，「老爺，我要聖經。」老人驚訝的說道：「你又不認識字，你要聖經作什麼？」小孩子說，「我母親天天念聖經給我聽。她的聖經已很破舊；我總想有了錢，買一本好的送給她。現在這本好看的聖經，要是送給她，比二十塊錢，她更要歡喜得多呢！」老人說，「我的好孩子，願神祝福你。」說著就將聖經遞給他。小孩子打開一看，內中還有百元鈔票一張。別人看了，都目瞪口呆，後悔得很。"],["P","許多信徒不喜歡聖經，不知漏掉多少祝福；你若愛慕它，讀它，必從其中得著無限的豐富。"]]},{"no":26,"t":"又是一次歡聚","b":[["V","求你用臉光照僕人，又將你的律例教訓我。（詩119:135）"],["E","Cause Your face to shine on Your servant, and teach me Your statutes. (Psalm 119:135)"],["P","德國有一位著名的大學教授，名叫本柏格爾，學問淵博，生活又為全校學生所欽佩。有幾個好奇的學生，很想探聽他所以有這樣生活的秘訣；其中有位學生就去藏匿在他的書房裡，看他每天晚上作些什麼。教授走進書房，通常為時已晚，他似乎很疲累，坐了下來，打開聖經，十分虔誠的讀了一個鐘頭，然後低頭默禱。禱告後，他合起聖經說，「主耶穌，我們又一次歡聚。」原來這位教授是藉著讀經與主歡聚，吸取生命的供應，活出祂的見證。"],["H","讀經－尋求主的話（詩585）"],["L","求主靜中發言，|當我在等候；"],["L","我心在此靜聽，|望允我所求。"]]},{"no":27,"t":"加爾博士利用花生","b":[["V","耶和華的律法完全，能甦醒人的魂；耶和華的法度可靠，能使愚蒙人有智慧。（詩19:7）"],["E","The law of Jehovah is perfect, restoring the soul; the testimony of Jehovah is faithful, making the simple wise. (Psalm 19:7)"],["P","黑人科學家加爾博士，自幼生長在美國南部，常勸他的黑人同胞，除了種棉花，還要再種其他農作物。這樣，若是棉花歉收，才不至完全失望。後來，他終於說服他們種植花生。出乎意料之外，花生收成太好，除了食用，剩餘甚多。他們便去請教加爾。加爾是個虔誠的基督徒，便去求神賜他智慧，叫他知道如何利用這些花生。"],["P","神垂聽他的禱告，叫他發現花生不但可以榨油，還可以用在作麵包、咖啡、雪糕、牛奶、染料、藥品等百種以上的東西。後來，他應邀出席美國國會的一個特別會議。主席問他：「加爾博士，你怎能發明這許多東西呢？」加爾回答說，「我是從一本古書上學來的。」「什麼書呢？」「聖經。」「聖經裡有講論關於花生的事麼？」「沒有，但是聖經叫我認識了那位創造花生的神。我求祂賜我智慧，祂便指示我怎樣利用這些花生。」"],["P","敬畏耶和華是智慧的開端，認識至聖者便是聰明。（箴九10。）"]]},{"no":28,"t":"讀經影響別人","b":[["V","耶和華的訓辭正直，能快活人心；耶和華的命令清明，能明亮人眼。（詩19:8）"],["E","The precepts of Jehovah are right, making the heart joyous; the commandment of Jehovah is clear, enlightening the eyes. (Psalm 19:8)"],["P","美國大布道家亨利，某次當眾見證，他所以奉獻歸主，乃是受史密斯的感動。史密斯是何許人呢？既不是大學教授，也不是召會領袖，更不是社會名流。原來他曾作過亨利之父的佃農。他常在工作之暇，坐在床上用心閱讀聖經。這無意中影響了年幼的亨利，使他成為好孩子，以後更成為大布道家。"],["H","耶和華我稱頌你（兒520）"],["L","耶和華，我稱頌你，|求用律例教訓我；"],["L","我用嘴唇傳揚你口中的典章；|默想你訓辭，看重你道路，"],["L","在你律例中自樂，不忘記你的話。"]]},{"no":29,"t":"點高粱杆","b":[["V","你的言語一解開，就發出亮光，使愚蒙人通達。（詩119:130）"],["E","The opening of Your words gives light, imparting understanding to the simple. (Psalm 119:130)"],["P","山東平度縣村，原先只有幾位信徒，一位姓侯，家道富足，有兒女，也有田地。另一位姓李，家境清寒，常替侯家作工；然而得救後的喜樂，夜以繼日的充溢著他。因此，常有人對他說，「你看，侯某某信主這樣富有，有兒女，也有田地；你也信主，卻是什麼都沒有。」他很安詳喜樂的回答說，「我有，我有，我有的是在裡面，也在天上。」"],["P","他很愛主，渴慕神的話語，喜歡讀神的話，有空就讀聖經。農忙替人作工時，衣袋裡也藏著聖經。每當休息，其他工人都在抽菸閒談；他則從衣袋中取出所愛慕的寶貴聖經，津津有味的閱讀。即使是夜晚，他也是這樣愛慕誦讀神的話語。因為家貧，太太不願他點燈耗油，他就燃點高粱杆的一端，貼近聖經，照明字句，邊吹邊讀。對他來說，讀經確實是一大享受。"]]},{"no":30,"t":"常從聖經取得安慰","b":[["V","我要在你的律例中自樂；我不忘記你的話。（詩119:16）"],["E","I will take delight in Your statutes; I will not forget Your word. (Psalm 119:16)"],["P","倫敦曾經舉行一次聖經見證聚會，古實（衣索匹亞）王撒拉西親臨會中作見證。大意是說，「我從小學習尊敬聖經，長大之後，讀經興趣與日俱增，在國事繁忙之際，常從聖經得著無限的安慰。尤以『凡勞苦擔重擔的，可以到我這裡來，我必使你們得安息』，（太十一28，）這話給我的快樂最多。以後我就設法克服各種困難，將聖經古文譯成近代的古實文，使全國人民都有機會閱讀。總之，對於聖經和聖經的教訓，我滿心引以為榮。」"],["P","許多基督徒，整日忙碌世事，不願抽出一點時間讀聖經，難怪他們勞苦背重擔，總得不著安息。"],["H","主的話語比金更寶（兒516）"],["L","主的話語比金更寶，|比蜜更甘甜，"],["L","我們禱讀享受主話，|何等的甘甜；"],["L","何等的甘甜，|何等的甘甜，"],["L","我們禱讀享受主話，|何等的甘甜。"]]},{"no":31,"t":"一遍又一遍","b":[["V","求你使我明白你訓辭的道路，我就默想你的奇事。（詩119:27）"],["E","Cause me to understand the way of Your precepts, and I will muse upon Your wondrous deeds. (Psalm 119:27)"],["P","路德馬丁常說，「要明白神的話，非親自經驗不可。聖經不只叫人記得、懂得，乃是要人生活經歷。」又說，「我年輕的時候，將聖經讀過一遍又一遍，以至十分熟悉。只要你一題某一節，我立刻知道是在何處。我是先熟悉聖經的內容，然後才參考註釋；因為其中有許多，是使我良心不能贊同的，有的竟與聖經的本文相沖突。親眼看見，總比別人的眼睛看好些。」"],["P","慕安得烈在荷蘭讀書時，他父親曾在信中叮嚀他說，「無論人介紹你看什麼書，都不可忽略讀聖經。這件事必須每日去作，並且要用謙卑和許多的禱告，仰望聖靈的引導。」"],["H","讀經－從主話得餵養（詩586）"],["L","主阿，我心我靈又渴又飢，|今來就你，求你給我供給；"],["L","我所需要乃是你的自己，|作我生命供應，作我能力。"],["L","（副）"],["L","餵我飲我，主，餵我飲我！|充我飢餓，主，解我乾渴！"],["L","使我快樂，並且有力生活，|餵我飲我，主，餵我飲我！"]]},{"no":32,"t":"「驗」與「歷」","b":[["V","你們若住在我裡面，我的話也住在你們裡面，凡你們所願意的，祈求就給你們成就。（約15:7）"],["E","If you abide in Me and My words abide in you, ask whatever you will, and it shall be done for you. (John 15:7)"],["P","有個傳道人，前往探望一位年長姊妹，見她正在虔讀聖經，聖經旁邊或寫一個「驗」字，或寫一個「歷」字。傳道人覺得十分奇特，就再仔細翻看那本聖經，發現那本聖經從頭到尾，幾乎每頁邊上都寫有「驗」字或「歷」字。傳道人就問那位年長姊妹，這是什麼意思？年長姊妹滿面笑容答道：「凡我寫有『驗』字的，表示這句聖經我已親自試驗過，知其所言確實；凡我寫有『歷』字的，表示此句聖經是我親自經歷過，知其所言確是這樣。」今天讀聖經的人成千上萬，然而，活在聖經中的人少之又少。"],["H","聖經每一應許是為我（兒513）"],["L","聖經每一應許是為我，|每章，每節，每句是為著我；"],["L","每一應許都是對我說，|故當靠這應許而生活。"]]},{"no":33,"t":"戴德生的讀經法","b":[["V","凡聽見我這些話就實行的，好比一個精明人，把他的房子蓋在磐石上。（太7:24）"],["E","Everyone therefore who hears these words of Mine and does them shall be likened to a prudent man who built his house upon the rock. (Matthew 7:24)"],["P","戴德生從年少的時候，就按次序有系統的讀聖經。他在六十八歲時作見證說，他四十年之久，讀過聖經從創世記到啟示錄四十遍，大約每天讀舊約三章，新約一章，詩篇一篇。有時因思想貫串，讀得多些；有時因為多默想，讀得少些。每年總把聖經讀一遍。在他看來，讀聖經不但得著餵養，並且作他生活工作的指導。聖經對他來說，真是腳前的燈，路上的光。他常說，「有一位活神，這位活神在聖經裡說話；神說一句，就算一句，凡神應許的，無不成就。聖經是活神所說的活話；凡神所說的，都靠得住。」戴德生平日習慣早起，守晨更。無論在任何環境中，絕不改變。他說，「那有先開音樂會，然後才調和樂器呢？每天讀經、祈禱，先與神調和，然後再與人見面辦事。」在他看來，研究聖經，在乎遵行聖經的話；所以他解經講道，都注重實行這一方面。正是因為他實行他自己所知道的，順服聖經的命令、應許，所以他能明白聖經的深奧。知道即行，越行越知道。如經上所記：「你們既曉得這事，若是去行就有福了。」（約十三17。）"]]},{"no":34,"t":"兩種讀法","b":[["V","賜人生命的乃是靈，肉是無益的；我對你們所說的話，就是靈，就是生命。（約6:63）"],["E","It is the Spirit who gives life; the flesh profits nothing; the words which I have spoken to you are spirit and are life. (John 6:63)"],["P","一位文學家和一老傳道人，同被一位財主邀約赴筵席。席間有人題議，要請文學家誦讀詩篇二十三篇。文學家答應下來，但堅持老傳道人也讀一遍。因為文學家精通文學，讀法出眾，當快則快，當慢則慢，當高則高，當低則低，誦讀起來，如同音樂，非常動聽。讀畢掌聲如雷，無不稱讚他的讀法。接著，老傳道人也讀一遍。讀後一無掌聲，但見個個眼中流淚。於是文學家站起來說，「我的讀法比傳道人好，我年輕，聲音響亮，停頓分明；傳道人年老，門齒剝落，發音不清。然而我所得著的，只是你們的掌聲，你們的稱讚；但他所得著的，乃是你們的心，你們的眼淚。這是什麼緣故呢？無他，乃因我所認識的，只是詩篇二十三篇中的字句；而他所認識的，乃是詩篇二十三篇中的那位牧者。」"],["P","我們若能更深認識基督，就能為祂作出更美的見證。"]]},{"no":35,"t":"聖經診病","b":[["V","我兒，要留心聽我的言語，側耳聽我的講論。…因為對尋得的人，這些乃是生命，又是全身的醫治。（箴4:20,22）"],["E","My son, be attentive to my words; incline your ear to my sayings. …For they are life to those who find them, and healing to all their flesh. (Proverbs 4:20,22)"],["P","有個人病了，便請醫生來看診。醫生要診查他的病源，便用手撫按他的身體；一面撫按，一面問道痛不痛。摸到病人覺得痛的地方，就知道病在那裡。同樣的，我們讀經時，無論讀到那章那節，都當求問這節的訓誨，是否就是我們的光景。如果受感，覺得傷痛，就請暫且不要繼續讀下去，而要安靜在神面前思想，把這感覺化為禱告，或認罪，或祈求，或感贊。如此，我們必能得醫治。"],["H","讀經－從主話得餵養（詩587）"],["L","我今來到施恩座前，|得你憐恤，蒙你恩典，"],["L","作我所需應時幫助，|使我心、靈得到安舒。"]]},{"no":36,"t":"天天給，天天見","b":[["V","活的父怎樣差我來，我又因父活著，照樣，那吃我的人，也要因我活著。（約6:57）"],["E","As the living Father has sent Me and I live because of the Father, so he who eats Me, he also shall live because of Me. (John 6:57)"],["P","一位聖經教師帶領學生讀聖經；讀到嗎哪的事，學生就問：「神為什麼不把全年應吃的嗎哪，一次賜給以色列人呢？」教師就用一個比喻，向他們解釋說，「某國皇帝有一個兒子。他在一年之中，定了一天，把全年兒子所需用的錢，一次交給了他。結果，一年之中，他的兒子只去見他那一次。於是他就改變辦法，把他要給兒子的錢，分成一天一天的給。結果，他的兒子每天都去見他一次。」"],["P","我們的神供給我們的需用，在祂是很容易的事，但祂喜歡我們愛祂，常去見祂。祂不願我們只求地上的東西，不求祂自己；只求那必朽壞的食物，不求存到永遠生命的食物。"],["H","人活著不是單靠食物（補211）"],["L","經上記著：人活著不是單靠食物，|乃是靠著神口裡所出的一切話。"],["L","（副）"],["L","阿利路亞！阿利路亞！|阿利路亞！阿們，阿利路亞！"]]},{"no":37,"t":"不把孩子餓死了麼","b":[["V","像才生的嬰孩一樣，切慕那純淨的話奶，叫你們靠此長大，以致得救。（彼前2:2）"],["E","As newborn babes, long for the guileless milk of the word in order that by it you may grow unto salvation. (1 Peter 2:2)"],["P","有位弟兄頭一次到一個地方傳道，問一個姊妹說，「你基督徒生活過得如何呢？」她回答說，「很平常，我沒有為召會作什麼，也沒有為基督作什麼，不知道為什麼不冷不熱？」弟兄便問她：「你每天讀聖經麼？」她回答說，「有工夫就看一點。」那時她旁邊放著一個小嬰孩，睡在車內。弟兄就問說，「若是你餵這個孩子喝奶，今天餵五遍，明天餵三遍，以後連著三天都不餵；然後，再重新一天餵五遍，這可以麼？」她說，「那不把孩子餓死了麼？」弟兄就告訴她說，「你豈不知，你就是這樣對待你裡面的人麼？」"],["H","讀經－從主話得餵養（詩588）"],["L","主阿，我來就你，我心飢渴要你！"],["L","深願在此吃你喝你，享受你的自己。"]]},{"no":38,"t":"樹根朝上","b":[["V","我看重你的一切誡命，就不至於羞愧。（詩119:6）"],["E","Then I will not be put to shame, when I regard all Your commandments. (Psalm 119:6)"],["P","有一個主人，要僱用一個合式的人，第一個條件就是要這個人能聽話。為要試驗應徵者，誰是真正聽話的人，他就要求所有前來應徵的人，先作一件事情。他要他們把一小株樹倒栽在土裡，樹根朝上，樹枝樹葉朝下。前來應徵的人，都覺得主人的命令很不合理，就照一般人的看法、作法，把根埋在土裡，而沒有照主人的話讓根朝上。然而有一個人，他卻照著主人的話，把樹枝樹葉埋在土裡，讓樹根朝上。主人一看，便說，「這人就是我所要的，因為他聽話；他不管別人意見如何，也不照自己的看法，只遵照主人的意思行。」"],["P","我們在讀神的話語，對待神的話語上，常常把別人的意見，或自己的看法攙雜進來，以致對神的旨意總是看不清。"],["H","阿們神的話語（補414）"],["L","你若要脫離世界的轄制，|阿們神的話語！"],["L","你若要經歷屬靈的實際，|阿們神的話語！"],["L","阿們神的話語！|阿們神的話語！"],["L","接受祂話語，一點不懷疑，|阿們神的話語！"]]},{"no":39,"t":"天天梳頭","b":[["V","求你使我清晨得聽你的慈愛，因我信靠你。求你使我知道當行的道路，因我的魂仰望你。（詩143:8）"],["E","Cause me to hear Your lovingkindness in the morning, for in You I trust. Make known to me the way on which I should walk, for to You I lift up my soul. (Psalm 143:8)"],["P","有位鄉間女子，因著工作繁忙，沒有時間梳頭，所以每年只梳一次，一梳就覺得非常痛苦。有一天她到了城裡，看見那裡的婦女每天梳頭，心中暗想，城裡的婦女天天梳頭，為何不畏痛苦呢？她那裡知道天天梳頭，成為習慣，便輕而易舉，不會感覺痛苦；反倒每年只梳一次，當然感覺痛苦。"],["P","讀聖經也是這樣；若是天天讀，天天蒙光照，天天有對付，天天遵行神的話，成為習慣，便不為難。"],["H","我們不忘主的話（兒517）"],["L","我們不忘主的話，|天天用心來讀它！"],["L","藉著禱告來消化，|天天快樂笑哈哈。"]]},{"no":40,"t":"誤認燈光","b":[["V","你當竭力將自己呈獻神前，得蒙稱許，作無愧的工人，正直的分解真理的話。（提後2:15）"],["E","Be diligent to present yourself approved to God, an unashamed workman, cutting straight the word of the truth. (2 Timothy 2:15)"],["P","主後一九五三年二月底，有一艘法國巨輪遇險，因擱淺以致船身中部折斷，有數十人因此喪生。其餘乘客雖然得慶生還，卻被迫全都擠在黑暗的尾艙中，飽受驚慌；同時，財物損失不少。這艘巨輪是怎樣遇險的呢？據說是因為當時有霧籠罩，駕駛人誤認岸上的燈光為燈塔的燈光，以致招來大禍。"],["P","同樣的，有人讀聖經，憑著私意解釋聖經，還自以為那就是神的光，反而受到虧損，甚至走上岔路。以賽亞五十章十一節說，「凡你們點火用火把圍繞自己的，可以行在你們火焰的光裡，並你們所點的火把中。這是你們從我手裡所要得的：你們必躺在悲慘之中。」"],["H","你若要享受基督的恩惠（兒518）"],["L","你若要享受基督的恩惠，|阿們神的話語，"],["L","你若要飽嘗聚會的甘美，|阿們神的話語；"],["L","阿們神的話語，|阿們神的話語，"],["L","接受祂話語，一點不懷疑，|阿們神的話語。"]]},{"no":41,"t":"蓋蠟燭鐵帽","b":[["V","願我們主耶穌基督的神，榮耀的父，賜給你們智慧和啟示的靈，使你們充分的認識祂。（弗1:17）"],["E","That the God of our Lord Jesus Christ, the Father of glory, may give to you a spirit of wisdom and revelation in the full knowledge of Him. (Ephesians 1:17)"],["P","有一位研究科學的人，問一位傳道人說，「我將新舊約原文聖經從頭至尾，仔細讀了十七遍，並且與科學細細比較過，其中所說基督救贖的道，實在太奇怪了！」傳道人說，「沒有什麼可奇怪的。幾天前的一個晚上，我想點蠟燭，卻總點不著，覺得非常奇怪。仔細一看，才發現原來我忘了將蓋在蠟燭上面的鐵帽揭開。若是我不揭開鐵帽，就是點了十七次也是不會亮的。所以，凡用科學知識、成見，去讀聖經的，心眼必被遮蔽，就如蠟燭蓋上了鐵帽一樣。」"],["P","我們讀聖經時，不可有自己的觀念、成見、看法；否則，那些東西會成為你裡面的帕子，叫你讀了，卻仍不懂得。"],["H","羨慕－與主交通（詩284）"],["L","沒有間隔，主，沒有間隔；"],["L","願我如此隨你，願我所見惟你，願我所歸惟你；"],["L","沒有間隔，沒有間隔。"]]},{"no":42,"t":"金幣仍在那裡","b":[["V","惟喜愛耶和華的律法，晝夜默想，這人便為有福。（詩1:2）"],["E","Blessed is the man…his delight is in the law of Jehovah, and in His law he meditates by day and by night. (Psalm 1:1-2)"],["P","德國王子查理，每到夏天常去鄉間旅行。有一次，他到了一個農家，看見一本聖經，就問那位農夫說，「你讀這書麼？」農夫回答說，「是，王子，每天讀一章。」王子暗中取出金幣一枚，夾在經中，就回去了。過了一年，王子又來到農家，問說，「你還讀這經麼？」農夫回答：「是的，每天讀一章。」王子說，「拿來給我看看。」找到夾錢之處，發現金幣仍在那裡，立刻說，「你對我說了謊。你看，我去年夾在裡頭的記號，仍在這裡；你若每天讀一章，必定發現這個金幣。」"],["P","許多基督徒都曾多次立志，每天必讀一章聖經，結果卻是越讀越少，末了索性不讀。我們必須看見，主的話乃是我們生命的糧，是我們腳前的燈，路上的光。"],["H","讀經－從主話得餵養（詩587）"],["L","你話是燈，也是食物，|我蒙光照，也得飽足；"],["L","深願在此多讀多吃，|受到啟示，得著糧食。"]]},{"no":43,"t":"不常拖刷","b":[["V","少年人用什麼使他的行徑純潔呢？是要遵行你的話。（詩119:9）"],["E","With what should a young man keep his way pure? By guarding it according to Your word. (Psalm 119:9)"],["P","有一個女子在結婚時，收到許多賀禮，其中有一支新的拖把。婚後數月，她的母親到她新房來看看。她非常興奮，十分自豪的指著那支新拖把，說，「媽，你看，那支新拖把仍舊是嶄新的，和我剛收到的時候一樣。」一點也不錯，那支拖把依然是嶄新的。然而，地板成了什麼樣子呢？當然，地板因為不常拖刷而不清潔。"],["P","詩篇一百一十九篇九節說，「少年人用什麼使他的行徑純潔呢？是要遵行你的話。」神的話有潔淨的能力；可惜許多神的兒女，從來不讀聖經，得救十年、八年了，聖經和剛買來時是一樣的新，因此他們的行為也是依然故我，沒有絲毫改變。"]]},{"no":44,"t":"在聖經上花工夫的榜樣","b":[["V","你既開廣我的心，我就奔跑你誡命的道路。（詩119:32）"],["E","I run the way of Your commandments, for You enlarge my heart. (Psalm 119:32)"],["P","在全世界各國，有許多人花了相當多的工夫翻譯聖經；像達秘（J. N. Darby）那樣的工作，是作得最好的。神用他翻了義大利文、法文、德文、和英文的聖經；他一個人翻了四種語文的聖經。他翻譯聖經時，每一節都要花上幾十個鐘頭。我們中文的和合本聖經，每一節也都是花上十幾個鐘點翻成的。許多神的兒女，對聖經的翻譯，在神面前是花了許多工夫，所以，現在我們也要花工夫讀聖經。"],["H","鼓勵－與主交通（詩477）"],["L","用功朝見主面，|多和主對講，"],["L","常住在祂裡面，|以祂話為糧。"],["L","等候在祂面前，|柔順且降服，"],["L","每件事上不忘尋求祂祝福。"]]},{"no":45,"t":"研讀聖經的方法","b":[["V","聖經都是神的呼出，對於教訓、督責、改正、在義上的教導，都是有益的，叫屬神的人得以完備，為著各樣的善工，裝備齊全。（提後3:16-17）"],["E","All Scripture is God-breathed and profitable for teaching, for conviction, for correction, for instruction in righteousness, that the man of God may be complete, fully equipped for every good work. (2 Timothy 3:16-17)"],["P","倪柝聲弟兄一開始過基督徒生活，就殷勤研讀聖經。他研讀聖經的方法有二十種之多，除了一般按順序研讀聖經各卷，得著整體的概念外，他還專一研讀一卷書，或讀專題，或讀辭，或讀預表、寓意、比喻、數目、預言，或讀聖經人物的生平，讀歷史，讀詩歌等。他更將聖經的一段，與相似或不同的另一段作比較，並查讀希伯來文或希臘原文，以得著一個字或辭的準確意義。此外，他還讀別人的著作，從其中得著幫助、靈感、和平衡的觀點。他甚至用一本聖經，特為作筆記和寫註解；並教導人為著這個目的，每天讀三章舊約一章新約，一年讀完聖經一遍。為著要得屬靈生命的每日糧食，他用另一本聖經，裡面沒有任何註解或筆記，以接受新鮮的亮光，得著屬靈的滋養。他教導別人每早晨也這樣作，讀幾節聖經，同時用禱告的靈接觸主，透徹的消化這幾節。為著熟悉聖經，倪弟兄在二十歲左右，約有一年之久，每週讀新約一次。他也時常默想聖經中某些段的話；並背誦一些重要的經節或段落，將聖經存在心裡，為著常時和即時的需要。藉著用許多不同的方式讀聖經，倪弟兄對聖經非常純熟，也得著關於神的定旨、基督、召會、以及救恩和生命之事的亮光。"]]},{"no":46,"t":"寫聖經字典的人","b":[["V","以斯拉立定心意考究遵行耶和華的律法，並在以色列中教導律例和典章。（拉7:10）"],["E","For Ezra had set his heart to seek the law of Jehovah and to do it and to teach His statutes and ordinances in Israel. (Ezra 7:10)"],["P","歷史上，因著有人寫聖經的字典，以致我們今天能很簡單的查知聖經的字義。這些人包括薛夫（Philip Schaff）、史密斯（William Smith）等。他們不知花了多少工夫和心血，在他們的時代中努力過；他們一樣一樣、一項一項的考查，有的東西是查了幾年才查出來的。召會二千年來，就因著繼續不斷的有人在那裡查，在那裡努力，今天聖經對我們才能是解開的、豐富的。"],["H","主的話比酒美（兒515）"],["L","主的話比酒美，比蜜更甜，|在我的上膛何等甘美；"],["L","在我的口中比蜜更甜，|我愛慕、我渴想你的言語。"]]},{"no":47,"t":"人裡面喜歡真理的性能","b":[["V","你的言語在我上膛何等甘美！在我口中比蜜更甜！（詩119:103）"],["E","How sweet are Your words to my taste! Sweeter than honey to my mouth! (Psalm 119:103)"],["P","人裡面有一種喜歡真理的性能，這在聖經裡有清楚的例證。就如主耶穌出來盡職時，大多在山上或曠野講道；沒有豪華、舒適的場所，但人卻成群的來找祂。"],["P","神造人時，給人裡面造了一個求知的慾望，所以人自小渴望認識外在的事物。聰明的母親管教孩子，不會責打、勉強，而是對他多說話，向他多傳輸知識。西方人教育孩子有一個長處，就是在孩子入睡前，必定對他講一段故事。不僅如此，有時母親看見孩子頑皮，也不責打，就是講故事給他聽。他一聽就安靜、規矩、馴服，不再調皮了。這是因為他裡面有個渴望，願意多知道。小孩子知道得越多，他就越歡喜，越覺得滿足。"],["P","聖經是人無法窮其究竟的。李常受弟兄得救後天天研讀聖經，他自己見證他是越讀越有得著，越讀越覺得可讀。研讀聖經的真理是沒有止境的。"]]}]},{"n":"禱告","i":2,"intro":[["V","耶和華阿，我卻呼求你；早晨我的禱告要達到你面前。（詩篇八十八篇十三節）"],["E","But I, O Jehovah, have cried out to You; and in the morning my prayer comes before You. (Psalm 88:13)"]],"a":[{"no":48,"t":"禱告是基督徒的基本權利","b":[["V","向來你們沒有在我的名裡求什麼，現在你們求，就必得著，叫你們的喜樂可以滿足。（約16:24）"],["E","Until now you have asked for nothing in My name; ask and you shall receive, that your joy may be made full. (John 16:24)"],["P","基督徒活在地上有一個基本的權利，就是禱告能得著答應。你一得著重生，神就給你一個基本的權利，就是你能求神，神能聽你。約翰十六章告訴我們說，我們在主的名裡求的時候，神就答應；叫我們的喜樂可以滿足。我們如果常常禱告，我們在地上就可以作一個喜樂的基督徒。"],["P","我們在聖經裡能找出許多禱告得著答應的條件，但是，其中基本的條件只有幾個。我們相信，如果按著這幾件去作，禱告就可以得著答應。我們也相信，這幾個條件對於多年禱告的人也能適用。"],["P","第一，要求。所有的禱告，都應當在神面前真實的求。初信的人要學習一個功課，就是要禱告，並且要禱告得有一個專一的目標。"],["P","第二，不可妄求。我們應當在神面前求，但是，還得有第二個條件，就是不可妄求。（雅四3。）"],["P","第三，要對付罪。有的人求是求了，也沒有妄求，可是神還是沒有聽他的禱告。那是因為有一個基本的攔阻，就是他與神之間有罪的攔阻。（詩六六18。）"],["P","第四，要信，還有一個條件，就是在積極方面應當信。"],["P","第五，要一直的求。禱告要繼續，不可停止。（初信造就）"]]},{"no":49,"t":"兩面的禱告","b":[["V","有一件事，我曾求耶和華，我仍要尋求；就是一生一世住在耶和華的殿中，瞻仰祂的榮美，在祂的殿裡求問。（詩27:4）"],["E","One thing I have asked from Jehovah; that do I seek: to dwell in the house of Jehovah all the days of my life, to behold the beauty of Jehovah, and to inquire in His temple. (Psalm 27:4)"],["P","一個為主所用的人，定規是一個禱告的人。使徒說，他們要堅定持續的禱告，並盡話語的職事。（徒六4。）盡話語的職事就是作主工，為主用；而禱告正是作主工為主用的原因。他們所以能為主用，因為他們堅定持續的禱告。沒有一個忽略禱告，不會禱告，以及不禱告的人，能為主用。"],["P","禱告第一面的意義就是用靈來接觸神，吸取神，將全人調回到靈裡與神交通。當我們這樣接觸神，吸取神，和神交通的時候，神就有機會把祂自己啟示、灌輸到我們的裡面。這是禱告第一面的意義，就是進入交通。那是禱告的基礎。這個基礎打好了之後，才可以有第二面的禱告，就是求問的禱告。這裡的求問，包括為主工作的求問，也包括為個人需要，就如病症、難處等的求問。"],["P","在我們的禱告裡面，求問應該過於求告。不是你的意思給神知道了，乃是神的意思給你知道了。好像是你在問，卻是神給你的感覺。這時你一面覺得裡面很重的負擔，另一面裡面卻滿了生命、自由和平安。當你這樣求問的時候，很容易摸著神的引導，你就可以照著那引導去作。（來到施恩的寶座前）"]]},{"no":50,"t":"禱告與讀經的配合","b":[["V","你們若住在我裡面，我的話也住在你們裡面，凡你們所願意的，祈求就給你們成就。（約15:7）"],["E","If you abide in Me and My words abide in you, ask whatever you will, and it shall be done for you. (John 15:7)"],["P","一個正常的基督徒，讀經和禱告這兩件事乃是生活的兩面，是缺一不可的。我們可以看到，在神的定規裡面，宇宙中的事差不多都是兩面的。比如上下、左右、陰陽、晝夜、男女，這些都是兩面的。又如我們人的身體，很多的部分也都是兩面的。我們的手、腳、耳朵、眼睛、鼻孔，都是成雙，都是兩面。基督徒在主面前生活的實行，也有兩面的講究，一面是讀經，另一面就是禱告。我們走路的時候，必須兩隻腳同時並用，並且要保持平衡，不能用右腳走二十步，用左腳只走兩步。我們作基督徒，要活在神面前，讀經和禱告也必須同時並用，保持平衡。"],["P","我們若要有正常的基督徒生活，就必須讀經和禱告同樣並重，就像走路的時候左右腳並用一樣，一直是讀經禱告，禱告讀經。我們每一次禱告都該摸著神的話，而每一次讀經也都該配上禱告。（禱告）"]]},{"no":51,"t":"求樹不求果子","b":[["V","所以我們只管坦然無懼的來到施恩的寶座前，為要受憐憫，得恩典，作應時的幫助。（來4:16）"],["E","Let us therefore come forward with boldness to the throne of grace that we may receive mercy and find grace for timely help. (Hebrews 4:16)"],["P","有一個人名叫撒都，他曾見證說，「在我悔改以後的兩、三年內，常為種種事物祈求，但我現在只求得著主自己。比如有一棵樹，結滿果子，你可以去向樹的主人求一點或是買一點。然而，你若是能得著那棵樹，那麼樹上所有的果子就都是你的。照樣，假若神是你的，天上地下所有的東西也都是你的；因為祂是你的父親，你的一切。否則，你就要像乞丐一樣，去乞求你所需要的某種事物，等到用完，還得再來。所以，不要去求禮物，只要求那賜禮物的神；不要去求生命所需要的，只要求那賜生命的神。如此，生命和生命所需要的一切，都要加給你們了。」"],["H","來到施恩座（補415）"],["L","我們坦然來到施恩座，|得著憐恤恩惠作幫助；"],["L","不再環繞十字架敬拜，|因為我主已不在彼。"],["L","祂已衝破了死亡捆綁，|復活昇天得榮耀！"],["L","現今祂從施恩寶座，|用祂生命供應我。"]]},{"no":52,"t":"要爸爸媽媽","b":[["V","因為萬有全是你們的，…但你們是基督的，基督又是神的。（林前3:21,23）"],["E","For all things are yours, …but you are Christ's, and Christ is God's. (1 Corinthians 3:21,23)"],["P","有位父親出外作生意，四個兒女在家等他回來。有一天，四個孩子商量說，等爸爸回來該向他要什麼呢？老大說，我要皮鞋。老二說，要糖。老三說，要洋娃娃。老四說，我要父親。媽媽聽見覺得很奇怪，便問老四說，「你要父親有什麼用處？他又不能吃，又不能玩，又不能用。」老四說，「有了父親，不只有皮鞋、有糖、有洋娃娃；有了父親，他什麼都會買給我。」"],["P","又有一位母親，時常外出，幾天才回來一次，每次都給孩子們帶些東西。有一次，她回來，孩子們仍然熱烈的歡迎她。然而這一次，她沒有帶東西回來，她很抱歉的說，「這次我沒有給你們帶禮物來，是因為…」她話還沒有說完，最小的孩子就接著說，「媽，我們不是要禮物，我們要你。」照樣，我們所要的乃是基督自己，不是在祂以外的一點祝福。"],["H","經歷基督－作一切（詩394）"],["L","前要的是祝福，|今要主自己；"],["L","前要的是醫治，|今要主而已；"],["L","前我貪求恩賜，|今要賜恩者；"],["L","前我尋求能力，|今要全能者。"],["L","（副）永遠舉起耶穌，|讚美主不歇；"],["L","一切在於基督，|主是我一切。"]]},{"no":53,"t":"初見總統不至要錢","b":[["V","你們雖然不好，尚且知道把好東西給兒女，何況天上的父，豈不更將聖靈給求祂的人麼？（路11:13）"],["E","If you then being evil know how to give good gifts to your children, how much more will the Father who is from heaven give the Holy Spirit to those who ask Him! (Luke 11:13)"],["P","有位不信神的學生，問一家醫院的護理長說，「我若向你的神要一百元，你想祂會給我麼？」護理長溫和的回答說，「如果你今天初次看見總統，你會開口向他要錢麼？」學生說，「不會，我會等到與他熟悉時。」護理長接著說，「若是你今天初次看見神，你不會只是向祂要錢；你必會向祂求更寶貴、更需要的東西。」學生問：「有什麼是比錢更寶貴、更需要的呢？」護理長回答說，「有阿，比方罪得赦免，得著重生，以及內心的改變。」"],["P","神給我們最大的禮物，就是祂的獨生子主耶穌基督；因祂，我們的罪得赦免；借祂，我們得著重生；有祂，我們的生命得變化。我們向神所求的上好，乃是基督自己，並非福利平安。"],["H","每當我喊主耶穌（補231）"],["L","每當我喊主耶穌，|我深處總覺發燙；"],["L","祂生命冉冉而升上，|在我裡面成長。"],["L","請來同喊主耶穌，|這喜樂地上無雙；"],["L","主且要進入你裡面，|作你生命供你享。"]]},{"no":54,"t":"為金銀鑿地","b":[["V","他心裡所願的，你已經賜給他；他嘴唇所求的，你未嘗不應允。（詩21:2）"],["E","You have given him his heart's desire and have not withheld the request of his lips. (Psalm 21:2)"],["P","有一個人名叫撒都，有一次旅行到巴基斯坦，到了一個村莊；那裡沒有井，也沒有泉。他們所用的水，是從三里外取來的。撒都在那裡遇見一個人，他告訴撒都那裡一切的事。這人有兩個兒子，他要他們去開鑿一塊田，就對他們說，「那裡埋有寶藏。」他們就很歡喜，滿帶盼望的說，「我們不久要在那裡掘出許多金銀。」他們開始動工；然而從早到晚，一連掘了三天，卻什麼也沒找著。他們就去告訴父親。父親說，「那裡寶藏很多，我信你們一定可以找著。」第四天，他們仍舊開鑿，以致疲倦，就說，「我們縱然得著金銀，也難止住口渴，如今最需要的乃是水。」忽然間，有泉湧出，他們喜出望外。一人跑去告訴父親。父親說，「這就是為什麼我不告訴你們『去開鑿水泉』。因為若是如此，你們一定不肯去作。我只好對你們說，那裡有寶藏，你們就去了。我的意思是要你們為著金銀而去，卻要得著比金銀更寶貴的東西。」我們的禱告有時也是如此，所求的是祂的祝福，但祂所給的，卻是祂的自己。"]]},{"no":55,"t":"神留我禱告","b":[["V","又有一位女申言者亞拿，…並不離開聖殿，禁食祈求，晝夜事奉神。（路2:36-37）"],["E","And there was one Anna, a prophetess, …who did not depart from the temple, serving God with fastings and petitions night and day. (Luke 2:36-37)"],["P","有個姊妹，十三歲得救，活到一百零三歲去世。當她一百歲時，有個弟兄前去見她，問她知不知道，為何神留她在地上這麼長久。她安靜的回答說，「神留我在這裡，是要我再禱告一回，再禱告一回。」這是一個何等豐富的人，她在地上不斷的用禱告供應召會。"],["H","羨慕－與主交通（詩287）"],["L","主，我是屬你，|我聽你宣告，"],["L","知你愛我的無匹；|但我是渴望能因信升高，"],["L","能以和你更親密。"],["L","（副）吸引我近，|更近，親愛主，"],["L","直至你流血身邊；|吸引我近，更近，"],["L","更近，親愛主，|直至你同在中間。"]]},{"no":56,"t":"膝蓋如駱駝皮","b":[["V","我的王我的神阿，求你垂聽我呼求的聲音；因為我向你禱告。（詩5:2）"],["E","Give heed to the sound of my cry, my King and my God; for to You do I pray. (Psalm 5:2)"],["P","主的兄弟雅各曾經寫信給散居十二支派的人，勸勉他們，信心要加上行為才是活的。雅各是個拿細耳人，因為時常跪著禱告，認真追求主，以致膝蓋的皮磨得堅硬，如同駱駝的皮一樣。難怪他被稱為召會的柱石，站在耶路撒冷眾長老的前面。"],["H","禱告－在主名裡（詩559）"],["L","我奉耶穌全能的名，|跪在施恩寶座前，"],["L","打敗許多黑暗軍兵，|滅熄許多的火箭。"],["L","（副）全能名！全能名！|我奉此名就得勝！"],["L","全能名！全能名！|撒但、罪、死，都無能！"]]},{"no":57,"t":"鬼在屋頂睡覺","b":[["V","務要謹守、警醒。你們的對頭魔鬼，如同吼叫的獅子，遍地遊行，尋找可吞吃的人。（彼前5:8）"],["E","Be sober; watch. Your adversary, the devil, as a roaring lion, walks about, seeking someone to devour. (1 Peter 5:8)"],["P","慕迪（Moody Dwight Lyman, 1837～1899）說過一個故事：有一個人作夢，出外旅行，看見一個教堂，屋頂之上有一個小鬼，躺在那裡熟睡。又到一個地方，看見屋頂上的小鬼一大堆，來回亂跑。這個人甚感詫異，就問旁邊的人：「這是什麼緣故？」那人回答說，「那個教堂的教友全是睡覺的教友，所以只用一個小鬼防備，綽綽有餘；因為沒有事，便在屋頂睡覺。然而這間小屋內，一男一女，二人同心合意禱告，所以小鬼聚集很多，極力攪擾他們。」這雖是個故事，卻說出一個屬靈的事實：禱告能夠搖動陰府，是對付魔鬼最好的方法。"],["H","禱告－摸神寶座（詩565）"],["L","禱告摸神的寶座，|摸神施恩的寶座，"],["L","蒙到憐恤和恩惠，|應時幫助必得著。"]]},{"no":58,"t":"得勝的秘訣","b":[["V","你們要時時警醒，常常祈求，使你們得勝，能逃避這一切要發生的事，得以站立在人子面前。（路21:36）"],["E","Be watchful at every time, beseeching that you would prevail to escape all these things which are about to happen and stand before the Son of Man. (Luke 21:36)"],["P","一位傳道人去世，有人前往探望他的妻子，並加慰問。交談之間，那人題到這位傳道人的作為與成就，不知他的得勝秘訣為何。傳道人的妻子回答說，「請跟我來，你就可以知道他得勝的秘訣。」她將那人帶到樓下一間另外預備的禱告室，是普通人不容易到的地方。在那房間的四壁，那位傳道人記載著：「今天禱告兩小時。」「今天禱告了三小時。」「今晚我必須禱告。」「必須要有更多的禱告。」「昨夜禱告了九小時。」「感謝神，因為在禱告中有大勝利。」「我如何能尋到更多的時間禱告呢？」禱告實在是得勝的秘訣。"],["H","禱告－與主同勞（詩569）"],["L","禱告與主同勞苦，|禱告為主將路鋪，"],["L","禱告把主來推動，|也被推動走主路。"]]},{"no":59,"t":"司布真的發熱機","b":[["V","這些人同著幾個婦人，和耶穌的母親馬利亞，並耶穌的兄弟，都同心合意，堅定持續的禱告。（徒1:14）"],["E","These all continued steadfastly with one accord in prayer, together with the women and Mary the mother of Jesus, and with His brothers. (Acts 1:14)"],["P","有五個青年傳道人，特意在主日到倫敦參觀大會堂，想聽名人講道。那天早晨天氣炎熱，他們到司布真的會堂去聚會。會堂門口站著一個人，上前對他們說，「諸位好像都是主的工人，想必喜歡看看我們會堂的發熱機，我可以引導諸位去看。」他們在炎熱的日光下，那裡還想去看發熱機，無奈因著情面難卻，只得答應。那人便引導他們到會堂的下一層，開了門，低聲對他們說，「請諸位看，這就是我們教會熱力的發源處。」他們見了，大大驚奇。原來在他們面前，約有七百人，都屈膝在神面前，懇切禱告神，求神賜福給樓上聚會的講道。那位引導他們的，不是別人，就是司布真自己。司布真傳道有能力的秘訣就在此。"],["H","經歷基督－與祂交通（詩417）"],["L","當我歡留於祂面光，|祂以溫情對付、指點；"],["L","用祂神聖、寶貴成分，|浸透全人、供應無限。"],["L","向我發言、給我看見：|祂的豐富是為今天；"],["L","多方、豐滿，將祂享受，|所有問題全都逃竄！"]]},{"no":60,"t":"密室裡禱告爭戰","b":[["V","時時在靈裡禱告，並盡力堅持，在這事上警醒，且為眾聖徒祈求。（弗6:18）"],["E","By means of all prayer and petition, praying at every time in spirit and watching unto this in all perseverance and petition concerning all the saints. (Ephesians 6:18)"],["P","一六三〇年，在蘇格蘭的復興中，約翰李司登的一次講道，有五百人悔改；那是因著有大批的信徒，徹夜禱告讚美神。一七四一年，約拿單愛德華在恩田佈道，聚會中忽然滿了痛哭的嗚咽聲；那是因有數百位信徒正為那聚會求神憐憫。"],["P","密室裡藉著禱告爭戰的情形，決定了戰場上的勝利。"],["H","禱告－教導（詩554）"],["L","求主教我如何禱告！|如何使敵遁逃，"],["L","如何捆綁滅其權勢，|使眾罪囚得釋。"]]},{"no":61,"t":"閉店禱告","b":[["V","義人的祈求發動起來，是大有能力的。（雅5:16）"],["E","The petition of a righteous man avails much in its working. (James 5:16)"],["P","某城有個召會，多年沒有復興，景象衰敗，城中許多青年沒有得救。城裡有一個口吃的老鐵匠，原是眾人所討厭的。有一個週五，他在店裡作工，忽然想到召會荒涼，許多不信的人沉淪在罪惡之中，走向滅亡的路，他心中大感痛苦。痛苦到一個地步，他不得不停止工作，關閉店門，用那午後半天的時間，專心祈禱。到了主日他去見傳道人，請他召開特別聚會。傳道人起初頗為遲疑，恐怕沒有人來，後來終於贊成，隨即定規那天晚上，在某個私人的大屋子裡聚會。出乎意料，那晚來聚會的人非常之多，座無虛席。聚會開始時，在安靜片刻後，有一個人起來，流著淚說，「倘若有人能夠禱告，請他為我禱告。」說完之後又有一個人起立，發出同樣的請求。接二連三的，有許許多多人都為自己的罪責備自己。他們說出自己知罪的時候，正是鐵匠關在店裡禱告的時候。從此召會大大復興。"],["H","禱告－為復興（詩576）"],["L","復興你工作，主！|求你感動召會，"],["L","為著罪惡，憂傷痛悔，|好讓你顯作為。"],["L","（副）復興你工作，|主！我們現今等候；"],["L","但願正當我們俯伏，|你就顯現能手。"]]},{"no":62,"t":"慕迪如何到英國","b":[["V","也替我祈求，使我在開口的時候，有發表賜給我，好放膽講明福音的奧秘。（弗6:19）"],["E","And for me, that utterance may be given to me in the opening of my mouth, to make known in boldness the mystery of the gospel. (Ephesians 6:19)"],["P","倫敦有一個姊妹，時常抱病在床，自己起初以為在世的工作結束了。然而聖靈卻對她說，這病並非是神把她放在一邊，乃是神要她為復興召會的工作禱告。她就日夜為著這事禱告。有一天，她看見報紙刊載大布道家慕迪的工作，深深覺得應該求主帶領慕迪，到她所在的教堂領會。然而這事如何成就呢？因為慕迪在大西洋那邊，而她在倫敦千萬個會堂中的一個，如何與他接洽呢？"],["P","一八七二年，慕迪第二次到英國，立志不再講道，惟一的心願，是想從英國解經家多學一些聖經真理。在一次禱告聚會之後，有人請他到倫敦北部教堂講道，他無法推辭。這就是那位常常禱告的姊妹聚會的會堂。慕迪在那天早晨講道，精神不佳，巴不得不講還好。那位姊妹聽說慕迪來到她所在的會堂講道，明白這事的意義，那天她就特別專心禱告。晚上慕迪再去講道，當他開口講道之際，一切都改變了，聽眾莫不肅靜細聽。慕迪的舌頭也鬆開了，話語如同活水般流了出來。毫無疑問，神與他們同在。當慕迪請凡要信主的人起立時，全體聽眾都站了起來，甚至慕迪自己也感希奇。那天晚上共有四百人加入召會。"]]},{"no":63,"t":"引起全城禱告會","b":[["V","主耶和華如此說，我要加增以色列家的人數，多如羊群；他們必為這事向我求問，我要給他們成就。（結36:37）"],["E","Thus says the Lord Jehovah, Moreover for this I will be inquired of by the house of Israel to do it for them; I will increase them with men like a flock. (Ezekiel 36:37)"],["P","一八五七年，美國倫菲耳先生在禱告中忽然覺得，在這世界上每天不知有多少人死亡，心中很是憂急。於是在紐富耳敦街找到一個地方，佈置妥當，預備開一個祈禱會。到了那一天，只有他自己一個人赴會。然而，他並不灰心，獨自一人跪下禱告主，懇求主赦罪，求聖靈挑旺。過了半個鐘頭，來了另一個人，最後一共來了六個人；於是，他們同心禱告主。會後，倫菲耳很快樂的對他們說，「今天我真是覺得主與我們同在，請下週再來聚會。」果然下週到了三十個人，再下週竟然來了一百多人；人數天天增加，以致天天聚會。後來影響所及，全城到處發起禱告會，並漸漸遍及全美國。"],["P","神聽了他們的禱告，賜福給這個工作。幾個月後，就有幾千處奮興會，影響到全世界。星星之火，足以燎原；因此而歸主的，不只千百萬人。紐富耳敦街這祈禱處的發源地，如今還在。"],["H","禱告－憑信心（詩562）"],["L","再唱信心的歌！|仇敵聽見要抖；"],["L","讚美原來會勝鬼魔，|何致被他箝口。"]]},{"no":64,"t":"攀山禱告","b":[["V","你們要為耶路撒冷求平安。耶路撒冷阿，愛你的人必然興旺。（詩122:6）"],["E","Pray for the peace of Jerusalem. Those who love You will prosper. (Psalm 122:6)"],["P","一八六〇年，慕安得烈得著引導，遷往伍賽斯德工作。當時，神已經在那裡興起一班代禱的人；其中有一位常到山頂禱告，因為從該據點可以俯覽全村，禱告更加有負擔。多年攀登的結果，留下羊腸小道清晰可見。復興的風越吹越強，禱告聚會人數顯著加增，並且聚會空氣非常的熱烈。結果，神的靈大大作工，給那地方帶來大的復興。"],["H","禱告－為復興（詩576）"],["L","復興你工作，主！|向你聖徒顯現；"],["L","求你用權發命監督，|讓你兒女檢點。"],["L","（副）復興你工作，主！|我們現今等候；"],["L","但願正當我們俯伏，|你就顯現能手。"]]},{"no":65,"t":"跪在地圖前禱告","b":[["V","所以我勸你，第一要為萬人祈求、禱告、代求、感謝。（提前2:1）"],["E","I exhort therefore, first of all, that petitions, prayers, intercessions, thanksgivings be made on behalf of all men. (1 Timothy 2:1)"],["P","在倫敦一處窮人的住宅區內，有一間小房子；這房子就是早年戴德生住的地方。那時戴德生不過是個二十多歲的青年人。在他那房間的牆壁上，懸掛著一幅全中國的大地圖。戴德生每天都用幾個鐘頭，跪在地圖前禱告。當時中國還有十幾個省沒有福音傳進去，也沒有一個人去為主作見證。戴德生沒有錢，也沒有差會的幫助，並且肯和他一同到中國的人也不多，只有幾個朋友，每週來一、二次，和他一同跪在那地圖前禱告。那時，戴德生的心裡有一個遠大的志向，要將福音傳遍中國內地。"],["P","截至一九三三年為止，在中國內地會有總堂三百二十八處，支堂二千三百二十五處，西國宣教士一千三百多位。自設立召會以來，受浸的人數約十五萬。這樣大的事業，都是由於這一個青年人的志向，和他的禱告而來。"],["H","禱告－憑信心（詩562）"],["L","再唱信心的歌！|無論夜如何黑；"],["L","你若讚美，神要工作，|使你所信能得。"]]},{"no":66,"t":"離席為子禱告","b":[["V","耶和華是我的力量，我的詩歌，祂也成了我的拯救。這是我的神，我要讚美祂；是我父親的神，我要尊崇祂。（出15:2）"],["E","Jah is my strength and song, and He has become my salvation; this is my God, and I will praise Him; my father's God, and I will exalt Him. (Exodus 15:2)"],["P","戴德生少年時並不信主。他母親一次在外作客，離他有五十多哩遠。在午飯後，她離席為兒子禱告，因她多年不忘為她兒子的悔改禱告。那一天下午，她鎖上房門，決定求神應允她，否則她不出來。當她禱告到不能再禱告下去時，聖靈指示她，禱告已蒙應允，她兒子已經悔改了。她立即改祈求為感謝，不住的讚美神。"],["P","那天是假日，十七歲的戴德生百般無聊，隨意揀起了一本福音小冊閱讀。那邊母親正在禱告，這邊兒子正在讀一個患肺病的煤礦工人的福音故事。當戴德生讀到基督的工作「成了」時，他自言自語的說，「成了什麼呢？」一面自己又回答說，「成就了一個完全圓滿的救贖，為我們的罪，已付了贖價；不但為我們的罪，也為普天下人的罪。」「既然如此，我還要作什麼呢？」這時聖靈的光照進他的心中，使他大受感動，只得跪下接受救主的救恩。"]]},{"no":67,"t":"越過海洋的禱告","b":[["V","耶和華拯救我的神阿，我晝夜在你面前呼求。（詩88:1）"],["E","O Jehovah, the God of my salvation, I have cried out by day and in the night before You. (Psalm 88:1)"],["P","美國俄亥俄州的某個村子裡，有一名鐵匠，他和妻子都是熱心信主的人。他們節衣縮食，資助一位印度的女子，在學校裡讀書。一個週六晚上，這位鐵匠回到家中，剛要坐下吃飯，發現餐桌上擺著一封信，是從印度寄來的。拆開一看，臉色顯得十分沉重，就對妻子說，「我不能吃飯了，必須去禱告。」原來那封信是一位女宣教士寄來的，說到這對夫婦所資助讀書的那位女子，無論怎樣都不肯悔改信主；並且不但自己不信，還攔阻別人相信。學校為了保全其他學生的緣故，若是她不早些悔改，只有把她開除，別無辦法。"],["P","這位鐵匠讀了信，再也顧不得吃飯，急忙進入內室禱告。大家都知道，美國俄亥俄州的週六晚上，已是印度的主日早晨。那天早晨，那位女宣教士照例召集全班學生，去上主日學。課才開始不久，那位頑劣的女生，竟然不由自主，從座位上跳了下來，跑到女宣教士面前，痛哭流涕，俯伏悔改，接受基督作她的救主。那天早晨，全班學生得到了救恩。"],["P","在美國一個鄉村的地方，有人在那裡懇切禱告，卻遠在印度成就了大事。"]]},{"no":68,"t":"一浪捲入海一浪捲上船","b":[["V","願我的禱告達到你面前；求你側耳聽我的呼求。（詩88:2）"],["E","May my prayer come before You; incline Your ear to my cry. (Psalm 88:2)"],["P","非拉鐵非地方有一位年長姊妹，她有一個兒子，不守規矩，粗魯放蕩，眼中無神，後來作了水手。一天夜裡，老姊妹忽然醒來，心裡覺得她兒子正在危險之中，就披上外衣，跪在床前，懇切求神施恩。禱告了兩、三個鐘頭，負擔才卸去，心中才平安下來，知道神已聽了她的禱告。幾周之後，她兒子回來，一見到母親就說，「母親，我已經得救了。」於是將自己得救的經過述說一番：幾周之前，他們的船航行大西洋，突遇狂風，桅杆折斷。船主命令把桅杆拆去，以減少危險。他被差派冒險出去工作，心中不免埋怨，口中不斷咒罵，神為何害得他們在此黑夜，冒著狂風大雨，出去工作。"],["P","正當他們工作之時，大浪捲來，船身一側，他就被捲入海中。他在海中與浪掙扎，生死一髮之間，忽然想到靈魂將要永遠滅亡，心中不覺禱告說，「主阿！我仰望你。」說完，完全失去知覺。數小時後，風平浪靜，水手來到艙面收拾災後，發現他在艙面，立刻灌藥，把他救醒。原來一浪卷他入海，一浪卷他上船。母親為他禱告之時，正是他在遇難又蒙拯救之時。"]]},{"no":69,"t":"繩子嵌在石縫中","b":[["V","約伯…清早起來，按著他們眾人的數目獻燔祭；因為約伯說，說不定我兒子犯罪，心中咒詛了神。約伯常常這樣行。（伯1:5）"],["E","Job …would rise early in the morning and offer burnt offerings according to the number of them all; for Job said, Perhaps my children have sinned and have cursed God in their heart. Job did this continually. (Job 1:5)"],["P","賈斐（Gorfield）生長在一個極為貧困的家庭中。父親早逝，母親以耕種幾畝薄田為生，他自己則在船上作伙伕。有一天夜半，他一個不小心落入海裡，沒有人聽見他的呼救。他在危急中，抓住一條繩子，繩子另一端很鬆，無法施力，便越拉越沉。突然繩子嵌在船邊的石縫中，他因此得以攀上，得救上岸。他穿著溼淋淋的衣服跑回家中，看見母親正在跪著為他禱告。他知道是神救了他，從此以後便成為神所重用的人。"],["H","禱告－在主名裡（詩559）"],["L","我奉耶穌全能的名，|跪在施恩寶座前，"],["L","打敗許多黑暗軍兵，|滅熄許多的火箭。"],["L","（副）全能名！全能名！|我奉此名就得勝！"],["L","全能名！全能名！|撒但、罪、死，都無能！"]]},{"no":70,"t":"未聽道能信主","b":[["V","祂願意萬人得救，並且完全認識真理。（提前2:4）"],["E","Who desires all men to be saved and to come to the full knowledge of the truth. (1 Timothy 2:4)"],["P","有一位姊妹讀了一本書，上面寫著：「一個人在倫敦，為一個兩千哩外的人禱告，那裡正有變動；結果藉著那個禱告，那人得蒙保守。」這位姊妹看了以後，想起她有一位哥哥，住在福建潮州，尚未得救。她就試著為他禱告，求主使她哥哥得救。過了不多時日，忽然接到她哥哥的來信，告訴她說，「我莫名其妙，想起要讀聖經，想起自己的罪，若不悔改，好像地獄就在眼前。就在那一天，我悔改接受了救主。」一個人從未聽過道，也沒有讀過聖經，竟能信主。這是代禱的功效。"],["H","禱告－憑信心（詩561）"],["L","「憑信心求，」奉主的名，|施恩座前來禱告；"],["L","你若相信，聽主答應：|看哪，小子，已成了。"]]},{"no":71,"t":"為人得救禱告六十多年","b":[["V","耶穌又對他們講一個比喻，是要人常常禱告，不可灰心。（路18:1）"],["E","And He told them a parable to the end that they ought always to pray and not lose heart. (Luke 18:1)"],["P","有一位傳道人，在慕勒將死之前，問他說，「你一生所求的，有沒有什麼事是神未曾應允的？」慕勒回答說，「我曾為兩個人得救的事，禱告了六十二年三個月又五天零兩個鐘頭；我記得非常清楚，可是那兩個人毫無悔罪改過的樣子。」傳道人說，「你希望神救這兩個人麼？」「祂當然一定會救。你想神會把祂孩子六十多年的禱告，擱在一邊不顧麼？」慕勒死後不久，那位傳道人接替慕勒，在瑞司特教堂講道，就對大眾題起這件事。一位太太立刻說道：「你所題起的那二人，其中一位是我的舅父，已經得救，前幾周過世了；另一位在柏林，也已蒙恩歸主了。」"],["H","禱告－憑信心（詩561）"],["L","「憑信心求，」神要成就|聖靈組織的禱告；"],["L","祂必施行奇妙拯救，|遠超過你所意料。"]]},{"no":72,"t":"記名禱告","b":[["V","我們要堅定持續的禱告，並盡話語的職事。（徒6:4）"],["E","We will continue steadfastly in prayer and in the ministry of the word. (Acts 6:4)"],["P","倪柝聲在學時，曾一次記下一百四十個人的名字，併為他們的得救禱告。很奇妙的，有的人上午寫進去，下午就得救。過了十八個月，只有兩個人沒有得救。這是一個很好的榜樣。我們當將家中所有尚未得救的人，以及親戚朋友，並一切認識的人，都一一記入禱告簿內，天天、好好的為他們禱告。我們應當相信，這是蒙祝福的事。"],["H","我信神聽我禱告（兒501）"],["L","我信神聽我禱告，|我信神聽我禱告，"],["L","我已證實神垂聽，|榮耀歸主名。"]]},{"no":73,"t":"一直麻煩神","b":[["V","神的選民晝夜呼籲祂，祂縱然為他們忍耐著，豈不終久給他們伸冤麼？（路18:7）"],["E","And will not God by all means carry out the avenging of His chosen ones, who cry to Him day and night, though He is long-suffering over them? (Luke 18:7)"],["P","有位姊妹，為她哥哥禱告多年，都未得著答應。有一天她說，我知道我的哥哥定規得救。說的時候，好像很有把握。她說，「我這幾天讀到路加十八章，那個寡婦老是求，那個不義的官總是不給她伸冤。後來她求到一個地步，把那個不義的審判官求得麻煩了，就給她伸了冤。在這事上，神給我看見，我從來沒有麻煩過神。如果我早晨起來，對神說，叫我的哥哥得救；中午也對神說，叫我的哥哥得救；晚上也對神說，叫我的哥哥得救。如果我一直這樣求，到有一天，神被我求得麻煩了，便會說，好，就讓你的哥哥得救吧。所以，我一定要這麼作；並且我知道，我的哥哥定規要得救。」這位姊妹本來是一個非常膽小的人；然而，那一次她非常剛強。她一直麻煩神，一直為她哥哥禱告。到隔一週，她的哥哥果然得救了。"],["H","禱告－等候神（詩574）"],["L","我今等候，主，我今等候；|讓我安息於你，"],["L","使我清楚你意，|這是我所懇祈－"],["L","我今等候，我今等候。"]]},{"no":74,"t":"為中國人得救題名禱告","b":[["V","所以，我願男人無忿怒，無爭論，舉起虔聖的手，隨處禱告。（提前2:8）"],["E","I desire therefore that men pray in every place, lifting up holy hands, without wrath and reasoning. (1 Timothy 2:8)"],["P","內地會在中國的工作，有一段時間非常興旺，可說是全世界最興旺的區域。其中的原因從來沒有人知曉，直到內地會的創辦人戴德生有一年去英國，才找出這原因。有一天他在英國某地講完了道，就有一位青年人前來對他說，「我對於中國內地會的光景，以及什麼人得救，我都知道。因為我有一位同學，在中國傳道，凡有心向道的中國人，他都不斷的把他們的名字寄來給我，我就不斷的一一為他們禱告。」戴德生這才明白，原來在英國有一個禱告的人，不但天天禱告，而且特別題名禱告，可說是代禱的傳福音者。雖然他未曾親臨中國，但他在中國福音上所得的果效是奇妙的。"],["P","你的親戚、朋友、同事、同學，是不是還有許多沒得救的呢？你是否天天特別題名為他們一一禱告？請不要忘了他們。"],["H","禱告－與主同勞（詩569）"],["L","禱告與主同勞苦，|照主心意和目的；"],["L","與主完全的聯合，|直到祝福能滿溢。"]]},{"no":75,"t":"必不停止為你禱告","b":[["V","至於我，斷不停止為你們禱告。（撒上12:23）"],["E","Moreover as for me, far be it from me that I would sin against Jehovah by ceasing to pray for you. (1 Samuel 12:23)"],["P","有個農夫在農事以外，時常傳道。他的大兒子是作生意的。有一個主日，父子同車回家。他一看見自己的兒子，就向兒子傳福音。他的兒子大大不悅，說，「父親，我不要聽福音；請不要再向我說。你若再說，我就不回家了。」他很傷心的答應兒子，但他說，「讓我告訴你，我必不停止為你禱告，求神救你；因你尚不曉得為自己求。」過了幾個月，他的兒子聽見他在禱告，就不知不覺的自問：「父親真要不住的為我禱告麼？」隨即側耳傾聽。這位老農夫向神傾吐了許多心裡的話；末後，用很悲傷的聲音說，「神阿，現在要講起我的大兒子約翰。」只說了這一句話，約翰的心就碎了，再也聽不下去，立即承認自己的罪，接受主耶穌作他的救主。"],["H","禱告－告訴主（詩572）"],["L","我所有苦況，必須告訴主，|我不能獨自擔此憂鬱；"],["L","我在患難中，惟主能安撫，|擦去我眼淚，將我體恤。"],["L","（副）我必須告訴，必須告訴主，|將我的心事向主傾吐；"],["L","我必須告訴，必須告訴主，|惟主知我心，樂於安撫。"]]},{"no":76,"t":"我的事完成了","b":[["V","不要銷滅那靈。（帖前5:19）"],["E","Do not quench the Spirit. (1 Thessalonians 5:19)"],["V","為著那靈撒種的，必從那靈收永遠的生命。（加6:8）"],["E","He who sows unto the Spirit will of the Spirit reap eternal life. (Galatians 6:8)"],["P","有一位鐵匠，清晨開起店門，看見一個人站在門口；那人名叫撒母耳，是個口吃的人。他的褲子溼到膝頭，鞋子完全溼透，因為他走了三英哩的路，被路上滿了露水的野草弄溼了。鐵匠立即上前向他請安。撒母耳因為口吃，不能即刻答覆，只點了點頭。然後，經過不少的掙扎，才說出話，他說，「我特意來，與你一同禱告，神把你放在我的心中。我今早四點鐘就想到你。」鐵匠請他進來，他卻不進。未等鐵匠再說什麼，撒母耳就跪下，舉手仰臉，開聲向神禱告，極其懇切敬虔。這時他的口吃竟然不成阻礙，他禱告的話十分流暢，為鐵匠向神祈求，直到心中的重擔卸脫。他一說完「阿們」，就抓住鐵匠的手說，「好，我的事完成了。神要我作的，我已經作了；現在我要走了。」說畢轉身就走。鐵匠心中深受感動，無法開店作工，就把店門關起來，轉入屋內，高聲向樓上呼喚其妻，要她一同下來禱告。他的妻子一下樓，便看見鐵匠正放聲大哭，向神禱告，真實悔改，接受主耶穌作他個人的救主。"],["P","信徒若是順從聖靈的引導，不知道多少神蹟要發生！"]]},{"no":77,"t":"撫髮禱告","b":[["V","況且，那靈也照樣幫同擔負我們的軟弱；我們本不曉得當怎樣禱告，只是那靈親自用說不出來的嘆息，為我們代求。（羅8:26）"],["E","Moreover, in like manner the Spirit also joins in to help us in our weakness, for we do not know for what we should pray as is fitting, but the Spirit Himself intercedes for us with groanings which cannot be uttered. (Romans 8:26)"],["P","有一位母親因為兒子常常醉酒，走向毀滅之路，便請求一位姊妹為他禱告。這位姊妹問她自己曾否為兒子禱告。她說，「已經為他禱告過了。」這位姊妹再問她曾否與兒子一同禱告。她答：「我不能出聲禱告，也不敢在人面前禱告。」這位姊妹就對她說，「姊妹，你必須與他一同禱告；否則，我也不能為他禱告。」這位母親立即醒悟過來，覺得不該如此軟弱，以致兒子不能悔改。"],["P","有一天晚上，她的兒子又喝醉酒回家，躺在自己的臥室裡，酣酣入睡。聖靈把這位姊妹引到她兒子身邊，她跪在地上，把手放在兒子發燙的額上，一面撫平他的亂髮，一面為他禱告，求神感動他的心，使他悔改。忽然兒子醒過來，睜眼看著母親，心中十分驚異。聖靈使他的心靈甦醒過來，他立即喊說，「母親，你在為我禱告？神阿，憐憫我。」淚從他臉上流了下來，他悔改了；二人同聲禱告。當晚他就得救了。"]]},{"no":78,"t":"五萬件事得答應","b":[["V","你們在我的名裡無論求什麼，我必作成，叫父在子身上得榮耀。（約14:13）"],["E","And whatever you ask in My name, that I will do, that the Father may be glorified in the Son. (John 14:13)"],["P","一八三〇年十月七日，慕勒和葛馬利結婚。他們結合在同一的捨己原則上，四十年之久，同心事奉主。他們遵從主的話，變賣他們僅有的一切，賙濟窮人，積攢財寶在天上。他們為著基督自願貧窮，從不後悔所行的；他們在日常的生活裡，相信神的供應，並證明神的信實，經歷神是一位聽禱告的主。在慕勒六十年倚靠主的生活中，他的信心從不畏縮。他能清楚指出，有五萬件事明顯的得著禱告的答應，其他還有無數的例子，雖不能逐條指明，卻都是神看顧的憑據。"],["H","禱告－告訴主（詩571）"],["L","何等朋友，我主耶穌！|擔我罪孽負我憂；"],["L","何等權利，|能將難處到主面前去祈求。"],["L","多少平安屢屢喪失，|多少痛苦無須受；"],["L","無非我們未將萬事|到主面前去祈求。"]]},{"no":79,"t":"亞比該絨線球","b":[["V","你們禱告，無論求什麼，只要信，就必得著。（太21:22）"],["E","And all that you ask in prayer, if you believe, you will receive. (Matthew 21:22)"],["P","有個小女孩，名叫亞比該，一直想得到一些花絨線，好能作個球玩。有一次，慕勒到她家裡，她就請慕勒為她花絨線球的事禱告。慕勒答應了她，和她一同跪下禱告。她先禱告神說，「我要一個絨線球，但顏色是要花的。」後來慕勒也低下頭，按手在她身上，對神說，「這裡有一個孩子，她要一個絨線球，顏色要花的。這件事在人作不到，我也不作，這是你的事，求你聽她的禱告。」禱告後慕勒起來，就對她說，「在近兩天內，神必定給你花絨線球玩。」那時她小小的心都跳了起來，心想，也許是她的外祖母，或者姑母會帶花絨線給她吧。那知就在第二天夜裡，她的父親拿了一些花絨線來給她，她真是快樂極了。原來她的父親開了一間百貨商店，別的絨線都賣出，只有這花絨線總是賣不出，索性拿回家給孩子玩。"],["P","第二次慕勒先生看見她，就問她說，「你的花絨線球好玩麼？」慕勒不是問她得著了花絨線球沒有，乃是問她好不好玩。一個認識神的人，禱告就是這樣有把握。"]]},{"no":80,"t":"求神賜下肥皂","b":[["V","應當一無掛慮，只要凡事藉著禱告、祈求，帶著感謝，將你們所要的告訴神。（腓4:6）"],["E","In nothing be anxious, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God. (Philippians 4:6)"],["P","在德國，有一位靠信心辦孤兒院的依凡小姐，在她的見證裡說到：有一次，在經濟上非常缺乏，連洗衣的肥皂都沒有了。院中的負責人就一同禱告，求神賜下肥皂。第二天，郵局送來通知單，說有一個木箱待領。他們去領回來後，打開一看，竟是一箱肥皂，迄今無法找出是誰送來的。"],["P","無論環境如何，永遠不可懷疑神的智慧、信實與慈愛。"],["H","禱告－告訴主（詩572）"],["L","我所有缺乏，必須告訴主，|我不能獨自卸去憂慮；"],["L","我所有需要，惟主能滿足，|使我享豐富，綽綽有餘。"],["L","（副）"],["L","我必須告訴，必須告訴主，|將我的心事向主傾吐；"],["L","我必須告訴，必須告訴主，|惟主知我心，樂於安撫。"]]},{"no":81,"t":"天使看管鈕釦","b":[["V","當將你的事交託耶和華，並信靠祂，祂就必成全。（詩37:5）"],["E","Commit your way to Jehovah, and trust in Him; and He will act. (Psalm 37:5)"],["P","倪柝聲年少時，有一次穿了他父親的新大衣，到郵局去寄信。到了郵局之後，發現鈕釦掉了一個。他就立刻禱告，求主差遣天使看住那個鈕釦，不要給人拿去；因為他穿這件衣服，沒有得到父親的允許，若是丟了鈕釦，恐怕要受父親重重的責備。在他回家的路上，他幾乎已經忘記此事；直走到半路時，才忽然想起來，即刻低下頭來，一看，那個鈕釦就在他腳下。天使是服役的靈，為那承受救恩的人效力。"],["H","主阿求你記念我的禱告（兒512）"],["L","主阿，求你記念我的禱告，|保守我活在你裡面；"],["L","隨時問問你在我裡的感覺，|順從你，得你喜悅。"]]},{"no":82,"t":"脫離獅口","b":[["V","救我脫離獅子的口；求你應允我，使我脫離野牛的角。（詩22:21）"],["E","Save me from the mouth of the lion; indeed while I am in the horns of wild oxen, answer me. (Psalm 22:21)"],["P","多年以前，非洲有英國軍隊駐守，他們宿營在廣大的樹林裡，野荒獸多。有一回，一個士兵迷了路，找不到宿營地點。天色漸黑，林中野獸吼叫，極其可怕，他心中萬分焦急。就在他體倦力疲時，忽然看見一個洞穴，便爬了進去，倒下就睡著了。天亮之前，忽然聽到獅子吼叫的聲音，自遠而近。不一會兒，果然有一頭猛獅進入洞中，發現那人睡在裡面。這頭猛獅因一夜已經吃得飽足，就用腳爪抓住那人胸部，無心再吃，並在那人旁側睡了下去。這個士兵嚇得面如土色，動也不敢動。這時，他想起幼時常常坐在母親膝前，聽母親禱告，自己卻未曾禱告過一次；現在生死關頭，他只有禱告一途，別無他法。於是他低頭禱告說，「主耶穌阿，求你救救我。你若救我，脫離獅子的口，我必信靠你。」禱告後聽聽聲音，知道那獅子已經睡得很甜。他就慢慢的將獅子的爪，從自己身上挪開；他一面挪移，一面不住的禱告。主使獅子沉睡，那個士兵便能把獅爪從他身上挪開，爬出獅洞，狂奔回營。他的朋友們，因他得以從獅子口中逃了出來，都歸榮耀給神。"]]},{"no":83,"t":"槍斃前禱告","b":[["V","因為你必不將我的魂撇在陰間，也不叫你的聖者見朽壞。（詩16:10）"],["E","For You will not abandon my soul to Sheol, nor let Your Holy One see the pit. (Psalm 16:10)"],["P","上海有位姓王的牙醫，是個基督徒。日軍攻佔上海時，他便遷到租界避難。在路過日軍駐紮的所在地時，那裡只准婦人、孩子經過。王醫師不得已，只好仍回江灣。第二天，他和一位友人前往日軍司令部，請領赴租界的通行證，以期能逃出險境。日軍以其形跡可疑，把他拉往空地，想要把他槍斃。王醫師就用英文說道：「我是個基督徒，請在槍斃之前，給我兩分鐘的時間禱告。」日軍允許了他。王醫師立刻跪在地上，迫切禱告，將靈魂交給主；然後起來，平平安安等候槍斃。日軍看見這樣的情形，知道他不是什麼危險分子，就把他釋放了。"],["H","祈求的就必得著（兒509）"],["L","祈求的，就必得著，|尋找的，就必尋見，"],["L","叩門的，|主必親自給你開門；"],["L","祈求的，就必得著，|尋找的，就必尋見，"],["L","叩門的，|主必親自給你開門。"]]},{"no":84,"t":"宇宙皇帝","b":[["V","他們聽見了，就同心合意的高聲向神說，主宰阿，你是造天、地、海和其中萬物的。（徒4:24）"],["E","And when they heard this, they lifted up their voice with one accord to God and said, Sovereign Master, You are the One who has made heaven and earth and the sea and all things in them. (Acts 4:24)"],["P","一八三九年，土耳其回教皇帝下了一道諭令：「基督教徒一個也不准留在境內，都要限期回國。」有一位美國傳教士韋廉顧代，聞知此事，就去找他的朋友康士坦丁大學校長韓慕林博士，告訴他這不好的消息，並說，「不好啦，我們得走了。英、美大使對此也是束手無策，因為這個皇帝極為專制，不講理。」博士回答說，「宇宙的皇帝會聽禱告，祂必能改變土耳其回教皇帝的諭令。」他們就同心合意的禱告。第二天，回教皇帝駕崩，諭令也就沒有實行。"],["H","屬靈的爭戰－穿上神的軍裝（詩642）"],["L","當奉耶穌這名站住，|信祂得勝站住；"],["L","不靠自己力量站住，|不靠才能站住；"],["L","不要使用血氣兵器，|只用聖靈寶劍；"],["L","穿上神的軍裝服役，|滅盡仇敵火箭。"]]},{"no":85,"t":"禱告救了美國","b":[["V","聚集在這裡的眾人也必知道耶和華施行拯救，不是用刀用槍，因為爭戰的勝敗在於耶和華。（撒上17:47）"],["E","And all this congregation will know that it is not by sword or spear that Jehovah saves, for the battle is Jehovah's. (1 Samuel 17:47)"],["P","一八六二至六三年，是美國歷史上最黑暗的一年。當時為了解放黑奴，南北雙方交戰不休。當時北政府外有強敵，內有內奸，以致屢戰屢敗。正在這嚴重關頭，總統林肯發佈一道命令，勸全國人民禁食禱告神；那是一八六三年三月三十日的事。五月九日在昌色拉威爾，北軍打了一次敗仗，看起來好像神沒有聽到禱告。當時南方軍隊，更加驕傲，決定北伐。北軍失敗的消息傳到林肯總統耳裡時，他獨自一人在房裡禱告神，並許願說，神若賜他大勝，他必終身向神盡忠。他對他的部屬說，「這次戰爭是為神，為正義而戰，所以這一次，神必扶助我們的將士能戰勝。」第二天在蓋茨堡（Gettysburg）一戰，果然得了大勝利；那一次的勝利，決定了大局，以後北軍屢戰屢勝。這就是神聽了一國元首和全國人民禱告的事實。"],["H","試煉中的安慰－主的信實（詩506）"],["L","祂不誤事，因祂是神！|祂不誤事，祂樂施恩！"],["L","祂不誤事，祂已許過！|我們有神，還怕誰何？"]]},{"no":86,"t":"一條大魚","b":[["V","並要在患難之日呼求我：我必搭救你，你也要榮耀我。（詩50:15）"],["E","And call upon Me in the day of trouble: I will deliver you, and you will glorify Me. (Psalm 50:15)"],["P","有一個寡婦，撫養了五個孩子，生活極其窮苦。有一天，天氣十分寒冷，家裡只剩一點麵。母親就用僅有的麵作了一塊餅，分成兩半，作為午、晚兩餐之用。到了晚上，吃完最後半塊的餅，母親坐在燈下，想到明天的日子不知如何過，不禁嘆口氣說，「我太驕傲了，從來沒有藉著禱告尋求神的幫助。現在雖想禱告，但是心裡又冷又硬。」於是翻開聖經，盼望找到一些關於窮乏得著供應的例子。然而轉念之間，心想：此時總不會有申言者到我這裡，即使有申言者來，也不會增加我的糧食，因為壇裡沒有一點麵；明晨只好叫四個孩子喝些開水，打發他們上學。想到這裡，忽然看到詩篇裡的一句話：「並要在患難之日呼求我：我必搭救你，你也要榮耀我。」（五十15。）這句話摸著了她的心，立即淚如雨下，跪在主前禱告。當下，她的小女兒瑪利忽從外面跑進來，說，「媽媽，我找到一條大魚，但我拿不動。」母親隨即與女兒一同跑到河邊，果真發現河邊岸上有一大魚。取回後賣給一家大飯館，魚重十九磅半，得了一大筆錢。"]]},{"no":87,"t":"躲在深山禱告","b":[["V","我若心裡注重罪孽，主必不聽。（詩66:18）"],["E","If I regarded iniquity in my heart, the Lord did not hear. (Psalm 66:18)"],["P","十九世紀帶進美國大復興的斐尼，在他得救之初，開始學習禱告時，他以為只要放聲，而不被人聽見，就能自由釋放的禱告。於是有一天，他就悄悄離家，深入樹林，翻到山後，找到一個地方。那裡有幾棵大樹倒在一起，中間留有一個空隙，就像一個禱告的密室。斐尼就爬了進去，跪下禱告；但他仍然怕有人看見，所以侷促不安，以致勉強說了幾句，卻也是有口無心。他難過的快要絕望了，因為以為不能禱告了。這時內心忽然責備他說，「你這罪人，怎以跪在神前向祂禱告為恥，並且如此冰冷呢？」於是他大聲認罪，在主面前腸斷心碎，繼續禱告，不知過了多少時候；回到家中，已是正午時分。"],["P","禱告並非改變神，乃為改變我們，叫我們裡面起了變化，以符合神的作事條件。"]]},{"no":88,"t":"聖安求涸井復湧","b":[["V","我要在光禿的高處開江河，在谷中開泉源。我要使曠野變為水池，使乾地變為水泉。（賽41:18）"],["E","I will open up rivers on the bare heights, and in the midst of the valleys, springs. I will make the wilderness into a pool of water, and the dry land into springs of water. (Isaiah 41:18)"],["P","加拿大有一個婦人，名叫聖安，已經活了一百歲。當她年輕時，曾作用人，工資很低，主人又極其兇惡。每一天，聖安都必須走到三哩外的小山取水，十分辛苦。附近本來是有一口深井，但久已乾涸。有個晚上，經過一天的辛勞，聖安很疲倦，跪在神前禱告。當她禱告之時，想起一節經文：「我要在…谷中開泉源。…使乾地變為水泉。」（賽四一18。）「耶和華…說，你們要呈上你們的案件；…要題出你們的論據。」（21。）這些話語激動聖安的心，便在神的面前呈上她的案件，告訴神怎樣迫切要水，上山取水如何艱苦。禱告後她便躺下睡了；因為她已呈上她的案件，題出她的論據。次日清晨，有人看見聖安拿著小瓶，前往涸井那個方向去。於是問她要往何處，聖安回答說，「要往井裡取水。」那人驚奇的說，「那井豈不早已乾涸了麼？」聖安仍然去了，她知道她所信的是誰。到了那裡，發現井裡已有八十三尺深水，又清又涼，從此那井再也沒有乾過。"],["H","得救的證實與快樂－主的保守（詩259）"],["L","（副）"],["L","惟知道我所信的是誰，|並且也深信祂實在是能保"],["L","守我所信託祂的，|都全備直到那日！"]]},{"no":89,"t":"交響和諧","b":[["V","我又實在告訴你們，你們中間若有兩個人在地上，在他們所求的任何事上和諧一致，他們無論求什麼，都必從我在諸天之上的父，得著成全。（太18:19）"],["E","Again, truly I say to you that if two of you are in harmony on earth concerning any matter for which they ask, it will be done for them from My Father who is in the heavens. (Matthew 18:19)"],["P","「同心合意」這辭的另一種翻譯，是「交響」或「和諧」。世界上最好聽的音樂便是交響樂。韓德爾所寫彌賽亞中的「牧人交響曲」，便是一個顯著的例子。這樣偉大的音樂，若被外行人演奏，或者指揮不善，就不能把它的美妙之處表達出來。要能表達得恰當，就必須一切樂器都先把音調校正。對音之後，演奏的人還得時時注意指揮，音調、時間、和抑揚頓挫，都得絲毫不差。這樣樂聲才能和諧一致，優雅動聽。雖然樂器有數十種之多，卻也不至混亂嘈雜。眾聖徒在一起禱告，必須個人與神和諧一致，再與眾聖徒交響在一起。"]]},{"no":90,"t":"按鈴叫我","b":[["V","耶和華阿，認識你名的人要信靠你，因你沒有離棄尋求你的人。（詩9:10）"],["E","And those who know Your name put their trust in You, for You have not forsaken those who seek You, O Jehovah. (Psalm 9:10)"],["P","在一個精細織品的工廠裡，有一條工人必須遵守的工作規則：「若是遇見機器上絲線纏繞錯亂時，工人應當按鈴請工頭來，將亂絲理清。」有一次，一個女工機器上的經緯纏亂了，自己以為是熟手，可以弄好，就沒有去通知工頭。結果越理越亂，弄得一籌莫展。最後工頭來了，女工連忙解釋說，「先生，我已盡我所能的了。」工頭的回答是：「下次務必記得，盡你所能的，就是按鈴叫我。」在患難的日子求告耶和華，這就是「盡你所能的」。"],["H","聽聽聽聽聽主耶穌聲音（兒707）"],["L","聽！聽！聽！聽！|聽主耶穌聲音，"],["L","祂的命令我都要遵行；|走！走！走！走！"],["L","跟主耶穌前走，|一步一步跟主前走！"]]},{"no":91,"t":"運磚上屋","b":[["V","天天加給我們美福的主，就是拯救我們的神，是當受稱頌的。（詩68:19）"],["E","Blessed be the Lord, who day by day loads us with good; God is our salvation. (Psalm 68:19)"],["P","三個建造房子的工人，在一架板梯上分立上、中、下三處位置，運磚上屋。下面的人把磚遞給中間的人，中間的人接磚後，再遞給上面的人。這樣，就很快的把地上的磚運上去了。不過，如果中間的人不將下面那人所給他的磚再遞上去，或者上面的人不接受中間的人所遞給他的，就要被下面的人所繼續不斷送給他的磚壓住。照樣，我們不要把從世界來的重擔，壓在自己身上；乃要卸給神。什麼時候，我們有了重擔，就當立刻藉著禱告、祈求和感謝，交託給神。"],["H","試煉中的安慰－主的看顧（詩495）"],["L","路途遙遠，負擔沉著，|力盡身疲要倒下；"],["L","請聽主聲，柔然輕說：|重擔當託耶和華。"],["L","（副）重擔當託耶和華，|重擔當託耶和華，"],["L","主會安慰你，又會堅固你，|重擔當託耶和華。"]]},{"no":92,"t":"停止操心","b":[["V","你們要將一切的憂慮卸給神，因為祂顧念你們。（彼前5:7）"],["E","Casting all your anxiety on Him because it matters to Him concerning you. (1 Peter 5:7)"],["P","路德馬丁在給他妻子的一封信裡說到：「我的博士夫人，我不願你為我操心，甚至害失眠症。因你為我操心，我的鄰家就失了火，幾乎把我們葬於火窟。昨日，無疑的也是因為你操心的緣故，一塊石頭從上面掉下來，幾乎打在我的頭上。我怕你若不停止為我操心，恐怕地也會開口把我們吞下去。…你只要禱告，讓神照顧我。」"],["H","經歷基督－與祂交通（詩415）"],["L","在祂同在的秘密處，|我得安居何甘美！"],["L","在祂面前時常俯伏，|所學功課何寶貴！"],["L","憂慮不能將我攪擾，|試煉也不能壓住；"],["L","每逢撒但引誘吼叫，|我就到祂隱密處，"]]},{"no":93,"t":"讓神決定","b":[["V","我的神阿，我樂意實行你的旨意；你的律法在我裡面。（詩40:8）"],["E","I delight in doing Your will, O My God; indeed Your law is within My inward parts. (Psalm 40:8)"],["P","有一個母親，因為孩子得了癱瘓的病，便流淚來到聚會的地方。神的僕人就問她說，「若你知道是神的旨意要接他去，你願意讓他去麼？」她經過長時間的掙扎，最終答覆說，「如果我知道確實是神的旨意，我就願意放手，讓我的孩子去。」主的僕人就為孩子的病向神禱告，把孩子完全奉獻給滿有憐憫與智慧的神。過了三天，孩子就離開醫院，在他身上已經沒有病的現象了。"],["P","如果我們在禱告的事上，無論結果是什麼，都願意讓神來決定，我們的禱告必會得到答應，因為神總是把最好的給我們。"],["H","禱告－等候神（詩575）"],["L","我魂要肅靜，等候你的主！|先讓祂說話，然後向祂訴。"],["L","真實的禱告，乃是主發起；|你僅是器皿，發表祂自己。"]]},{"no":94,"t":"當香獻上","b":[["V","願我的禱告如香陳列在你面前，願我舉手祈求，如獻晚祭。（詩141:2）"],["E","Let my prayer be set before You as incense, the lifting up of my hands as the evening offering. (Psalm 141:2)"],["P","舊約裡是把禱告當作香獻在神面前。舊約裡的香，是用樹膠、樹汁作的。乃是先把樹皮挖掉，樹就會流出膠，流出汁來，經過調製，再才獻上給神。所以，禱告不是把一個普通的東西拿來就好，乃是從我們全人最中心的地方，送出東西來。好像是經過了十字架，經過了傷，挖出來的，那才是禱告。"],["H","禱告－意義（詩552）"],["L","禱告乃是靈中所燒聖香，|經過破碎之人向神獻上："],["L","乃是聖靈焚燒之氣所點，|再由信心呼求帶到神前。"]]},{"no":95,"t":"靈魂重擔壓在身上","b":[["V","那義人定居在他們中間，看見聽見不法的行為，他的義魂就天天感到痛苦。（彼後2:8）"],["E","That righteous man, who settled down among them, in seeing and hearing tormented his righteous soul day after day with their lawless works. (2 Peter 2:8)"],["P","熱得弗德是蘇格蘭著名的傳道人，他的妻子屢次在夜間由床上起來，總是看見他用毯子裹著身體，跪在又冷又硬的地板上禱告。他的妻子勸他上床睡覺，他卻回答說，「許多人的靈魂好像一個重擔，壓在我身上，教我如何能睡得著呢？」"],["H","願主大愛激勵我（兒1110）"],["L","願主大愛激勵我，|更加努力搶救靈魂，"],["L","許多人失迷罪中，|天天死亡沉淪；"],["L","求主使我裡面剛強，|不以你福音為恥，"],["L","賜我愛心，賜我力，|搶救更多靈魂！"]]},{"no":96,"t":"沒有預備那能禱告","b":[["V","時候將到，如今就是了，那真正敬拜父的，要在靈和真實裡敬拜祂，因為父尋找這樣敬拜祂的人。（約4:23）"],["E","But an hour is coming, and it is now, when the true worshippers will worship the Father in spirit and truthfulness, for the Father also seeks such to worship Him. (John 4:23)"],["P","有個教堂，請了一位傳道人前來佈道。傳道人講完之後，便請任何一位弟兄作個禱告結束。大家低下頭來，等了許久，沒有一個人起來禱告。有位弟兄等得不耐煩，便說，「傳道先生，我們那位禱告的弟兄今天沒有來。」傳道先生就說，「那麼就請你禱告吧。」這位弟兄答說，「你沒有預先通知我，我現在沒有準備好，那能禱告。」"],["P","禱告不是作文章或上呈文案，必須起稿預備；禱告乃是如同兒子對父親說話一樣，不用預備，只要將我們實在的光景與需要告訴主。"],["H","禱告－發表主（詩567）"],["L","禱告要將主發表，|不可發表我自己；"],["L","讓主啟示祂自己，|借我發表祂心意。"]]},{"no":97,"t":"盼夫得救好待自己","b":[["V","你們求也無所得，是因為你們妄求，為要耗費在你們的宴樂中。（雅4:3）"],["E","You ask and do not receive because you ask evilly that you may spend it on your pleasures. (James 4:3)"],["P","一位信了主的女子為她丈夫禱告，求主救他，目的並不是願意神得著她的丈夫，乃是盼望丈夫得救，就能待她好一些。有的作父母的，為他們兒女的靈魂禱告，希望兒女得救之後，可以孝順他們。如果神要他們的兒女得救以後，前往遠方傳道，他們立刻就不願意了。這樣的禱告，是自私的禱告，常得不到答應。"],["H","禱告－意義（詩553）"],["L","主阿，我要安靜在你面前，|將我全人收回到我裡面；"],["L","不再僅是外面隨意禱告，|乃是照著靈裡感覺發表。"]]},{"no":98,"t":"禱告如鑽山","b":[["V","耶和華阿，求你在這些年間復興你的工作。（哈3:2）"],["E","O Jehovah, revive Your work in the midst of the years. (Habakkuk 3:2)"],["P","叨雷博士曾著一本關於禱告的書。書中有段話說，「禱告如在大山鑽洞，我們在這頭鑽，神就在那頭作工，一到洞穿接觸之時，就為神的大能開了大門。」麥威杜尼城裡，有一個女士讀了這本書的這段話，心裡大受感動，立即邀請朋友組成禱告小組，專心禱告。這個運動很快普遍起來，及至該城中立之時，就有一千七百個禱告小組恆切禱告。不久這位女士前往英國，赴開西大會講論這些禱告小組。英國和愛爾蘭立時效法，禱告小組如同雨後春筍。到了一九〇四年，全球就有三萬信徒天天禱告說，「主阿，求你復興你的召會。」由此種下一九〇五年威爾斯的大復興。英美兩國的屬靈運動，以及印度和中國如同五旬節的復興，大都由於這些禱告小組的禱告。"],["H","禱告－為復興（詩577）"],["L","主給這個地方，|給這個地方，"],["L","將一個大復興，|給這個地方。"],["L","除去所有阻擋，|使我靈高昂，"],["L","好叫我運生命來醫治人傷。"]]},{"no":99,"t":"挖油井","b":[["V","所以，弟兄們，你們要恆忍，直到主的來臨。看哪，農夫等候地裡寶貴的出產，為此恆忍，直到得了秋雨春雨。（雅5:7）"],["E","Therefore be long-suffering, brothers, until the coming of the Lord. Behold, the farmer eagerly awaits the precious fruit of the earth, exercising long-suffering over it until it receives the early and late rain. (James 5:7)"],["P","從前有一個人，投資採挖油井，花了許多時間，耗費幾萬元，卻不見滴油，於是十分敗興，便廉價賣出。不料買主繼續再挖六個小時，油即如泉湧出。這頭一個主人，因為一時敗興，損失難以估計。同樣的，多少禱告未蒙應允，是因人等得不耐煩，灰心敗興，中途捨棄。主說，禱告不可灰心。（路十八1。）"],["H","鼓勵－與主交通（詩476）"],["L","活在生命光中，|不斷與主交通，"],["L","瞻仰恩主慈容，|順從聖靈感動，"],["L","天天榮上加榮，|時時讚美稱頌，"],["L","活在生命光中。"]]},{"no":100,"t":"放名片","b":[["V","你們要堅定持續的禱告，在此警醒感恩。（西4:2）"],["E","Persevere in prayer, watching in it with thanksgiving. (Colossians 4:2)"],["P","有位基督徒亞察爾，他說，禱告像把名片放在天平上。先把一兩的法碼放在一邊，然後把名片一張一張的放在另外一邊。第一張名片放下去，不能把那一兩的重量提高，一張一張的加上去，還是無法動得了。然而，或許正當末了一張加上去時，那邊的重量就提起來了。禱告也是如此；禱告一次、二次、三次…再禱告一次，也許這是你末次的禱告，答應就來到了。"],["H","鼓勵－與主交通（詩477）"],["L","用功朝見主面，|多和主對講，"],["L","常住在祂裡面，|以祂話為糧。"],["L","等候在祂面前，|柔順且降服，"],["L","每件事上不忘尋求祂祝福。"]]},{"no":101,"t":"竹筒漂鐘","b":[["V","在指望中要喜樂，在患難中要忍耐，在禱告上要堅定持續。（羅12:12）"],["E","Rejoice in hope; endure in tribulation; persevere in prayer. (Romans 12:12)"],["P","有一個很值錢、很重的鐘落在河裡，人用盡各種方法，總是拉不上來。後來，有一個聰明人，願意試一試。他利用數百條粗竹筒，僱了一些能夠潛水的人，將竹筒一條一條拴在鐘上。到末了，竟把鐘漂起來了。禱告如同這拴竹筒，不可灰心，拴到末了一根，禱告就發生果效了。"],["H","藉著神豐盛的憐憫（詩617）"],["L","愛弟兄要彼此親熱，|恭敬人要互相爭先，"],["L","殷勤不可懶惰，|要靈裡火熱常服事主，"],["L","在指望中要喜樂，|在患難中要忍耐，"],["L","在禱告上要堅定持續，|這是神人調和的生活。"]]},{"no":102,"t":"木塞打鋼條","b":[["V","耶穌看著他們說，在人這是不能的，在神凡事都能。（太19:26）"],["E","And looking upon them, Jesus said to them, With men this is impossible, but with God all things are possible. (Matthew 19:26)"],["P","有一塊長八尺、重五百磅的鋼鐵，用一條小鐵鏈懸在空中。在它旁邊有一瓶子的木塞，也是用一條絲線懸在空中；目的是要讓那個木塞打那鋼鐵，看看結果怎樣。木塞擊打那塊鋼鐵，起初鋼鐵絲毫不為所動。木塞繼續的打，一直打了十分鐘，鋼鐵便開始不安定；再過十分鐘，鋼鐵便有反應；到了半點鐘之後，鋼鐵竟在空中搖搖擺擺，如同鐘擺搖動一樣。照樣，只要我們肯繼續不斷的禱告，即使我們的禱告好像很微弱，但再大再難的事，神也會成就。因為每一個禱告都是摸著神的寶座，只要禱告一多，神自然起來作事。"]]},{"no":103,"t":"食人鯨","b":[["V","一人…能追趕他們千人，二人…能使萬人逃跑。（申32:30）"],["E","One chase a thousand, and two put ten thousand to flight. (Deuteronomy 32:30)"],["P","在南極洋裡有許多食人鯨，常常是一百多條成群的游來游去。它們有巨大的頭和嘴巴，據說還有世界上最厲害的一副牙齒。海豹和企鵝只要被它們可怕的牙齒一咬，立刻就喪命。有一個探險者，一次拿著攝影機站在浮冰上，準備拍攝食人鯨的照片。起初他發現它們常從海裡抬起頭來，好像在察看四周，但一剎那之間，忽然有如受了一聲命令似的，所有鯨魚都不見了。一會兒，就在那人腳踏冰塊底下，發生一連串兇猛的撞擊，冰塊開始碎裂，碎塊之間露出那些可怕鯨魚的頭，張著嘴巴。那攝影者不敢再逗留，飛奔逃回船上。"],["P","食人鯨合力撞擊冰塊的事，啟示給我們幾個禱告的原則：第一，要聚集在一起，同心合意的禱告。申命記三十二章三十節說，「一人…能追趕他們千人，二人…能使萬人逃跑。」第二，要不斷的禱告。主耶穌說，「要…常常禱告，不可灰心。」（路十八1。）祂常常不是很快的答應我們的禱告，乃因祂願意我們的信心逐漸增長，並要我們學習寶貴的功課。"]]},{"no":104,"t":"鑽戒無人認領","b":[["V","至於我，我要仰望耶和華，等候那救我的神；我的神必垂聽我。（彌7:7）"],["E","But as for me, I will look for Jehovah; I will wait for the God of my salvation; my God will hear me. (Micah 7:7)"],["P","有一位貴婦去看電影，回家之後，發現手上最寶貴的鑽石戒指掉了。她就打電話告知戲院主人，說在某某包廂裡遺失了一隻戒指。主人回答說，「請你等一會兒，我就去找。」貴婦等了約有一刻鐘，很不耐煩，就把電話掛上。不久，戲場主人找得鑽戒，但已無人接電話了。查問電話局，也無法得知她的號碼。後來登報聲明，仍是無人認領。"],["P","人的禱告有時也是如此；未等神的應允，就中途停止，真是可惜。"],["H","禱告－與主交通（詩568）"],["L","禱告與主來往交通，|憑信將祂來尋求；"],["L","學習來摸祂這活靈，|恭敬、仰望並等候。"],["L","（副）禱告與主來往交通，|祂面靈裡來尋求；"],["L","祂前求問並且靜聽，|隱密之處來等候。"]]},{"no":105,"t":"裝祈禱的馬車","b":[["V","因為我知道，這事藉著你們的祈求，和耶穌基督之靈全備的供應，終必叫我得救。（腓1:19）"],["E","For I know that for me this will turn out to salvation through your petition and the bountiful supply of the Spirit of Jesus Christ. (Philippians 1:19)"],["P","有一個信徒，住在鄉下，家裡小孩很多，經濟負擔很重，除了他的月薪以外，別無其他進款。不料他的腳骨重傷，臥在床上，不能作工，月薪也就沒有了。於是，眾信徒就召集一個特別的禱告會，專為他和他的家人禱告。一個接著一個，相繼起來禱告說，「神阿，求你供給他的一切需用。」"],["P","正當他們禱告之時，一位青年人前來叩門，說，「我爸爸今天不能來赴禱告會；但他的禱告由馬車裝運來了。」馬車就在聚會處的門口，裡面有瓜、有薯、有菜、有果、有肉、有蛋、有麵粉、有糖、有鹽等日用食品。信心沒有行為就是死的。若你財物有餘，看見弟兄窮乏，卻不供給他所需用的，而只口裡向神為他禱告，這樣的禱告也不實際。"]]},{"no":106,"t":"不必為樹操心","b":[["V","你所作的要交託耶和華，你所謀的就必成就。（箴16:3）"],["E","Commit your works to Jehovah, and your purposes will be established. (Proverbs 16:3)"],["P","有一信徒種了一棵橄欖樹，他禱告說，「神阿，我的樹需要水分，求你降下甘霖滋潤。」神就降下雨來。他又禱告說，「神阿，我的樹需要日光，求你給它日光。」於是雲散雨止，神就給它日光。他再禱告說，「神阿，現在需要霜來堅固它的組織。」果然那棵幼小的植物上罩了一層薄霜。然而不料，到了傍晚，那棵小樹竟然死了。於是他就去見另一位信徒，告訴他這奇異的經歷。那位信徒回答說，「我也種了一棵小樹，現在長得十分茂盛。我並沒有為我的樹操任何一點心，只是簡單的把它交給神；因為造它的神知道它的需要，遠勝過像我這樣無知的人。所以，我並不向神提出條件、建議、或任何方法。我只禱告說，『神阿，求你把它所需要的給它，無論是風、是雨、是霜、是雪、是日光、是什麼，你既造了它，一定知道它的需要，也會給它供應。』」"],["P","禱告不是替神作參謀，乃是將你的事交託給祂，並倚靠祂，相信祂，讓祂成全。"]]},{"no":107,"t":"到十五歲才給她","b":[["V","天怎樣高過地，照樣我的道路高過你們的道路，我的意念高過你們的意念。（賽55:9）"],["E","For as the heavens are higher than the earth, so My ways are higher than your ways, and My thoughts higher than your thoughts. (Isaiah 55:9)"],["P","在過年前幾天，一位父親問他的三個兒女說，「你們要什麼作新年的禮物呢？」老大說，「我要一支自來水筆。」父親說，「好。」老二說，「我要一個大皮球。」父親說，「好。」最小的女兒才三歲，她說，「爸爸，我要一隻金手錶。」父親也說，「好。」到了新年那天，兩個大的孩子都如願得到自己想要的禮物；惟獨金手錶用別的代替。小女兒想，是爸爸捨不得買給她。過了十二年，到她十五歲時，父親才給她買了一隻極好看的金手錶。父親說，「為什麼那時不買給你呢？因為你太小，不會照顧它。」"],["P","我們的禱告不一定立刻就得到答應，不是因為神不垂聽，乃是因為神有祂的方法，神有祂的時候。"]]},{"no":108,"t":"求忍耐的答應","b":[["V","求，就給你們；尋找，就尋見；叩門，就給你們開門。因為凡求的，就得著；尋找的，就尋見；叩門的，就給他開門。（路11:9-10）"],["E","Ask and it shall be given to you; seek and you shall find; knock and it shall be opened to you. For everyone who asks receives, and he who seeks finds, and to him who knocks it shall be opened. (Luke 11:9-10)"],["P","有一個作生意的基督徒，覺得他最需要的是忍耐，因為他最大的弱點就是容易發脾氣，這使他非常難過。於是他向神禱告，使他有忍耐的心。不久，他請了一個新的打字生。那知這個打字生的動作非常遲慢，是他一生從未遇見的；這使他幾乎天天發怒。有一天，神給他看見，這就是神對他要求忍耐的答應。當他明白神如何答應他的禱告時，他才開始學習靠著神忍耐。我們多是不知神答應禱告的方法，自以為神沒有答應我們的禱告；其實，神早已答應我們的禱告，只是我們不知道而已。"]]},{"no":109,"t":"請給全倉麥子","b":[["V","你要囑咐那些今世富足的人，不要心思高傲，也不要寄望於無定的錢財，只要寄望於那將百物豐富的供給我們享受的神；又要囑咐他們行善，在善事上富足，甘心分授，樂意與人同享。（提前6:17-18）"],["E","Charge those who are rich in the present age not to be high-minded, nor to set their hope on the uncertainty of riches but on God, who affords us all things richly for our enjoyment; to do good, to be rich in good works, to be ready to distribute, to be ones willing to share. (1 Timothy 6:17-18)"],["P","有一個富農，倉裡豐盈。在他禱告時，總是求天父使那貧窮的人，得以衣食無缺。然而，當貧窮者前來求乞時，他總是回答說，家中無物可以幫助。有一天早晨，他又在那裡為窮人禱告。禱告後，他的孩子對他說，「我很想得到一樣東西。父親，你知道是什麼？」父親回答說，「不知道。」"],["P","兒子說，「我想要那倉庫裡的麥子。」父親十分驚奇的說，「你要這許多麥子作什麼？」兒子說，「我要把這些麥子分給窮人，作神答應你替窮人的禱告。」父親聽了，一言不發，裡面如同萬箭穿心。這叫口是心非的禱告。我們要學習真實的禱告。"]]},{"no":110,"t":"笑我禱告我要打你","b":[["V","你們各人若不從心裡赦免你的弟兄，我天父也要這樣待你們了。（太18:35）"],["E","So also will My heavenly Father do to you if each of you does not forgive his brother from your hearts. (Matthew 18:35)"],["P","有個女學生，十分調皮，常常和同學打架。有一次，她自己禱告說，「神阿，求你幫助，使我不再打人。」另一個學生聽到便笑她說，「願你實行你的禱告，就好極了。」這個女學生聽了，就怒不可遏，還沒來得及說「奉主的名，阿們」，就大聲吆喝：「你敢譏笑我麼？我要打你。」禱告必須誠實，必須在靈裡說出心中真實的話，然後交託神，因為只有神能成就這禱告。"],["H","禱告－在靈裡（詩564）"],["L","永遠要在靈裡禱告，|不憑肉體或頭腦！"],["L","這個秘訣若肯實行，|神的同在必得到。"],["L","（副）永遠要在靈裡禱告，|這個秘訣主所示；"],["L","在靈裡面與神接觸，|這個秘訣要保持。"]]},{"no":111,"t":"造出另外一種聲音","b":[["V","你所喜愛的，是內裡真實；你在我隱密處，必使我認識智慧。（詩51:6）"],["E","You delight in truth in the inward parts; and in the hidden part You would make known wisdom to me. (Psalm 51:6)"],["P","有一個弟兄，想要作熱心的基督徒。他覺得禱告時若用天然的聲音，就不夠熱心，所以造出另外一種聲音。他起初這樣禱告時，裡面還覺得有點特別，覺得不是他自己的聲音。久而久之，他都忘了自己本來的聲音，是什麼樣的聲音。別人都覺得他那一種禱告的聲音不自然，但他還自以為很自然。不自然的，還以為很自然，這是對自己著迷。起先裝作時，裡面還有感覺，等到著了迷，不只裡面沒有感覺，並且還以為是真的，這是多麼可憐的事。"],["P","禱告必須真實，不造作，不虛假，裡面有什麼話就禱告什麼話。"]]},{"no":112,"t":"吃飯不禱告的傳道人","b":[["V","你們的光也當這樣照在人前，叫他們看見你們的好行為，就榮耀你們在諸天之上的父。（太5:16）"],["E","In the same way, let your light shine before men, so that they may see your good works and glorify your Father who is in the heavens. (Matthew 5:16)"],["P","在美國有一個地方，那裡有一家旅館，旅館中有一項規矩，就是凡是傳道人住宿，只收半價。有一位傳道人，住了一週。當他要離去時，開來的賬目卻都是全價。傳道人驚奇的問道：「傳道人不是半價麼？」服務生回答道：「是的，但你不是傳道人。」傳道人說，「我是出來遊行佈道，怎麼不是傳道人呢？」服務生回答說，「因為我們看你每次吃飯都不禱告，所以認定你不是傳道人。」傳道人無言可答，只得照付全價。"],["P","許多基督徒吃飯時，不敢在人面前禱告，為的是怕人取笑自己，豈知自己卻已羞辱了主。"]]},{"no":113,"t":"每月謝飯一次","b":[["V","凡神所造的都是好的，若感謝著領受，就沒有一樣是可棄的，都藉著神的話和人的代求，成為聖別了。（提前4:4-5）"],["E","Every creature of God is good, and nothing is to be rejected if received with thanksgiving; for it is sanctified through the word of God and intercession. (1 Timothy 4:4-5)"],["P","有一家基督徒，每天吃飯必先禱告謝飯。後來覺得麻煩，主人就說，「每次吃飯都要禱告，這太麻煩。」於是，就一次把一個月應該用的糧米買來，然後禱告說，「謝謝主賜給我們這一個月的飯食。」以後每天便不再禱告。"],["P","每次用飯，都存著歡躍單純的心領受，因此而生禱告感謝，乃是神所喜悅的。若因嫌麻煩，每月只禱告感謝一次，那就失去實意，不過成了律法罷了。"],["H","主我滿心感謝（兒508）"],["L","主，我滿心感謝，歡樂領受，|你所賜的飲食，美好豐厚；"],["L","求你聽我禱告，慈愛天父，|將它分別為聖，並加祝福。"]]},{"no":114,"t":"多多益善一毛不拔","b":[["V","塞耳不聽窮人哀求的，他將來呼求也不蒙應允。（箴21:13）"],["E","Whoever closes his ear
