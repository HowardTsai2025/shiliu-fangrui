 to the cry of the poor man also will cry and will not be heard. (Proverbs 21:13)"],["P","一個富足的信徒，在往教堂去的路上，遇見他素來所相識的一位鄰居，這人一向乏人照管奉養，是個老病窮苦的婦人。婦人看見這富足的人，就發出了悽慘的聲音，呼求幾角錢的賙濟。那富足的信徒心想，我手中實在有不少的錢，不過我的錢怎好這麼容易就給她呢。然而為免得她麻煩我，就給她兩枚銅幣吧。這樣作過後，他便離開，往教堂去。到了堂中，跪在神前，就感謝祈求說，「神阿，我感謝你，因為你使我一切所需用的都充足，又保護我得享平安。求你把更多的恩典加給我，使我的身心都能得福充盈；凡你所有的恩典，求你樣樣都賜給我。」為著別人，他一毛不拔；為著自己，卻要求多多益善。這種禱告，不會蒙悅納，因為「塞耳不聽窮人哀求的，他將來呼求也不蒙應允」。"],["H","禱告－甜美之時（詩578）"],["L","禱告之時、甘甜之時！|使我離開煩惱之事，"],["L","來到神的座前發表|所有意願、所有需要；"],["L","當我遇到重壓、憂愁，|我靈卻常得著自由，"],["L","不陷惡者所有佈置，|因為有你－禱告之時！"]]}]},{"n":"交通","i":3,"intro":[["V","神是信實的，你們乃是為祂所召，進入了祂兒子我們主耶穌基督的交通。（哥林多前書一章九節）"],["E","God is faithful, through whom you were called into the fellowship of His Son, Jesus Christ our Lord. (1 Corinthians 1:9)"]],"a":[{"no":115,"t":"活在生命的交通裡","b":[["V","願主耶穌基督的恩，神的愛，聖靈的交通，與你們眾人同在。（林後13:14）"],["E","The grace of the Lord Jesus Christ and the love of God and the fellowship of the Holy Spirit be with you all. (2 Corinthians 13:14)"],["P","約翰一書告訴我們，使徒聽見並看見永遠的生命，然後將這生命傳與信徒，使他們也可以聽見並看見。（一2～3。）藉著永遠的生命，使徒享受了與父並祂兒子主耶穌的交通；他們渴望信徒也能享受這交通。"],["P","在聖經中，「交通」原文的意思是一同參與，共同分享。交通乃是永遠生命的流出，並且實際上，就是所有已經接受並得著神聖生命之信徒裡面永遠生命的流。這是由新耶路撒冷裡生命水的流所描繪的。（啟二二1。）因此，所有的真信徒都在這交通裡。（徒二42。）這交通也是憑我們重生之靈裡的那靈，而得以繼續，因此稱為聖靈的交通（林後十三14）和（我們）靈的交通。（腓二1。）我們信徒乃是在這永遠生命的交通裡，有分於父與子的所是，和為我們所作的一切。我們藉著那靈的交通，享受父的愛和子的恩。"],["P","我們一信入主，就與主有了生命的聯結，這生命也就帶給我們生命的交通；我們還要天天活在這生命的交通裡，與神交通，好分享祂一切的豐富。（約翰一書生命讀經，生命課程）"]]},{"no":116,"t":"交通的秘訣","b":[["V","神是信實的，你們乃是為祂所召，進入了祂兒子我們主耶穌基督的交通。（林前1:9）"],["E","God is faithful, through whom you were called into the fellowship of His Son, Jesus Christ our Lord. (1 Corinthians 1:9)"],["P","基督徒必須深刻感覺到，他們僅僅悔改、相信、罪得赦免是不夠的；即使他們將自己奉獻給神也是不夠的。這些都不過是開端而已。一個基督徒必須認識，他自己並沒有力量來維持個人的屬靈生活，他需要天天藉著和主耶穌交通，接受從天上來的新恩典。可是這個新恩典，不是急急忙忙禱告一下，或是敷衍了事的讀幾節聖經就能得到的。他必須花時間，安靜的、慎重的進到神面前，而對於自己的軟弱和需要滿有感覺，並等候神藉著聖靈，在他心中更新他屬天的亮光和生命。這樣，在一天之中，不論遇到任何試探，都能蒙到基督大能的保守。"],["P","親愛的聖徒們！請我們默想一下：我們屬靈生活軟弱的光景，是否因為每天缺少時間和神交通呢？哦！我們應當相信，得勝的生活乃是可能的。許多人必要因著單獨在神面前花時間禱告的緣故，從他們裡面顯出新的生命來。（交通的秘訣）"]]},{"no":117,"t":"神與人的交通","b":[["V","因那聖別人的，和那些被聖別的，都是出於一；因這緣故，祂稱他們為弟兄，並不以為恥。（來2:11）"],["E","For both He who sanctifies and those who are being sanctified are all of One, for which cause He is not ashamed to call them brothers. (Hebrews 2:11)"],["P","在自然界，兩種生物要有交通，必須有一樣的生命、有一樣的地位。今天我們能夠與主有交通，是因為主已經把祂的生命給了我們，也把祂的地位給了我們。我們與主有一樣的生命，有一樣的地位，所以我們能夠與祂有交通。"],["P","主耶穌成為肉體，是叫祂自己成為人子；祂從死裡復活，是叫我們成為神子。祂成為肉體，是叫祂自己來到地上，站在人子的地位；祂從死裡復活，是將我們帶到天上，站在神子的地位。藉此，我們與主耶穌是聯合的。主耶穌降生是叫祂自己與我們聯合，主耶穌復活是叫我們與祂聯合。從祂復活之後，我們與祂有同一的生命，站在同一的地位上。所以希伯來書說，祂受苦之後，就能稱我們為弟兄。（二12。）"],["P","如果你在這裡只看見自己是僕人，主是主人，你和主就不能交通。你必須看見，你有祂的生命、祂的地位；你必須看見，祂稱你為弟兄，你和祂站在一樣的地位上，彼此能有交通。今天我們雖然是在地上，卻有天上的生命；祂雖然是在天上，卻有地上的生命。我們能與祂有交通。如果我們真看見這一件事情，就不會沉悶，就要發瘋似的讚美祂了！我們要說，阿利路亞！（十二籃，神與人的交通）"]]},{"no":118,"t":"默想和讀經","b":[["V","還要藉著各樣的禱告和祈求，接受救恩的頭盔，並那靈的劍，那靈就是神的話。（弗6:17-18）"],["E","And receive the helmet of salvation and the sword of the Spirit, which Spirit is the word of God, by means of all prayer and petition. (Ephesians 6:17-18)"],["P","一位活在交通中的姊妹，見證自己進入交通的經歷。她說，「引人進入交通的方法有兩個：一是默想；二是一面讀經，一面默想。」這裡的第二個方法，就是揀選一小段緊要又能實行的經節，先讀一讀，再仔細品嚐、消化，從裡面將精華取出來。當我們嘗得有味道時，就不必再往下讀；一直到味窮時再往下讀去，仍照前面的方法去品嚐。"],["P","這樣的讀經，可以用嬰孩吃奶作為很好的比方。起初他用力吸奶，及至奶汁流出來的時候，只要吃下，就不必再吸；不然易使自己被奶嗆到。我們讀經最好一次不要過量，因為叫我們得益處的，不是量多，乃是方法合宜。"],["P","第一個默想的方法，在讀經時可實行，隨時隨地也都可實行。就是運用信心，將自己放在神面前，想起一段有餵養和滋補性的真理，便用柔順、甜蜜的態度，專注在真理上，咀嚼其中的美味。這樣就能遏制心思往外遊蕩，不至分心，而遠離外面的紛擾，向裡面邁進，在深處親近神。"]]},{"no":119,"t":"基督在這裡","b":[["V","看哪，我天天與你們同在，直到這世代的終結。（太28:20）"],["E","And behold, I am with you all the days until the consummation of the age. (Matthew 28:20)"],["V","但與主聯合的，便是與主成為一靈。（林前6:17）"],["E","But he who is joined to the Lord is one spirit. (1 Corinthians 6:17)"],["P","在東印度群島有一位傳道人，受邀前去訪問一位將要離世的信徒。傳道人問這婦人有什麼感覺，她回答說，「快樂阿！快樂阿！」她將手放在聖經上說，「我有基督在這裡。」又將手放在她的胸膛說，「基督也在這裡。」再指著天說，「基督也在那邊。」"],["H","主在我裡面（兒323）"],["L","主在我裡面，|主在我外面，"],["L","主在我的前面，|主在我後面，"],["L","主在我右邊，|主在我左邊，"],["L","無論我在那裡，|都有主同在。"]]},{"no":120,"t":"在裡面等待你","b":[["V","願你吸引我，我們就快跑跟隨你－王帶我進了他的內室－我們必因你歡喜快樂。（歌1:4）"],["E","Draw me; we will run after you — The king has brought me into his chambers — We will be glad and rejoice in you. (Song of Songs 1:4)"],["P","有一位姊妹名叫凱瑟琳，曾有六週之久，一直覺得神離開了她；好像神的恩典、憐憫向她斷絕，因而心中十分難過。有一天神對她說，「凱瑟琳，你一直在外面的感覺上尋找我，所以找不著；這六週中，我卻在裡面等待你。你當回到靈中的內室來找我，因為我在那裡。」"],["H","經歷基督－與祂交通（詩408）"],["L","你名似膏香，你愛比酒美，|你若來吸引，有誰不跟隨？"],["L","我們若跟隨羊群的腳蹤，|我們必進入你愛的交通。"]]},{"no":121,"t":"藍背小鳥","b":[["V","使基督藉著信，安家在你們心裡，叫你們在愛裡生根立基。（弗3:17）"],["E","That Christ may make His home in your hearts through faith, that you, being rooted and grounded in love. (Ephesians 3:17)"],["P","在美國有一種藍背小鳥，非常美麗。有一個小孩聽說這種小鳥美麗可愛，就渴望得到一隻。他竭盡全力跑到原野森林，各處尋找，卻沒能得到，至終垂頭喪氣的跑回家。最使他驚奇的是，原來他家的小鳥就是藍脊背，只因為平常鳥籠掛得很高，沒有發現。其實，基督住在我們裡面，不要在外面尋找祂，回到裡面就能遇見。"],["H","永遠在我心裡（兒316）"],["L","永遠在我心裡，耶穌屬我，|永遠在我心裡，我真快活；"],["L","主愛我堅定不改，慈聲對我說，|「我總不離開，」耶穌屬我。"]]},{"no":122,"t":"捨近求遠","b":[["V","我們有這寶貝在瓦器裡，要顯明這超越的能力，是屬於神，不是出於我們。（林後4:7）"],["E","We have this treasure in earthen vessels that the excellency of the power may be of God and not out of us. (2 Corinthians 4:7)"],["P","南美洲的巴西，有九個牧羊人結伴離家，要到北美的加州去開金礦。他們動身之時，經過自己的家鄉，便在山腳下拾起一袋小碎石，準備在路上用來下棋消遣。他們到了美國，原本想把那袋石子丟到海裡，索性就把剩下的幾塊石子，拿給鍊金的人。那人立刻認出，碎石原來是極名貴的金剛石。他們立即趕回家，要去採拾金剛石。可惜一到達家門，才知道那塊地已賣給政府，不能再採石了。"],["P","美國內華達州有一個農夫，將自己僅有的一塊地賣了，只得著四十二塊錢作旅費，便出門去探求金礦。那知自己所賣出的那塊地，到了別人手裡，一經開採便是金礦、銀礦。"],["P","神格一切的豐滿，都有形有體的居住在基督裡面，而基督又在我們裡面；只要我們回到裡面，就能摸著基督，得著測不透的豐富。"]]},{"no":123,"t":"聽見敲鐘就禱告","b":[["V","所以我們不喪膽，反而我們外面的人雖然在毀壞，我們裡面的人卻日日在更新。（林後4:16）"],["E","Therefore we do not lose heart; but though our outer man is decaying, yet our inner man is being renewed day by day. (2 Corinthians 4:16)"],["P","有位弟兄信主二年，讀到勞倫斯著的「與神同在」，就與另一位弟兄約定，每個鐘頭要有一次禱告，每次聽見敲鐘就禱告一下。他們因為一直覺得不能維持與神同在，只得盡力多回到神面前。他們常常禱告，甚至主日整天禱告、週六半天禱告，這樣維持了兩三年。"],["P","然而難處在這裡：回到神面前的時候，是感覺神的同在，可是一出去就失去了。這是靠著人的記性維持神的同在，一旦忘記，同在就沒有了。這種用記性維持神的同在是愚昧的，因為神的同在是在靈裡，不是在記性裡。只有靈與靈才能維持長久的同在。"],["P","外面的人是反應外面的事物；一個人喪失神的同在，不能享受神的同在，乃是因為他外面的人一直對外面的事物有反應。我們沒有法子把外面的事都除滅，卻能破碎外面的人。外面的人一破碎，外面的事只能影響外面的人，裡面的人則不受影響，仍能活在神面前。"]]},{"no":124,"t":"基督在我裡面活著","b":[["V","我已經與基督同釘十字架；現在活著的，不再是我，乃是基督在我裡面活著。（加2:20）"],["E","I am crucified with Christ; and it is no longer I who live, but it is Christ who lives in me. (Galatians 2:20)"],["P","一位老弟兄過著長久失敗的基督徒生活。他在失望中，看到神的話：「基督在我裡面活著。」他說，「什麼？基督真的活在我裡面麼？」於是他跳起來了。雖然他的個性嚴謹，竟也在桌邊跳起舞來說，「基督在我裡面活著！基督在我裡面活著！」當他認識了那釘死的基督，實在活在他裡面的時候，他滿有神的賜福，而脫離了舊生活。"],["P","一個與基督合一的生活，是一個滿足、豐富、得勝的生活。"],["H","主活在我裡面（補120）"],["L","前遠離神死在罪中，|黑暗矇蔽心眼；"],["L","今蒙主話照明得知，|主活在我裡面。"],["L","（副）主活我裡面，|主活我裡面，"],["L","哦，這是何等救恩，|主竟活我裡面。"]]},{"no":125,"t":"神在裡面說話","b":[["V","我心裡柔和謙卑，因此你們要負我的軛，且要跟我學，你們魂裡就必得安息。（太11:29）"],["E","Take My yoke upon you and learn from Me, for I am meek and lowly in heart, and you will find rest for your souls. (Matthew 11:29)"],["P","多年之前，宣信的朋友送他一本小書，書名叫「真平安」。書中的大意是說，神在我們裡面等著要對我們說話，只要我們能安靜下來，就能聽見祂的聲音。他就學習安靜自己；那知道一要安靜，耳中立刻充滿千萬的聲音：有自己的聲音、自己的問題、自己的憂慮、自己的祈禱，還有魔鬼的題議、世俗的呼聲。許多他當作、當說、當想的事，都從各處蜂擁而來，非常喧鬧。他覺得不能不聽，不能不答覆，神卻向他說，「你要安息，要知道我是神。」他心裡就稍微安靜一些，但是還有明日的憂慮、明日的難處。神就再說，「你要安息。」他裡面也就更安靜一些，但是心意仍然有些不定。神就繼續再說，「你要安息。」這時他就聽不見那些外面和自己的聲音，只聽見裡面神向他說話的微小聲音。這個微小的聲音，成為神在他裡面的禱告，也成為神在他裡面的生命供應，和他一切問題的答覆。"]]},{"no":126,"t":"內室的回憶","b":[["V","耶和華是我的牧者；我必不至缺乏。祂使我躺臥在青草地上，領我在可安歇的水邊。（詩23:1-2）"],["E","Jehovah is my Shepherd; I will lack nothing. He makes me lie down in green pastures; He leads me beside waters of rest. (Psalm 23:1-2)"],["P","波斯國有一位宰相，為了記念自己富貴騰達之前的生活，特別在家中選了一間內室，陳列從前作牧羊人時，所用的一些器具，包括牧杖、行囊、粗衣、水瓶等，作為懷念。他每天都用一些時間，回憶以前的生活，藉以提醒自己不要受到皇室尊貴和名譽的引誘。"],["P","舊約中的大衛王亦是如此，他不忘記牧童時所過的生活。他在心中也有一內室，常在那裡默想禱告，並寫了詩篇第二十三篇。詩中包含他成人以後的經歷，以及童年時牧羊的清晰回憶。弟兄姊妹，你有這內室麼？"],["H","經歷神－作牧人（詩444）"],["L","是愛的神作我牧人，|祂常餵養，祂常施恩；"],["L","祂是屬我，我是屬祂，|何來需要？何來缺乏？"]]},{"no":127,"t":"海鷗與戰艦","b":[["V","我們將所看見並聽見的，也傳與你們，使你們也可以與我們有交通；而且我們的交通，又是與父並與祂兒子耶穌基督所有的。（約壹1:3）"],["E","That which we have seen and heard we report also to you that you also may have fellowship with us, and indeed our fellowship is with the Father and with His Son Jesus Christ. (1 John 1:3)"],["P","海鷗覓食的能力很強，連海中船隻拋出的零碎食物，都能注意到。第二次世界大戰時，英國海軍非常關切艦隻的安全，煞費苦心尋找掩護，甚至為了矇騙敵方，還製造了許多假戰艦。有一次英國的首相親自前往某處視察，雖然他已知道有些戰艦是假的，卻不知道是那幾艘。海軍負責人也深信首相不會認出。可是沒多久，首相就指著一艘說，「那是假的！」旁邊的人聽了非常驚奇，因為連用飛機從各個角度觀察，都找不出一點破綻。一位官員最後鼓起勇氣，問他怎能知道。首相說，「沒有海鷗在它旁邊！」原來真的戰艦常有剩餘的食物拋出艦外，招來許多海鷗；假戰艦因為沒有食物，所以周圍一隻海鷗也沒有。海軍方面從此就時常拋散食物於假戰艦的周圍，藉以招來海鷗。"],["P","神的子民需要屬靈的食物，就是神的話語。我們要為主申言，就必須常常與主交通，才能像「活」的戰艦，常有食物供應出來，常有神的話語釋放出來，叫神的子民得著飽足。"]]},{"no":128,"t":"加利利海和死海","b":[["V","所以你們必從救恩之泉歡然取水。（賽12:3）"],["E","Therefore you will draw water with rejoicing from the springs of salvation. (Isaiah 12:3)"],["P","以色列有兩個湖，都是約但河的延續。一是北邊的加利利海，沿岸百花芬芳、葡萄茂密；湖裡游魚成群。主耶穌有四位門徒，曾經都是加利利海的漁夫；直到今天，還有人倚靠此海為生。另一為南邊的死海，湖水過鹹，不僅魚類難以繁殖，沿岸也是草木不生。前者因為水源川流不息，所以清澈而富饒；後者因為水源停滯不流，所以枯乾死寂。基督徒若不常常與主交通，一面有領受，一面有供應，也會慢慢變成死海。"],["H","從救恩泉源歡然取水（補25）"],["L","所以你們從救恩泉源|歡然取水，歡然取水。"],["L","就在那日，你們說：讚美主！|所以你們從救恩泉源"],["L","歡然取水，歡然取水。|就在那日，"],["L","你們說：讚美主！呼求祂的名，|將祂所行傳揚在萬民中，"],["L","題說祂的名已經被尊崇。|揚聲歡呼！"],["L","你們錫安的居民哪！|因你們中間的以色列的聖者為至大！"]]},{"no":129,"t":"下面很沉悶","b":[["V","所以你們若與基督一同復活，就當尋求在上面的事，那裡有基督坐在神的右邊。你們要思念在上面的事，不要思念在地上的事。（西3:1-2）"],["E","If therefore you were raised together with Christ, seek the things which are above, where Christ is, sitting at the right hand of God. Set your mind on the things which are above, not on the things which are on the earth. (Colossians 3:1-2)"],["P","有一位傳道人在車上遇見一個人，便問他尊姓大名和工作。他說，「我是潛水夫。」傳道人不明白潛水夫的意思，他就解釋說，「我們公司常常替人下到水底撈取東西；若是大船沉了，我們就下到海底撈取。」傳道人就說，「你很有本事阿。」他說，「因為我們穿橡皮衣，鼻上有管通到上面透氣。」傳道人再問：「你能看見海底有山，有魚，或各種海中生物、植物麼？」他說，「我一一看見。」傳道人說，「好看麼？」他說，「好是好，但在下面很沉悶。通常我們都是快快作工，一找到東西，就叫岸上的人立刻把我們拉上去。」"],["P","這裡我們得到很好的屬靈教訓：第一，靠著天上的供應，才能在地上為主作工。第二，我們在地上不過是客旅，是寄居，若在地上紮根，必至苦悶死沉。"]]},{"no":130,"t":"換馬蹄鐵","b":[["V","主耶和華以色列的聖者如此說，你們得救在於歸回安息；你們得力在於平靜信靠。（賽30:15）"],["E","For thus says the Lord Jehovah, the Holy One of Israel, in returning and rest you will be saved; in quietness and in trust will be your strength. (Isaiah 30:15)"],["P","從前有一位戰士，從他仇敵手中逃了出來，半途發覺他的馬有換馬蹄鐵的必要。可是仇敵追趕急迫，不能稍微耽延，但他智慧的停在路旁一家鐵匠門口，花數分鐘重新換馬蹄鐵。這時候，追蹤者的腳步由遠而近，他仍耐性等著裝好馬蹄鐵。當仇敵和他只有一百碼距離的時候，他躍上馬鞍，快速馳離，立刻脫離了危險。他的暫停並不失算，反而加快他的速度。"],["P","神從我們忙碌的工作中，呼召我們回到祂面前，安靜一些時候，與祂交通，吸取能力，這使我們作工更有果效。"],["H","鼓勵－與主交通（詩476）"],["L","活在生命光中，|不斷與主交通，"],["L","瞻仰恩主慈容，|順從聖靈感動，"],["L","天天榮上加榮，|時時讚美稱頌，"],["L","活在生命光中。"]]},{"no":131,"t":"沒有水管的水龍頭","b":[["V","人若不住在我裡面，就像枝子丟在外面枯乾了，人收集起來，扔在火裡燒了。（約15:6）"],["E","If one does not abide in Me, he is cast out as a branch and is dried up; and they gather them and cast them into the fire, and they are burned. (John 15:6)"],["P","一個生長在窮鄉僻壤的人，有一年為了謀生，從鄉下搬進城市；他租了一個小房間，既沒有電燈，也沒有自來水。他看見鄰舍的牆上有自來水龍頭，一扭開，水就嘩啦出來。他心裡想：「我家若有這個東西，就太方便了。」便去問鄰居：「這個東西要多少錢？在那裡買？」打聽之後，就上街買了一個回來，在牆上鑿一個洞，把水龍頭裝上。可是等了好久，不見一滴水。他以為是水龍頭有毛病，就去換一個；再等了半天，還是一滴水也沒有。就去責問老闆說，「為什麼賣給我的水龍頭，個個都是壞的呢？」老闆接過來一看，沒有毛病，就問他：「老兄，你是裝在什麼地方？那裡有自來水管沒有？」他回答：「我沒有看見水管子。」老闆就哈哈大笑說，「沒有水管，即使有水龍頭，也滴不出水來。」這時他才明白，自來水龍頭必須裝在自來水管上，才能有水。"],["P","親愛的聖徒！請問你與基督的關係是正常的，還是脫節的？我們若不在交通中碰著主的生命，人生就會變得枯燥、乏味，更談不到為主發光、為主作工了。"]]},{"no":132,"t":"看指上鑽石","b":[["V","眼睛乃是身上的燈。所以你的眼睛若單一，全身就明亮。（太6:22）"],["E","The lamp of the body is the eye. If therefore your eye is single, your whole body will be full of light. (Matthew 6:22)"],["P","有一位鑽石專家收購一大批鑽石。他的朋友站在旁邊，看他如何選擇。這位朋友除了能分辨鑽石的大小不同之外，完全不知道真偽優劣到底如何。但他看見那位鑽石專家，手上戴著一枚鑽石戒指。鑽石專家選擇鑽石之時，必先看看指上的鑽石，然後下手選擇。不久，又注目指上的鑽石，然後再看要選的鑽石。後來鑽石專家向他的朋友解釋說，「我手上的鑽石是最純粹的。若不時常看那最純粹的，眼睛就很容易失去分辨力。所以我要一再將我的眼睛轉開，來看這最純粹的，這樣，選擇才會準確。這個最純粹的鑽石，給我的眼睛有分辨和決斷的能力。」信徒必須常常親近主、注視祂，才能有屬靈的眼光，也才能分辨屬靈的事物。"]]},{"no":133,"t":"不看櫥窗不感興趣","b":[["V","然而屬魂的人不領受神的靈的事，因他以這些事為愚拙，並且他不能明白，因為這些事是憑靈看透的。（林前2:14）"],["E","But a soulish man does not receive the things of the Spirit of God, for they are foolishness to him and he is not able to know them because they are discerned spiritually. (1 Corinthians 2:14)"],["P","慕迪講道喜歡用故事作比喻。一位不信神的新聞記者常批評譏笑說，「慕迪先生的故事雖然講得好，但全是假的，是他捏造的。」有一天，他去聽慕迪講道，為要挑剔錯誤。那天慕迪講「屬靈的光」，用一個故事作比喻：「有三個女子在街上走，沿路觀看商店櫥窗的陳列物。其中兩個女子很感興趣，看了以後，再講給第三個女子聽。但那個女子好像不感興趣。有一個人從旁邊經過，詫異她們同行同看，為何有如此的差別？近前才知，第三位女子因為眼瞎，當然不感興趣。」慕迪說，「這就是基督徒與世人的分別。我們對於屬靈的事，覺得有味道，屬血氣的人卻不以為然，因為他們的心眼瞎了，不領會神靈的事，反倒以為愚拙；因為這些事，惟有屬靈的人才能看透。」那位記者聽了，不等散會，就上前質問說，「你剛才講的故事，是從何處聽來？」慕迪回答說，「在報紙上讀過這段故事，卻不記得是什麼報。」記者就說，「那是我寫的故事。我自己看見那三個女子，便記了下來，卻想不到其中的好教訓。如今才知道，我的心眼實在瞎了，不領會屬靈的事。」就在那次聚會中，那位不信神的新聞記者，被自己所記的故事感動，而悔改歸主。"]]},{"no":134,"t":"一個更大的定律","b":[["V","孩子們，你們是出於神的，並且勝了他們；因為那在你們裡面的，比那在世界上的更大。（約壹4:4）"],["E","You are of God, little children; and you have overcome them because greater is He who is in you than he who is in the world. (1 John 4:4)"],["P","在明媚的春天裡，一位父親帶著他年幼的兒子，到公園遊玩。園中花香鳥語，充滿大自然的美麗與生氣。忽然孩子想起老師講過的話，就問父親說，「爸爸，究竟什麼是地心引力？」父親解釋說，「地心引力是一種自然的定律，是地球原本就有的力量，要吸引一切物體趨向地面。你如果向上拋一塊石頭，或一顆蘋果，地心引力就把它們吸回，跌落地面。」兒子疑惑的說，「但是，爸爸，請你看看這些可愛的花朵和枝葉，它們並不趨向地下，卻是背地向上生長，趨向天空阿！」父親不禁微笑，對孩子說，「在地心引力的定律之外，還有一個更大的定律，就是生命的定律。生命的定律具有比地心引力更大的力量，使有生命的物體勝過地心引力，反向生長。好比這些花朵，活著就向上長；若是把花折斷，斷絕原本生命的來源，就失去向上生長的能力，而受地心引力的控制，立刻掉在地上。」基督是我們的生命，常住在祂裡面，就能勝過一切，不至於墮落，並且叫我們向上生長。"]]},{"no":135,"t":"裡面不肯外面不能","b":[["V","因為乃是神為著祂的美意，在你們裡面運行，使你們立志並行事。（腓2:13）"],["E","For it is God who operates in you both the willing and the working for His good pleasure. (Philippians 2:13)"],["P","潘湯曾經講過一個故事，說到有一位醫生，吩咐看護去叫病人作一件事。看護就照醫生所說，去叫病人作。但是，那個病人說，「我不能作。」看護就回報醫生說，「他不肯作。」醫生便去查看那個病人為何不作。察驗之後，醫生就說，這個病人不是不能，也不是不肯，乃是「不能肯」。"],["P","我們在裡面是不肯，在外面是不能；裡面不肯丟世界，外面就不能丟世界。但是，神能在我們裡面運行，直到我們真肯、真願照著神的美意而行，並且也能行得出來。"],["H","得救的證實與快樂－被主釋放（詩244）"],["L","我因歸耶穌，|全人得著釋放；"],["L","耶穌我救主，|今在我心作王；"],["L","聖靈充滿我，|使我終日歡唱；"],["L","主耶穌已把我釋放！"],["L","（副）釋放！釋放！|榮耀釋放！"],["L","我不再被罪惡捆綁；|寶血洗淨我，"],["L","全人明亮、清爽；|主耶穌已把我釋放！"]]},{"no":136,"t":"溪水沖洗汙穢","b":[["V","祂便救了我們，並不是本於我們所成就的義行，乃是照著祂的憐憫，藉著重生的洗滌，和聖靈的更新。（多3:5）"],["E","Not out of works in righteousness which we did but according to His mercy He saved us, through the washing of regeneration and the renewing of the Holy Spirit. (Titus 3:5)"],["P","古希臘有一個國王，吩咐一個大力士，作一件極難的事，就是要他把一間很大豢養牲畜的房子，掃除乾淨。那間房子座落在山谷裡，多年累積汙穢畜糞，堆積得很厚。但是國王既然如此為難他，究竟該怎麼辦呢？後來，那個大力士想出一招妙法。他走到山頂，找著一條溪水，便設法把它引導下來，流過那間大房子。這樣日夜沖洗，水源滔滔不絕，不到幾天，好大的房子都潔淨了。我們若要靠自己努力，是無法聖潔的，必須活在交通裡，靠神的生命潔淨，才能除去汙穢。"],["H","福音－見證（詩739）"],["L","在十字架我救主捨命，|所流寶血洗罪有權能；"],["L","這寶貝血已將我洗清；|榮耀歸主名！"],["L","（副）榮耀歸主名！|榮耀歸主名！"],["L","主寶貝血已將我洗清；|榮耀歸主名！"]]},{"no":137,"t":"打破水晶燈","b":[["V","但那屬基督耶穌的人，是已經把肉體連肉體的邪情私慾，都釘了十字架。（加5:24）"],["E","But they who are of Christ Jesus have crucified the flesh with its passions and its lusts. (Galatians 5:24)"],["P","有一位姊妹脾氣兇暴，超乎平常人，她的家人都很怕她。多年以後，她學會與主交通，靠主得勝。有一天早晨，她遇到一個頂大的試驗。她在樓上梳洗，還未下樓，她的丈夫和用人在樓下，要掛一盞水晶燈。這燈相當名貴，價值很高。他們正掛的時候，不料落在地上，砸得粉碎。這時正巧她從樓上下來。她的丈夫看見她，以為她要大發脾氣，那知她卻很安靜的說，「燈打碎了，掃掉就是了。」她的丈夫十分希奇，平時只打破小杯、小碟，都要吵鬧，今天卻完全出乎意料之外。丈夫見她這樣安靜，就問她說，「你昨夜睡得好麼？你生病了麼？」她說，「我沒有病，是神行神蹟，將我的病除去了。」她的丈夫回答：「這真是神蹟，真是神蹟！感謝讚美神！」"],["H","福音－見證（詩738）"],["L","救我恩何等豐滿，|救我恩何等豐滿，"],["L","救我恩何等豐滿，|救我恩無量！"],["L","（副）主斷開一切鎖鏈，|主斷開一切鎖鏈，"],["L","主斷開一切鎖鏈，|主把我釋放！"]]},{"no":138,"t":"只能收拾到這地步","b":[["V","使我認識基督、並祂復活的大能、以及同祂受苦的交通，模成祂的死。（腓3:10）"],["E","To know Him and the power of His resurrection and the fellowship of His sufferings, being conformed to His death. (Philippians 3:10)"],["P","英國有一位傳道人，好發脾氣，自己常常為這事難過。他雖然多次為這件事禱告，甚至流淚，卻總勝不過。有一天他禱告認罪，以為可以不再發脾氣，沒有想到，結果又發脾氣。這使他心灰意冷，非常失望，就很憂傷的倒在書房睡著了。夢中看見來了一位客人，十分尊貴，朝著他的書房走來。他一看自己書房裡面，塵土滿地，東西亂七八糟，就極力的打掃收拾。這時候，客人叩門聲音不斷，他更著急，越急越亂。當下他就明白，是主耶穌基督在外面等候，只好開門回答：「我的主！我只能收拾到這個地步。若你不嫌棄，就請進來吧！」主一進來，很奇妙的，屋子裡塵土沒有了，不再雜亂無章，並且充滿了光明喜樂。他費盡平生之力不能辦到的事，主一來就辦成了。然後，他高興得醒過來。藉著這夢他才清楚，靠自己的力量不能對付脾氣，而需要與主交通，活在祂裡面，靠祂勝過一切。"]]},{"no":139,"t":"魁瑟頓的為人","b":[["V","這是照著我所專切期待並盼望的，就是沒有一事會叫我羞愧，只要凡事放膽，無論是生，是死，總叫基督在我身體上，現今也照常顯大。（腓1:20）"],["E","According to my earnest expectation and hope that in nothing I will be put to shame, but with all boldness, as always, even now Christ will be magnified in my body, whether through life or through death. (Philippians 1:20)"],["P","魁瑟頓（John Chrysostom）是主後三九八年，東羅馬帝國君士坦丁堡的大主教。「魁瑟頓」翻譯出來，就是「金口」的意思。他的才幹和他的名字正好相符，非常擅長演講。當時有一位荒淫的皇后，魁瑟頓演講時，便公然的斥責她，沒有半點畏懼。有幾位大臣勸皇帝要放逐他，或者沒收他的財產，或者把他下在監裡，或者斬首，或者焚身。另有幾位大臣則告訴皇帝說，「這些刑罰他都不以為意。假使驅逐他出境，神仍然安然居住在他裡面。若是沒收他的財產，對他無損，只有受他救濟的人虧損。假使把他下在監裡，他也必定會親吻那繫住他的鐵鏈，以為是神給他莫大的榮耀。假使殺他，神必定提接他去。要他失敗，只有一個方法，就是誘惑他犯罪。但是此法也是無用，因為他最痛恨而提防的，就是犯罪。他與主交通很親密，主會使他寧願死，也不犯罪，所以不如釋放他吧！」"]]},{"no":140,"t":"因愛神而作","b":[["V","願主修直你們心中的途徑，引導你們的心，進入神的愛以愛神，並進入基督的忍耐以忍耐。（帖後3:5）"],["E","And the Lord direct your hearts into the love of God and into the endurance of Christ. (2 Thessalonians 3:5)"],["P","勞倫斯有一次被差遣去買酒。他非常不願意作這事，因為沒有益處，並且他的腳跛，感到非常不方便。他就對神說，「神阿，這是你所許可的。」所以他就勝過難處，將事情辦好。他在廚房裡面作事，按天然說，他最厭惡廚役的事，但他無論作什麼，都是因愛神而作；凡事藉著禱告，向神求恩典，使他作得好。他在交通裡，覺得樣樣都容易，沒有難處。他以現有的情形為喜樂，他可以作，也可以不作，並無自己的傾向。他在任何情形中，都能找到快樂，因為他作這些事，是為愛神而作。"],["H","羨慕－在主裡的長進（詩297）"],["L","主！使我更愛你，|和你更親密，"],["L","為你名更熱心，|向你話更信，"],["L","對你憂更關心，|因你苦更貧，"],["L","更覺得你看顧，|更完全順服。"],["L","（副）求主天天扶持我，|給我力量保守我，"],["L","使我一生走窄路，|使主心滿意足。"]]},{"no":141,"t":"一進家門就平安","b":[["V","住在至高者隱密處的，必住在全能者的蔭下。（詩91:1）"],["E","He who dwells in the secret place of the Most High will abide in the shadow of the Almighty. (Psalm 91:1)"],["P","一位信徒幼年時代，生長在哈爾濱，那裡的野孩子很多，許多人走在街上，常會受到無端的欺侮。有一次他在路上走，忽然來了一群野孩子，不問理由，就向他拳打腳踢，使他當場昏倒。有時候他們會追到家裡，但是隻要他躲進家裡，關上門，就感到平安、穩妥。無論他們怎樣恐嚇蠻橫，他都不怕。他感覺到：「我回到了家，就有保障。」"],["H","任何遭遇不要驚怕（兒307）"],["L","任何遭遇不要驚怕，|神必定顧念你，"],["L","住在神愛的翅膀下，|神必定顧念你；"],["L","神必定顧念你，|時時顧念，處處顧念，"],["L","神必定顧念你，|神必定顧念你。"]]},{"no":142,"t":"深處的寧靜","b":[["V","應當一無掛慮，只要凡事藉著禱告、祈求，帶著感謝，將你們所要的告訴神；神那超越人所能理解的平安，必在基督耶穌裡，保衛你們的心懷意念。（腓4:6-7）"],["E","In nothing be anxious, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God; and the peace of God, which surpasses every man's understanding, will guard your hearts and your thoughts in Christ Jesus. (Philippians 4:6-7)"],["P","海洋學家說，最猛烈的暴風衝擊海洋的時候，弄得波濤洶湧，船隻傾覆，卻不過攪動海面數百公尺深的水，海的深處絲毫未受影響。可以說是表面濁浪排空，內部平靜安恬。照樣，基督徒可能在外面的環境上，遭遇狂風駭浪；但若是與主交通，必能因神所賜出人意外的平安，心懷意念蒙保守，使裡面平靜安恬。"],["H","得救的證實與快樂－一般（詩268）"],["L","平安正如水流，一路跟隨我；|憂慮卻如怒濤橫湧；"],["L","任何的遭遇，你已教我能說：|我魂，你應安息，無所恐！"],["L","（副）哦，我魂，可無恐！|哦，我魂，可安樂、可無恐！"]]},{"no":143,"t":"音樂在人心裡","b":[["V","你們要在主裡常常喜樂，我再說，你們要喜樂。（腓4:4）"],["E","Rejoice in the Lord always; again I will say, rejoice. (Philippians 4:4)"],["P","帕格尼尼（Nicolo Paganini）是一位擅於演奏小提琴的音樂家。在一場演奏會中，他站在聽眾面前，在喝采聲下，忽然發現他手中的小提琴有點不對勁。仔細一看，才發覺那並不是他平日珍愛的貴重提琴。他發呆了一會兒，不得不告訴他的聽眾，他拿錯琴。於是退下去，在幕後尋思他的琴究竟放在那裡。不久就發覺，有人把他的琴偷去，換了一把破琴留在原處。他很懊惱，卻仍然出場，站在聽眾面前說，「諸位來賓，今天我要證明給大家看：音樂並不是在樂器裡，乃是在人心裡。」他就用心來演奏，從那破舊的樂器裡，流出了悠揚悅耳的音樂。聽眾個個激奮，喝采聲幾乎貫穿屋頂。他果然向他們證實，音樂並不是在樂器裡，乃是在人心裡。人生的音樂並不是在環境裡，並不是在外表裡；乃是在人心裡。回到裡面與主交通，能叫我們的內心充滿喜樂、甘甜。"]]},{"no":144,"t":"船長的臉","b":[["V","我的魂哪，你為何憂悶？為何在我裡面煩躁？應當仰望神；因祂的臉是我的救恩，我還要讚美祂。（詩42:5）"],["E","Why are you cast down, O my soul? And why are you disquieted within me? Hope in God, for I will yet praise Him for the salvation of His countenance. (Psalm 42:5)"],["P","一艘航行在南太平洋的船，突然遇到狂風暴雨，旅客們個個提心吊膽，深怕船會沉沒。一位旅客鼓起勇氣，冒著風雨，攀登到艙面上。他看見船長安閒自在，緩步在甲板前的高臺上。船長臉上並無絲毫恐懼、憂煩的氣色，還從容指揮水手駕駛船隻。他就走回充滿驚慌失措的旅客艙裡，向質詢他的旅客回答說，「放心吧，我看見船長的臉了！」當我們遭遇艱難，陷於困境的時候，不要一味煩悶，應當仰起臉來，瞻仰耶穌的面容，心靈必得平安。"],["H","讚美主－對祂的滿足（詩171）"],["L","耶穌，只要一想到你，|我心就滿甘甜；"],["L","但這甘甜還遠不及|親眼看見你面。"]]},{"no":145,"t":"船上吃飯不要錢","b":[["V","猶太人和希利尼人並沒有分別，眾人同有一位主，祂對一切呼求祂的人是豐富的。（羅10:12）"],["E","There is no distinction between Jew and Greek, for the same Lord is Lord of all and rich to all who call upon Him. (Romans 10:12)"],["P","有一個愛爾蘭人乘船到美國討生活。他帶的錢很少，除了買船票以外，所剩無幾。於是他買了一些粗點心，預備在船上吃，卻不敢多吃，心裡盼望那些點心，能吃到越過大西洋。誰知沒有幾天，點心就吃完了。正在捱餓的時候，船上有一個工人，端了一盤菜，從他身旁經過，叫他垂涎三尺。他忍不住上前追問：「請問這盤飯菜要多少錢？」工人說，「你搭船買了船票沒有？」他說，「買了。」工人就說，「你既然買了票，為什麼不到餐廳去吃飯？你可以去吃，不會另外要錢的。」那人聽見這話，十分驚訝，這才明白說，「我太愚笨了，為什麼我在這裡捱餓，不去吃飯？」我們一得救，就在基督裡，祂所有的豐富，都是我們的，只要活在交通裡，就能得著，就有享受。"],["H","在靈裡享受（補115）"],["L","飽嘗我基督在靈裡，|吃喝祂，享受祂，甜無比！"],["L","祂豐富都成為我實際，|安息又飽足不止息。"],["L","在靈裡，在靈裡，|飽嘗我基督在靈裡；"],["L","在靈裡，在靈裡，在靈裡，|享受主基督，在靈裡！"]]},{"no":146,"t":"只住地窖","b":[["V","使你們滿有力量，能和眾聖徒一同領略何為那闊、長、高、深，並認識基督那超越知識的愛，使你們被充滿，成為神一切的豐滿。（弗3:18-19）"],["E","May be full of strength to apprehend with all the saints what the breadth and length and height and depth are and to know the knowledge-surpassing love of Christ, that you may be filled unto all the fullness of God. (Ephesians 3:18-19)"],["P","一位母親管理家務，天天打掃，並晾曬床褥椅墊。因為他們全家都住在最低層的地窖，樓上各層只等貴賓來時才開，平時總是關閉。他們住在最低層，並非因為屋荒，迫不得已；乃是他們故意揀選的，至少他們的母親堅持如此。"],["P","神造人，好像一座樓房，有靈、魂、體三層。人不要天天只為身體打算，尋求地上的福樂，就像這一家人，只住在屋子的最低層一樣。乃要升到最高層，在靈裡享受神自己。"],["H","耶穌聚集我們在一起（補616）"],["L","從前我們在罪中死了，|這世界全然一團糟；"],["L","但神使我們一起復活，|一起與基督昇天，同坐寶座。"],["L","（副）"],["L","耶穌聚集我們在一起，|請看看聖徒同心合意！"],["L","主愛使得我們都一致，|達到基督豐滿身量的地步。"]]},{"no":147,"t":"山裡公公看海螃蟹","b":[["V","神能照著運行在我們裡面的大能，極其充盈的成就一切，超過我們所求所想的。（弗3:20）"],["E","To Him who is able to do superabundantly above all that we ask or think, according to the power which operates in us. (Ephesians 3:20)"],["P","從前有一個女孩，家住海邊，靠打魚過日，後來嫁給一個住在山裡的男子。因為山上交通不便，物資缺乏，所以生活很清苦。有一天，她的公公很生氣，罵媳婦不知道節儉，只會敗家，因為一個海螃蟹的殼子，三天就被她吃完了。他怒氣忿忿的去找親家說話。親家留他吃飯，桌上擺了許多海螃蟹；又看見他們的天井裡，海螃蟹的殼子不知道堆了多少。他想也不必抱怨，回家算了。許多人看神蹟，就像這個山裡的公公看海螃蟹一樣。他們也許十年、三十年才經歷一次，所以把神蹟看作希奇的事。但是，活在神面前，經常與主交通，神蹟乃是平常的事；神的手是神蹟的來源，神一直在那裡施行神蹟。"]]},{"no":148,"t":"睡醒就過禱告生活","b":[["V","要常常喜樂，不住的禱告，凡事謝恩；…不要銷滅那靈。（帖前5:16-19）"],["E","Always rejoice, unceasingly pray, in everything give thanks; …do not quench the Spirit. (1 Thessalonians 5:16-19)"],["P","一位姊妹作見證說，「早晨我一睜開眼睛，就禱告說，主阿，求你開啟我的心眼；穿衣之時，就禱告說，主阿，願我穿上基督的義袍；洗臉之時，就禱告說，求主洗淨我；作工之時，就禱告說，求主給我日子如何，力量也必如何；點火之時，就禱告說，求主在我裡面重新挑旺我的愛火；掃地之時，就禱告說，求主除去我心裡一切的汙穢；吃飯之時，就禱告說，求主給我隱藏的嗎哪，與純淨的靈奶；照管小孩之時，就仰望父神使我作祂順命的兒女。一天到晚，我都這樣禱告。我所作的每一件事，全都用這樣的意念來禱告。」"],["P","許多人以為，「不住的禱告」乃是一件不容易實行的命令。我們若按照此法去行，就不難辦到。"]]},{"no":149,"t":"每天九點禱告","b":[["V","但是不可少的只有一件，馬利亞已經選擇那美好的分，是不能從她奪去的。（路10:42）"],["E","But there is need of one thing, for Mary has chosen the good part, which shall not be taken away from her. (Luke 10:42)"],["P","有一位姊妹，丈夫去世，遺下子女十多人。她雖然擔當家務，十分忙碌，每天卻照常與神交通。每天九點鐘，必到房間裡把門關上，一個鐘頭之後才出來。孩子們不知道她在房裡作些什麼，卻看見她從房裡出來的時候，臉上放光。有一天，她的兒子在九點鐘以前，悄悄跑進母親房裡，躲在床下。看見母親進來，跪在床前禱告：「主阿，我身體疲憊，精神睏倦，求你賜我能力，使我雖然忙碌，卻能常與你有交通。」禱告之後再讀聖經，讀讀禱禱，約一小時才出來。許多信徒常常以為自己很忙，或者環境不好，無法與神交通。其實，雖然忙碌，也能抽出時間來與神交通。"],["H","經歷基督－住在祂裡面（詩418）"],["L","住在主裡面，無上的福氣，|常與主交通，甜美的經歷；"],["L","住在主裡面，主與我聯合，|常與主交通，我與主無隔。"]]},{"no":150,"t":"將心放在神面前","b":[["V","心思置於肉體，就是死；心思置於靈，乃是生命平安。（羅8:6）"],["E","The mind set on the flesh is death, but the mind set on the spirit is life and peace. (Romans 8:6)"],["P","勞倫斯學習與神同在時，起首的幾年當中，他一般親近神的辦法，就是有規定時間的禱告。在禱告中所思念的就是死亡、審判、和他所犯的罪等等。這樣一直持續了好幾年。後來就是在不禱告的時候，或是在工作的時候，他也很謹慎的將心放在神面前。他一直想，神是和他同在，也住在他裡面。因此，他不知不覺的在規定禱告的時候之外，也覺得心在神面前。這使他大有喜樂，大得安慰。"],["P","他在作事最忙的時候，還能保持天上的思念，按部就班，不慌不忙，安靜的完成工作。雖然廚房裡面很吵鬧，有時幾個人同時向他要幾件東西，但是他都有極大的平安，有神的同在，好像跪下領受主的晚餐一樣。"]]},{"no":151,"t":"召回心思的方法","b":[["V","在從前的生活樣式上，脫去了舊人，這舊人是照著那迷惑的情慾敗壞的；而在你們心思的靈裡得以更新。（弗4:22-23）"],["E","That you put off, as regards your former manner of life, the old man, which is being corrupted according to the lusts of the deceit, and that you be renewed in the spirit of your mind. (Ephesians 4:22-23)"],["P","一位弟兄多年學習與神同在，後來時時刻刻都活在交通中。他說，我們的心思原本是很散漫的，但是意志是我們五官的主導，必須負責召回心思，將它帶到神面前。我們起首學習禱告的時候，因著心思沒受過訓練，已經有了遊蕩、散漫的惡習，要勝過並不容易。而且心思常常思念種種屬地的事，都是我們所不願意的。有一個補救的辦法，就是謙卑的在神面前，承認我們的過錯。在禱告時，不需要用太多的話語，因為沒有次序的言語，常是使心思遊蕩的原因。最好是將自己擺在神面前，好像一個困苦啞口的乞丐，在富人的門前；就是要保守你的心思在神的面前。如果心思離開神，往外遊蕩，也不必怎樣不安；因為心裡不安，反叫心思更加煩擾。這時候，必須用意志，安安靜靜的召回你的心思。如果你能這樣堅持下去，神就會憐憫你。還有一個辦法，就是在平常的時候，不讓你的心思跑得太遠，那麼禱告的時候，稍微一離開，也就容易召回。你必須保守你的心思，常常思念神，你就會覺得在禱告的時候，也容易保守你的心思，安靜在神面前。"]]},{"no":152,"t":"嬰孩、羊、病人","b":[["V","我使我的魂平穩安靜，好像斷過奶的孩子在他母親懷中；我的魂在我裡面真像斷過奶的孩子。（詩131:2）"],["E","Surely I have calmed and quieted my soul, like a weaned child with its mother; like a weaned child is my soul within me. (Psalm 131:2)"],["P","一位認識交通的信徒，說出一些親近神的態度：首先，當看自己不過是一個軟弱的嬰孩，在屢次的失敗、受傷、無力、無法潔淨自己時，只要在卑微和混亂中，將自己悲慘的情形，訴說在父面前，用嘆息或幾句話，將愁情吐露出來。然後在默禱中，要榮耀的王在裡面作王掌權。其次，有時當將自己如羊一般，放在牧人的面前，仰望祂賜給糧食。然後，有時可以看祂像醫生，自己像病人，將病放在祂面前就醫，千萬不要自尋煩惱，只要安靜的將自己交託神。"],["H","羨慕－脫離己（詩311）"],["L","主阿，求你將我看，|賜我甜美的簡單；"],["L","靈中貧窮，心卑微，|尋求猶如向日葵。"]]},{"no":153,"t":"邁格那城的埋沒","b":[["V","你要切切保守你心，因為生命的果效發之於心。（箴4:23）"],["E","Keep your heart with all vigilance, for from it are the issues of life. (Proverbs 4:23)"],["P","有人在北非發掘一座廢墟，該城名為邁格那，就是羅馬皇帝瑟弗留出生之地。那城當初是羅馬帝國在非洲的政治、經濟重鎮，有船隻與遠近各港口通航，交通便利，文化發達。然而這座名城卻沒落了，漸漸從地上消逝。它之所以湮滅，不是因為大火或洪水，也不是因為地震，更不是因為戰爭和敵人入侵。乃是因為它的港灣被淤泥充塞，便不再與外界貿易。逐漸的，那裡的人紛紛離開。年代久遠之後，大沙漠的沙石就把那城埋在地下。我們也是這樣，若不保守我們的心清潔，而一直讓神以外的事物來充塞，慢慢就會失去與神的交通，至終就要堵塞荒廢。"],["H","裡面生命的各方面－正確的心（詩540）"],["L","與主來往，享主生命，|需一正確的心，"],["L","使主一切，借祂恩典，|我們全都有分。"]]},{"no":154,"t":"偷吃東西","b":[["V","我們若在光中行，如同神在光中，就彼此有交通，祂兒子耶穌的血也洗淨我們一切的罪。（約壹1:7）"],["E","If we walk in the light as He is in the light, we have fellowship with one another, and the blood of Jesus His Son cleanses us from every sin. (1 John 1:7)"],["P","有一個女孩子，當母親出門時，就偷偷跑到廚房，把母親所作的菜，或是廚房裡的水果拿來大吃一頓。吃完之後把廚房的門關得好好的，嘴擦得乾乾淨淨，桌子也清理得乾乾淨淨。本來每天晚上，她和母親是非常親密的，現在母親在樓上一喊，她在樓下心就跳起來，以為母親一定是發現了，要責打她。就是母親給她東西吃，她也不覺得有味道，因為怕母親知道她所作的事。她和母親的交通出了問題。不是因為偷吃東西，就不是女兒；女兒還是女兒，可是與母親的交通受了攔阻。所以，不是你犯了罪就不是神的兒女，你還是神的兒女，可是與神中間的交通出了事情。犯了罪，馬上交通就斷絕了！"],["H","禱告－與主交通（詩568）"],["L","禱告與主來往交通，|祂面靈裡來尋求；"],["L","祂前求問並且靜聽，|隱密之處來等候。"],["L","（副）禱告與主來往交通，|祂面靈裡來尋求；"],["L","祂前求問並且靜聽，|隱密之處來等候。"]]},{"no":155,"t":"只有認錯一條路","b":[["V","我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。（約壹1:9）"],["E","If we confess our sins, He is faithful and righteous to forgive us our sins and cleanse us from all unrighteousness. (1 John 1:9)"],["P","一個小孩在外面作了一件不好的事，回到家裡，母親不一定責備，但只要母親不說話，他就覺得不對勁，無法有甜蜜的交通，因為裡面有隔閡。信徒也是如此，一旦有罪，就使我們與神隔開。只有一條恢復的路，就是到神面前承認自己的罪，相信主耶穌基督已經作了我們的救贖主，擔當我們一切的罪。我們要求祂的血洗淨；祂的血甚至能夠對付我們任何將來的罪。"],["H","聖靈的豐滿－火（詩206）"],["L","主，我曾否叫聖靈憂愁，|流蕩、隨便並冷落？"],["L","然而我的犯罪和退後，|未曾叫祂厭倦過。"],["L","（副）"],["L","求你多賜我們以聖靈，|讓祂光照並焚燒，"],["L","將「你」供給我們作生命，|使我不住的禱告。"]]}]},{"n":"信心","i":4,"intro":[["V","信就是所望之事的質實，是未見之事的確證。（希伯來書十一章一節）"],["E","Now faith is the substantiation of things hoped for, the conviction of things not seen. (Hebrews 11:1)"]],"a":[{"no":156,"t":"相信主的意義","b":[["V","那以信為本的人，就是亞伯拉罕的子孫。（加3:7）"],["E","They who are of faith, these are sons of Abraham. (Galatians 3:7)"],["P","舊約裡的亞伯拉罕被稱為「信心之父」。他捨棄了一切，除了信靠神以外無法往前。他信靠神，因為他不知道往那裡去。神只告訴他要離開本地、親族和父家。祂沒有告訴亞伯拉罕往那裡去，這迫使他信靠神。亞伯拉罕能說，「我只信靠神。祂帶領我去那裡，我就去那裡。」我們若研讀亞伯拉罕的歷史，就會知道他的生活是信靠神的生活，信的生活。神不期待亞伯拉罕作什麼。神似乎告訴他：「亞伯拉罕，你已蒙我呼召，不要作什麼。我要為你作一切，只要與我同在。我行動的時候，你就行動；我往那裡去，你就必須往那裡去；不要為自己或憑自己作什麼。」這就是信靠神的意思。"],["P","許多人有錯誤的印象，以為相信主耶穌只不過是說，「主耶穌，我相信你，我接受你作我的救主。」這是對的，但相信主耶穌還有更深遠的含意。相信主的意思是：我們必須了結自己，承認我們一無所是，一無所有，也一無所能。每一步、每一刻，我們都必須信靠祂。我不知道如何行事；我只知道如何信靠我的主。我已蒙召離開一切不是神的事物，現在我信入一切是神的事物。我相信祂，我也相信祂為我所成就的一切。我相信祂為我所能作的，也相信祂為我所要作的；我完全信靠祂。我們是信心之父亞伯拉罕的子孫，我們乃是信心的子民。（加三7～9。）（羅馬書生命讀經）"]]},{"no":157,"t":"信心的創始者與成終者","b":[["V","望斷以及於耶穌，就是我們信心的創始者與成終者。（來12:2）"],["E","Looking away unto Jesus, the Author and Perfecter of our faith. (Hebrews 12:2)"],["P","我們需要耶穌作信心的創始者，因為照我們天然的人，我們沒有信的能力，我們憑自己沒有信。那叫我們得救的信，乃是我們從主所得寶貴的信。當我們仰望耶穌，祂這賜生命的靈就將祂自己，將祂信的成分，灌輸到我們裡面；這樣，自然而然的，有一種信在我們裡面升起，我們就能相信祂。"],["P","耶穌是信心的創始者和起始者，主要是就著祂在地上的生活和所行的路程說的。主耶穌在地上的生活，乃是開闢信心之路的生活。祂無論往那裡去，好像都有高山大水攔阻祂；但祂一步一步開闢信心的路，就像建築高速公路的人，移高山平深谷一樣。"],["P","耶穌是信心的成終者，主要是就著祂在榮耀裡和在天上的寶座上說的。祂在榮耀裡坐在寶座上，要完成祂在地上所起始的信心。祂是信心的完成者和完全者，必能完成並完全祂所起始並開創的信心。"],["P","當我們望斷以及於祂，我們就給祂機會，讓祂自由的把祂自己作到我們裡面。這樣，生命之律就能在我們裡面每一部分運行，直到我們裡面被祂充滿。我們裡面越多充滿祂，就越容易相信。這就是得著信心的路。（希伯來書生命讀經）"]]},{"no":158,"t":"因信而活","b":[["V","只是我的義人必本於信活著；他若退縮，我的心就不喜悅他。（來10:38）"],["E","But My righteous one shall live by faith; and if he shrinks back, My soul does not delight in him. (Hebrews 10:38)"],["P","因信而活，是基督徒生活的原則。神必須把我們從感覺中帶出來，進到因信而活裡。神要我們得著祂的真理，但祂不是要我們在感覺裡得著，乃是要我們在信心裡得著。"],["P","我們是因信而活，不是憑著外面的感覺而活。因信而活，乃是能在最枯乾中過最快樂的生活，在最快樂中過最枯乾的生活。雖然落到山谷，進入黑暗的山洞，卻仍能仰望神、等候神，直等到從山洞裡出來，登上高峰，這就是因信而活。"],["P","你如果因信而活，就必定有一個態度：一心求神的喜悅，絕不肯退縮。有時你讀經，覺得沒有滋味，但是不退縮；有時你禱告，覺得沒有果效，但是不退縮；有時你作見證，覺得沒有力量，但是不退縮；有時你好像處在山洞裡，黑暗無光，仍是不肯退縮。不管你外面的感覺如何，你總不肯退縮。這樣，你不只能活，並且也能得著神的喜悅。請記得，義人是因信而活，不是憑著感覺而活。（十二籃，因信而活）"]]},{"no":159,"t":"已經先感謝了","b":[["V","我們卻不是退縮以致遭毀壞的人，乃是有信心以致得著魂的人。（來10:39）"],["E","But we are not of those who shrink back to ruin but of them who have faith to the gaining of the soul. (Hebrews 10:39)"],["P","一次，戴德生弟兄在中國內地和同工旅行作工，但一路無法買到食物，肚子很餓。戴德生卻唱說，「感謝主賜給我們這些食物。」他的同工聽見，就說，「食物在那裡？」戴德生笑著回答：「離這裡不遠。我們的父親知道我們肚子很餓，祂會快送早餐給我們吃。等到食物來時，你必須先謝飯，然後才能吃。我卻能馬上就吃；因為我已經先感謝了。」果然，有人挑著扁擔來賣吃的東西，解除了他們的飢渴。"],["P","有時我們眼睛雖然還沒有看見，但在信心裡已經相信是得著了，便先感謝神的賜給，這是真信心。"],["H","經歷基督－順從祂（詩426）"],["L","當我同主行動，|在祂話的光中，"],["L","何等榮耀照在我全身；|當我肯聽命令，"],["L","祂就充滿我靈，|祂充滿信而順從的人。"],["L","（副）信而順從！|因為除此以外，"],["L","不能得主的喜愛－|惟有信而順從！"]]},{"no":160,"t":"開辦療養院","b":[["V","凡你們禱告祈求的，無論是什麼，只要信已經得著了，就必得著。（可11:24）"],["E","All things that you pray and ask, believe that you have received them, and you will have them. (Mark 11:24)"],["P","美國加州有位姊妹，因為看見軍人和公務員有療養院，而神的僕人們辛辛苦苦傳道一生，到了病老，卻沒有療養院，她就求神賜給她二萬五千美元，藉以開辦療養院。禱告之後，她心裡很有把握，便起來感謝神。"],["P","不久之後，她聽說有一片土地要出售，看了之後覺得很滿意，就拿出數百元付訂金，說定某月某日交款，否則訂金沒收。但是付款日期越來越近，那筆鉅款卻尚無著落。但她不慌不忙，安如泰山。有一天有人來拜訪她，對她說，「按我們考察，有一個礦坑要從你現在所要買的那塊地經過，我們想要出錢向你買那塊地。」那女士說，「不賣。」那人便問說，「你肯租麼？」她說，「不租。但是有一個辦法，就是在某個時期內，你賣煤油所得的錢，百分之五歸我，就可以經過那塊地。」他們彼此約定後沒多久，二萬五千元就湊齊了，正好用以付款。後來暴風雨把礦坑洞口塞住，再挖採時，竟然沒有油了。真希奇，她求主賜她二萬五千元，她有信心，在未得之前心靈早已知道，如同已經得著，並且開口感謝神，這就是信心。"]]},{"no":161,"t":"天上的父必為我們預備","b":[["V","只是要憑著信心求，一點不疑惑；因為那疑惑的人，就像海中的波浪，被風吹動翻騰。（雅1:6）"],["E","But let him ask in faith, doubting nothing, for he who doubts is like the surge of the sea, driven by the wind and tossed about. (James 1:6)"],["P","一位姊妹乘坐一艘船渡洋，臥病在床，不能起來。船上醫生特別囑咐她，什麼東西都不可以吃，只准吃橘子。因此，船上的侍者天天都送橘子給她吃。船在海裡不斷航行，遠離岸邊的城市鄉鎮，周圍只見汪洋一片。有一天，侍者來說，「太太，船上所有的橘子都吃光了。現在船在大海，離岸遙遠，要買橘子也沒有辦法。」她聽了，很有信心的回答說，「不要緊，我的父親必為我預備所需的橘子。」她在船艙裡獨自向天禱告，照著神的應許，一點也不疑惑。過了一些時候，海上傳來汽笛聲，一個鐘頭後，那位侍者兩手抱著很多橘子，來到她的面前，非常高興的說，「太太，剛才你聽見汽笛的聲音麼？原來有一艘船，因為霧大，走迷了路；他們的存水用完，就向我們發出求救訊號。於是我們送給他們大量飲水。正好他們的船上橘子很多，為了要報答我們，便送給我們許多橘子；這些橘子就是他們送來的。」"]]},{"no":162,"t":"郵票簿的應許","b":[["V","總沒有因不信而疑惑神的應許，反倒因信得著加力，將榮耀歸與神。（羅4:20）"],["E","But with regard to the promise of God, he did not doubt in unbelief, but was empowered by faith, giving glory to God. (Romans 4:20)"],["P","喬治的奶奶答應送他一本郵票簿，可是過了很久，仍然沒有給他，而且不再聽她題起過。但喬治的同伴來找他玩時，喬治便把所收到的禮物一件件拿出來展示，並且總要加上一句：「奶奶給我一本郵票簿。」喬治的母親聽他說了好幾次，覺得奇怪，就問說，「喬治，奶奶並沒有給你郵票簿，你為什麼常這樣說呢？」喬治回答說，「媽媽，奶奶既然答應了，就等於我已經得到了。」喬治的媽媽不再說些什麼，恐怕傷了他的信心。有一天，喬治的母親想試驗他的信心如何，就對他說，「喬治，我想奶奶已經忘記了。」喬治立刻說，「不，她絕不會忘記的。」並且臉上現出喜悅的光彩說，「媽媽，你想我要不要寫一封信去謝謝她的禮物呢？」媽媽說，「你可以試一試。」幾分鐘後，他把感謝信寫好，寄了出去。不久，回信來了，裡面寫著：「親愛的喬治，我沒有忘記要給你的郵票簿。我想照你喜歡的樣式去買，可是本城買不到，我就向紐約函購。但是寄來之後，我一看仍舊不對，所以我又向芝加哥函購了。你所愛的祖母。」他臉上帶著勝利的表情，對母親說，「媽媽，我不是告訴過你麼？祖母既然答應了，就等於我已經得到了。」他的心裡從來沒有疑惑過；不久，信心就變成了事實。"]]},{"no":163,"t":"準備開飯罷","b":[["V","你們若有信心像一粒芥菜種，就是對這座山說，從這邊挪到那邊，它也必挪去；並且在你們就沒有一件事是不可能的。（太17:20）"],["E","If you have faith like a mustard seed, you will say to this mountain, Move from here to there, and it will move; and nothing will be impossible to you. (Matthew 17:20)"],["P","慕勒喬治曾在英國布利斯特城開辦一間孤兒院。那時他三十二歲，這個工作一直繼續到他九十三歲時。六十多年來，共得一千三百五十萬元的捐款，先後養育了一萬上下的孤兒。他從不募捐，一切單單仰望神。一日，午飯時間將到，但孤兒院的廚房空空如也。在差二十分十二點時，廚師來見慕勒說，「先生，今天沒有什麼給孩子們吃，怎麼辦呢？」慕勒說，「神必賜給我們，你去準備開飯吧！」廚師心想，飯鍋是空的，如何預備？但他還是去把盤碟擺上，又到慕勒那裡說，「先生，只差十分鐘了，怎麼辦呢？」慕勒說，「放心吧，你去等著好了。」又過了五分鐘，將要敲鐘吃飯了，廚師的臉色都變成灰白了，又到慕勒那裡說，「先生阿，就要敲鐘了，怎麼辦？」慕勒說，「你為何著急呢？你不曉得這是神的孤兒院，神必負責麼？你這樣實在是疑惑神了！你去吧，這不用你管。」廚師還是不大服氣，自言自語的埋怨著。就在這時，有幾輛大貨車滿載麵包而來，送給兩千多孤兒食用。原來有一工廠因為特別事故突然停工，工人不在，麵包廠仍照常送來他們的中餐，麵包又不能存放，廠長就把這些麵包轉送孤兒院，剛好應付了孤兒院的需要。"]]},{"no":164,"t":"週六下午一定到達","b":[["V","信就是所望之事的質實，是未見之事的確證。（來11:1）"],["E","Now faith is the substantiation of things hoped for, the conviction of things not seen. (Hebrews 11:1)"],["P","有一位基督徒船長，對一位乘客作見證：「五週前我經過此地，在我們的乘客中，有一位慕勒先生。那時因為霧大，輪船已經停頓了二十四小時。慕勒來對我說，『船長，週六下午我是一定要到魁北克的。』我說，『這是不可能的事。』他說，『很好，如果你的船不能叫我按時到達，神有別的方法。五十七年以來，我從未對人失約過。讓我們跪下禱告。』我呆望這位傳道人，心中想，這個人不知道是從那一家瘋人院出來的？我從來沒有聽見過這樣的話。我就對他說，『慕勒先生，你知不知道霧是多麼厚？』他答道：『不，我的眼睛並不看霧的厚薄。我的眼睛只看活的神，祂是管理我一生環境的。』於是他跪下來有一個很簡單的禱告。當他禱告完了，我正想接下去禱告的時候，他將手放在我的肩上，叫我不要禱告。他說，『第一，你不相信神會答應你；第二，我相信神已經答應了，用不著你再求了。』我呆呆的望著他。他對我說，『我認識我的主已經五十七年了，祂從來沒有一次不聽我。船長，把門打開，你要看見霧全消散了。』我站起來一看，霧果然已經全消了。於是週六下午慕勒如約到了魁北克。」由此可見，信是我們所盼望之事的確信、把握，也是我們所未看見之事真實的確證。"]]},{"no":165,"t":"應當一無掛慮","b":[["V","又當堅守我們所承認的盼望，不至搖動，因為那應許我們的是信實的。（來10:23）"],["E","Let us hold fast the confession of our hope unwavering, for He who has promised is faithful. (Hebrews 10:23)"],["P","有一次，倪柝聲弟兄遇見一件過不去的事，毫無出路，就想起主的話：「應當一無掛慮。」（腓四6。）於是走到一片荒地上去禱告。禱告了十幾遍，仍然沒有平安。他就想，難道這節聖經只可以講給人聽，自己實行是不可能的麼？那時神就對他說，「我說，應當一無掛慮，你就有平安；現在你說，你沒有平安…。」他就跳起來說，「神阿，你說我有平安，我就有平安。我自己不說什麼了。」他這樣相信了，就回家，他立刻就有平安，並且這平安是他一生很少經歷過的。"],["P","所以，用神的話來禱告時，必須先信神的話。如果想要有了事實再相信，必無成就的可能。"],["H","鼓勵－相信主（詩481）"],["L","應當一無掛慮，|主已經近了；"],["L","應當信神應許，|平安不動搖；"],["L","你切不可失敗，|也不可失檢，"],["L","因耶穌快要來，|也許是今天。"]]},{"no":166,"t":"神的話不比人的話可靠麼","b":[["V","天地要過去，但我的話絕不能過去。（太24:35）"],["E","Heaven and earth will pass away, but My words shall by no means pass away. (Matthew 24:35)"],["P","一位少年在一次晚間聚會之後，十分苦惱的跪在那裡禱告。第二天晚間，又在那裡禱告。原來他已經信主，只是仍沒有赦罪的確據。一位傳道人引用神的話，對他說明赦罪的事，仍然不能幫助他。後來他就起來要回家去。臨走之前，他請這位傳道人為他禱告。這位傳道人立刻答應他。"],["P","少年走了幾步，傳道人把他叫回來，說道：「你相信我能為你禱告麼？」他驚訝的回答說，「當然相信。」傳道人就說，「何以你能相信？」他說，「因為你答應了我！」傳道人說，「神的話，不比我的話更可靠麼？」少年立刻領悟，就在那時，他得著赦罪的確據，知道自己有了永遠的生命。"],["P","我們多少時候相信自己的感覺，相信別人，也相信別人的代禱，卻不相信所禱告的神，也不相信神所說的話。"],["H","得救的證實與快樂－蒙神赦免（詩233）"],["L","神將我罪丟在背後，|不再記念，不再追究；"],["L","神將我罪踏在腳下，|不再看見，不再鑑察。"],["L","（副）我的過犯神全赦免，|好似厚雲完全消散；"],["L","我的罪惡神都塗抹，|猶如薄雲盡都滅沒。"]]},{"no":167,"t":"因信讚美","b":[["V","就當存著真誠的心，以十分確信的信，前來進入至聖所。（來10:22）"],["E","Let us come forward to the Holy of Holies with a true heart in full assurance of faith. (Hebrews 10:22)"],["P","有一位弟兄生了病，得到神應許要醫治他，他就立即讚美主，兩天後病就好了，並且向聖徒們作見證。他藉著信心經歷病得醫治有七個步驟：第一，生病；第二，禱告；第三，得著應許；第四，相信應許；第五，讚美；第六，病得醫治；第七，作見證。另外一位患病的弟兄便照著頭五步去作，卻得不著第六步。因為頭一位弟兄是先相信病得醫治，結果產生讚美，他的讚美是從信來的；但第二位弟兄的讚美是要達到信的，他是以讚美為達到信心的手段。第一位弟兄的讚美是結果，第二位弟兄的讚美是手段。第二位弟兄盼望以讚美達到病得醫治，卻沒有真實的信心，所以不發生效力。我們只能因信讚美，不能由讚美產生信。"],["P","倪柝聲弟兄有一回生了大病，主應許他因信得生，因信而立，因信而行。神這樣對他說，他就相信祂的話，不再祈求。他相信神的應許，就是得生，得站立，得行走；於是他得生，他站起，又行走。後來有一位姊妹也生病，她照著倪弟兄的見證，也要爬起來，卻不能起來。她是要爬入信心，卻是不能；她自己沒有信心，卻要爬入信心，所以沒有成功。信心的經歷，乃是有主的應許，而相信，然後從信心出發，而能讚美。信心的經歷不能照別人信心的行為，也不能由讚美到信。從別人學來的，乃是信心的公式，公式是沒有用的；只有活的信心才能產生功用。"]]},{"no":168,"t":"基督得勝","b":[["V","弟兄們勝過他，是因羔羊的血，並因自己所見證的話，他們雖至於死，也不愛自己的魂生命。（啟12:11）"],["E","And they overcame him because of the blood of the Lamb and because of the word of their testimony, and they loved not their soul-life even unto death. (Revelation 12:11)"],["P","有一次，倪弟兄住在一位老姊妹家中，忽患重病；當時不只身體不適，且因幾件事情弄不好，心裡也頂難受。老姊妹前來看他。他把他的情形告訴她。每當他說了一句，她總是注目對他說一句：「基督得勝。」他說，「外面的病我不怕，我裡面的事沒有弄好，叫我想起就發冷汗，實在過不去了。」她還是說，「基督得勝。」他說，「不是這麼說。對仇敵可以說基督得勝；對於罪，是因靠主的血洗淨；對於疾病，也可以說是因基督擔當了；這都可以說基督得勝。然而我自己出了事，事情沒有弄好，怎能說基督得勝呢？」但是她還是說，「基督得勝。」她又讀了兩節聖經。到了這時，他裡外才都清楚了；他那天才知道「基督得勝」的意義。從前對於「基督得勝」，他只有聖經的知識，這時他才有從神來的知識。"]]},{"no":169,"t":"主的恩典夠你用","b":[["V","祂對我說，我的恩典夠你用的，因為我的能力，是在人的軟弱上顯得完全。（林後12:9）"],["E","And He has said to me, My grace is sufficient for you, for My power is perfected in weakness. (2 Corinthians 12:9)"],["P","有一位傳道人，在他女兒的葬禮之後，第二天恰好是主日，他思考著該預備什麼樣的信息，於是選了林後十二章九節：「我的恩典夠你用的」作題目。於是他跪下來，求神祝福這題目。在禱告的時候，他自問說，「到底神的恩典夠不夠我用呢？若是神的恩典不夠我用，我怎能對人說，神的恩典是夠你用的？我女兒過世了，我難過、心疼，我過不去，這就是說，神的恩典不夠我用。我不能說謊。」他想換一個題目，時間又來不及了，所以他只有禱告，求神說，「神阿，叫我經歷你夠用的恩典，叫你的恩典是夠我用的。」"],["P","他禱告了很久，似乎一點效力都沒有。就在這時，他無意間瞥見壁爐上掛著一節聖經，是他母親在他去參加葬禮時擺進來的。那正是林後十二章九節：「我的恩典夠你用的。」這上面「我」、「你」印的是藍色，其餘的字印的是黑色，只有「夠」印的是紅色。他忽然得著神的亮光，主是說，「我的恩典夠你用的；」但我卻說，「你的恩典不夠我用。」他就在神面前認錯說，「神阿，你說『我的恩典夠你用的』；我卻還在祈求，叫你的恩典夠我用。」他一面向神認罪，一面感謝讚美神說，你的恩典是夠我用的。他充滿快樂和感謝。"],["P","第二天，他站在講臺上，講了一生之中最好的一篇道。有人問他秘訣在那裡，他回答說，在他給女兒送葬之後，他看見了什麼是相信。相信不是去求神成就祂的應許，相信乃是讚美感謝神已經說了的話。"]]},{"no":170,"t":"憑信注視祂","b":[["V","並且我如今在肉身裡所活的生命，是我在神兒子的信裡，與祂聯結所活的，祂是愛我，為我舍了自己。（加2:20）"],["E","And the life which I now live in the flesh I live in faith, the faith of the Son of God, who loved me and gave Himself up for me. (Galatians 2:20)"],["P","寫「荒漠甘泉」的考門夫人（Mrs. Charles E. Cowman），有一段時間常常感到灰心；希奇為什麼聖經上寫滿了過聖別生活的勸戒，而人卻作不到。她無法解答「神的要求」與「人的經歷」兩者間的不平衡。後來她看見一位弟兄被神的靈充滿了，像小孩一樣，過著與神的旨意和諧的生活。接著她就看見亮光，明白在神的救恩裡，可以得到聖別和內心的平安。如果她憑信心的眼注視祂，就必得著祂成為她的義，在祂裡面過聖別的生活。於是，她順服神的帶領，她的相信成了她自己的經歷。"],["P","看自己的人永遠不能超脫「自我」；惟有仰望耶穌，才能改變，而且榮上加榮。因為在我們裡面沒有一件是好的，在祂裡面卻全是神的榮耀與聖別。"]]},{"no":171,"t":"指南針和望遠鏡","b":[["V","因我們行事為人，是憑著信心，不是憑著眼見。（林後5:7）"],["E","For we walk by faith, not by appearance. (2 Corinthians 5:7)"],["P","一艘海軍軍艦在大海中失迷了航道，很多日子看不見別的船，距離岸邊也還很遙遠。但是艦長仍然毫不畏懼，日夜行駛。一天早晨，他終於看見他的軍艦已經朝向正確的碼頭前進。"],["P","他是如何找到了正路呢？因為他相信他的指南針和他的望遠鏡；不管看得見看不見陸地，他只精確依照指針行駛，一點都不改變。在基督徒的靈程上也當這樣；不憑眼見，只憑內心聖靈的感覺和神的話語。真實的信心必定包括順服，信而順服定能帶下祝福。"],["H","試煉中的安慰－主的名（詩497）"],["L","神阿，你名何等廣大泱漭！|我今投身其中，心頂安然；"],["L","有你夠了，無論日有多長；|有你夠了，無論夜有多暗。"]]},{"no":172,"t":"只管跳下","b":[["V","主是信實的，祂要堅固你們，並保護你們脫離那惡者。（帖後3:3）"],["E","The Lord is faithful, who will establish you and guard you from the evil one. (2 Thessalonians 3:3)"],["P","有一個人開了一家商店，倉庫設在地下室。一天，商人下到地下室拿東西。他的孩子跑來找他，站在地下室倉庫門口，向下觀望，漆黑一團，什麼也看不見，他便大聲喊叫：「爸爸！」父親問他：「找我作什麼？」他說，「我要到你那裡。」父親抬頭望見兒子，說道：「你跳下來吧！」兒子說，「我什麼都看不見！」父親答說，「爸爸就在這裡，只管跳下來。」兒子望望漆黑的倉庫，心裡忐忑不安，惟恐跳了下去，跌得頭破血流。但又想到父親的信實可靠，於是鼓起勇氣，跳了下去。父親立刻把他接在懷中。真正的信心乃像這個孩子一樣，不看環境如何，只相信信實可靠的神。"],["H","小百合（補418）"],["L","我是小花一朵，敞開我臉；|我完全轉向神，接受恩典。"],["L","不知如何往前，就是這樣；|一朵小百合信靠神。"]]},{"no":173,"t":"吊繩採花","b":[["V","因為知道我所信的是誰，也深信祂能保守我所託付的，直到那日。（提後1:12）"],["E","For I know whom I have believed, and I am persuaded that He is able to guard my deposit unto that day. (2 Timothy 1:12)"],["P","有幾個遊客在高山上採集植物標本。他們發現了一種奇特的花朵，是從來沒有見過的。但是這種花開在山谷中，如果要採摘，必須用繩子把人縋吊下去。由於太危險了，所以沒有人敢下去。後來他們遇見一個看羊的孩子，便請他下去採花，並且答應給他很好的報酬。那些遊客願意幫他拉緊繩子，叫他不要害怕。孩子不放心，就說，「我要去找我的父親，他能握住繩子。」他便立刻跑回去了。"],["P","不久，他的父親帶了一根很堅牢的繩子來，套在孩子的身上，將他縋了下去。孩子上來的時候帶了很多的花，因此得到很好的報酬。遊客中的一位問小孩說，「為什麼你不敢信靠我們呢？我們會像你父親一樣握牢繩子的。」孩子回答：「我不認識你們，但我認識我的父親，他抓住了繩子，我就什麼也不怕。」使徒保羅知道他所信的是誰，所以他能完全交託給祂。照樣，我們認識祂多少，也能信靠祂多少。"],["H","得救的證實與快樂－主的保守（詩259）"],["L","（副）"],["L","惟知道我所信的是誰，|並且也深信祂實在是能保"],["L","守我所信託祂的，|都全備直到那日！"]]},{"no":174,"t":"不讓孩子跌下去","b":[["V","祂既愛世間屬自己的人，就愛他們到底。（約13:1）"],["E","Having loved His own who were in the world, He loved them to the uttermost. (John 13:1)"],["P","有一位姊妹，因為境遇十分困難，心裡十分煩悶。有一位傳道人特別來探望她，見她抱著自己的孩子坐著，臉上一點笑容也沒有。傳道人對她說，「你會不會讓你的孩子從你手中跌下去呢？」她聽見這話，覺得奇怪，就回答說，「我絕對不會讓他跌下去的。」傳道人又問：「你要我付出多少代價，才肯讓你的孩子跌下去呢？」她回答：「就是給我像天上星星那麼多的金鎊，我也不讓他從我手裡跌下去。」「你真的不讓你的小孩跌下去麼？」「我絕對不。」「你想你愛你的孩子，更勝過神愛祂自己的孩子麼？」她的臉忽然放光，信心如火一樣，重新挑旺起來。"],["H","試煉中的安慰－主的信實（詩506）"],["L","祂不誤事，因祂是神！|祂不誤事，祂樂施恩！"],["L","祂不誤事，祂已許過！|我們有神，還怕誰何？"]]},{"no":175,"t":"入霄風箏","b":[["V","你們雖然沒有見過祂，卻是愛祂，如今雖不得看見，卻因信入祂而歡騰，有說不出來、滿有榮光的喜樂。（彼前1:8）"],["E","Whom having not seen, you love; into whom though not seeing Him at present, yet believing, you exult with joy that is unspeakable and full of glory. (1 Peter 1:8)"],["P","有一個小孩在曠野放風箏。因為風順，沒有多久，風箏就已飛得很高，甚至高入雲霄。雖然他已經看不見風箏，但是他還是緊牽著線，站在那裡。有一個老人從他身旁走過，問道：「孩子！天快要黑了！你還站在這裡，作什麼？」「我在這裡放風箏。」老年人抬起頭來，四周一看，說，「那裡有風箏？」孩子答道：「信不信由你，風箏已經飛入雲霄，看不見了；可是我總覺得上面有個力量牽引著我。」照樣，只有看見那看不見的主，才能感覺到有一股力量吸引著你。"],["H","主耶穌！我渴慕摸著你！（詩403）"],["L","主耶穌！主耶穌！|我渴慕摸著你！"],["L","多又多，多又多，|你長大在我裡。"],["L","願你的生命不斷成長，|「榮耀之花」盛放！"],["L","叫世人看見你|顯在我的身上。"]]},{"no":176,"t":"戴德生論信心","b":[["V","耶穌聽見，就希奇，對跟從的人說，我實在告訴你們，這樣大的信心，我在以色列中，沒有遇見人有過。（太8:10）"],["E","And when Jesus heard this, He marveled and said to those following, Truly I say to you, With no one in Israel have I found so great a faith. (Matthew 8:10)"],["P","戴德生說，「『主是我的牧者。』請注意這個『是』字，不是說『從前』主是我的牧者，也不是說，主『或者』是我的牧者，乃是說，主『是』我的牧者。主日祂是我的牧者；週一至週六，祂也是我的牧者。正月初一到十二月三十一日，主天天是我的牧者，年年是我的牧者。在家或出外，順境或逆境，貧窮或富有，主都是我的牧者。世界的一切金銀，都是屬於神的，千山萬水，地上一切的生物，都是神所有的。我們何必叫窮？我們何必吃素？我差僕人去買東西，無論是買幾分錢的，或是買幾千塊錢的，僕人都須指望我給錢，並將東西買來給我。照樣，神差我無論作大事或是小事，難事或是易事，無論怎樣，神都要引導我，給我一切的需要。有難解的事，神要賜智慧；有難辦的事，神要賜恩惠；有難作的事，神要賜力量。不用怕出於神的來源不夠，入不敷出，供不應求。神的來源是我的，因為神自己是我的。神與我同在，並且住在我的心內。」"],["P","這位信心的偉人，就是憑這樣的信心，在中國內地十一個省打開福音之門。"]]},{"no":177,"t":"為基督穿喪服","b":[["V","那借著祂來到神面前的人，祂都能拯救到底；因為祂是長遠活著，為他們代求。（來7:25）"],["E","He is able to save to the uttermost those who come forward to God through Him, since He lives always to intercede for them. (Hebrews 7:25)"],["P","路德馬丁有一次十分愁苦的時候，他的妻子穿著一身喪服，由外面進來。路德問：「你為什麼人穿喪服？」她答道：「基督死啦！」路德很莊重的說，「基督那能死呢？」她問說，「那麼你為什麼愁苦呢？」路德大受提醒，忽然喊道：「對！基督是活的，那我還怕什麼，還有什麼可愁苦的呢！」"],["H","讚美主－祂的復活（詩106）"],["L","榮耀歸於你，復活得勝子，|你已永遠得勝，你已勝過死；"],["L","天使身穿白衣，滾開墳墓石，|憑著你的空墓，你復活啟示。"],["L","（副）榮耀歸於你，|復活得勝子，"],["L","你已永遠得勝，|你已勝過死。"]]},{"no":178,"t":"怕不能信到底","b":[["V","那聽我話，又信差我來者的，就有永遠的生命，不至於受審判，乃是已經出死入生了。（約5:24）"],["E","He who hears My word and believes Him who sent Me has eternal life, and does not come into judgment but has passed out of death into life. (John 5:24)"],["P","美國一位很有名的傳道人慕迪到英國時，有一天去拜訪一位剛信主的朋友。那人很灰心的說，「剛才我在聚會中受感信主，只怕日子一久，又要在信仰上跌倒，不能相信到底。」慕迪抬頭看見他的家裡掛了一個大鐘，就問那位朋友說，「你相信鐘現在在走麼？」他說，「我信。」慕迪又問：「你相信它明後天仍會走麼？」他說，「這沒有問題。」慕迪說，「我再問你，今天主救了你麼？」他說，「是的。」「為什麼你不信明天、後天，主還是救你呢？」那人想了一下，立刻領會，確信已經得著永遠的救恩了。後來那位朋友把那大鐘運到美國送給慕迪，作為他自己永遠得救的記念。"]]},{"no":179,"t":"小鳥唱晚歌","b":[["V","住在至高者隱密處的，必住在全能者的蔭下。（詩91:1）"],["E","He who dwells in the secret place of the Most High will abide in the shadow of the Almighty. (Psalm 91:1)"],["P","有一次，路德馬丁非常灰心，不知如何是好。忽然聽見一隻小鳥在唱晚歌，唱完後就將頭放在翼下安睡了。路德馬丁就對自己說，「這隻小鳥已吃飽，現在準備安睡；它的心何等滿足，絕不以明日的食宿為念。它如同大衛，住在全能者的蔭下。它在樹枝上何等安息，完全讓神來顧念它，為它安排。」"],["P","馬太福音告訴我們，不要為生命憂慮，吃什麼，喝什麼；也不要為身體憂慮，穿什麼。因為生命勝於食物，身體勝於衣服。野地裡的百合花，它們既不勞苦，也不紡線。就是以色列國智慧的王所羅門，在他極盛的榮耀裡，也沒有披戴得像這些花中的一朵。所以不要憂慮，說，我們要吃什麼？喝什麼？披戴什麼？因為這一切都是外邦人所急切尋求的，我們的天父原知道我們需要這一切。（六25～32。）"],["H","試煉中的安慰－主的看顧（詩493）"],["L","應當住在神的翅下，|神必定顧念你；"],["L","任何遭遇不要驚怕，|神必定顧念你。"],["L","（副）神必定顧念你，|時時顧念，處處顧念，"],["L","祂必定顧念你，|神必定顧念你。"]]},{"no":180,"t":"你的日頭不再下落","b":[["V","你的日頭不再下落，你的月亮也不退縮；因為耶和華必作你永遠的光。（賽60:20）"],["E","Your sun will no longer go down, nor will your moon withdraw; for Jehovah will be an eternal light to you. (Isaiah 60:20)"],["P","慕安得烈在某次講道以後，有位姊妹前來與他談話。這位姊妹十分虔誠，他就問她近來情形如何。她回答說，「還不是照舊，有時光明，有時黑暗。」他就說，「親愛的姊妹，這記載在聖經何處？」她說，「自然界有白晝，有黑夜，我們的靈性也是如此。」不，絕對不，聖經告訴我們：「你的日頭不再下落。」讓我們信我們是神的兒女，同時父在基督裡藉著聖靈愛了我們，使我們能夠常常住在祂的面光中，不斷得著祂的同在。"],["H","鼓勵－相信主（詩482）"],["L","神的應許不能廢去，|句句都是堅定；"],["L","信心從來不用憑據，|因神言出必行。"],["L","（副）天地雖能被焚燒，|小山大山雖傾倒，"],["L","但那相信主的人，|必見主話得成。"]]},{"no":181,"t":"不替神打算盤","b":[["V","因為耶和華以色列的神如此說，罈內的麵必不用完，瓶裡的油必不短缺。（王上17:14）"],["E","For thus says Jehovah the God of Israel, the barrel of meal will not give out, nor will the jar of oil fail. (1 Kings 17:14)"],["P","一個主日的早晨，一位替主僕人們管伙食的姊妹對他們說，「柴火只夠燒午飯，菜錢若買肉，就只夠買一天的菜；如果只買青菜，還可以維持到明後天。」主的僕人們想了一想，說，「我們不替神打算盤，就照著平常的菜色，盡我們所有的，用完再說。」當時他們也並不知道晚飯的柴火也不夠用。所以菜雖然買了，到了晚餐，柴火卻不夠燒。"],["P","午後，神差遣一位弟兄，遠道送來一筆款。事實上，他在一週前就受引導要送款來，拖延到那天才有機會前來。當神的供給來時，夕陽已經西下，主的僕人們知道天色已暗，買柴火不易，特地分頭上街，四處尋找購買。正好一個大學生走錯路，巧遇了兩個挑柴的販子，正在等待顧客上門；就買了柴火回來，不快不慢，恰巧接上爐灶裡最後的一把柴火，燒熟一桌晚飯。神的預備，常在最後的一秒鐘，才向人顯現。"]]},{"no":182,"t":"我知道神要辦","b":[["V","我的神必在榮耀中，照著祂的豐富，在基督耶穌裡，使你們一切所需用的都充足。（腓4:19）"],["E","And my God will fill your every need according to His riches, in glory, in Christ Jesus. (Philippians 4:19)"],["P","十九世紀英國的名佈道家司布真（Charles Haddon Spurgeon），他曾多次作過這個見證：「我的祖父是一個貧窮的傳道人，他曾養了一頭牛，這對於養活他的十個兒女幫助很大。不幸，有一天牛死了。我的祖母就問說，『我們沒有了它，現在我們的生活怎麼辦？』我的祖父回答說，『我不知道我們現在要怎麼辦，但我知道神要辦；我深信神有辦法，供應我們一切的需用。』第二天，他從差會收到了二十英鎊，他並沒有申請這一筆款，但神卻應時供給他的需要。」"],["H","試煉中的安慰－主的同在（詩490）"],["L","我常居住天愛中，|不怕改變一點；"],["L","如此把握不落空，|在此沒有改變。"],["L","也許狂風四面起，|也許無多希望；"],["L","但神四面來護庇，|我怎能夠彷徨？"]]},{"no":183,"t":"從漢口送款來","b":[["V","似乎憂愁，卻常常喜樂；似乎貧窮，卻叫許多人富足；似乎一無所有，卻擁有萬有。（林後6:10）"],["E","As made sorrowful yet always rejoicing; as poor yet enriching many; as having nothing and yet possessing all things. (2 Corinthians 6:10)"],["P","太平洋戰爭爆發那一年除夕前一日，家家戶戶準備歡度舊曆年的時候，神的僕人們正好食糧已盡，囊空如洗。明知道除夕一過，有錢都買不到東西，而年內得著供給的希望卻又很少。到了那天下午，主的僕人們聚集在一起，並不面面相覷，大家都知道難關在眼前，裡面卻都有安息，所以也沒有籌畫人的辦法。正當這時，門外有人敲門，來了兩位陌生的客人。這兩位客人也不說明來意，只要參觀，神的僕人們滿腹疑雲。待引導他們參觀後，他們才說明來意：「我們從來沒有聽說過這個地方。但我們負了使命從漢口來，專為代送幾筆款而來；因為時候已晚，馬上就要搭末班渡輪回漢口去。」讚美主，至今神的僕人仍不認識那二位送款的人。除夕的上午，他們上街買米、菜蔬以及用品，豐豐富富的過了那次的難關。"]]},{"no":184,"t":"單單與神交涉是可能的","b":[["V","信靠祂的人，必不至於羞愧。（彼前2:6）"],["E","He who believes on Him shall by no means be put to shame. (1 Peter 2:6)"],["P","一次，慕勒剛從德國回來，在主的工作上遭遇極大的經濟困難。數日之後，接到一位時常捐助孤兒院的弟兄來函說，「你所負責的工作是否有急需？我知道你從不求人，單單仰望你所事奉的主；可是答覆人的詢問，似乎有點不同。這是正當的。我願意曉得你目前工作上的經濟狀況，請你通知我，目前你需要多少，或者將來盼望多少？」此時慕勒手中只剩二十七便士，有數百孤兒需要供應，但他覆信說，「我感激你的愛心，同意你的意見，向人要錢和答覆詢問確有不同。但我覺得沒有自由可以向你報告我們的經濟狀況，因為在我手中工作的主要目的，在乎領導一些信心軟弱的人看見，單單與神交涉是可能的。」回信寄出之後，慕勒為這位弟兄禱告，將需要獻給這位永活的神：「主阿，你知道為著你的緣故，我沒有把需要告訴這位弟兄。現在，主阿，求你再一次的顯明，單單向你吐露我們的需要是行得通的。所以求你對這位弟兄說話，使他幫助我們。」神感動這位弟兄，送來一百金鎊。款收到時，慕勒兩手正已空空。"]]},{"no":185,"t":"一個便士","b":[["V","自己裡面也斷定是必死的，叫我們不信靠自己，只信靠那叫死人復活的神。（林後1:9）"],["E","Indeed we ourselves had the response of death in ourselves, that we should not base our confidence on ourselves but on God, who raises the dead. (2 Corinthians 1:9)"],["P","一八四一年秋，慕勒和同工們受到一個信心最重的試驗，情形比較已往任何時期來得艱難。數月以前孤兒院中接到之供應還是源源不絕；但是現在幾乎每一餐都必須仰望神。禱告雖然仍然不斷的獻上，幫助有時卻是似乎遲延。因此大家感覺這是神的特別恩典。慕勒和他的同工們竟能相信到底。他們確蒙神的托住，毫不動搖，安息在神的慈愛裡。"],["P","有一次，一個貧窮的婦人奉獻了兩個便士，她說，「這是區區之數，但我必須給你。」誰知這筆奉獻十分應時，其中的一個便士適可湊足整數，購買急用的麵包。另有一次，孤兒院需要八個便士以預備下一頓飯，可是手頭只有七個便士。待開奉獻箱，發現只有一個便士，恰合所需。"]]},{"no":186,"t":"空麵缸中唱「三一頌」","b":[["V","所以不要憂慮，說，我們要吃什麼？喝什麼？披戴什麼？…你們的天父原知道你們需要這一切。（太6:31-32）"],["E","Therefore do not be anxious, saying, What shall we eat? or, What shall we drink? or, With what shall we be clothed? …For your heavenly Father knows that you need all these things. (Matthew 6:31-32)"],["P","戴德生過去在中國北方講道時，常說，「一個人若有真正的信心，才能將頭放在空麵缸中唱『三一頌』。」說了這話不久，這樣的事便臨到他。"],["P","一天，他的妻子把他拉到廚房。他問妻子說，「有什麼事？」她說，「我要你來唱『三一頌』。」他果然看見一個空麵缸。她說，「親愛的，我常聽你講道說，如果有真信心，才能在麵缸空了時，將頭放進去，唱『讚美父乃祝福之源，…讚美三一神是我分』。（詩歌第5首。）看哪！你的機會來了，現在實行你所講的道吧！」那空麵缸立在那裡，張口向他望著。戴德生摸摸口袋，空空如也，也沒有進款的希望。這時要尋找信心，似乎信心已溜走了；想要逃走，妻子堵在門口，手裡拿著舀麵粉的杓子。戴德生就說，「我可以把頭放在空麵缸裡唱『三一頌』，但有一個條件，就是你也要把頭放在空麵缸裡，一同來唱才行！你記得我們結婚時，你曾經答應我要同甘共苦。」於是他們把頭一同伸進空麵缸中，同唱「三一頌」。"],["P","那時，他們心中充滿喜樂。當頭伸出來時，沾了不少麵粉。第二天，一家雜貨店送來一袋麵粉。雖然他們從來不曾知道，究竟是誰送來的麵粉；卻篤定天上的父知道他們的需要。"]]},{"no":187,"t":"空白的支票簿","b":[["V","少壯獅子，還缺食忍餓；但尋求耶和華的，什麼好處都不缺。（詩34:10）"],["E","The young lions hunger and starve, but those who seek Jehovah will not lack any good thing. (Psalm 34:10)"],["P","十九世紀英國弟兄會的戚伯門（Robert Cleaver Chapman），在他所著的書中說到，在他人生的一個時期，肩負經濟上的重擔，因為他家裡發生一件意外，為此需要很多的金錢協助。他就憑著信心，將他的需要告訴神。不久，有一位信徒前來見他。這一位信徒素來很謙卑，也很愛主，又是一位百萬富翁。他對戚伯門說，「戚伯門博士，我聽說你近日有經濟上的難題。你不必問我這消息從那裡來，只請你承認這是否是事實。」戚伯門沒有應聲，但點頭示意。那位信徒說，「你不必告訴我你的需要，但要你知道，我的一切是要作你的後盾，盼望你的難題可以因此得著解決。」戚伯門的眼淚不禁奪眶而出。他似乎信不來他耳中的好消息，只是瞪大眼睛看著他的朋友，不能說出一句話。那位信徒從他口袋中，拿出一本支票遞給戚伯門說，「這些支票都已簽上我的名字，你只要在空白處填上所需要的數目。」說完了話，他與戚伯門誠摯的握手而別。戚伯門一面感謝神，一面將他經濟的難題一一解決。"]]},{"no":188,"t":"神聽見倒麵缸的聲音","b":[["V","罈內的麵果然沒有用完，瓶裡的油也沒有短缺，正如耶和華藉以利亞所說的話。（王上17:16）"],["E","The barrel of meal did not give out, nor did the jar of oil fail, according to the word of Jehovah, which He had spoken through Elijah. (1 Kings 17:16)"],["P","在英國蘇格蘭有一位寡婦，她的子女很多，雖然她多方節儉，也僅僅足以維持衣食。但她的心完全倚靠神，並教導她的兒女也照樣倚靠主。可是有一天，錢袋空了，麵粉缸裡也僅剩麵粉一把。她預備將所有的麵粉作些食物，給孩子們充飢，但用完了這些麵粉，下一餐的食物從何而來，完全不知。當她將麵粉缸底的麵粉倒盡時，不禁傷心，流出淚來。她的孩子羅伯見她流淚，就走近來，安慰她說，「神豈沒聽見你倒麵缸的聲音麼？」她的信心立刻又增強起來，說道：「是的，羅伯，神是知道的。一切雖然沒有了，但神仍然存在。神說，祂要供給我們一切的需用。」這位寡婦雖然貧窮，但神用奇妙的方法供給她，使她沒有缺乏。"],["H","試煉中的安慰－主的信實（詩506）"],["L","我們因信歡樂唱說：|祂不誤我，祂已許過！"],["L","祂不誤我，祂樂施恩！|祂不誤我，因祂是神！"]]},{"no":189,"t":"仰頭望過短牆","b":[["V","我的魂哪，你為何憂悶？為何在我裡面煩躁？應當仰望神；因祂的臉是我的救恩。（詩42:5）"],["E","Why are you cast down, O my soul? And why are you disquieted within me? Hope in God, …for the salvation of His countenance. (Psalm 42:5)"],["P","有一天，衛斯理約翰和一個品行高尚的人一同走路。那人正在對他述說他的困難，而且不知如何解決。這時在不遠的地方正好有一頭牛仰起頭，望過一堵短牆。衛斯理就問那人說，「你知道那頭牛為什麼抬起頭來，望過石牆？」那人回答說，「不知道。」衛斯理說，「我可以告訴你，這是因為它不能透視牆外的事物，所以只好抬起頭來觀看。所以你也必須這樣往上觀看，來解決你的困難。」"],["H","羨慕－神（詩269）"],["L","我如困鹿切慕溪水，|裡面乾渴難言；"],["L","哦神，我心惟你是追，|並你復甦恩典。"]]},{"no":190,"t":"抓緊藤枝往上看","b":[["V","我的魂說，耶和華是我的分；因此，我要仰望祂。（哀3:24）"],["E","Jehovah is my portion, says my soul; therefore I hope in Him. (Lamentations 3:24)"],["P","一位傳道人來到非洲的剛果。一天，要過一座用藤葛編成的橋。兩端藤葛交纏樹上，高懸空中，飄搖無定；下臨深淵，景狀危險。那位傳道人俯瞰下面激流湍急的河水，想想伏在水中的巨鱷，根本不敢走過那座橋。有一位土著和他同行，發覺他十分恐懼害怕，就說，「不要怕，抓緊了藤枝，往上看，不要向下看，這是走過這橋的惟一訣竅。」那位傳道人如法堅握藤枝，並往上看，於是平安到達彼岸。"],["P","基督徒度過險境的惟一秘訣，就是往上看，抬起臉來仰望神。看環境會叫你畏縮不前；仰望神會叫你勇往直前。"],["H","一路跑盡（補424）"],["L","我們有當跑的路，阿利路亞！|當一路跑盡，莫停下！"],["L","對所有在跑的人，阿利路亞！|神說：「當望斷及於祂！」"],["L","（副）當望斷以及於祂！|一路跑盡，莫停下！"],["L","望斷一切身外物，注視耶穌，|當望斷一切及於祂！"]]},{"no":191,"t":"上面沒有雲霧","b":[["V","我要向山舉目。我的幫助從何而來？我的幫助從造天地的耶和華而來。（詩121:1-2）"],["E","I will lift up my eyes to the hills. From where will my help come? My help comes from Jehovah, who made heaven and earth. (Psalm 121:1-2)"],["P","一艘大郵輪正橫渡大西洋，突然遇見濃霧；但是船行速度仍然沒有減速，照常猛進。乘客頗為憂心。過了一些時候，乘客召集會議，推派兩位代表去見船長，請求減低船行速度，並在船頭船尾加派船員值班，恐怕因為視線受濃霧阻礙，遭遇意外。船長接見乘客的代表，就託他們轉告所有乘客，不用擔心，在船最高的地方，就是船長的駕駛臺上並沒有雲霧，他們的視線並不受阻。"],["P","同樣的，當信徒遭遇試煉、患難、困苦時，往往十分憂愁，以為前面非常黑暗，不知將要遇見什麼。但請記得，引領我們的主在上面，祂是無所不知，無所不見；我們只管安息在祂裡面。"],["H","試煉中的安慰－主的引領（詩507）"],["L","主，你作我的領港，|來過此人生風浪；"],["L","前面是未識水道，|浮沙外加上暗礁；"],["L","你當賜南針圖狀，|主，你作我的領港。"]]},{"no":192,"t":"井中月亮","b":[["V","他們舉目不見一人，只見耶穌。（太17:8）"],["E","And when they lifted up their eyes, they saw no one except Jesus Himself alone. (Matthew 17:8)"],["P","一年中秋，明月皎潔，高懸天空，月光如同水銀傾瀉大地。有一家兄弟五個，在庭院裡玩捉迷藏。最小的弟弟因為躲在井旁，無意中發現井底也有一個月亮，既亮且圓，並不亞於天上的。他就向哥哥們招呼說，「哥哥，看阿！井裡有個月亮多麼美阿！」哥哥們一聽他的召喚，便都圍攏來看。"],["P","老三平常就很調皮，當他跑來時，就先撿了一塊石頭，藏在身上。當五兄弟看得出神時，老三忽然拿起預先準備的石頭，往井裡一丟，聽到噗咚一聲，大家都嚇了一跳。因為井底的水波震動，月亮的影子就顯得支離破碎。最小的弟弟哭喪著臉說，「哥哥，為什麼月亮變成這個樣子？」哥哥說，「弟弟，別難過，你看天上的月亮，還是那麼圓，那麼亮。」他抬頭一看，立刻破涕為笑了。"],["P","事實告訴我們，人間的盼望，脆弱如同玻璃，經不起任何的打擊，戰爭、疾病、患難一來，就把我們的美夢打得粉碎。讓我們抬起頭來，把目光轉移，集中在那昔是、今是、以後永是的基督耶穌身上。"]]},{"no":193,"t":"在豺狼旁邊禱告","b":[["V","我不撇下你們為孤兒，我正往你們這裡來。（約14:18）"],["E","I will not leave you as orphans; I am coming to you. (John 14:18)"],["P","一位神的僕人在旅行佈道時，頓時陷入低潮。他遇見許多難處，無法解決，感覺神似乎撇棄了他。於是他找到一個山洞，進去禱告，細訴苦情和被撇棄的光景。禱告又禱告，一直在那裡向主傾心吐意。時間過了很久，他的眼睛習慣於洞裡的黑暗後，方才發現洞裡離他很近的地方，躺臥著一隻母狼和它的小狼。這隻狼不但沒有過來吞噬他，就是連動也不動。"],["P","本來正在乳養幼狼的母狼比一切的猛獸更兇暴，但神在他以為被撇棄的時候，卻保守他十分平安。他頓時領悟過來，一切憂患都是暫時的，千般的為難都有神的美意，他的神用自己的手引領他的一生，叫他無憂無懼。"],["H","試煉中的安慰－信靠主（詩515）"],["L","不在此時，許待主回，|不在此地，許到那裡；"],["L","我們才能完全領會，|嘆息眼淚所有意義。"],["L","（副）你當一生信靠救主，|路雖陰暗，仍當讚美，"],["L","不必懼怕，主在攙扶，|有日、有日都要領會。"]]},{"no":194,"t":"三個枕頭","b":[["V","賜諸般安慰的神，是當受頌讚的；祂在我們一切的患難中安慰我們，叫我們能用自己從神所受的安慰，安慰那些在各樣患難中的人。（林後1:3-4）"],["E","Blessed be the…God of all comfort; Who comforts us in all our affliction that we may be able to comfort those who are in every affliction through the comforting with which we ourselves are comforted by God. (2 Corinthians 1:3-4)"],["P","有一個貧窮的女人，不但看不見，而且得了很痛苦的病，長期躺在床上。有一位傳道人來探望她時對她說，「你的痛苦真是非常人所能受的。」她回答說，「我有一次聽見一位傳道人說，他去探望一位將死的人。傳道人問那將死的人說，『你現在覺得怎麼樣？』將死的人回答說，『我將我的頭安息在三個枕頭上：第一個枕頭是神的全能；第二個枕頭是神的全愛；第三個枕頭是神的全智。』我現在也照樣安息在這三個枕頭上，所以我的心安然無慮。」"]]},{"no":195,"t":"兩幅安息的圖畫","b":[["V","我將這些事對你們說了，是要叫你們在我裡面有平安。在世上你們有苦難，但你們可以放心，我已經勝了世界。（約16:33）"],["E","These things I have spoken to you that in Me you may have peace. In the world you have affliction, but take courage; I have overcome the world. (John 16:33)"],["P","有兩個畫家，相約各繪一幅圖畫，表達安息的意義。第一個畫家畫了一個大湖，風平浪靜，湖面如鏡；山上美景清清楚楚映在水中。第二個畫家畫下一片極大的瀑布，旁邊有棵小灌木的枝子，彎在瀑布的水中；它的頂端分枝之上，架著一個鳥巢，幾乎被浪花浸溼，中間睡著一隻知更鳥。"],["P","第一幅畫表達的僅僅是停滯；第二幅畫才是安息；因為要有安息，必須先有陪襯安息的對象。在驚濤駭浪的逆境中，仍能歡顏著接受，才是真正享受安息的人。"],["H","祂是主（補417）"],["L","四周滿艱辛，|無一處可安息，"],["L","我心似乎消化如水；|但是在深處有微聲輕輕訴，"],["L","你是否真知道「祂是主」？"],["L","（副）哦我心，當肅穆！|祂是主，祂是主，祂是主！"]]},{"no":196,"t":"用不著愁","b":[["V","所以你們不要為明天憂慮，因為明天自有明天的憂慮，一天的難處一天當就夠了。（太6:34）"],["E","Therefore do not be anxious for tomorrow, for tomorrow will be anxious for itself; sufficient for the day is its own evil. (Matthew 6:34)"],["P","第一次世界大戰時，法國有一青年，就是怕被抽去當兵。在前線的一位朋友，聽見他這種怕死的情形，就寫信去鼓勵他。這封信被郵政官檢查出來，認為頗有價值，就把它登出來，用以勸告那些貪生怕死的人。以下就是信的內容："],["P","在以下二者中有一件是確定的：不是被抽調，就是在原位。若在原位，那麼你用不著愁。若被抽調，在以下二者中有一件是確定的：不是送往前線，就是留在後方。若留在後方，那麼你用不著愁。若在前線，在以下二者中有一件是確定的：不是在危險的區域，就是在安全的地帶。若在安全的地帶，那麼你用不著愁。若在危險中，在以下二者中有一件是確定的：不是受傷，就是安全。若是安全，那麼你用不著愁。若是受傷，在以下二者中有一件是確定的：不是重傷，便是輕傷。若是輕傷，那麼你用不著愁。若是重傷，在以下二者中有一件是確定的：不是死掉，就是治好。若是治好，那麼你用不著愁；若是死掉，你就不會愁了。"],["P","「你們中間誰能因憂慮使自己的身量多加一肘？」（太六27。）"]]},{"no":197,"t":"不要揹負魔鬼的重擔","b":[["V","凡勞苦擔重擔的，可以到我這裡來，我必使你們得安息。（太11:28）"],["E","Come to Me all who toil and are burdened, and I will give you rest. (Matthew 11:28)"],["P","有位信主多年的中年婦人，因飽嘗人生苦楚，所以終日面帶愁容。她的兒子雖然常常勸她，用盡方法要讓她喜樂，總是無效。一天早晨，她下樓來吃早飯，滿面笑容，與平時大不相同。兒子非常詫異，就問她說，「媽媽！我喜歡看見你的笑臉，究竟什麼事叫你這樣喜樂？」她說，「孩子，昨天夜裡我作了一個奇異的夢。夢見自己跟一大群揹著重擔、極其疲倦的人，走在一條路上。前面有許多可怕的惡魔，把很多黑色的包袱撒在地上。所有的人都一邊行走，一邊彎腰拾起那些包袱，背在背上。大家越走越沉重，壓得透不過氣來。過了一會兒，我抬起頭來，看見一位人子，帶著榮耀的慈顏，走到我的身邊。我仔細一看，原來是我的救主。我就呼叫：『主阿！我非常疲倦，實在背不動了。』祂說，『親愛的孩子阿！你用不著揹負這些重擔，因為那是魔鬼給你的，不是我給你的，所以要將你的重擔丟掉，摸也不要摸，就會覺得路很好走，走起來像生了翅膀一樣的輕鬆。』祂說完了話，用手一摸，我的重擔就都脫落了，喜樂平安立刻充滿我的心。正想跪在祂的腳前感謝，我就醒了，我的一切憂慮也完全消失了。」從這天起，直到她離世的日子，都是全家最喜樂的人。"]]},{"no":198,"t":"只有「如果」的毛病","b":[["V","你要囑咐那些今世富足的人，不要心思高傲，也不要寄望於無定的錢財，只要寄望於那將百物豐富的供給我們享受的神。（提前6:17）"],["E","Charge those who are rich in the present age not to be high-minded, nor to set their hope on the uncertainty of riches but on God, who affords us all things richly for our enjoyment. (1 Timothy 6:17)"],["P","一位黑奴生活很苦。但她是一位信主的人，每天從早到晚都十分喜樂，口中常是滿了「阿利路亞」和「讚美主」的聲音。有一天，主人家的姑母來了。她是一位尊貴的白人婦女。她見家裡的黑奴這麼喜樂，就問她說，「你為什麼這麼喜樂呢？」她說，「我是信主耶穌的，祂是我的救主，已經救了我。」那位貴婦實在氣不過她這麼快樂，又問她說，「你怎麼能這麼快樂，毫不關心你的前途呢？如果你的主人不要你了；如果你背痛不能洗衣服了；如果你的兒子病了；如果你賺的錢被偷了；如果你不幸發生意外；如果…。」這位充滿喜樂的姊妹不等她再說出一個「如果」，立刻答覆她說，「我的太太，我看你什麼都好，就只有一個『如果』的毛病，你若沒有這個『如果』的毛病，你早就像我這麼快樂了。」"]]},{"no":199,"t":"在試煉中站住","b":[["V","忍受試煉的人有福了，因為他既受試驗得了稱許，就必得著生命的冠冕，這是主應許給那些愛祂之人的。（雅1:12）"],["E","Blessed is the man who endures trial, because when he has become approved by testing, he will receive the crown of life, which He promised to those who love Him. (James 1:12)"],["P","有人問慕勒，如何可得堅強的信心。這位信心之王回答說，「只有一個方法，就是忍受試煉。我個人學得信心，都是因為在兇險的試煉中站住的緣故。」這話是真實的，當一切都不可靠之時，便是真正信靠神的時候。"],["H","試煉中的安慰－盼望之主（詩520）"],["L","新鮮如同清晨甘露，|帶來暢爽的甘美，"],["L","基督借祂溫情恩膏，|柔聲細語的安慰："],["L","站住，直到試煉過去，|站住，直到風波平，"],["L","站住，為著神的榮耀，|站住，與主同得勝。"],["L","（副）"],["L","盼望之主，你的聲音何甜！|在你面前我心因此暢歡！"]]},{"no":200,"t":"信心的翅膀","b":[["V","你們在所忍受的一切逼迫與患難中，仍有忍耐和信心。（帖後1:4）"],["E","Concerning your endurance and faith in all your persecutions and the afflictions which you bear. (2 Thessalonians 1:4)"],["P","一隻蜂雀孵育兩隻小蜂雀，等到它們羽翼長豐，便教它們學習飛行。其中一隻由於母雀引導，即刻鼓翼而飛。另外一隻則站在鳥巢裡，十分驚惶，不敢展翅而飛。母雀一直在它周圍盤旋，呼叫催促。但它看看世界這樣浩大，自己又是這樣渺小，不敢一試。它雖然聽見母親急切呼叫，並且看見它的兄弟自由自在的遨翔，並無絲毫危險，但它總是不敢信任它的翅膀，一直站在一旁猶豫不決。母雀雖然失望，卻不知如何幫助它突破自己。"],["P","後來有一隻土蜂飛來，發出嗡嗡的聲音。小蜂雀十分害怕，以為是敵人要來攻擊它。想要飛逃，卻又不敢。於是搖轉頭部，想要把它嚇走。但是土蜂越來越近，嗡嗡的聲音越來越大。蜂雀極其害怕，側身而下，並且鼓起翅膀飛到地上。雖然經過一番緊張，卻安然著地。某人看見這種情形，好意將小蜂雀拾起，放回巢裡。可是它已不肯留在巢裡，便一飛而去。"],["P","神在許多時候興起環境，讓各樣的試煉、困難臨到信徒身上，為叫他們運用信心倚靠祂，至終他們必學得秘訣。"]]},{"no":201,"t":"丟失柺杖","b":[["V","我們這活著的人，是常為耶穌被交於死，使耶穌的生命，也在我們這必死的肉身上顯明出來。（林後4:11）"],["E","We who are alive are always being delivered unto death for Jesus' sake that the life of Jesus also may be manifested in our mortal flesh. (2 Corinthians 4:11)"],["P","有一位信主的婦人，患脊椎病許多年，走路非用柺杖不可。雖然醫生曾經囑咐她，要她放下柺杖，但她始終不敢試試看。有一天，她從樓上下來，突然失足，一路滾到樓梯底下。那時，她的柺杖也掉了，便躺在地上大聲呼救，碰巧附近沒有一個人；她就用盡氣力，扶著欄杆，掙紮起來，試著自己行走。從那時起，她便能不靠柺杖行走了。顛仆和失去柺杖，反而成了她一生最好的遭遇。"],["P","許多時候，神在環境上剝奪我們所倚靠的，為要我們單純倚靠祂。"],["H","羨慕－基督（詩276）"],["L","你若取去我的心愛，|求以自己給我；"],["L","你若仍定我受疑猜，|求以自己給我。"],["L","（副）主耶穌，親愛救主，|多以自己給我；"],["L","我向你完全順服，|多以自己給我。"]]},{"no":202,"t":"辨別真假鑽石","b":[["V","叫你們信心所受的試驗，比那經過火的試驗仍會毀壞之金子的試驗，更為寶貴，可以在耶穌基督顯現的時候，顯為可得稱讚、榮耀和尊貴的。（彼前1:7）"],["E","So that the proving of your faith, much more precious than of gold which perishes though it is proved by fire, may be found unto praise and glory and honor at the revelation of Jesus Christ. (1 Peter 1:7)"],["P","有一位鑽石商人說，「分別真假鑽石，最靠得住的方法，莫過於用『水試』。真的鑽石放在水裡，美麗不減，仍然發光；假的鑽石一到水裡，光豔全失，跟石頭沒有兩樣；若將真假鑽石同時放到水裡，則更容易分辨，就是一個毫無經驗的人也看得出來。」"],["P","假的信心經不起環境的試驗，真的信心越試驗越顯明。"],["H","試煉中的安慰－信靠主（詩516）"],["L","信靠耶穌何其甘甜，|抓祂話語作把握，"],["L","安息在祂應許上面，|只知主曾如此說。"],["L","（副）"],["L","耶穌、耶穌，何等可靠，|我曾試祂多少次；"],["L","耶穌、耶穌，我的至寶，|祂是活神不誤事。"]]},{"no":203,"t":"綁在樹上過夜","b":[["V","但那全般恩典的神，就是那曾在基督耶穌裡召你們進入祂永遠榮耀的，等你們暫受苦難之後，必要親自成全你們，堅固你們，加強你們，給你們立定根基。（彼前5:10）"],["E","But the God of all grace, He who has called you into His eternal glory in Christ Jesus, after you have suffered a little while, will Himself perfect, establish, strengthen, and ground you. (1 Peter 5:10)"],["P","有一個印第安人的孩子，生性懦弱。他的父親為要教他學習勇敢，便把他帶到樹林裡，綁在一棵樹上，留他在那裡過夜。他懼怕野獸，就大聲哀號。但是他的父親並非真的離開了他，而是藏在一棵樹的後面，手裡拿著槍，準備射擊所有要來侵犯他的野獸。"],["P","我們在天上的父神操練我們的信心，也是這樣。許多時候，祂把我們擺在艱險困難的環境中，卻在暗中保守我們，使我們的信心得以增長。"],["H","試煉中的安慰－主的看顧（詩496）"],["L","當我遇見試煉災殃，|經過荊棘豺狼之疆，"],["L","我有一個甘美思想，|就是主懷念我。"],["L","（副）主，你正懷念我！|主，你正懷念我！"],["L","我怕什麼？有你親近，|並且還懷念我！"]]},{"no":204,"t":"鑑識真花假花","b":[["V","信心也是這樣，若沒有行為，就是死的。有人會說，你有信心，我有行為；你將你沒有行為的信心指給我看，我便由我的行為，將我的信心指給你看。（雅2:17-18）"],["E","So also faith, if it does not have works, is dead in itself. But someone will say, You have faith, and I have works; show me your faith without the works, and I will show you my faith by my works. (James 2:17-18)"],["P","相傳所羅門為王的時候，國勢鼎盛，遠方各國都來朝貢。某國特派專使獻上兩盆名貴的花朵，但其中一盆是天然的，一盆是人造的，兩盆都是一樣美不勝收。為要誇示他們國家技藝的精巧，並要窺探進貢國家國王的才識，所以請所羅門王鑑賞識別。"],["P","所羅門王毫不猶疑的說，「請把兩盆花放在花園中，等我和貴使臣一同去鑑賞。」花園中百花爭豔，極其芬芳，蜂蝶飛舞其間，春光絢爛。一會兒，所羅門笑對使臣，說出那一盆是真花，那一盆是人造的。原來天然的花有蜜，蜂蝶都棄假趨真。使臣聽了，驚服所羅門的智慧。"],["P","我們的信心好比花朵，雖然一時真假難辨，卻可實驗。真信心和真花一樣，是有生命的，花開時綻放花香，不僅吸引人，花謝後還能結果子。雖然各種花結的果子有大小的不同，但總不會白佔地土。這就是使徒雅各說的：「信心…若沒有行為，就是死的。…我便由我的行為，將我的信心指給你看。」因此，我們有無信心，不僅自己可以測驗，別人也會知道。"]]}]},{"n":"了結已往","i":5,"intro":[["V","若有人在基督裡，他就是新造；舊事已過，看哪，都變成新的了。（哥林多後書五章十七節）"],["E","If anyone is in Christ, he is a new creation. The old things have passed away; behold, they have become new. (2 Corinthians 5:17)"]],"a":[{"no":205,"t":"清理舊生活","b":[["V","在從前的生活樣式上，脫去了舊人，…並且穿上了新人。（弗4:22,24）"],["E","That you put off, as regards your former manner of life, the old man, …and put on the new man. (Ephesians 4:22,24)"],["P","我們一得救，成了一個新的人，自然就應當有一個新的起頭，新的開始，過一種新的生活。為此，我們就必須清理已往的舊生活。保羅在帖前一章九節說到，在帖撒羅尼迦的信徒，他們一信主就離棄了偶像，轉向神，為要事奉那又活又真的神。"],["P","神是忌邪的神，絕不許可事奉祂的人跪拜任何偶像，因為偶像的背後，都有鬼魔藏著。所以，我們信主歸於神之後，就要立刻離棄、棄絕一切金、銀、銅、鐵、木、石所刻制和塑造，大小各種形狀的偶像。在舊約中神是要祂的百姓，打碎、焚燒一切的偶像。我們屬神的人也該如此作，不該將任何偶像留下轉送別人。這是得罪神，也敗壞別人的事。不僅偶像本身，即使是一切與偶像有關的物件，也都要打碎、焚燒。"],["P","此外，一切與拜偶像並邪惡之事有關的邪汙之物，如算命、占卦的書，和帶著龍像、龍印的物件，以及各種賭具等物，都要去掉。這些都是撒但魔鬼的表徵。我們既是屬神、敬奉神的人，無論在我們身上的穿戴，或在我們家中的陳設，以及典藏之物，都不該再有這些邪汙之物的形跡。反之，我們的衣著、裝飾，和我們的陳設、裝潢，都應該叫人看出我們是信主、愛神的人。我們在信主之後，當將所得的不義之財，儘速償還我們所虧負的人。這會叫我們在人面前有見證，在我們的良心裡有平安，使我們配成為一個真正的基督徒。（生命課程）"]]},{"no":206,"t":"慕勒了結舊生活","b":[["V","一切苦毒、惱恨、忿怒、喧嚷、毀謗，同一切的惡毒，都要從你們中間除掉。（弗4:31）"],["E","Let all bitterness and anger and wrath and clamor and evil speaking be removed from you, with all malice. (Ephesians 4:31)"],["P","慕勒年少時，行為放蕩，酗酒偷竊，欺騙偽造，樣樣都來。那時，他不只是個大學生，而且還被接納，預備承接聖職，特准在國教的教堂傳道。他雖一再努力改良，卻一再遭遇失敗，因為他尚未找到能力的秘訣。後來，在一次家庭聚會中，他蒙了光照，清楚得救，立刻就有一種新的潔淨，和成聖的能力，使他憎惡罪中之樂，遠避舊時的同伴，從此絕跡酒肆；並且在言語上受約束，彷彿在他的嘴唇設立了守望，每句話都經過檢點。"],["P","當時他正在翻譯一本法文小說，希望利用所得酬金，逛遊巴黎等地。他先是放棄了這個旅行計劃，卻仍繼續小說的翻譯。後來，他清楚曉得這事不是出於信心，乃是出於罪惡，便把全部譯稿付之一炬。從此常常讀經、禱告，成為一個在主裡的信徒。他不停的參加聚會，勇敢的站在主這一邊，忍受昔日同學的譏刺、羞辱，並願意付上一切代價跟隨主，結果成為一位主所大用的僕人。"]]},{"no":207,"t":"一支手槍四顆子彈","b":[["V","但那屬基督耶穌的人，是已經把肉體連肉體的邪情私慾，都釘了十字架。（加5:24）"],["E","But they who are of Christ Jesus have crucified the flesh with its passions and its lusts. (Galatians 5:24)"],["P","有一個人，愛上一個女子；但那女子又被另外一個男人愛上，跟著那人逃走了。他就恨之入骨，賣了田地，買了一支手槍和四顆子彈。他試打了二槍，結果很準，便留著二顆子彈，要找那男人，打死他。然而遍找不著，就覺得作人乏味，準備自殺了事。有一天，遇見一個信耶穌的人，在鄉間佈道，許多人擁擠成一團。他就上前觀看，聽見靈魂得救的問題，便信了耶穌，並且禱告。他心想，靈魂的問題解決了，現在可以死了。回家之後，穿上新衣，睡在床上，把被子蒙在頭上，手槍隔著被窩，準備對著腦門一扣板機，了此一生。扣了二次，子彈都未擊發；他急忙起身檢查手槍，原來子彈卡在槍膛裡，打不出來。後來一想，我已相信耶穌，已是一心歸主，這個女人既然犯罪不要我，我也不要她了，何必自殺呢？隨即將積存的一捆情書一起燒光，又將與女人有關係的照片雜物一概除盡，一心歸主。"],["P","一個人一旦得救，已往的一切便到此了結，今後開始過全新的生活。"]]},{"no":208,"t":"小叔給主改變了","b":[["V","敗壞的話一句都不可出口，只要按需要說建造人的好話，好將恩典供給聽見的人。（弗4:29）"],["E","Let no corrupt word proceed out of your mouth, but only that which is good for building up, according to the need, that it may give grace to those who hear. (Ephesians 4:29)"],["P","有位傳道人，遇見一位受浸八年的弟兄，就問他：「是否清楚知道你裡頭有主的生命？」他說，「是的，我信主八年了。」那傳道人說，「看你的生活不像是有主生命的人。」他很生氣，就走了。可是一面走，一面有聲音說，「受浸八年，得救不清楚，不像有主的生命。」回家後便關起門來，禱告了一個多鐘頭，神就光照他。原來他哥哥、嫂嫂均未信主，在分家產時，哥哥多得一畝地，三十塊錢。他就很不滿意，和哥哥吵了架，三年不和哥哥說話。現在聖靈對他說，「你是主的人，三十塊錢和一畝地算什麼？為什麼三年不說話？你哥哥生病時，你就說死了還好。信主的人罵人死，怎能叫人信？」第二天，主又說，「你光向我認罪不夠，你要向哥哥認罪阿。」他想這是一件太難的事。正巧哥哥回來，他就求主加他力量，對哥哥說，「哥哥，你回來了麼？」哥哥說，「是的，我回來了。」他心裡很喜樂；但主仍說，「只是這樣叫他不夠，還要向他認罪。」於是，他再去向哥哥、嫂嫂認罪說，「哥哥，我三年不同你說話，是我不對，請你原諒我。嫂嫂到家裡二十年，我沒有叫過一聲嫂嫂，真是對不起。」嫂嫂快樂得流淚，就到傳道人那裡說，「先生，我也要信耶穌。我小叔給耶穌改變得很奇特，我要聽這奇特的道。」"]]},{"no":209,"t":"結束演唱","b":[["V","我也將萬事看作虧損，因我以認識我主基督耶穌為至寶；我因祂已經虧損萬事，看作糞土，為要贏得基督。（腓3:8）"],["E","I also count all things to be loss on account of the excellency of the knowledge of Christ Jesus my Lord, on account of whom I have suffered the loss of all things and count them as refuse that I may gain Christ. (Philippians 3:8)"],["P","一位就讀師範學院的學生，非常喜愛音樂和戲劇，常在歌詠隊及劇團中擔任角色。得救之後，覺得這種演唱生活不討神的喜悅，不能見證榮耀神。他就禱告主，願意了結這種生活，不再參加演唱。然而，這突如其來的舉動，引起許多昔日同好的疑異，紛紛前來慰問，以為他受什麼打擊，或有什麼失意，或有什麼傷心的事。他卻含糊其辭的推託一番，自然不能滿足同好們的疑竇。他再經過禱告之後，覺得應該明白的將原因向同好們說明，一面可以免去許多的誤會，一面可以見證他所確信的主。經過一番解釋之後，昔日的同好們方才恍然大悟，並且都說，「他已經成了耶穌迷，我們不必再寄望於他，也不必再去找他了。」從此他雖失去一班朋友，卻得著無上至寶的救主基督。"]]},{"no":210,"t":"解除酒肉朋友","b":[["V","你們既已脫去謊言，各人就要與鄰舍說實話，因為我們是互相為肢體。（弗4:25）"],["E","Having put off the lie, speak truth each one with his neighbor, for we are members one of another. (Ephesians 4:25)"],["P","洪弟兄是一位世傳綢緞商，交際甚廣，朋友眾多。得救後，他就把已往數十位酒肉朋友請來吃飯，又請幾位弟兄陪座。席間他先作見證，說明他已經信主，從此不再吃喝玩樂，要解除酒肉朋友，並且盼望朋友早日信耶穌。作完見證，有位弟兄起來再傳福音。不僅如此，洪弟兄原來開設大綢緞店，通常日本貨說是美國貨，臺灣貨說是香港貨，藉此賺錢。現在既已得救不再撒謊，就把這店廉價盤讓給人，他是徹底了結已往不正常的生活。"],["H","得救的證實與快樂－在基督裡（詩229）"],["L","我今在基督裡面，|脫離了亞當界限；"],["L","凡舊事都變新鮮，|屬地變為屬天！"],["L","讚美主，在此得享恩典，|飽嘗生命與平安！"],["L","讚美主，我今在主裡面！"]]},{"no":211,"t":"喝酒的張某死了","b":[["V","我已經與基督同釘十字架；現在活著的，不再是我，乃是基督在我裡面活著。（加2:20）"],["E","I am crucified with Christ; and it is no longer I who live, but it is Christ who lives in me. (Galatians 2:20)"],["P","從前有張、李二位先生，都嗜好喝酒，因此結成好友。一次，李先生前往漢口經商，約有一個月才回來。一回到上海，將行李安置妥當，即往酒樓買醉，並叫侍役持條子邀請張先生來赴小酌。不料侍役持條子回來，上面寫著：「喝酒的張某已經死了。」李先生頓時大吃一驚，心想分離只一個月，好友卻已死，竟成永別。然而，不知他的家人如何？因此無意喝酒，立刻僱了一輛車子到張家去。到了張家，看見雙門緊閉，便上前叩門。不久門開，張先生赫然立在門前。李先生以為見了鬼魂，嚇得轉身就跑。張先生趕去一把抓住他，笑個不停。李先生嚇得渾身發抖的說，「我是你的好友，生前沒有虧負你，你現在何必如此對待我呢？」張先生好言安慰他說，「不要怕，我沒有死。」李先生回答說，「那回條明明批著：喝酒的張某已經死了。」說時雙手捧著紙條，恭恭敬敬的呈在張先生面前，心中卻仍舊害怕。張先生回答說，「我已經悔改信了耶穌，已經與酒樽告別了，從此不再喝酒，所以喝酒的張某死了；現在活著的，是信主的張某。」"]]},{"no":212,"t":"搗毀酒廳賭窟","b":[["V","若有人在基督裡，他就是新造；舊事已過，看哪，都變成新的了。（林後5:17）"],["E","If anyone is in Christ, he is a new creation. The old things have passed away; behold, they have become new. (2 Corinthians 5:17)"],["P","有一個兇暴之人，開設酒廳、賭窟，招引酒徒買醉，又叫他們狂賭，騙盡他們所有的錢財。許多人因此傾家蕩產，自殺的也不少。這人又在紐約欺騙一位美麗女子，娶其為妻，卻常常醉酒打她，把她關在門外；一次打他女兒，使她跌倒於熱紅火爐上，自肩到手無一完膚；又同夥計用槍殺死四個人。結果，那地方的人個個都怕他。後來他聽了斐尼的佈道，悔改得救了。第二天早晨，他跑到酒廳，將一樽一樽的酒，一瓶一瓶的威士忌，全都打碎；再到賭窟，將賭具、賭桌拋在火爐中；然後跑回家中，抱住妻子、女兒，嚎啕痛哭，涕淚橫流。過了許久，方才壓抑自己，對他妻女說，「妻阿，女兒阿，不要害怕。神今早帶領一個新的人，新的父親回到家裡來了。」"],["P","一個人一得救，所有不正當的事業都得結束，已往的作人也得結束，一切都該有新的開始。"]]},{"no":213,"t":"洗手不幹","b":[["V","偷竊的不要再偷，倒要勞力，親手作正經事，好有所分給需要的人。（弗4:28）"],["E","He who steals should steal no more, but rather should labor, working with his own hands in that which is respectable, that he may have something to share with him who has need. (Ephesians 4:28)"],["P","有位姓陳的人，原是個著名的扒手，估計扒過臺幣六十萬，盜跡遍佈全省。後來在牢中悔改歸主，已往扒竊的行業便洗手不幹。曾經有人要他去賣冒牌電燈泡，可以獲利不少；但他覺得燈泡冒牌，又未上稅，不是基督徒可以作的，便未接受。後來有位舊日同夥前來找他，要他一同南下行竊，他只需坐在旅館裡，就可分到三分之一，不必親自出馬。陳弟兄那時經濟雖很拮据，但因已了結已往，不能再跟著他們，就對那人說，「我不能去了。」後來，他沿街叫賣冰淇淋，雖然收入微薄，勉可餬口；但他寧願受苦，甘心清貧，了結已往犯罪的生涯。"]]},{"no":214,"t":"大盜歸正","b":[["V","所以你們要悔改，並要迴轉，使你們的罪得以塗抹，這樣，那舒爽的時期，就得以從主面前來到。（徒3:19）"],["E","Repent therefore and turn, that your sins may be wiped away, so that seasons of refreshing may come from the presence of the Lord. (Acts 3:19)"],["P","林不，福建安溪人，是一個陸海大盜，手下甚多。後來因政府搜捕，逃往廈門。有一天，他路過教堂，忽然覺得後面有人跟蹤，便懷疑是警察，就慌張的溜進教堂，混在會眾中間，假裝聽道。不料，傳道人的話語，非常剛強，感動了他，使他深覺扎心，立即悔改，接受救主。林不信主後，立刻回家，勸勉手下也要信主，改邪歸正；並將財產分給他們，另謀正業。解散手下，結束舊業之後，他就獻身為主活著，熱心傳揚福音，到處為主作見證。"],["H","得救的證實與快樂－生命改變（詩241）"],["L","我生命有何等奇妙的大改變，|自基督來住在我心；"],["L","神榮耀的光輝，照耀在我魂間，|自基督來住在我心。"],["L","（副）自基督來住在我心，|自基督來住在我心；"],["L","喜樂潮溢我魂，如海濤之滾滾，|自基督來住在我心。"]]},{"no":215,"t":"開葷燒偶像","b":[["V","你們又是怎樣離棄了偶像轉向神，來服事又活又真的神。（帖前1:9）"],["E","And how you turned to God from the idols to serve a living and true God. (1 Thessalonians 1:9)"],["P","鄭大強弟兄原先虔修佛道，清齋十八年半，斷絕油鹽一年，且能演易占卜，入定遊魂。後來突患離奇重病，弟兄們為他禱告。他夢見異象，信了耶穌，病即不藥而癒。得救後不久，即行開葷，被弟兄們請上菜館，吃起魚肉。他燒燬所有偶像，往日看如珍寶的經典，通通付之一炬；占卜用具也搗毀無遺，古銅香爐拋入嘉陵江中。那時，鄭弟兄住在張鬱嵐弟兄家中，樓下就是聚會的所在。隔壁住有一位婦人，多年患病，用盡醫藥，耗盡所有，病也未見好轉。她見鄭弟兄焚燬偶像經典，很為鄭弟兄擔心害怕，以為偶像會來懲罰降災。那知過了一些日子，看見鄭弟兄平安無事，完全恢復健康，充滿喜樂。她心裡十分詫異。有一天，弟兄們正在聚會禱告，她忽推門進來，立刻跪下，求主醫病。禱告後，她全身發抖冒汗，溼透棉襖，身心頓感輕鬆，當時病就好了；三十年來抽菸的惡習也除去了。第二天，她作見證說，耶穌真是活神。"],["P","基督徒得救後，所有迷信的事必須一概斷絕，一切與迷信及偶像有關的邪汙東西，都應該除盡。"]]},{"no":216,"t":"燒了一筐偶像","b":[["V","我差你到他們那裡去，叫他們的眼睛得開，從黑暗轉入光中，從撒但權下轉向神，又因信入我，得蒙赦罪，並在一切聖別的人中得著基業。（徒26:18）"],["E","To whom I send you, to open their eyes, to turn them from darkness to light and from the authority of Satan to God, that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in Me. (Acts 26:18)"],["P","有位弟兄姓林，得救前生了很重的肺病，醫藥都無效，便到處求神問卜，叩頭敬拜，有時還住在廟裡求醫。他家中供奉大小偶像十幾個，日夜焚香點燭，俯伏叩拜，大小節期都要獻祭。他為了應付迷信，耗費不貲。請和尚道士消災要錢，廟裡也要捐錢，大節期還要獻祭請客，沒錢時還得借錢維持面子；弄得他真是又病又窮，痛苦極了。後來，他信了耶穌，病情轉好，漸漸痊癒。不久召會有大焚燒的行動，他就把家中大小偶像十幾個，以及香爐、燭臺，裝了一筐，放在腳踏車後面，載到會所，打碎焚燒；從此，與偶像斷絕關係，靈裡火熱，常常服事主。"]]},{"no":217,"t":"就是喜歡這一個","b":[["V","孩子們，你們要保守自己，遠避偶像。（約壹5:21）"],["E","Little children, guard yourselves from idols. (1 John 5:21)"],["P","有位王弟兄，他母親在信主後，仍舊保留一尊偶像。他心裡非常不安，想要打碎，但母親不容許。王弟兄對母親說，「請把佛像給我，無論你要什麼，我都可以買給你。」她說，「我就是喜歡這一個。」王弟兄又說，「這是魔鬼，信主的人不能要。」她說，「我又不拜它，只是收起來罷了。」王弟兄的弟媳也有一個佛像，收在箱裡。有一天，她床上突然起火，棉被燒起來了，她急忙撲滅，但遍查卻不知火源何在。王弟兄就說，這是偶像作祟。這時她們方才醒悟過來，把佛像都拿出來打碎扔掉。他母親原雖信主，但對得救還不清楚，這一來屬靈的竅就開啟了。"],["H","新酒灌滿（補719）"],["L","我們與偶像，不再有關涉，|基督是我們惟一的享受！"],["L","我們不再受世界的迷惑，|召會是我們實際的生活。"],["L","（副）哦，對付以後，何等的享受！|高山上滴酒、滴酒、"],["L","滴酒、滴甜酒！哦！當讚美主，|何等的豐富，"],["L","小山上流奶、|流奶、流奶子！"]]},{"no":218,"t":"住在樓板下","b":[["V","有許多行巫術的人，把書拿來，堆在眾人面前燒燬了。他們計算書價，便知道共合五萬銀幣。（徒19:19）"],["E","And a considerable number of those who practiced magic brought their books together and burned them before all; and they counted up the price of them and found it to be fifty thousand pieces of silver. (Acts 19:19)"],["P","一九三三年春，浙江溫嶺縣有一個女子被鬼附著，有人請了幾位弟兄去為她禱告。禱告之後，當時鬼就離她而去；但過不久，鬼又回來。有位弟兄就問那鬼說，「我們奉主的名叫你去了，為什麼又回來。」它說，「我沒有離去；我是有地方住的。」弟兄就問它：「你住在什麼地方？」它說，「我不告訴你。」弟兄說，「我們奉主耶穌基督的名，一定要你告訴我們。」它才說，「我住在樓板下。」於是叫人下樓尋找；那女子是住在樓上。一會兒，那人回來說，「有一張破舊的符還貼在樓板底下。」弟兄們就說，「快快撕毀它。」當人去撕時，那鬼又說，「嘿！我還有地方。」弟兄們問它還有什麼地方？它不肯說。弟兄們就問那主人，家中什麼地方還有邪汙之物？主人說，「不知道雜物堆裡有沒有？」弟兄就要他找找看。這時，那鬼忽然喊起來，「沒有的，沒有的，不要去找吧。」弟兄們一聽見，知道一定有的，就吩咐人快點去找。鬼見阻止無效，就說，「你們何苦如此。」一會兒，找出許多佛經、偶像、木主等，一齊拿了出去。弟兄就對它說，「現在你沒有地方了，你可以去啦。」它說，「我去，我去。」就離去，不再回來。所以，家中若有什麼邪汙之物，必須一一除去，免得成為鬼的住處。"]]},{"no":219,"t":"徐弟兄捉龍","b":[["V","你們要服從神，抵擋魔鬼，魔鬼就必離開你們逃跑了。（雅4:7）"],["E","Be subject therefore to God; but withstand the devil, and he will flee from you. (James 4:7)"],["P","徐弟兄信主多年後，有一天躺在床上，看見被子上有一小尾巴，仔細再看，原來是一條小龍，盤成圓花，整個被面都是。他立刻覺得，龍是魔鬼的記號，怎麼可以蓋在身上。於是趕快拆下，拿去燒掉。又想到別的東西，或許也有龍，只是未曾注意，於是一一檢查。果然發現熱水瓶上商標有龍，立即刮掉；小杯上畫有小龍，馬上打碎；他將凡有龍的東西，都除得乾乾淨淨。"],["P","我們基督徒是神的器皿，應當盛裝神，被神充滿，所以要除去一切屬地，甚至屬鬼的事物，好叫我們的心清潔，沒有其他權勢轄制；也叫我們的生活清潔，沒有任何玷汙。"]]},{"no":220,"t":"告別聲色","b":[["V","不要愛世界，和世界上的事。人若愛世界，愛父的心就不在他裡面了。（約壹2:15）"],["E","Do not love the world nor the things in the world. If anyone loves the world, love for the Father is not in him. (1 John 2:15)"],["P","有位弟兄沒有得救前，喜歡明星照片。舉凡中外的，他都一一搜集無遺，並且裝入鏡框，掛在壁上，時時欣賞。他也喜歡娛樂，自己還能編寫劇本，其中一劇還頗得聽眾讚賞。然而得救之後，他覺得這些乃是不討神喜悅的事物，就把所有明星照片，都從壁上取下；又把所編劇本，全都找了出來，在召會的一次大焚燒時，拿出焚燒。他並且作見證說，這些東西浪費他不少時間精力，此後與這些聲色之物告別。"],["H","福音－愛與恩（詩690）"],["L","愛何奇妙，恩何深廣，|神差愛子來此；"],["L","罪的審判歸祂身上，|祂為你我代死。"],["L","愛路，恩門，今正齊開，|無別拯救舍此以外，"],["L","神心依依等待你來，|切莫拒祂恩愛。"]]},{"no":221,"t":"不賣豬血","b":[["V","就是禁戒祭偶像之物和血，並勒死的牲畜和淫亂，這幾件你們自己若能禁戒不犯，那就好了。（徒15:29）"],["E","To abstain from things that have been sacrificed to idols and blood and things strangled and fornication, from which if you carefully keep yourselves, you will do well. (Acts 15:29)"],["P","有一位弟兄，原來專門販賣豬血為生，挑著豬血沿街叫賣；或作成酸辣湯，味道鮮美，多人購食，獲利甚豐。有一天，他信了主耶穌，看見經上記著：「無論什麼活物的血，你們都不可吃。」（利十七14。）他覺得自己固然不該吃血，也不該賣給別人吃，於是改行作別的小生意。"],["H","得救的證實與快樂－借恩得救（詩247）"],["L","驚人恩典！何等甘甜，|來救無賴如我！"],["L","前曾失落，今被尋見！|前盲，今不摸索！"]]},{"no":222,"t":"打破玻璃","b":[["V","撒該站著，對主說，主阿，看哪，我把家業的一半給窮人，我若訛詐了誰，就還他四倍。（路19:8）"],["E","And Zaccheus stood and said to the Lord, Behold, the half of my possessions, Lord, I give to the poor, and if I have taken anything from anyone by false accusation, I restore four times as much. (Luke 19:8)"],["P","一個教堂裡，有一塊大玻璃，約值四十塊美金，被一個小孩因為玩球而打破了。那個教堂的牧師沒有追究，只見一個小孩來到教堂門口，張望一下就走了。後來那個小孩的母親過世，許多信徒都來為他母親安葬，因此這個小孩受到基督愛的激勵，接受耶穌作救主。他得救後，就有心願要了結打破玻璃的事；所以，一有餘錢，就寄給那教堂的牧師。起初先賠一毛，以後有時多賠，有時少賠。有時來信說，我最近需要補習，這個月不能多賠，只能賠二毛。以後又來信說，我現在手裡多一點了，能賠一元。這樣繼續有款寄來，已經超過玻璃的價值了。那個教堂的牧師召集大家商量，應該怎樣辦理？後來定規登報，要他停止賠償。從登報那天起，他才不再寄錢來。十年後，該教堂有次新舊牧師的交接，那位新的牧師，竟然就是那個打破玻璃的小孩。他站起來說了這個故事，眾聖徒大受感動。"],["P","這是一個了結已往的好例子，並且也是一個賠償的好結果，不只成為神的兒女，更成為神的工人。"]]},{"no":223,"t":"特別討飯的","b":[["V","感謝神，你們從前雖然作罪的奴僕，現今…既從罪裡得了釋放，就作了義的奴僕。（羅6:17-18）"],["E","But thanks be to God that though you were slaves of sin, …And having been freed from sin, you were enslaved to righteousness. (Romans 6:17-18)"],["P","李常受弟兄作見證說，他在信主前，一次上班的地方火災。在紛亂中，他看見一個精緻中國瓷的墨水瓶，和一把西洋毛刷，就順手帶走了。得救後，聖靈一直叫他去對付這件不義的事。那時小墨水瓶還在，小毛刷卻已不在了，於是他帶著那個小墨水瓶，加上一塊錢，去見物主，面紅耳赤的承認從前如何拿走這些東西，現在來償還。物主堅持不接受；但經他再三請求，才說，「我收下這墨水瓶，但這一塊錢我絕不接受。」這時，他見李弟兄拿著一個陰陽合曆的月曆，當時是眾所喜愛而少有的，就說，「好啦，就用這個月歷頂那個小毛刷吧。」李弟兄從他那裡出來後，一面捨不得那個可愛的月曆，一面覺得這塊錢不容易處理，就在心裡說，「最好神賜給我一個特別討飯的，好把這塊錢送他。」回到家中，門剛閉上，就有人來叩門求助。於是李弟兄給他吃飽，送他一些饅頭，又把那塊錢給他作為路費，告訴他，那是主耶穌給的。那人辭謝而去後，忽然看見有一位弟兄，他把一個紙包遞給李弟兄，說，「這個送你。」他打開紙包一看，竟是一個陰陽合曆的月曆。他豁然領會了神的帶領。這實在證明神喜歡我們賠償虧欠，對付不義的事。"]]},{"no":224,"t":"小箱及字典","b":[["V","他要承認所犯的罪，將所虧負人的，全數賠還，另外加上五分之一，給與所虧負的人。（民5:7）"],["E","Then they shall confess their sin which they have committed, and he shall make restitution according to its principal for his wrong and add to it one-fifth of it and give it to the one whom he has wronged. (Numbers 5:7)"],["P","有位姊妹，在她得救之初，總以為自己是個好人，並不覺得有罪。她信了耶穌，卻不覺得需要耶穌的血洗淨她的罪；好像這位耶穌只作她道德崇拜的榜樣，卻沒有成為她生命的實際。有一次，她去聽道，傳道人作見證說，「我的父親是銀行經理，很有地位，也很有錢，按理我這銀行經理的兒子，在金錢上應該很闊綽清白，那知我常作小偷…。」就這一句「銀行經理之子作小偷」的話，打動她的良心，她的心眼立即明亮，好像有話指責她說，「從前你作教員時，豈不是把學校的字典、小箱子等物，都拿走了麼？」當時她就悔改認罪，答應裡面的聲音，歸還這些偷來之物。後來，她又覺得這樣歸還太難為情，不如按照這些物品的價值折成現金，將錢寄給一位在校的同事，託她代還學校。然而，她裡頭過不去，非得親自去還不可。至終，她順服了下來，親自帶著這些東西，到學校去，向校長認罪歸還。從這一次的順服經歷中，她摸著了那活在她裡面的基督。"]]},{"no":225,"t":"六枚銅元","b":[["V","你們不可偷盜，不可欺騙，也不可彼此說謊。（利19:11）"],["E","You shall not steal; neither shall you deceive nor deal falsely with one another. (Leviticus 19:11)"],["P","一個孩子，約十一、二歲。幾年前，他在學校門前看見同學買糖果吃，自己卻沒有錢。他就想到，某某先生臥房桌上放有好些銅元；若是他不在房內，就可以拿幾枚銅元去買糖吃。想著想著就跑去，果然先生不在。他取了六枚銅元，買糖吃了。有一天，他聽見福音，就為著這罪非常難過。他想去償還，卻沒有錢，就去對他姊姊說，「請你一定給我六個銅元。」姊姊問他為何如此，要他說出個理由。弟弟一直不肯，只說，「無論如何請你給我。」姊姊沒有辦法，只得給他，並跟著他去看他到底要作什麼。他把這錢拿到先生那裡，對他說，「幾年前我曾在你房中，偷取六枚銅元買糖吃，現在我把這錢還你，求你原諒。」從此以後，他心裡才真正平安下來。"],["H","得救的證實與快樂－借恩得救（詩248）"],["L","恩典代罪而興，|在我靈中執政，"],["L","使我脫離罪的權能，|脫離敗壞天性。"],["L","（副）恩典夠我用！|永不感力窮；"],["L","基督活在我靈中，|使我受恩重重。"]]},{"no":226,"t":"暗中使壞","b":[["V","說謊言的嘴為耶和華所憎惡；行事忠信的，為祂所喜悅。（箴12:22）"],["E","Lying lips are an abomination to Jehovah, but those who deal faithfully are His delight. (Proverbs 12:22)"],["P","有一個在中學讀書的學生，一天夜裡清楚得救了。主就把他已往的不義，一件一件擺在他面前。他就隨著主的引導，一件一件的認罪。那時夜深，他父母都已睡了。他就去跪在母親身旁，想起對父母的許多罪過，眼淚不住往下直流。不一會兒，他母親醒過來，驚奇的問道：「兒阿，你在這裡哭什麼？」他就一面哭，一面說，「母親，我對不起你，我從前常常偷你的錢，出去買糖吃，也買過香菸；也常偷吃你留給父親吃的點心；並且常常惹你和父親生氣。現在我已經信主耶穌悔改了。」母親說，「你不是個好孩子麼？」他說，「不，我是暗中使壞。」接著又說，「現在是深夜，父親已經睡的很沉，我不願意驚醒他，請母親告訴他我的罪，並求他饒恕。」母親說，「好孩子，快起來吧，以後不要再偷了。」他擦著眼淚，回到自己房裡，提起筆來寫了幾封對付的信；有的是向教員、校長承認他從前考試作弊的罪；有的是給同學求和睦的；有的是告訴人，他再不去和他們結黨犯罪了。"]]},{"no":227,"t":"私接電燈","b":[["V","不要彼此說謊，因你們已經脫去舊人，同舊人的行為，並且穿上了新人。（西3:9-10）"],["E","Do not lie to one another, since you have put off the old man with his practices and have put on the new man. (Colossians 3:9-10)"],["P","有位中學生得救後，主叫他想起他的罪，就是幾個月來，他私接了一盞電燈，並且安上一盞特別亮的一百燭光燈泡。每晚開燈以前，他都得先將門簾、窗簾放好，深怕被外邊的人看見。得救那一夜，他就將燈泡取下，定規不再私接電燈，並且預備一盞小煤油燈，代替電燈。當然一盞小煤油燈，比一盞一百燭光電燈的亮度，相差太多；但他定意，寧肯眼睛變瞎，也不再私接電燈了。可是，已往幾個月點的電燈費怎麼辦呢？要去賠償，沒有錢；要向父母要，父母都是不信主的，若去要錢又沒有見證。於是心裡定規，等畢業出去作事時，必加倍的賠償。六年後，他到外埠去，主為他預備一點錢，他就跑到郵局兌了一張匯票，用雙掛號信，寄到他原住地的電力公司；一面向他們認罪求饒恕，一面賠償了兩倍的電費。從那天起，他的生命有了長進，在事奉神的事上，也常常經歷不少神蹟奇事。"]]},{"no":228,"t":"償還二十年前電費","b":[["V","因憐憫真實，罪孽蒙遮蓋；因敬畏耶和華，人就遠離惡事。（箴16:6）"],["E","By lovingkindness and truth iniquity is expiated, and by the fear of Jehovah men depart from evil. (Proverbs 16:6)"],["P","有一位弟兄來見李弟兄說，「李弟兄，你幫幫我的忙，我在二十幾年前，偷用人家的電，現在禱告時不平安，你說怎麼辦？」李弟兄就說，「這隻有償還人家，你寫一封信，註明你的姓名及詳細住址，從你偷電那一天起，算一算多少錢，另外加上利息，寫一張現兌的支票，附在信上。」他說這太簡單了，就照著去辦。這一封信到了電力公司，經理看了這信，非常驚奇。有一天，經理對一位王弟兄說，「老王阿，信耶穌真奇妙，你看這一封信，還有一張支票。一個人信了耶穌，將多年前偷電的錢送來了。不是一年前、二年前，而是二十年前偷的電費都還過來了。」王弟兄一看這信，就向那位經理傳福音說，「世界上的人都不誠實，惟有真信耶穌的基督徒，才能這樣誠實。」"],["H","得救的證實與快樂－借恩得救（詩251）"],["L","從前我愚昧，罪惡轄我心，|使我的腳步完全遠離神；"],["L","今被主尋回，能不歡欣？|現今是個罪人蒙主恩！"],["L","（副）我是個罪人蒙主恩！|我是個罪人蒙主恩！"],["L","這是我身分，榮耀歸給神，|我是個罪人蒙主恩！"]]},{"no":229,"t":"又偷又揩","b":[["V","免我們的債，如同我們免了欠我們債的人。（太6:12）"],["E","And forgive us our debts, as we also have forgiven our debtors. (Matthew 6:12)"],["P","有一位替西國教士作飯的大廚師，常常偷他主人的米、面、糖、煤；上市場買菜，也常常揩他主人的錢。明明是一塊錢買的東西，回來開賬成了一元五角；五十元的，回來開賬成了六十五元。因著他能偷能揩，他的太太和兒女的吃穿，可說是小康之家。有一天他得救了，主的光一直光照他，要他向主人認罪。他極其作難，因為若去認罪，就要丟掉飯碗。他想：我偷的那些東西，揩來的那些金錢，早已吃光、用光，那裡有錢賠償呢？然而，聖靈一直在他裡面催促，叫他坐立難安。經過很長時間的掙扎，末了主得勝。他就走到教士那裡，流著淚說，「主人，我對不起你，我常偷你的東西，帶到家裡吃用，上市場買菜也常揩你的油。現在我得救了，想要賠償你，卻沒有錢，請你收下我作你的奴隸吧，把我的身體作賠償你的代價，服事你。」那位教士就對他說，「感謝主，主既然赦免了你，我怎能不饒恕你呢？至於你給我作奴隸，我不敢當，只要你好好愛主就夠了。」後來這位弟兄，帶領不少人得救。"]]},{"no":230,"t":"兩塊銀元","b":[["V","忠信人必多得福；急於發財的，難免受罰。（箴28:20）"],["E","A faithful man will abound with blessings, but he who makes haste to be rich will not go unpunished. (Proverbs 28:20)"],["P","鍾弟兄在得救之前，曾向下屬借了兩塊銀元，一直沒有歸還。因著是上司與下屬的關係，所以他根本不打算歸還。得救後，在一次聚會中蒙了光照，覺得該去了結這事，卻又找不到對象。他就禱告，求主安排。不久，他在路上巧遇這位多年不見的下屬，正是歸還的好機會。那知口袋中的現鈔不夠兩塊銀元的價值；於是，就把手上一錢重的金戒脫下兌換，按市價再加上十元臺幣，償還給他的下屬。他的下屬堅持不收；他見下屬不收，就再加上十元。他的下屬見他如此誠意，只好收下。回家後，他滿了喜樂。過了數日，有位老友來訪，這位老友很久前曾向他借兩錢金子，這次特地先來還他一錢金子。"],["P","所有的虧欠，都必須儘快還清，不然，神無法祝福。"],["H","得救的證實與快樂－生命改變（詩242）"],["L","喜樂滿我心！|滿我心！滿我心！"],["L","喜樂滿我心！|主將我石心，"],["L","換成了肉心；|聖靈來更新，"],["L","使我成為新人：|喜樂滿我心！"],["L","滿我心！滿我心！"]]},{"no":231,"t":"不能代免債務","b":[["V","他的兒女要求窮人的恩惠，他的手要賠還不義之財。（伯20:10）"],["E","His children seek the favor of the poor, and his hands return his wealth. (Job 20:10)"],["P","從前有一個部隊長，下了一道命令，任何官兵都不許向人借錢。後來有個士兵，向另外一個士兵借了幾十塊錢，但無力償還。他就來到長官面前認錯，承認違背長官命令，願意接受長官的處罰，請求長官赦免他的罪過，並要求欠那士兵的錢可以不必還。你看，這個要求，長官能否替另外一個士兵作主，不要他還呢？長官只能赦免那個士兵借錢的罪，但不能替另一個士兵赦免他的債務。"],["P","今天我們虧欠人，一面是得罪人，一面是得罪神；我們不能說得罪了人，虧欠了人，不必向人賠償，只要向神認罪就了事。神不能替別人赦免我們的虧欠。"],["H","得救的證實與快樂－被主釋放（詩244）"],["L","罪惡失權勢，情慾不能羈絆，|今生的憂慮也難再將我纏，"],["L","屬地的捆索也都已被斬斷；|主耶穌已把我釋放！"],["L","（副）"],["L","釋放！釋放！榮耀釋放！|我不再被罪惡捆綁；"],["L","寶血洗淨我，全人明亮、清爽；|主耶穌已把我釋放！"]]},{"no":232,"t":"考聖經帶小抄","b":[["V","你們應當行的是這樣：各人與鄰舍說實話。（亞8:16）"],["E","These are the things which you shall do: Each man speak truth to his neighbor. (Zechariah 8:16)"],["P","倪柝聲曾作見證說，以前他在召會學校讀書，考試每科都考到九十幾分、一百分，平均分數總在九十分以上。然而，他對聖經沒有興趣，總是考不及格。到了第三年，他想：雖然不喜歡讀聖經，但老師每次報告時，總是說某人每科都考得頂好，只有一本書考不好；這豈不是不好麼？所以，就定規要好好的預備。那年考使徒行傳，到了考試時，倪弟兄想這次一定要考得好，所以就用帶小抄的方法，把聖經要點寫在手臂上，用長袖遮著。果然有些題目考對了，但不過考到七十餘分。"],["P","倪弟兄得救後，為了這事很不平安，又不敢去認；因為怕一認錯，老師、校長就要以為他已往考得好的，也都是作弊的。況且學校規定，凡帶小抄的學生要立刻予以開除。他又因某種真理與他們不同，已經不蒙校長喜悅，所以怕這樣被開除後，無臉回家見父母。他心裡作難了好些日子，裡頭一直沒有平安。良心雖可以睡覺，但良心卻不會死；於是，他寫了一封信向校長認罪。事後校長喊他去，對他說，「我代表學校赦免你的罪。」"],["P","每一個不義若不了結，總有一個疤痕在那裡，使良心不能平安。"]]},{"no":233,"t":"假文憑","b":[["V","遵行我的律例，謹守我的典章，按公理行事；這人就是公義的，必定存活；這是主耶和華說的。（結18:9）"],["E","If he walks in My statutes and keeps My judgments to do truth — he is righteous; he shall surely live, declares the Lord Jehovah. (Ezekiel 18:9)"],["P","有一個大學生得救後，想起他考大學的文憑是假的，一連幾天良心不安。於是去見一位傳道人，問他有什麼辦法。傳道人對他說，「你一面要在神的面前認罪，信主的寶血洗罪；一面還得去向校長認罪。」學生說，「我不敢去。」傳道人說，「你要靠著神的能力，去向校長認罪；必須這樣認罪，良心才會平安。」於是，和他兩人一同跪下禱告。第二天，學生就去見校長，誠實的承認假文憑的罪。校長很受感動，說，「我們知道很多學生的文憑都是假的，只有你信主耶穌，才會前來承認，所以我饒恕你，現在只罰你降一級。」這位學生很喜樂，再去見傳道人時，臉上的喜樂證明他的良心已經平安。"]]}]},{"n":"奉獻","i":6,"intro":[["V","因為你們是重價買來的。這樣，就要在你們的身體上榮耀神。（哥林多前書六章二十節）"],["E","For you have been bought with a price. So then glorify God in your body. (1 Corinthians 6:20)"]],"a":[{"no":234,"t":"奉獻的意義","b":[["V","所以弟兄們，我藉著神的憐恤勸你們，將身體獻上，當作聖別並討神喜悅的活祭，這是你們合理的事奉。（羅12:1）"],["E","I exhort you therefore, brothers, through the compassions of God to present your bodies a living sacrifice, holy, well pleasing to God, which is your reasonable service. (Romans 12:1)"],["P","奉獻自己乃是我們蒙恩的人，對主救恩一個積極的反應。我們將自己奉獻給主，就是讓主得著我們，作我們對祂的還報。我們將自己奉獻給主的根據，是主用祂的血作重價買了我們，我們就成了祂所買的奴僕。（林前六19～20。）我們信主，蒙主救贖所買的人，乃是主所買的奴僕，不再是屬自己的，乃是屬於主的。主權不在我們，乃在主。我們為主所贖、所買，既是屬於主的，我們或活或死，總是祂的人。（羅十四8。）這是我們把自己奉獻給祂，歸祂使用的根據。"],["P","再者，我們將自己奉獻給主，也是因為祂的愛睏迫、激勵我們。主的愛逼著我們，不能不把自己奉獻給祂。因為祂替我們眾人死，我們眾人就都死了；並且祂死，是為叫我們得著祂的生命，向祂活著。這個愛激勵我們，逼著我們愛祂，將自己奉獻歸祂，作我們對祂大愛的感激、還報。（林後五14～15。）"],["P","我們將自己獻給主，是將自己獻給主作活祭，（羅十二1，）這不像舊約的人，獻牛羊犧牲給神作祭物。我們這樣獻上自己作活祭，乃是聖別的，是將自己分別出來，歸主使用；也是討神喜悅，滿足神心願的。（生命課程）"]]},{"no":235,"t":"基督徒的理財","b":[["V","叫我們既從仇敵手中被救出來，就可以一生一世在祂面前，坦然無懼的用聖和義事奉祂。（路1:74-75）"],["E","To grant us that we, having been delivered out of the hand of our enemies, might serve Him without fear, in holiness and righteousness before Him all our days. (Luke 1:74-75)"],["P","自從人墮落，和神出了問題，離棄以神作人一切的地位後，人便落到一種黑暗中：只認財物，不認神；只知倚靠財物，不知倚靠神，甚至事奉財物，以財物為神，讓財物頂替了神。然而，我們得蒙主的救恩，使我們從撒但的權下轉向神。故此，我們應當轉變對待財物的存心和態度。"],["P","聖經給我們看見，生活中一切物質的享受，表面是來自錢財，實際都是神豐富的賜與、供給的。所以，不要寄望於那無定的錢財，乃要寄望於那將百物賜與我們，給我們享受的神。（提前六17。）其次，奉獻財物乃是撒種，（林後九10，）這種子是神所供給，由神而來的；我們乃是將神賜給我們的，奉獻給神。主還說，不要為自己積蓄財寶在地上，只要積蓄在天上。（太六19～20。）我們需要把財物積蓄在天上，如濟助有需要的人，與他們結交朋友，推廣福音等。我們這樣作，在善事上富足，甘心分授，樂意與人同享，就為自己積存美好的根基作寶藏，叫我們持定那永遠的生命。（提前六18～19。）"],["P","我們若肯為著神，將我們的財物分賜施與有需要的人，神就必定也有所給我們的。（路六38。）我們將應當給神的，全然奉獻給祂，使召會有豐富的供應，神就必為我們敞開天上的窗戶，傾福與我們。（瑪三10。）（生命課程）"]]},{"no":236,"t":"財物奉獻的實行","b":[["V","各人要照心裡所酌定的，不要作難，不要勉強，因為神喜愛樂意施與的人。（林後9:7）"],["E","Each one as he has purposed in his heart, not out of sorrow or out of necessity, for God loves a cheerful giver. (2 Corinthians 9:7)"],["P","在財物奉獻的實行上，我們可以為著四方面有奉獻：第一是為著召會的需要，如同舊約的百姓，為帳幕和聖殿奉獻遮罪銀。（出三十11～16。）第二是為著推廣福音。（腓一5。）第三是為著供給主的僕人，如腓立比人供給保羅的需要。（四15～16。）那善於帶領召會的長老，和那在神的話語上勞苦教導人的，信徒也當用財物供給他們。（提前五17。）第四是為著供給有需要的聖徒，在聖徒缺乏上有交通，（羅十二13，）也當記念窮人。（加二10。）"],["P","我們也要看見，最蒙神悅納的財物奉獻，是應當先把自己獻給主，和關心我們的使徒，再有分於這樣的恩典和交通。正如馬其頓的眾召會，在財物供給猶太缺乏聖徒的事上所作的。（林後八4～5。）此外，我們奉獻財物給神，無論為著什麼用途，都不可行在人前，故意給人看見，要得人的榮耀，從人得到賞賜；這樣，就不能得在諸天之上父的賞賜。乃要作在隱密中，由天父看見，而報答我們。（太六1～4。）"],["P","信徒奉獻財物，在神眼中是極有價值的。原來在神眼中看為「不義」、「無定」的錢財，經過我們屬神的人，將它奉獻給神，為神使用，會成為我們與聖徒的「交通」，（林後八4，）我們在神面前對人的「義」，（九9，）也成為神所悅納的「祭物」，（來十三16，）並神所喜悅的「香氣」。（腓四18。）（生命課程）"]]},{"no":237,"t":"站在奉獻盤上","b":[["V","因我所尋求的不是你們的東西，乃是你們自己。（林後12:14）"],["E","For I do not seek what is yours but you. (2 Corinthians 12:14)"],["P","有一次，在一個大聚會中，釋放了往國外傳福音的信息。許多人聽了深受感動，於是開始奉獻財物，作為國外佈道之用。奉獻完畢，收納奉獻的執事們退到聽眾的後面。這時，有個約十歲左右的孩子，名叫達福亞歷山大，也在會中。他深受感動，但沒有錢奉獻。於是他就離座，走到拿奉獻盤的執事面前，請他將盤子放在地上。執事莫名其妙，但照他所說的，將盤子放在地上。達福竟站在盤子上，說，「神阿，我奉獻我自己。」那天起，他從來沒有退後和改變，後來果然成為傳道人。保羅說，「我所尋求的不是你們的東西，乃是你們自己。」（林後十二14。）神的旨意乃是要我們先把自己獻給主。"]]},{"no":238,"t":"我沒有手","b":[["V","祂在木頭上，在祂的身體裡，親自擔當了我們的罪，使我們既然向罪死了，就得以向義活著。（彼前2:24）"],["E","Who Himself bore up our sins in His body on the tree, in order that we, having died to sins, might live to righteousness. (1 Peter 2:24)"],["P","人不論作什麼，都不能離開身體。拿東西要用身體，走路要用身體，出門要用身體；神為拯救世人，也曾給主預備了一個身體，掛在木頭上，親身擔當了人的罪。我們學習事奉主的人，也是需要身體，但我們的身體肯不肯獻給主用呢？有一個人禱告說，「主阿，我的朋友不信你，求你用你的手刺他的心，叫他信主。」主說，「我沒有手，用你的手刺他吧。用你的腳走到他那裡，用你的口勸他。」根據羅馬十二章，我們獻上身體為著召會生活是很實際的：首先，時間必須分別出來；其次，身體需要實際的來到聚會中，或出外看望、拜訪人。這樣，主才能藉著我們這些流通的管道，將生命供應給人。"],["H","奉獻－全都獻主（詩339）"],["L","主，你得著我一生，|使它歸你成為聖；"],["L","得著我日與我時，|歸你使用永無止。"],["L","（副）"],["L","為我荊棘冠冕你肯戴，|為我釘死苦架你受害；"],["L","為你我願獻上我命與我愛，|事你、愛你到萬代。"]]},{"no":239,"t":"只要預備屋子","b":[["V","逾越節前六日，耶穌來到伯大尼，就是祂從死人中所復活的拉撒路所在的地方。有人在那裡為耶穌預備晚宴。（約12:1-2）"],["E","Then Jesus, six days before the Passover, came to Bethany, where Lazarus was, whom Jesus had raised from the dead. Therefore they made Him a supper there. (John 12:1-2)"],["P","在美國西北部有對宣教士夫婦，有一天，他們向一對印第安人夫婦詢問，可否到他們家中用飯。那位印第安人覺得有點為難，說他們沒有好菜，只有一點魚。宣教士就說，只要把小屋預備乾淨就可以。到了所定的日子，宣教士夫婦就到那位貧窮的印第安人家裡，帶著許多好東西，有茶、咖啡、糖、麵包、芋頭，以及他們從來沒有見過的奶油和點心；他們就一同吃喝快樂。宣教士作了實際的主人，窮苦的印第安人也吃到從來沒有吃過的東西。"],["P","我們接待主耶穌也像這樣。我們歡迎祂到我們卑賤的家中，將我們所有的為祂擺上，雖然我們所有的沒有什麼可誇耀的，祂卻歡喜接受，並將祂最好的賜給我們。祂接受我們所奉獻的，並將自己的富足賜給我們。"]]},{"no":240,"t":"刀、碗、馬、自己","b":[["V","他們…憑著神的旨意，先把自己給了主，也給了我們。（林後8:5）"],["E","They gave themselves first to the Lord, and to us through the will of God. (2 Corinthians 8:5)"],["P","從前美國土著的印第安人，大多是在樹林裡狩獵過生活；所以，他們最寶貴的就是吃飯喝水用的碗、刀、或者來福槍。有了這些東西，他們就可以到處生活。一天，有一個人到他們村裡來傳福音。他們中間有個酋長，十分專心聽講。當傳道人說到主耶穌怎樣離開天家，為愛罪人來到世上，這位酋長就興起愛慕耶穌的心。他離開座位，走到傳道人面前說，「我將我的刀獻給耶穌。」以後，他又聽到主耶穌怎樣在世為人，「祂本來是富足的，卻為我們成了貧窮，叫我們因祂的貧窮，可以成為富足。」他就第二次起來，走到傳道人那裡說，「我要將我的碗獻給耶穌。」他再聽到惡人怎樣怨恨耶穌，怎樣逼迫祂，想要殺害祂；主耶穌怎樣的好，怎樣的慈愛，反倒被人恨惡。他就牽了他的馬來，到傳道人面前說，「我將我的馬給主耶穌。」他還能再獻什麼？他已獻上他所最貴重、最有用的一切了。他仍然回座繼續聽講，聽到主耶穌怎樣被辱罵，受鞭打，頭戴荊棘冠冕，最終被人釘在十字架上，兵丁用槍扎祂的肋旁；祂怎樣為人的罪捨身，怎樣為這可憐的印第安人的罪死在十字架上。這位酋長落下了兩行熱淚，跑到傳道人面前說，「我將我自己獻給主耶穌。」"],["P","這正是主耶穌所要的。或許你已獻上許多金錢、時間、力量、以及許多別的東西給主耶穌；但是，你將自己獻給祂了沒有？"]]},{"no":241,"t":"「讓交」才能佔有","b":[["V","你們從前怎樣將肢體獻給不潔不法作奴僕，以至於不法，現今也要照樣將肢體獻給義作奴僕，以至於聖別。（羅6:19）"],["E","For just as you presented your members as slaves to uncleanness and lawlessness unto lawlessness, so now present your members as slaves to righteousness unto sanctification. (Romans 6:19)"],["P","有一所女子學校，因為學生增加，必須擴充校舍，便向毗連學校的一戶人家買下他們的房子；經過多次議價終於成功。立完契約，錢也付清了。然而到秋季開學時，學校仍然沒有辦法使用新購置的房舍，因為這戶人家還沒有將房屋讓出。購買給予主權上的名義，惟有「讓交」才能實際的佔有。主用重價買了我們，只有我們完全奉獻（讓交）給祂，才能讓祂實行使用權。"],["H","奉獻－全都獻主（詩340）"],["L","完全的交出，主，我今願|完全的交出，交在你前。"],["L","所有擺在祭壇，所有全都奉獻，|你已贖我罪愆，我今歸你。"]]},{"no":242,"t":"賣房不讓","b":[["V","豈不知你們的身體，就是在你們裡面之聖靈的殿麼？這聖靈是你們從神而得的，並且你們不是屬自己的。（林前6:19）"],["E","Or do you not know that your body is a temple of the Holy Spirit within you, whom you have from God, and you are not your own? (1 Corinthians 6:19)"],["P","有一次，在韓國的基督徒聚會中，有位弟兄題到一件事情，請問大家的感覺。他說，有一家人，賣了一所房子，契約也立了，錢也付了，但到了時候卻不交屋。請問這事應該如何處理？各人紛紛舉出理由，沒有一人滿意這個舉動。那時這位弟兄就說，請大家不要覺得希奇，其實這位房主就是我們。主耶穌基督已經用血買了我們，我們已經歸在祂的名下，但我們卻不肯把我們自己這個房子，就是我們的身體獻上，讓給主用；這和那位霸佔房子，不講理的房主，有什麼兩樣呢？"],["H","奉獻－迴轉歸主（詩354）"],["L","我豈可再冷淡退後，|使神聖靈終日擔憂，"],["L","恩主也在等候！|我今願意轉身回頭，"],["L","不再留戀，不再逗遛，|就此跟主而走！"]]},{"no":243,"t":"歸榮耀給母親","b":[["V","因為你們是重價買來的。這樣，就要在你們的身體上榮耀神。（林前6:20）"],["E","For you have been bought with a price. So then glorify God in your body. (1 Corinthians 6:20)"],["P","有一位大學畢業生，全靠著他母親的勞苦節儉，才得大學畢業。畢業典禮的前一天，他回家去見他的母親，請求她去參加畢業典禮。他母親推說，「好兒子，我沒有好衣服穿，穿了破衣服去，要丟你的臉。」兒子說，「媽媽，我能有今天，都是您的功勞，都是您的榮耀。儘管去吧！」兒子百般的相勸，才得母親同意。次日早晨，禮堂中擠滿了人，個個衣著光鮮，男女同學個個精神奕奕。在禮堂大門口，一個穿著禮服，頭戴方帽的畢業生正迎著他的母親。人人看見他手攙著一位貧窮的老太太進來，又坐在禮堂的頭一排座位上，無不驚奇。原來這位大學畢業生，在同班的幾十人中考得第一名，所以要代表全班上臺演說。在他的畢業演說中，他述說他的母親，如何辛苦節儉，供給他的需要，鼓勵他的學業，說時誠摯感人。等到校長頒發文憑及獎品的時候，那位大學畢業生又走下臺去，扶著他的母親走上臺，把文憑和獎品，恭恭敬敬的放在母親手中說，「母親，這一切都是你的功勞。」全場來賓、高官顯要、男女同學看見這事，都大受感動，鼓掌歡呼，甚至熱淚盈眶。"],["P","主耶穌為我們成了貧窮，祂為我們一生勞苦，最後為我們釘死流血；所以，我們當將自己的身體獻上，在我們的身體上榮耀神。"]]},{"no":244,"t":"鐵路穿過花園","b":[["V","在各樣善事上成全你們，好實行祂的旨意；祂是在我們裡面，藉著耶穌基督，行祂看為可喜悅的事。（來13:21）"],["E","Perfect you in every good work for the doing of His will, doing in us that which is well pleasing in His sight through Jesus Christ. (Hebrews 13:21)"],["P","美國有一位總統伽菲爾德，遇刺受了重傷，被安全人員安置在荒村中的一間屋子裡。為了便利醫生、護士、醫藥器材和親友的照護，工程人員臨時架了一條輕便鐵道。然而，當鐵道要穿過一位老農夫的花園時，遭到強烈的拒絕。工程人員就對老人解釋，這條鐵道是為了總統的緣故。他聽見後很驚訝的說，「為了總統？這可不同了。你們甚至可以從我的屋子裡穿鑿過去。」"],["P","神也許像這位美國總統的需要一樣，正要穿過你的計劃，穿過你在社會上的機會，穿過你在商場上的約定；你肯讓祂通行無阻麼？你知道麼，讓給神一個次要的地位，就等於不讓給神任何地位。"]]},{"no":245,"t":"冠冕放在主腳前","b":[["V","只是從前我以為對我是贏得的，這些，我因基督都已經看作虧損。（腓3:7）"],["E","But what things were gains to me, these I have counted as loss on account of Christ. (Philippians 3:7)"],["P","一位英國的主教，有一次向維多利亞女王，傳講基督第二次再來的信息。女
