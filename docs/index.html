王說，「我是何等願意，當我還在位時，祂就來呢。」主教問她為何有這心願。女王答說，「因為我樂意把我的冠冕放在祂的腳前。」"],["P","今天你願意把你的冠冕，你所看為尊榮寶貴的人、事、物，放在主耶穌的腳前麼？"],["H","敬拜父－祂的救贖（詩40）"],["L","神，我們感謝你，|為那榮耀之冠，"],["L","並非只有一時美麗，|轉眼即已枯殘，"],["L","乃是像寶座不朽到永遠，|樂哉，能向寶座投下所有冠冕。"]]},{"no":246,"t":"傷殘廢死","b":[["V","把這一切全燒在壇上，當作燔祭，獻與耶和華為怡爽香氣的火祭。（利1:9）"],["E","Burn the whole on the altar, as a burnt offering, an offering by fire, a satisfying fragrance to Jehovah. (Leviticus 1:9)"],["P","義大利的革命領袖加里波特，有一次對千萬的青年演講，鼓勵他們為祖國的自由而參戰。有一個膽小的青年問他說，「先生，我若參戰，可以得到什麼賞賜呢？」加里波特敏捷而堅定的回答說，「傷、殘、廢、或者死亡！但是，要記得，義大利會因你的傷殘而得著解放。」"],["P","奉獻是把自己擺在壇上，焚燒成灰，而讓馨香之氣達到神的面前。"],["H","奉獻－同主爭戰（詩351）"],["L","我是否要揹負十架，|跟從神的羔羊？"],["L","我豈可以怕出代價，|要得世界原諒？"],["L","（副）因你名，寶貴的名，|因你為我捨命，"],["L","靠恩，無論如何艱難，|我要求你喜歡。"]]},{"no":247,"t":"粗柴刻成名作","b":[["V","我們原是神的傑作，在基督耶穌裡，為著神早先預備好，要我們行在其中的善良事工創造的。（弗2:10）"],["E","For we are His masterpiece, created in Christ Jesus for good works, which God prepared beforehand in order that we would walk in them. (Ephesians 2:10)"],["P","有一位藝術家，遍處搜尋特種名貴的木材，準備雕刻出他最得意的傑作。經過了若干年卻沒有著落，他就心灰意冷，打算放棄。有一天晚上，他突然靈機一動，可用爐邊的一根粗柴進行雕刻，他便立刻開始工作。後來，就從那塊準備當作柴燒的樹幹，雕刻生出傑作來。"],["P","任何一個窮困、貧賤、出身平凡的人，若肯將自己交在主的手中，必被雕刻成為神的傑作。"],["H","奉獻－降服主（詩344）"],["L","照你企圖，主，照你企圖，|因你是陶人，我是泥土："],["L","製造又甄陶，照你美意；|降服且等候，使我歸依。"]]},{"no":248,"t":"垃圾堆中的石頭","b":[["V","窯匠難道沒有權柄，從同一團泥裡，拿一塊作成貴重的器皿…麼？（羅9:21）"],["E","Or does not the potter have authority over the clay to make out of the same lump one vessel unto honor…? (Romans 9:21)"],["P","有一天，義大利的藝術大師米開朗基羅，走在弗羅倫斯城的馬路上，看見路旁垃圾堆中有一塊大理石，不知是被那位雕刻家或工人雕壞了而棄之不用。米開朗基羅對這塊潔白的大理石發生了興趣，走上前去仔細端詳，尋思一會兒後，覺得這塊石頭雖然已被雕壞，但是棄之實在可惜，於是吩咐工人把它搬了回去。後來，米開朗基羅聞世的傑作「大衛像」，就是用那一塊垃圾堆中的石頭雕成的。"],["P","照樣，我們只是垃圾堆中的一塊廢物，只要肯放在造物主的手中，祂就會使我們成為祂的傑作。"],["H","奉獻－得著萬有（詩355）"],["L","起來！將這交易算看：|零碎換來整個－"],["L","萬事、萬物、加上萬人，|竟都歸你得著。"],["L","當你屬祂，萬有屬你，|並且祂你合一；"],["L","你還得享無限生命，|權益有何能比！"]]},{"no":249,"t":"房主是誰","b":[["V","且要在那些蒙憐憫、早預備得榮耀的器皿上，彰顯祂榮耀的豐富。（羅9:23）"],["E","In order that He might make known the riches of His glory upon vessels of mercy, which He had before prepared unto glory. (Romans 9:23)"],["P","我們都知道，房主是什麼樣的人，房子就會作什麼用途。一所房子的名稱，常是跟著房主變更的。若是房主是個愛跳舞的人，他這所房子可能就要變作舞廳；若是房主是個嗜賭的人，這所房子可能就會變作賭場；若是房主是個好酒的人，他這所房子或許就會變作酒廊。同樣的，若是房主是個敬畏神的人，他這所房子就要變作聚會所了。"],["P","如果你把你的這所房子，就是你的身體，奉獻給主；你作房子，主耶穌作房主，你就要像主耶穌，你的生活就能彰顯主。"],["H","奉獻－降服主（詩344）"],["L","照你企圖，主，照你企圖，|深願我全人向你降服："],["L","聖靈充滿我，流露你命；|基督活於我，彰顯你形。"]]},{"no":250,"t":"牛奶女郎的幻想","b":[["V","看哪，我來了，神阿，是要實行你的旨意。（來10:7）"],["E","Behold, I have come to do Your will, O God. (Hebrews 10:7)"],["P","有一個擠牛奶的女郎，頭上頂著一桶牛奶，要上市場去賣。她一面走，一面心裡打著如意算盤：「我賣掉牛奶，得到的錢就向鄰居買幾隻小雞，小雞長大後，每天所下的蛋賣給人，再把賣蛋的錢，拿去買一件我最喜歡的綠色衣服，穿上這件衣服，我就成了一個漂亮的人了。這時，許多的青年人都會來追求我，要我作他們的伴侶，然後他們會爭起來。這時，我就裝作看不上他們，他們追求越熱烈，我就越輕視他們；走在他們面前，故意把頭一揚，向天看…。」當她這樣一想時，那桶牛奶立即跌落下來，牛奶流瀉滿地。她一切的幻想便落空了。"],["P","當我們把自己奉獻給主以後，豈不也是常常在作屬靈的幻想：「要為主如何的熱心，如何的傳福音，如何的服事弟兄姊妹們，如何成為屬靈大漢。」奉獻乃是讓主作工，不是幻想如何為主作工。"]]},{"no":251,"t":"無可指摘的信","b":[["V","若有人愛神，這人乃是神所知道的。（林前8:3）"],["E","If anyone loves God, this one is known by Him. (1 Corinthians 8:3)"],["P","考門夫人作見證說，有一次，她被邀去處置她所最愛的一位姊妹的遺產。在那位姊妹所看為特別珍貴的物件中，有一封信是考門夫人七歲時寫給她的。先是她因訪友離家出外；考門夫人極愛她，又因她走的時候考門夫人沒有見著她，以致很想念她；那封信就是藉著文字，表達考門夫人心中的友愛。這封信絕非「無瑕無疵」，不僅文法不通，並且拼字錯誤，卻因是出於考門夫人的愛心，盡其所能而寫成，所以當時在已故的姊妹眼中，是「無可指摘」的。"],["P","神不是看我們的好壞，乃是看我們對祂的愛有多少。"],["H","奉獻－跟隨主（詩345）"],["L","我當如何愛我的主？|如何奉獻使祂歡喜？"],["L","不稍離開祂的道路，|學習如何與祂親密？"]]},{"no":252,"t":"你屬於神","b":[["V","我屬我的良人，我的良人也屬我；他在百合花中牧放群羊。（歌6:3）"],["E","I am my beloved's, and my beloved is mine; he pastures his flock among the lilies. (Song of Songs 6:3)"],["P","有人請問神的僕人腓力奉獻的經驗，他說，「當我十四歲時，曾聽人講道，題為『你屬於神』，大受感動。回家後立刻關上房門，仆倒在地，禱告說，『神阿！我原屬你，叫我遇見該行的義事時，不需要勇氣就去作；遇見不該行的惡事時，使它永無試誘的力量能壓倒我。』從那晚起，神就保守我一直如此。我今屬主，主亦屬我，非暫時數年，乃是永遠。」"],["H","主阿，我愛你（補327）"],["L","主阿！我愛你，|我實在深愛你，"],["L","無你活著枉然、失意。|你是富有吸引，"],["L","極其引人著迷，|你的豐富追測不盡。"],["L","我主名何甜蜜，|呼求叫人滿意，"],["L","主，你屬我；主，我也屬你。|聯結調和於你，"],["L","神人合併為一，|預嘗新耶路撒冷實際。"]]},{"no":253,"t":"放下背叛的心","b":[["V","這百姓用嘴唇尊敬我，心卻遠離我；他們敬拜我也是徒然。（太15:8-9）"],["E","This people honors Me with their lips, but their heart stays far away from Me; but in vain do they worship Me. (Matthew 15:8-9)"],["P","法西尼是羅馬屬國的一個王子，他背叛了羅馬皇帝該撒，卻送給他一隻冠冕。該撒拒絕這禮物，說，「他要先放下背叛的心，然後我才肯接受他的冠冕。」照樣，許多人在口頭上給基督不少的冠冕，但在生活中卻失去愛主的見證。這就像編了一頂荊棘冠冕，戴在主頭上。所以主說，「你們不要再帶虛浮的供物來；…是我所憎惡的…；我不能容忍。」（賽一13。）又說，「這百姓用嘴唇尊敬我，心卻遠離我；他們敬拜我也是徒然。」"],["H","奉獻－走主道路（詩349）"],["L","眾人都慕得主榮耀，|羞辱少人要；"],["L","眾人都愛同主掌權，|損失有誰願？"],["L","幾乎無人因主緣故，|看萬事如土！"]]},{"no":254,"t":"同死的奉獻","b":[["V","我們若在祂死的樣式裡與祂聯合生長，也必要在祂復活的樣式裡與祂聯合生長。（羅6:5）"],["E","For if we have grown together with Him in the likeness of His death, indeed we will also be in the likeness of His resurrection. (Romans 6:5)"],["P","有一位弟兄年輕時，曾一再嘗試要把自己完全交給主，卻屢試屢敗。他雖然完全真誠，但因失敗，便十分苦惱。最後他從「抹在祭司耳垂上、大拇指上、和腳指頭上的血」（參出二九20～21）這話，得到亮光，因而改變了他整個奉獻的觀念。他明白他與基督由死而生的聯合，解決了他奉獻的難處。「我們若在祂死的樣式裡與祂聯合生長，也必要在祂復活的樣式裡與祂聯合生長。」"],["H","與基督的聯合－聯於祂死與復活（詩364）"],["L","與主同葬，也一同復活，|還有什麼留給我去作？"],["L","只要我不再奮鬥擊空，|只要我照新生而舉動。"],["L","榮耀歸於神！"]]},{"no":255,"t":"單程票","b":[["V","也不要將你們的肢體獻給罪作不義的兵器；倒要像從死人中活過來的人，將自己獻給神，並將你們的肢體獻給神作義的兵器。（羅6:13）"],["E","Neither present your members as weapons of unrighteousness to sin, but present yourselves to God as alive from the dead, and your members as weapons of righteousness to God. (Romans 6:13)"],["P","韓國有一位亞漢小姐，曾與神辯論達七年之久；她不願前往日本傳道。因為他們逼迫基督徒，又跪拜神龕。然而，至終神征服了她。當她最後服從神的呼召時，她放棄了一切，買了一張單程票到東京，以表明她願意順服神的呼召，一直到死，也不回頭。是的，她再也沒有回韓國。我們若是害怕壇上的火和獻祭的刀，就當求神用祂的慈繩愛索緊緊縛住我們，免得我們走到一個羞恥的結局；並且使我們不再為肉體打算，不再從十字架上下來拯救自己，而成為一個永遠的燔祭。"],["H","奉獻－跟隨主（詩345）"],["L","是的，我算萬事為損，|為要來得你的注意；"],["L","丟棄萬事雖如土糞，|為著愛你有何可惜？"]]},{"no":256,"t":"木樁為證","b":[["V","我們若活著，是向主活；若死了，是向主死。所以我們或活或死，總是主的人。（羅14:8）"],["E","For whether we live, we live to the Lord, and whether we die, we die to the Lord. Therefore whether we live or we die, we are the Lord's. (Romans 14:8)"],["P","在一次野外的聚會裡，有一位弟兄願意把自己奉獻給神。他每天晚上都禱告奉獻自己；但是每天晚上在他離開聚會前，撒但就來控告他：「你的感覺並沒有什麼不同，一定是神沒有接受你的奉獻。」一次過一次，他就這樣被仇敵擊退了。最後一晚，他來赴會時，帶了一把鐵錘，和一根長木樁。他把自己奉獻以後，就將木樁釘入他所跪的那塊地上。當他走出會場時，撒但又來引誘他相信，一切不過是一幕戲而已。他立刻回到木樁那裡，指著木樁說，「撒但，你看見這根木樁麼？這就是我的證人，證明神已經永遠接受了我。」撒但立即離開了他。這位弟兄對於這個問題，以後再也不疑惑了。"],["P","從我們交給主那天起，不管我們的感覺如何，外面的環境如何，我們都得承認，我們已是在主手中的人了。"]]},{"no":257,"t":"獻上青春","b":[["V","然而，即使我成為奠祭，澆奠在你們信心的祭物和供奉上，也是喜樂，並且與你們眾人一同喜樂。（腓2:17）"],["E","But even if I am being poured out as a drink offering upon the sacrifice and service of your faith, I rejoice, and I rejoice together with you all. (Philippians 2:17)"],["P","有一個青年姊妹，住在鄉間，未曾受過多少造就，也不知道什麼叫作奉獻。一天早晨，她正在家中走廊欣賞一朵玫瑰花，看得出神，想把這朵尚未開放的花剪下，插在自己身上。因為再過幾日，花開放了，香味就沒有了，花瓣也脫落了，顏色也不鮮豔了。當她停在花前深思時，她的裡頭有一個清晰微小的聲音說，「我要你的青春，正如你喜悅這朵花一樣，不要等你年老了，臉帶皺紋，暮氣沉沉，才獻給我。你肯不肯現在就把你自己獻給我呢？」她因受主愛的激勵，立即答應主說，「主阿！我願意從現在起，把我的青春完全奉獻給你，讓你欣賞，供你使用。」這位姊妹後來服事主超過二十年，成了主所重用的一個僕人。"],["P","當你讀到這裡，若在主前俯伏禱告說，「主阿，我在這裡，你要我奉獻給你麼？」主就要在你的最深處，向你說出親密的話，使你能更完全的將自己奉獻給祂。"]]},{"no":258,"t":"女孩奉獻父親得救","b":[["V","所獻麵糰的頭一部分若是聖的，全團也是聖的；樹根若是聖的，樹枝也是聖的。（羅11:16）"],["E","Now if the dough offered as the firstfruits is holy, the lump is also; and if the root is holy, the branches are also. (Romans 11:16)"],["P","在印度有個小女孩來見傳教士，說，「好不好讓我作一件事？」「作什麼事？」「我要把自己送給你，因為我愛你。」說著就跪在地上，把兩手放在傳教士的手中，再說一次：「我把自己送給你。」過不多久，她問傳教士如何可以把自己獻給主耶穌。傳教士說，「你可以把自己奉獻給主耶穌，像你把自己送給我一樣。」她立刻跪下，握住雙手，望天禱告說，「主耶穌阿，我把自己獻給你，因為我愛你。」"],["P","這個女孩的父親住在很遠的地方，個性兇殘剛硬，不肯聽信神的福音；她常常為他禱告。有一天，她問傳教士，怎樣可以救他。傳教士說，「可以寫信給他，告訴他你已經把自己獻給了主耶穌，請他也這樣作。」她流了不少眼淚，禱告了好多次，才把信寫好寄出去。一天一天過去，但什麼消息也沒有。她想爸爸接到信之後必定很生氣，再見面時免不了要受責罰。然而有一天，爸爸步行了一百五十哩路，來見傳教士，淚流滿面，請求傳教士給他施浸，並說他來要把自己獻給主耶穌。這個粗魯、兇殘、剛硬的罪人受了浸，把自己獻給主耶穌，竟然變成一個謙卑的人，一生跟隨主，為主作見證。"],["P","我們是否也願意讓主得著我們，好讓祂使用我們，去得著別人呢？"]]},{"no":259,"t":"我給你，你給我","b":[["V","你要大大張口，我就給你充滿。（詩81:10）"],["E","Open your mouth wide, and I will fill it. (Psalm 81:10)"],["P","在一個青年聚會裡，有位青年人作見證，說出他基督徒生活中一個大轉變的經歷。從那大轉變起，他才真正體會神的每一個應許，都是千真萬確的。他說，「有一段時間，我知道自己的屬靈生命沒有絲毫的進展。正在心灰意冷的時候，有一天，我獨自跪在一個安靜的地方喊著：『主阿，加利利的主，客西馬尼的主，各各他的主阿，我願意將自己並一切所有的，都奉獻給你，求你照你的應許，將你和你所有的都賜給我。』」他的禱告肯定，所得的迴音也肯定。"],["P","一個將自己完全讓給主的人，才配向主討重價；討重價的人，才能叫神一切所充滿的，充滿他。"],["H","充滿我（兒211）"],["L","充滿我！充滿我！|願主聖靈充滿我；"],["L","將我倒空，將我剝奪，|願主聖靈充滿我。"]]},{"no":260,"t":"只算代價不算損失","b":[["V","人為我和福音，撇下房屋、或是弟兄、姊妹、母親、父親、兒女、田地，沒有不在今世得百倍，就是房屋、弟兄、姊妹、母親、兒女和田地，同各樣的逼迫，且要在來世得永遠生命的。（可10:29-30）"],["E","There is no one who has left house or brothers or sisters or mother or father or children or fields for My sake and for the gospel's sake, but that he shall receive a hundred times as much now at this time, houses and brothers and sisters and mothers and children and fields, with persecutions, and in the coming age, eternal life. (Mark 10:29-30)"],["P","有兩位青年在一起談論，其中一個說，「我講不出主耶穌對我是何等寶貴，祂為我作了何等大的事，我真盼望你也加入基督的軍隊。」另一個說，「我正在那麼想，但是這樣一來，可要撇下好些東西，所以我得計算一下代價。」當時有一個基督徒，聽見這話，就插進去說，「青年人阿，你只會盤算跟隨主的代價，但你有否計算過，若不跟隨主，你的損失是何其大呢？」這句話一直抓住那個青年人，使他在餘下的日子忠心跟隨主，作了基督的精兵二十七年，跑完當跑的路程。"]]},{"no":261,"t":"輸血割肉","b":[["V","祂替眾人死，是叫那些活著的人，不再向自己活，乃向那替他們死而復活者活。（林後5:15）"],["E","He died for all that those who live may no longer live to themselves but to Him who died for them and has been raised. (2 Corinthians 5:15)"],["P","有一箇中國貧婦，手臂上長了毒瘤，病情嚴重，住在醫院裡。一位西國護士把主耶穌介紹給她，但她不肯接受。醫生對她說，如果有人肯為她輸血割肉，補在她枯乾的手臂上，就有希望。她便叫了自己的兒子來，問他是否願意輸血割肉。他竟拒絕了。婦人悲傷絕望的哭泣起來。那位西國護士見她哭泣，願意把她的血與肉給她。婦人極受感動，雖然不願這位護士忍受這樣大的犧牲，但仍是行了輸血割肉的手術。此後，她就漸漸好起來，終於痊癒，一片白色皮膚，長在患過毒瘤而被割去的地方。有一天，那位西國護士見她又在流淚，便問她何故？她說，「我一看見這片白色皮膚，便想到你把你的血與肉給了我，醫治了我的病。你為什麼肯這樣作呢？」那位護士回答說，「只是為了主耶穌的緣故，因為祂把祂的生命給了我。」這位婦人聽了又哭起來，抬頭說道：「我要信你的耶穌，我自己的兒子都不肯救我的命，但是耶穌竟然使你這樣愛我，我要信祂。」這位婦人因而接受了基督。"],["P","當我們想到主耶穌的血為我們流出，身體為我們裂開，使我們得著拯救，我們也當被這受死的愛激勵，將自己的身體獻上，當作活祭。"]]},{"no":262,"t":"為我你舍何情","b":[["V","原來基督的愛睏迫我們，因我們斷定：一人既替眾人死，眾人就都死了。（林後5:14）"],["E","For the love of Christ constrains us because we have judged this, that One died for all, therefore all died. (2 Corinthians 5:14)"],["P","有一個畫家，畫完一幅耶穌釘十字架的畫後，又替一位女孩畫像。當他正在專心繪畫時，那位女孩看到那幅耶穌釘十字架的圖畫，心裡覺得非常驚奇，為何這位慈顏悅色的人，竟被釘在十字架上？因此便問那個畫家。那個畫家只好停下他的畫筆，把耶穌釘死十字架，拯救罪人的事，從頭到尾講給她聽。這位女孩很受感動，流淚問道：「祂為你舍了性命，你為祂舍了什麼呢？」這位畫家聽了這話，覺得非常扎心，就把這句話題在畫旁：「我為你舍了性命，你為我捨去什麼？」這畫後來陳列在一個展覽館裡。那時，有一個年輕的伯爵，名叫新生鐸夫，前往展覽館參觀，看見這幅圖畫，大受感動，久立呆望不去。畫上所題的話，深深打動了他的心。這位伯爵後來成為主所大用的僕人，摩爾維亞召會的領袖。赫維格爾姊妹曾經以此為題，寫了一首詩，就是我們所唱的詩歌三百三十一首。"],["H","奉獻－主愛激勵（詩331）"],["L","「為你，我流寶血，|為你，我捨生命，"],["L","將你洗得清潔，|使你從死復生。"],["L","為你，為你，我捨生命，|為我，你舍何情？"]]},{"no":263,"t":"甘心永遠為僕","b":[["V","倘若奴僕明說，我愛我的主人和我的妻子兒女，不願意自由出去。（出21:5）"],["E","But if the servant plainly says, I love my master, my wife, and my children; I will not go out free. (Exodus 21:5)"],["P","英國有一個富翁，搭船遊覽土耳其。同船有一個突厥首長，身邊帶著一個黑奴。英國人以為作奴僕的都是粗野的人，但是這個奴僕卻是舉止文雅。那位富翁就問他說，「像你這樣的人為何作奴僕呢？」他說，因為種族戰爭失敗，被人擄去為奴。此後，每天交談，都令富翁大起敬意，願意出價將他贖出來。那位黑奴說道：「英國沒有奴隸制度，凡到英國的人都得自由，難道你還要買我為奴，豈不與國家的法律不合麼？」這時他的身價已經談定，契約也已拿到富翁手中。富翁便對他說，「我不是買你為奴，乃為釋放，叫你得到自由。」立刻當面撕去契約，並說，「現在你是一個自由的人了，可以任意往來。」這位黑奴感激得跪下，甘願永遠作他的奴僕。"],["P","你曾否被主的愛激勵，把自己完全獻給祂呢？"]]},{"no":264,"t":"黑奴感恩","b":[["V","他的主人就要帶他到審判官那裡，又要帶他到門或門框那裡，用錐子穿他的耳朵，他就永遠服事主人。（出21:6）"],["E","Then his master shall bring him to God and shall bring him to the door or to the doorpost, and his master shall bore his ear through with an awl; and he shall serve him forever. (Exodus 21:6)"],["P","五百年前有人將非洲黑人賣到歐美各國，充任勞役，待遇如同牛馬，不只擔任種種苦工，責打至死也不負責。有時一家數口被人賣到各處，妻離子散，苦死異鄉，終身不能再見，真是慘無人道。有一次，某一個市場拍賣黑奴，最後賣到一個又大又高，特別強壯的黑奴。他被雙條鐵鏈捆著，人人視為奇貨，出價甚高，爭欲得之。一位紳士見他可憐，出了一筆特高的代價，把他買來。拍賣黑奴的人，就將賣契交給紳士，並且囑咐他說，「這個黑奴力大無比，必須餓他七天，才可解開鐵鏈；否則他會立刻把你打死，還要逃去。」紳士接過賣契之後，當著黑奴的面撕掉，並說，「我來買你不是要你作我奴隸；乃是要叫你得著自由。」於是解開他的捆索，叫他回家。黑奴感恩之後，二人各自離去。黑奴走到半路，心想，天下那有如此好人，我不愛他還愛誰呢？於是回頭追上紳士，急忙跪在他腳前，甘心情願作他的奴僕，以報大恩。紳士一再推辭，終以兒子之名收留了他。"],["P","主既用重價把我們買來，叫我們從罪裡得了釋放，得以自由；我們理當愛祂，奉獻給祂，甘心作祂的奴僕。"]]},{"no":265,"t":"盡以奉主仍覺可羞","b":[["V","有一個女人拿著一玉瓶極貴的香膏，到祂跟前來，趁祂坐席的時候，澆在祂的頭上。（太26:7）"],["E","A woman came to Him, having an alabaster flask of ointment of great value, and she poured it on His head as He reclined at table. (Matthew 26:7)"],["P","美國有一個寡婦，信了耶穌。她有三個兒子，也都信了耶穌。她把三個兒子全都奉獻給主，後來主感動大兒子前往非洲傳道；不久，就被非洲土著殺了。她知道後，就跪在神前，禱告讚美，她的兒子配為主殉道。接著，主又差她第二個兒子前往非洲傳道，也照樣死了。再差第三個，皆是如此死了。有一天，她的親友問她說，「你將你的三個兒子都獻給主，去作救人的工作，現在他們都死了，你懊悔不懊悔？」她回答說，「我很懊悔，因為我沒有第四個兒子，可以奉獻給主。」她禱告說，「主阿，即使我將全世界都獻上，仍是覺得可羞。」作詩的人聽了，深受她的激勵，寫出了我們所唱的詩歌第八十五首。"],["H","讚美主－祂的受苦（詩85）"],["L","我每靜念那十字架，|並主如何在上受熬，"],["L","我就不禁渾忘身家，|鄙視從前所有倨傲。"]]},{"no":266,"t":"盲女燈油費","b":[["V","耶穌知道了，就對他們說，為什麼難為這女人？她在我身上作的，是一件美事。（太26:10）"],["E","But Jesus, knowing it, said to them, Why do you trouble the woman? She has done a noble deed to Me. (Matthew 26:10)"],["P","瑞士有一個盲女，有一天，她拿了二十七元銀幣，交給一位傳道人，作為海外佈道的費用。傳道人說，「你眼盲，家庭環境又很不好，奉獻這麼多，太多了吧。」盲女說，「我晚上作工不需要點燈，我就將這省下來的油費捐為主用，為了感謝主的恩典，使我能天天賺錢生活。」主喜歡我們不顧一切的愛祂，奉獻給祂；因為在祂看來，我們愛祂，永遠不會太多；我們奉獻給祂，永遠沒有太過。"],["H","奉獻－走主道路（詩349）"],["L","但那誠實愛主的人，|禍福都不問，"],["L","就是他們寶貴心血，|也願為主舍；"],["L","求主給我這樣心志，|赤忠忘生死。"]]},{"no":267,"t":"拿撒勒人耶穌渴了","b":[["V","你們來到祂這為人所棄絕，卻為神所揀選所寶貴的活石跟前，也就像活石，被建造成為屬靈的殿，成為聖別的祭司體系，藉著耶穌基督獻上神所悅納的屬靈祭物。（彼前2:4-5）"],["E","Coming to Him, a living stone, rejected by men but with God chosen and precious, you yourselves also, as living stones, are being built up as a spiritual house into a holy priesthood to offer up spiritual sacrifices acceptable to God through Jesus Christ. (1 Peter 2:4-5)"],["P","歐洲某地，在耶穌「受難日」那天，有幾個人圍繞一張桌子坐著，喝酒鬥牌。他們中間一個舉起杯來，高聲說，「有人說，拿撒勒人耶穌在今天渴了，所以我們各人都要乾一杯。」其中有一個人，認為這樣的取笑是不對的；因為「拿撒勒人耶穌在今天渴了」這句話，刺激了他的良心，他就離席而去。在他耳中有聲音說道，「拿撒勒人耶穌在今天渴了。祂為什麼渴了？為你的罪，為你的罪。」這人曾經多次不肯聽從主的聲音，然而這次他聽從了，他將自己獻給為他渴了的拿撒勒人耶穌。"],["P","祂當日渴了，是因受了神憤怒的審判；祂今天渴了，是要得著你。你願意在今天奉獻給祂麼？"]]},{"no":268,"t":"對主你如何","b":[["V","耶和華喜悅燔祭和平安祭，豈如喜悅人聽從他的話呢？看哪，聽從勝於獻祭；聽命勝於公羊的脂油。（撒上15:22）"],["E","Does Jehovah delight in burnt offerings and sacrifices as much as in obeying the voice of Jehovah? Behold, to obey is better than sacrifice, and to heed, than the fat of rams. (1 Samuel 15:22)"],["P","在德國某教堂內，有一個碑銘如下：「我們的主耶穌基督，對我們如此說：你稱我為主，可是並不聽從我。你稱我為光，可是並不看見我。你稱我為道路，可是並不走在這路上。你稱我為生命，可是並不盼望得著。你稱我為全智，可是並不跟隨我。你稱我為美好，可是並不親愛我。你稱我為全豐，可是並不祈求我。你稱我為永生，可是並不尋求我。你稱我為仁慈，可是並不倚靠我。你稱我為尊貴，可是並不事奉我。你稱我為全能，可是並不尊敬我。你稱我為公義，可是並不敬畏我。我若定你的不是，你可不要怪我。」"],["H","福音－救主（詩677）"],["L","憐憫、慈愛、寬恕、|溫柔又謙和；"],["L","為了罪人忍辱，|甘負十架軛；"],["L","捨命、流血、受苦，|為救失喪者："],["L","這是基督耶穌，|對祂你如何？"]]},{"no":269,"t":"安納提的奉獻最多","b":[["V","有一個窮寡婦來，投了兩個小錢，就是一個大錢。耶穌便叫門徒來，對他們說，我實在告訴你們，這窮寡婦投入庫裡的，比眾人所投的更多。（可12:42-43）"],["E","And one poor widow came and cast in two lepta, which is a quadrans. And He called His disciples to Him and said to them, Truly I say to you that this poor widow has cast in more than all those who were casting into the treasury. (Mark 12:42-43)"],["P","相傳古時在歐洲某城，要鑄一個大鐘，不只外觀要很美麗，聲音也要清脆，好叫民眾一聽鐘聲，就被吸引前來敬拜神。然而，所需款項需由市民自由奉獻。"],["P","居民之中有一個極為貧窮的小女孩，名叫安納提，父親已經去世，母親作用人，生活相當窘迫。然而安納提誠心愛主，巴不得在鑄鐘的事上有分。"],["P","有一天，因為幫助他人搬運雜物，人家送她一個銅元。她起初推辭說，「請你收回，我並不是因為要錢才幫助你。」後來因為推辭不掉，就徵得母親同意，將銅元拿去獻作鑄鐘之用。"],["P","在獻款那裡，別人都獻上大筆款項。當收款人看見她光著腳，穿的又破，並且僅持一個銅元，羞羞答答的在那裡遞上時，便說，「什麼？一個銅元，我們這裡不要銅元，快拿回家去吧。」她回去一見母親，就哭著說，「母親，他們不肯收我的銅元。」母親安慰她說，「不要緊，天父知道你的心，你不必憂傷。」安納提只得又把銅元收藏起來。"],["P","鐘鑄好之後，經過多次的修整，所發聲音總是不和諧。鑄鐘的技工，雖然都是名匠，也灰心了。有的人說，鑄匠的手藝不佳；有的人說，是因天氣不合。最後有一個人問說，「請問鑄鐘的款全用上了麼？」收款人說，「所有奉獻的款都已用在這事上了；不過有個貧窮女孩拿來一個銅元，我沒有收她的。」那人說，「阿，我們若是不收那個奉獻，我相信，這鐘聲永遠不能和諧。」那收款人說，「這真是不近情理。」然而群眾都說，「我們該把那女孩找來。」"],["P","於是有人立刻找到安納提，對她說，「你快快拿著你的銅元去獻上吧。」安納提不懂是什麼意思；可是她就照所說的，獻上了她的銅元。當人再敲那鐘時，鐘聲真的和諧了，極其好聽。民眾十分歡喜，同聲說道：「安納提的奉獻最多。」"]]},{"no":270,"t":"父子代牛犁田","b":[["V","信的人都在一處，凡物公用，並且賣了田產家業，照各人所需用的分給各人。（徒2:44-45）"],["E","And all those who believed were together and had all things common; and they sold their properties and possessions and divided them to all, as anyone had need. (Acts 2:44-45)"],["P","有位富翁和一位有名的律師，結伴環遊世界，看到許多印象深刻的事物。尤其在某地所看見的，更是畢生難忘。一天，他們在鄉間散步，看見一個兒子拖著犁，一個老人扶著犁，在那裡犁田。律師覺得非常希奇，順手攝入鏡頭。不久，他們無意之中，把這照片拿給一個西國傳道人看，並問為何這樣用人犁田？傳道人回答說，「是的，這是少見的。不過，我碰巧認識這二人；他們很清苦，當本縣信徒建築會所時，他們也很願意有所奉獻，但沒有錢，結果便賣了他們僅有的那隻牛奉獻；所以，現在他們需要代替牲口犁田了。」律師與富翁聽後，愕然相視，一時說不出話來。稍後便問說，「這是何等愚昧的犧牲，為什麼你們容許他們這樣作？」「哦，他們卻不是這麼看；他們只覺得那是莫大的喜樂，因為還能有機會擺上一頭牛在主的事工上。」"]]},{"no":271,"t":"霍州戒菸所","b":[["V","要變賣你們的家業，施捨給人；為自己預備永不舊的錢袋，用不盡的財寶在諸天之上，就是賊不能近，蟲不能蛀的地方。（路12:33）"],["E","Sell your possessions and give alms; make for yourselves purses which do not become old, an unfailing treasure in the heavens, where thief does not come near nor even moth corrupts. (Luke 12:33)"],["P","清朝末年有一位席勝魔弟兄，曾設立幾個戒菸所，藉此傳揚福音，釋放被煙癮所捆綁的靈魂。其中一個霍州戒菸所的成立，乃是這樣：有一天，他的妻子對他說，「我們為霍州禱告很久，現在是不是要開始工作？」席勝魔說，「可惜目前沒有錢，房租又貴。」她問：「多少錢？」席勝魔便將數目告訴她；她就走開，沒有說什麼。第二天早上，家中聚會，她的裝束特別樸素，不同素常戴著首飾。會後，她將幾包東西放在桌上說，「我想神已經聽了我們為霍州的禱告。」席勝魔見妻子裝扮樸素，又聞此言，心知必有原因，就將小包打開看，原來是她的金銀裝飾：手鐲、戒指、簪、釵等物。席勝魔說，「你將這一切全都奉獻麼？」「自然是。」她很快樂的答覆：「我可以沒有這些東西，但霍州不可以沒有福音。」席勝魔就用所得的錢，創辦這戒菸所。戴德生當時也在場，看見這種情形，便說，「你不為這些美麗的東西可惜？」她回答說，「可惜什麼？我有耶穌還不夠麼？」"]]},{"no":272,"t":"天上來的電報","b":[["V","不要為自己積蓄財寶在地上，地上有蟲蛀、鏽蝕，也有賊挖洞偷竊。（太6:19）"],["E","Do not store up for yourselves treasures on the earth, where moth and rust consume and where thieves dig through and steal. (Matthew 6:19)"],["P","一個商人為福音工作奉獻了二百五十金元，當他把支票遞給傳道人之後，接到一封急電，閱後面色頹喪。他告訴傳道人說，「這封電報說我的一艘貨船沉沒，船上貨物全部損失，這個打擊將使我的環境大大改變，我需要重新寫一張支票給你。」傳道人明白這話的意思，就把那支票交還給他。然而，當商人另寫一張支票時，面額竟寫一千金元。傳道人詫異的問說，「你有沒有寫錯？」商人答說，「不，沒有寫錯。這封急電是由天上我們的父神那裡打來的，內文說，『不要積攢財寶在地上。』」"],["H","讚美羔羊（補24）"],["L","恩主，我們阿利路亞|向你高聲唱，"],["L","永遠讚美你的價值|超萬人之上。"],["L","（副）"],["L","讚美羔羊！你真是配！|永遠的歌聲。"],["L","阿利路亞！阿利路亞！|讚美主！阿們！"]]},{"no":273,"t":"尋求積財在天上","b":[["V","只要為自己積蓄財寶在天上，天上沒有蟲蛀、鏽蝕，也沒有賊挖洞偷竊。（太6:20）"],["E","But store up for yourselves treasures in heaven, where neither moth nor rust consumes and where thieves do not dig through nor steal. (Matthew 6:20)"],["P","當年閱讀慕勒孤兒院常年報告的人，可以不時的發現一位匿名的捐款人，數十年來不斷奉獻，但記錄上只稱他為「一個主耶穌的僕人，因著基督之愛的激勵，尋求積蓄財寶在天上」。如果把他的那些奉獻加起來，到一八九八年三月一日止，竟達八萬一千四百九十鎊十八先令八便士。這位捐款人就是慕勒自己，他將人送給他或者遺贈給他個人的款項，全都獻上為主所用。"],["H","花費（補746）"],["L","主，我今將自己|交在你恩手中，"],["L","我只望能為著召會花費，|雖不知我前途"],["L","有何患難或痛苦，|若是為著你召會，"],["L","何來懊悔！"]]},{"no":274,"t":"借破傘給女王","b":[["V","還有幾個得醫治，脫離惡靈和疾病的婦女，…和好些別的婦女，都是用自己的財物供給耶穌和門徒。（路8:2-3）"],["E","As well as certain women who were healed of evil spirits and infirmities, …and many other women, who ministered to them out of their possessions. (Luke 8:2-3)"],["P","有一天，外面正下著大雨，一個女人朝著一間簡陋的小屋走去；她開口向住在屋內的老婦人借一把雨傘。那位老婦十分吝嗇的借一把破傘給她。第二天，來了位皇家的御使，把那破傘帶來還給老婦人。老婦人大大驚訝，便懊悔說，「哎呀，如果我早認識她是維多利亞女王，我早就把好傘借給她了。」"],["P","你今天奉獻得這麼可憐，有一個最大的原因，就是因為還不認識祂是誰。"],["H","奉獻－主的榮美吸引（詩333）"],["L","你的靈豈非已見祂過？|你的心曾否被祂所奪？"],["L","你當認祂為人中第一人，|歡喜選那上好的福分。"],["L","（副）"],["L","你是千萬人中之第一人！|哦，求你開我眼，並奪我心，"],["L","摔碎眾偶像，並歡然加冠|你為千萬人中之第一人！"]]},{"no":275,"t":"太愚笨的方法","b":[["V","因為你的財寶在那裡，你的心也必在那裡。（太6:21）"],["E","For where your treasure is, there will your heart be also. (Matthew 6:21)"],["P","查理曾問慕勒弟兄說，你平日有沒有儲蓄款項？慕勒回答說，「這是太愚笨的方法。我若是將款項儲蓄下來，當我缺乏時，我怎能求告主呢？我從來沒有儲蓄款項的思想。我們的款項乃是儲蓄在天上；永生的神乃是我們的一切。我信祂能給我二十個便士，我也相信祂能給我數千磅。我們信靠祂，總不至於徒然。」"],["H","奉獻－全都獻主（詩337）"],["L","我將一切全獻基督，|全獻恩主心甘願；"],["L","我要永遠愛主，隨主，|天天活在主面前。"],["L","（副）一切全奉獻！|一切全奉獻！"],["L","我的恩主，|向你我願一切全奉獻！"]]},{"no":276,"t":"只給一粒芝麻","b":[["V","你們要將當納的十分之一，全然送入倉庫，使我家有糧，以此試試我，是否為你們敞開天上的窗戶，傾福與你們，甚至無處可容。（瑪3:10）"],["E","Bring the whole tithe to the storehouse that there may be food in My house; and prove Me, if you will, by this, …whether I will open to you the windows of heaven and pour out blessing for you until there is no room for it. (Malachi 3:10)"],["P","一個小孩正在吃燒餅。他母親問他說，「你給我一些吃好麼？」他看看餅，又看看母親，捨不得，就把一粒芝麻給母親。母親喜悅得很，便轉身進房裡，拿出一盒糖給兒子。神借申言者瑪拉基對以色列人說，「你們要將當納的十分之一，全然送入倉庫，使我家有糧，以此試試我，是否為你們敞開天上的窗戶，傾福與你們，甚至無處可容。」你有奉獻的智慧麼？"],["H","要將供物送倉庫（補737）"],["L","萬軍之耶和華神說，|你們要將當納供物，"],["L","十分之一全送倉庫，|使我有糧，以此試我，"],["L","是否為你敞開天窗，|傾福於你無處可容。"],["L","我必為你斥責蝗蟲，|不容它毀壞你土產，"],["L","你們田間的葡萄樹，|未熟之先不掉果子；"],["L","萬國必稱你們有福，|你地必成喜樂之地。"]]},{"no":277,"t":"神給他更好的機會","b":[["V","你們用什麼量器量給人，也必用什麼量器量給你們，並且要加給你們。（可4:24）"],["E","With what measure you measure, it shall be measured to you, and it shall be added to you. (Mark 4:24)"],["P","道格拉斯因為失業太久，囊中只剩一塊錢。主日聚會時，他把僅有的半數，五角，投入奉獻箱。第二天，忽然聽說某城要招工人，便想前往應徵。然而，到那裡的火車費需要一元。他只好用剩下的五角錢，買張半程車票，再以步行完成其他半程。表面看，好像他昨天不該把五角錢投入奉獻箱；然而當他步出車站，準備用兩腿繼續行程時，神給了他更好的機會。他尚未走出一個街口，就獲知附近一間工廠需要人手；三十分鐘之內，他就得到一分工作，工資遠超某城招工的待遇。後來他成為馳名遠近的製鞋業鉅商。"],["H","得救的證實與快樂－主的保守（詩259）"],["L","我真不知我的前途|到底是甘是苦；"],["L","我也不知未見主前|還有什麼試煉。"],["L","（副）"],["L","惟知道我所信的是誰，|並且也深信祂實在是能"],["L","保守我所信託祂的，|都全備直到那日！"]]},{"no":278,"t":"石油大王的賬簿","b":[["V","我算什麼，我的民算什麼，竟有力量如此樂意奉獻？因為萬物都從你而來，我們把從你手所得的獻給你。（代上29:14）"],["E","But who am I, and who are my people, that we should have strength to offer so willingly in this way? For all things are from You, and from Your hand we have given to You. (1 Chronicles 29:14)"],["P","石油大王洛克斐勒，有一次向一班青年，出示他的第一本賬簿。那本賬簿是從一八五五年開始的，詳列那一年他的收入和支出概況。那時他還微賤，後來才成為鉅富。在三個月中，他收入了五十塊錢，除了付房租、洗衣等費用外，還積蓄了一點。賬上記著每週為傳道奉獻一角，為某人奉獻五角，為本城佈道奉獻一角二分，賙濟召會中的窮信徒一角。雖然是小數目，但比起他的收入卻不算少。他有了這個奉獻和關心別人的起頭，所以當他成為鉅富時，他才能有大數目的財物奉獻，並關心更多的人。"],["P","許多基督徒覺得自己收入微薄，不肯學習奉獻財物，也從不關心別人；等到有一天收入較豐富時，便更捨不得財物出手了。"]]},{"no":279,"t":"安全的奉獻箱","b":[["V","信心是與他的行為同工，而且信心本於行為才得完全。（雅2:22）"],["E","Faith worked together with his works, and by these works faith was perfected. (James 2:22)"],["P","一個寓言故事說到，有兩隻蜘蛛彼此談話。一隻說，我有一天從講臺上經過，傳道人忽然拍起桌子，險些把我打死；另一隻說，我所在的地方從來沒有發生過危險，十分安全；我是住在奉獻箱裡。"],["P","這事表明聽道的人很多，講道的人也有，但是奉獻的人少得可憐。"],["H","奉獻－全都獻主（詩339）"],["L","三|得著我金與我銀，|分文不由我留存；"],["L","|得著我才與我智，|運用全照你指示。"],["L","四|得著我心與我意，|全歸於你不他依；"],["L","|得著我愛與我情，|全注於你不別傾。"],["L","五|主，你得著我一切，|我願與你永聯結，"],["L","|愛你、念你、事奉你，|永遠失去在你裡。"],["L","（副）"],["L","|為我荊棘冠冕你肯戴，|為我釘死苦架你受害；"],["L","|為你我願獻上我命與我愛，|事你、愛你到萬代。"]]},{"no":280,"t":"奉獻箱上的蜘蛛網","b":[["V","你要囑咐那些今世富足的人，不要心思高傲，也不要寄望於無定的錢財，只要寄望於那將百物豐富的供給我們享受的神。（提前6:17）"],["E","Charge those who are rich in the present age not to be high-minded, nor to set their hope on the uncertainty of riches but on God, who affords us all things richly for our enjoyment. (1 Timothy 6:17)"],["P","某處信徒，要請一位著名的畫家，為他們偉大壯麗的教堂作畫。畫家答應了，立即開始著筆。他畫上宏大雄偉的輪廓，美麗奪目的五彩玻璃窗，隱約可見雕刻精緻的講壇，名貴的管風琴，和一排一排的座位；這教堂顯然可以容納數千聽眾。然後，他在門內畫上一個奉獻箱，上面寫著：請樂意為傳道事工、慈善事工奉獻。他們看到這畫，都極力稱讚畫筆巧妙，認為這是一幅最逼真而偉大的傑作。當他們正要把畫取去時，畫家阻止說，「且等一下，我還要加上幾筆；因為還有一件重要的東西尚未畫上。」於是他就拿起筆來，在奉獻箱上，輕輕畫上一個蜘蛛網，完全遮住了奉獻箱口，表示沒有人投過奉獻款。"],["P","僅有外表美麗的會堂，沒有內裡奉獻的實際，乃是醜陋的。"]]},{"no":281,"t":"要水流過需裝水管","b":[["V","要囑咐他們行善，在善事上富足，甘心分授，樂意與人同享，為著將來，替自己積存美好的根基作寶藏，叫他們持定那真實的生命。（提前6:18-19）"],["E","To do good, to be rich in good works, to be ready to distribute, to be ones willing to share; laying away for themselves a good foundation as a treasure for the future, that they may lay hold on that which is really life. (1 Timothy 6:18-19)"],["P","有一次，一位黑人弟兄講道時，勸勉信徒盡力擺上，使主的工作沒有缺乏。當他講到言辭懇切時，有一個信徒當場質問他說，「你豈不說過，恩典是白白給的，好像我們所吸的空氣，又像我們所飲的水。若你所說是實在的，你就不該時時題說捐輸的事。」這位弟兄嚴肅的注視他，並回答說，「弟兄，你說得不錯，恩典是白白給的，好像我們所吸的空氣，又像我們所飲的水。然而，你若要水能流到你的廚房，必須裝設水管，這筆費用非出不可。」付出裝設水管的錢，是為著水能流過；照樣，十分之一的奉獻，是為著天上窗戶的打開，使神能夠傾福給你。"]]},{"no":282,"t":"是主的一角失去了","b":[["V","你定睛在財富上，財富卻消失了；因財富必長翅膀，如鷹向天飛去。（箴23:5）"],["E","When you set your eyes upon it, it is gone; for wealth certainly makes itself wings, like an eagle that flies toward heaven. (Proverbs 23:5)"],["P","有一個小孩，帶著兩角錢去聚會；一角為自己用，一角為奉獻。然而，在路上，一個不小心，他失去了一角錢。他便說，是主的那一角失去了。這孩子的話，說出許多成人的故事。人總是說，是主的錢不見了，因而不願把該給主的錢獻上；在人手中的錢，總是為自己用的，不在人手中的錢才是為主的。這就是人的難處。"],["H","全為召會花費（補748）"],["L","這世界非我家，|我的家是召會，"],["L","我的生命財物，|全為召會花費；"],["L","這世界一切事務|盡都是虛空，"],["L","我若不為召會，|必浪費世界中。"],["L","哦主！|你的心意乃是召會，"],["L","開展你的國度，|執行你的權柄。"],["L","我的所是所有|從世界全收回，"],["L","從今起我活著|完全是為召會。"]]},{"no":283,"t":"只會掙錢蓄錢","b":[["V","你要以財物，和一切初熟的出產，尊榮耶和華。這樣，你的倉房必充滿有餘，你的酒榨必盈溢新酒。（箴3:9-10）"],["E","Honor Jehovah with your substance and with the firstfruits of all your produce; then your barns will be filled with plenty, and your vats will burst open with new wine. (Proverbs 3:9-10)"],["P","有一次，衛斯理約翰在會中講道，釋放奉獻的信息。當他說到第一點，盡你的力量掙錢時，聽眾中有一位守財奴聽了，點點頭，很贊成的說，「這位講道人，真會講道。」當他說到第二點，盡你的力量儲蓄時，守財奴不覺手舞足蹈起來，說道：「很對！很對！」最後當他說到第三點，勸他們盡力奉獻他們所儲蓄的錢時，這個守財奴馬上垂頭喪氣，並且很掃興的說，「可惜他把剛才所講的話，完全糟蹋了。」"],["P","人的難處在於只體貼人的意思，不體貼神的意思，以致人得不著神的祝福，得不著神自己。"]]},{"no":284,"t":"衛斯理的遺產","b":[["V","敬虔又知足，便是大利了；因為我們沒有帶什麼到世界來，也不能帶什麼去；只要有養生與遮身之物，就當以此為足。（提前6:6-8）"],["E","Godliness with contentment is great gain; for we have brought nothing into the world, because neither can we carry anything out. But having food and covering, with these we will be content. (1 Timothy 6:6-8)"],["P","衛斯理約翰是主所大用的僕人，生前一班愛主的人送他個人不少的錢，總數不下六十五萬餘美元。衛斯理將這些款項，全數用在神的事工上。一七九一年，他被主接去，時年八十八歲，所遺財產僅一銀茶壺，與兩枚銀匙。這些遺物，至今仍存放在倫敦市區的博物院裡。基督徒應當生前把錢財奉獻，用在神的事工上，為自己積成美好的根基；勿把錢財當作死後遺產，成為虛無，毫無意義。"],["H","奉獻－主愛激勵（詩331）"],["L","「主，我獻上生命，|並獻所有時光，"],["L","完全聽你使令，|脫離地上捆綁。"],["L","為我，為我，你的全舍，|為你，我撇一切！」"]]},{"no":285,"t":"盧布變廢紙","b":[["V","但那些想要發財的人，就陷在試誘、網羅、和許多無知有害的私慾裡，叫人沉溺在敗壞和滅亡中。（提前6:9）"],["E","But those who intend to be rich fall into temptation and a snare and many foolish and harmful desires, which plunge men into destruction and ruin. (1 Timothy 6:9)"],["P","民國初年，中國北方有許多人，競相儲存俄國的盧布，甚至有人積了幾麻袋。因為他們不信任當時的「哈大洋」和「奉票」；反以為只有外幣可靠。然而當帝俄被人推翻之後，那些盧布便一文不值，形同廢紙。到民國二十年時，仍可看見許多孩子，拿著一疊一疊的新盧布當作玩物；也有許多人當糊牆紙用了。現今許多信徒，不知積蓄財寶在天上，只知積蓄黃金美鈔在地上，到有一天，錢財無用的時候，這些還能給他什麼呢？"],["H","經歷基督－因祂滿足（詩438）"],["L","我已揀選主耶穌，|揀選祂作世界；"],["L","祂愛實在是充足，|滿足我的一切；"],["L","主，我是你的器皿，|只有你能充盈；"],["L","敘加的水飲千井，|渴仍不停。"],["L","（副）耶穌，耶穌，|我揀選主耶穌，"],["L","我心今正住在|所有甘甜事物之源；"],["L","耶穌，耶穌，|祂乃是我滿足，"],["L","是祂消除我的要求，|平靜我的意願。"]]},{"no":286,"t":"大廈衰頹","b":[["V","貪財是萬惡之根，有人貪戀錢財，就受迷惑，離棄了信仰，用許多苦痛把自己刺透了。（提前6:10）"],["E","The love of money is a root of all evils, because of which some, aspiring after money, have been led away from the faith and pierced themselves through with many pains. (1 Timothy 6:10)"],["P","美國弗羅裡達州的邁阿密，是富人冬季避寒的勝地。那裡有一所大廈，是富豪狄林約翰建造的，精美壯麗，無與倫比，建築費高達一千六百萬美元。這一所雄偉的建築，現已日漸衰頹。高樓已被風雨侵蝕，精巧飛簷快要脫落。前門釘上木板，大有人去樓空之感。據說，狄林曾將此座大廈，捐給邁阿密市政府。市政府以美金一元八角五分的一張遊覽券，售與遊客入內遊覽。後來，市政府仍把大廈退還原主，因為每年的修理與開支過巨，市政府負擔不起。有人估計，狄林這筆建築費，若是用作佈道工作，可以派遣宣教士一千人，到國外佈道十六年；若派遣十人，可工作一千年之久；這一千六百萬美元，就會產生永存不朽的價值，不至像現在剩下一座快要毀壞、無人接受的房子。"],["P","富足的信徒們，你們的錢財願意讓它鏽壞呢，還是願意讓它增添你仁義的果子？"]]},{"no":287,"t":"倪弟兄去建甌（一）","b":[["V","恩待窮乏的，乃是尊敬主。（箴14:31）"],["E","He who is gracious to the needy honors Him. (Proverbs 14:31)"],["P","倪柝聲在福州讀書時，同學魏弟兄約他到建甌，距福州五百里處，去幫助那裡的召會。當時主只預備了三分之一的旅費，約是十幾塊錢。建甌召會催說什麼都預備好了，請他快去。倪弟兄回電報說，就來。他定規週五晚上動身。週五一早起來，忽然得到一句話：「你要給人，就有給你的。」心裡又覺得說，「你應該把鈔票都送出去，銀角留著為你自己。」但是給誰呢？又覺得說，「要給一個有家庭的弟兄。」倪弟兄禱告完了，不敢說順服，也不敢說不順服，心中對主說，「如果你要我送給這一位弟兄，你就叫我在半路上碰見他。」在中途，那位弟兄恰好迎面走來，倪弟兄就說，「弟兄，主叫我把這擺在你手裡。」說了，就走。走了兩步，就流下淚來，對主說，「我已經打電報給建甌的魏弟兄，說去；現在錢送出去了，叫我怎麼去呢？」然而另一面，他心裡非常舒服；因為主說，「你給了人，就必有給你的。」於是，他對主說，「主，你應當給我了。時候到了，就要上船了。」"],["P","誠實愛主的人，他的奉獻總是絕對的、堅定的。"]]},{"no":288,"t":"倪弟兄去建甌（二）","b":[["V","憐憫人的人有福了，因為他們必蒙憐憫。（太5:7）"],["E","Blessed are the merciful, for they shall be shown mercy. (Matthew 5:7)"],["P","那天，倪弟兄離開福州，一路一直禱告，禱告到上了民船，禱告到躺在船板上睡覺。他預定坐民船到洪山橋，再坐小火輪到水口，轉建甌。上了小火輪時，他就從上面走到下面，從下面走到上面，走了好幾轉，看看神有沒有安排。心想，神如果要給他，他也得多走兩次，叫神容易一點。然而，船上沒有一個認識的人；但心裡總有一個聲音說，「你給了人，我就給你。」當時，他手裡所有的錢，付了小火輪的錢之後，還剩約一百個銀角。他覺得相當為難，就禱告說，「主，現在到水口了，要不要買票回福州去？」裡頭就有一個感覺說，「你是一個愚昧的人，為什麼不禱告，叫你能便宜一點的去。」這感覺一來，他就對主說，「我不求你給我錢，只求你給我能到建甌就行。」這一個禱告之後，心裡非常平安。他站在小火輪的船頭上，船還沒有到水口，就有小船上的人來問說，「你是上南平或是建甌？」他說，「上建甌。」那人說，「我帶你去。」問說，「多少錢？」回答說，「七十角。」比他所有的還要少。他一聽就知道主有預備，就定規去。那人把他的行李，馬上搬到他的船上。按規矩，到建甌總要七、八十元。他問他說，為什麼你給我這樣便宜？他說，「不是我給你便宜，是因這隻船，已經有一個縣政府的人包去，他是在前艙，答應我在後艙可以另外搭一個客人。」那天，倪弟兄還用餘下的錢，買了一點菜，一點肉，就是這樣，他到了建甌。"],["P","「憐憫窮人的，就是借給耶和華；他的善行，耶和華必償還。」（箴十九17。）"]]},{"no":289,"t":"倪弟兄去建甌（三）","b":[["V","你們要先尋求祂的國和祂的義，這一切就都要加給你們了。（太6:33）"],["E","Seek first His kingdom and His righteousness, and all these things will be added to you. (Matthew 6:33)"],["P","倪弟兄由建甌要回家時，一共只剩下十二角。他買了約一元的東西，還剩兩角。所以，聚會完了，他便一直禱告。主日晚上，有一位鹿腓利弟兄請他吃飯。對他說，「倪弟兄，這一次你上來，我們得了很大的幫助，你回去的路費，好不好由我來負責。」他一聽見這話，一面快樂，一面覺得不行接受。就說，「已經有一位負責了。」鹿弟兄聽見這話，說了一聲對不起，就過去了。他離開時就很懊悔，因為這一件事，給他回絕了。然而他一面禱告，一面心裡很平安。第二天，他要走，口袋只有兩角錢，沒有辦法應付船資，他在那裡相當作難。魏弟兄和他家裡的人，都來送行，魏弟兄和他一同走，東西已經先挑走了。他就禱告說，「主阿，你把我帶到建甌來，你不能讓我回不去；是你負我的責任。如果我錯了，我肯承認我的錯，但是我不相信我錯了，因為你說，『你給人，就必有給你的。』」禱告完，走到半路上，腓利弟兄派人送一封信給他，信上說，「我知道有人負責，但是神叫我覺得，在這一次你來建甌的事上，我應當有分。你好不好讓一個年長的弟兄，有一點分在裡面。請你收下這一點錢。」他接受了這錢。對神說，「神，這一個時候的錢，是對的。」他就用這錢作路費；並且回來後，還有餘錢印一期復興報。"],["P","「你們要給人，就必有給你們的。」（路六38。）"]]},{"no":290,"t":"倪弟兄去建甌（四）","b":[["V","我的神必在榮耀中，照著祂的豐富，在基督耶穌裡，使你們一切所需用的都充足。（腓4:19）"],["E","And my God will fill your every need according to His riches, in glory, in Christ Jesus. (Philippians 4:19)"],["P","倪弟兄回來後，那位同工的妻子看見他，就問說，「倪弟兄，我要問你一件事。你離開福州時，為什麼送我丈夫錢？為什麼你把錢一塞給他，立刻就走了？」他說，「沒有別的，是因為我禱告了一天，主給我看見說，該送給他。所以我從家裡出去，在路上碰見他，就把錢給了他。」她說，「那一天晚上，是我們家裡最末了的一餐，最末了的一點柴。你的錢來的時候，米也買了一擔，柴也買了許多斤，一直到前幾天，主才給我們另外有一點錢。那一次，我們一直等候在主面前。」倪弟兄心裡非常清楚，如果把錢留在口袋裡，那錢就死掉了；但那錢送出去，就有用了。在路上他仰起頭來，對主說，「路加六章三十八節，我是第一次看見。」就在那裡，把他自己再一次奉獻給主說，「從今天起，我定規要給，我不願意一文錢留在我手裡是懶惰的錢。我要把錢送出去，讓神行神蹟；我要把錢送出去，當作神聽禱告的答應。」"],["P","我們豈不也當把錢奉獻出去，讓神行神蹟；把錢送出去，作神聽禱告的答應？"]]},{"no":291,"t":"神的量器比我的大","b":[["V","你們要給人，就必有給你們的，用十足的量器，連搖帶按，上尖下流的倒在你們懷裡。（路6:38上）"],["E","Give, and it will be given to you; a good measure, pressed down, shaken together, and running over, they will give into your bosom. (Luke 6:38a)"],["P","有一個基督徒，雖是農夫，卻很有愛心，常常將他所有的大量分給人。他未曾因此感到缺乏，反倒日加豐富。他的朋友都覺得很奇怪，就來試問個中秘訣。他說，「這是很簡單的事。我有一個量器，神也有一個量器。我用我的量器量給人，神就用祂的量器量給我。然而神的量器，比我的量器大得多。所以，我無論怎樣量，都無法勝過祂。」"],["P","請聽，你們要給人，就必有給你們的；並且用十足的量器，連搖帶按，上尖下流的倒在你們懷裡。"],["H","你要給人（補738）"],["L","你要給人神必給你，|並且要用十足升斗，"],["L","連搖帶按，上尖下流，|倒在你懷，倒在你懷。"]]},{"no":292,"t":"沒減少反增加","b":[["V","因為你們用什麼量器量給人，也必用什麼量器量給你們。（路6:38下）"],["E","For with what measure you measure, it shall be measured to you in return. (Luke 6:38b)"],["P","有一位作生意的信徒，籌算奉獻的計劃如下：起初我把淨利的十分之一奉獻給主；以後決定每月若得淨利五百金元以上，就抽出百分之十二點五；若是超過九百金元，則抽出百分之十七點五；若是超過一千三百金元，則抽出百分之二十二點五；若是超過一千五百金元，則抽出百分之二十五。當資本達到相當數目時，就抽出一半的淨利；當資本不必再加添時，即將全部淨利奉獻。數年來我採取此種計劃。感謝主祝福我的生意，不斷的有大量的淨利抽出來，我的錢一點也沒有減少，反而增多。"],["P","神的算數總和我們的不一樣。"],["H","鼓勵－憑信而給（詩488）"],["L","（副）"],["L","仍然當愛，仍然當給，|照舊你還餘一握；"],["L","所有的愛，所有的給，|要使神賜加倍多。"]]},{"no":293,"t":"靠四十元或靠神","b":[["V","少壯獅子，還缺食忍餓；但尋求耶和華的，什麼好處都不缺。（詩34:10）"],["E","The young lions hunger and starve, but those who seek Jehovah will not lack any good thing. (Psalm 34:10)"],["P","李常受有一次在南京，遇到韓弟兄，裡面覺得應該送他一筆錢；但自己只有四十塊錢，是預備到濟南、天津作工的路費用的。一面覺得要送，一面覺得另有需要。然而，最深處有一個聲音：「你是靠四十元呢，或是靠神？」李弟兄一直猶豫不決，直到韓弟兄臨走時，才把錢送給他。路費沒有了怎麼辦呢？到動身的那天晚上，有一位姊妹送來一筆路費，是他拿出去的數倍之多。"],["P","神是信實的；祂總不失信。"],["H","你們要嚐嚐主恩（補26）"],["L","你們要嚐嚐主恩的滋味，|便知道祂是美善；"],["L","主耶穌是信實的，|信靠祂的人有福了。"],["L","敬畏祂的一無所缺，|少壯獅子還缺食忍餓；"],["L","但尋求主耶穌的人，|什麼好處都不缺。"]]},{"no":294,"t":"莫爾分贈牛油（一）","b":[["V","我這兩隻手常供給我和同伴的需用，這是你們自己知道的。（徒20:34）"],["E","You yourselves know that these hands have ministered to my needs and to those who are with me. (Acts 20:34)"],["P","在英國，有個人名叫莫爾。有一天，他家裡差不多什麼都沒有了。英國人最要緊的是麵粉，莫爾連這個也沒有了。等了一、兩天，什麼東西都沒有人送來。他就對妻子說，「定規在我們家裡，有過多的東西，所以主不能給我們。」他們就跪下來禱告，求主給他們看見，在家裡有什麼東西是多了。禱告之後，就從屋頂閣樓起，所有東西一一看過。每件都考量是否太多？連小孩的衣服等也都看過，都是僅僅夠用。一件一件的看，整個房子都看遍、查過，便對主說，「在家裡實在沒有過多的東西。主，你不給我，是你錯了。」停了一停，他就對妻子說，「主不會錯，定規是在我們家裡有的東西太多。」他們就再去查，查到地窖裡，看見前些日子有人送來一箱牛油。他就非常歡喜，對妻子說，「這一定是多的。」他們就急著要將這箱牛油送給人，但是給誰呢？他就把那地所有窮苦聖徒都想了一遍，覺得無論是誰，都應該送一塊。於是夫婦兩人，就把這箱牛油，用刀切成一塊一塊，包了起來，送到這些弟兄姊妹家裡。"]]},{"no":295,"t":"莫爾分贈牛油（二）","b":[["V","我凡事給你們作了榜樣，叫你們知道，必須這樣勞苦，扶助軟弱的人，並且記念主耶穌的話，祂自己說過，施比受更為有福。（徒20:35）"],["E","In all things I have shown you by example that toiling in this way we ought to support the weak and to remember the words of the Lord Jesus, that He Himself said, It is more blessed to give than to receive. (Acts 20:35)"],["P","莫爾把牛油一包一包送完後，就對妻子說，「現在我們都作清楚了。」於是跪下來，禱告說，「主，我提醒你一句話，你曾說過：『你們給人，就必有給你們的。』請你記念，我們沒有麵粉了。」在這麼多接受他牛油的家中，有一家是很窮並且殘廢的姊妹，一天到晚躺在床上。她好些日子只吃麵包，沒有牛油；所以就禱告說，「主，求你憐憫我，給我一點牛油。」她禱告不多時候，莫爾來了，送她一塊牛油，她就因此感謝主。等一等，她仰起頭來說，「雖然他家的東西都不缺，把牛油送給我吃；但是，如果他有缺少，主，求你聽他的禱告。」因為莫爾從不叫人看見他有缺少，人根本不覺得他有缺少。並且有人在那裡傳說，莫爾是很有錢的一個弟兄。他常常給人東西，像這一次，又將許多牛油分送給人。這一個姊妹，在那裡禱告說，「如果他有缺少，求你聽他的禱告。」大約就在那一天，沒有過兩、三個鐘頭，莫爾就收到兩袋的麵粉。"],["P","主看顧義人，扶助軟弱的人。施比受更為有福。"]]},{"no":296,"t":"一餅一衣","b":[["V","孩子們，我們相愛，不要只在言語和舌頭上，總要在行為和真誠上。（約壹3:18）"],["E","Little children, let us not love in word nor in tongue but in deed and truthfulness. (1 John 3:18)"],["P","一個嚴寒的冬天早晨，一個小女孩來到衛斯理約翰的屋子。這女孩只穿一件單薄的衣服，臉上凍得發青，身體發抖，幾乎就要倒斃的樣子。衛斯理急忙探手入口袋中，但一文莫名，無法在財物上幫助這位小女孩，因此心中感到非常愁苦。於是，他向神許了一個心願：「自己的一塊餅和一件衣服，也當為貧窮人而犧牲。」以後，他在林肯學院執教時，第一年的進款共計三十鎊，除了自己留作生活費外，尚餘二鎊，他就以此施捨窮人。第二年，他年入六十鎊，但他仍舊只用二十八鎊，把那餘留的作為施捨之用。第三年，他收入九十鎊，施捨了六十二鎊。第四年，他有了一百二十鎊的進款，但除了必需用度的二十八鎊外，他還是全部幫助了窮人。"],["H","鼓勵－憑信而給（詩488）"],["L","何必預料明天境遇，|目前夠了就可樂；"],["L","何必先借明天憂慮，|手裡豈非還有著！"],["L","愛是生活，給反存留，|種得多的收也多；"],["L","好像你已罄你所有，|看哪！你還有一握！"],["L","（副）"],["L","仍然當愛，仍然當給，|照舊你還餘一握；"],["L","所有的愛，所有的給，|要使神賜加倍多。"]]},{"no":297,"t":"割衣暖丐","b":[["V","憐憫窮人的，就是借給耶和華；他的善行，耶和華必償還。（箴19:17）"],["E","He who has pity upon a poor man lends to Jehovah, and He will repay him for his good deed. (Proverbs 19:17)"],["P","一個冬天，馬丁和他的同伴冒著風雪，騎馬入城。進城之後，看見一群人圍聚一處，馬丁下馬去看究竟。只見一個老乞丐，幾乎全身赤裸，索索發抖，伸手乞食。當下馬丁就把身上一件外套脫下來，拔劍一斷為二，輕輕的把半件外套披在老乞丐肩上，然後上馬而去。當夜他作了一個夢，夢中看見一個人披著半件外套，同時聽見一個聲音，叫他認清楚，問他以前有沒有見過那件外套。起初他以為，那披半件外套的就是那個老乞丐，可是定睛一看，不見什麼老乞丐蹤影，卻隱約見到似乎是主耶穌出現在他眼前，並用清朗的聲音對眾人說，「馬丁還是一個新蒙恩的信徒，卻解衣為我。」"]]},{"no":298,"t":"一塊硬幣沒法分","b":[["V","他分施賙濟貧賤，他的義存到永遠。（林後9:9）"],["E","He has scattered abroad; he has given to the poor; his righteousness abides forever. (2 Corinthians 9:9)"],["P","戴德生有一次被一個窮人請到家裡，看見那窮人的妻子病得可憐，家中的情景真是需要錢財的幫助。那時，他的口袋裡只有一塊硬幣，是他那時所有的錢，也是他第二天中午吃飯要用的錢。他想，若他袋子裡的錢是零散的，他可以送那窮人一部分，留下一部分明天中午用。然而他所有的，是一整塊硬幣，沒法分送。若是全送，明天中午吃飯，就成了問題；不送，他裡面又不能過去。在這情形之下，當他想要安慰他們，告訴他們說，天上有一位慈愛的神時，他裡面就責備他說，你告訴他們天上有一位慈愛的神，你自己卻不肯將一塊硬幣交給他，自己倚靠那位神。後來，神得勝，他就把那塊錢送給那窮人。送出以後，他心裡滿了喜樂。第二天早飯尚未吃完，他就接到一封不知來處的信，裡面隻字未題，只有一些錢，有他昨晚送出去的三倍之多。他這樣學了順服裡面感覺的功課，以後就能有信心，應付在中國那麼大的工作需要。"]]},{"no":299,"t":"不願作偷竊的人","b":[["V","那豐富供應種子給撒種者，並豐富供應糧食作食物的，必供應並繁增你們的種子，又增添你們義的果子。（林後9:10）"],["E","Now He who bountifully supplies seed to the sower and bread for food will supply and multiply your seed and cause the fruits of your righteousness to increase. (2 Corinthians 9:10)"],["P","法蘭西斯行路遇見一個窮人，就對他的弟兄們說，「請把我的大衣送給這個窮人吧！這是他的；因為他比我們還貧窮。」弟兄們覺得法蘭西斯自己有需要，就不願給這窮人。法蘭西斯便說，「我不願作一個偷竊的人，這個人比我更有需要，我若不給他，我就是一個偷竊的人。」"],["H","我們甘心獻上（兒621）"],["L","我們甘心獻上，愛的禮物，|主阿，將我聖別，"],["L","合乎你用，|你曾白白為我捨去生命，"],["L","我願盡心、盡意、|盡力愛你。"]]},{"no":300,"t":"喜樂妙法","b":[["V","耶穌對他說，你若想要完全，就要去變賣你的家業，分給窮人，就必有財寶在諸天之上，你還要來跟從我。（太19:21）"],["E","Jesus said to him, If you want to be perfect, go, sell your possessions and give to the poor, and you will have treasure in the heavens; and come, follow Me. (Matthew 19:21)"],["P","有一個富翁，當他初信主的時候，很喜樂。過不多久，他的喜樂就消失了，覺得信主沒有什麼味道。於是，他問一個傳道人說，「這是什麼緣故呢？」傳道人告訴他：「你若要得到喜樂，請你去看望一家人。你看望之後，再來見我。」就將那家的地點告訴他。富翁照著地點去找。到了那裡，只見一家貧窮的信徒，房屋又破又漏，妻子病臥在床上，兒女衣衫襤褸，米缸中空無一粒。一家人在那裡禱告呼籲神，此外沒有別的出路。這位富翁信徒一見，心裡非常受感，連忙回家，把米、衣服、錢，送給這位窮苦信徒，使他們全家得以度日。富翁自己也滿有喜樂，以後又常去看望，從此被複興起來。有一天，富翁又遇見這位傳道人說，你為何不早將這喜樂的妙法告訴我呢？那不知要免去我多少愁苦哩。"]]},{"no":301,"t":"叫我的靈鬆一鬆","b":[["V","只是不可忘記行善和供輸，因為這樣的祭物是神所喜悅的。（來13:16）"],["E","But do not forget doing good and sharing with others, for with such sacrifices God is well pleased. (Hebrews 13:16)"],["P","有一個人名叫沙波，說到他自己親身的經歷：「我年少時，有一天，我的父親叫我和他同去鐵匠柴塞爾店裡。我父親有些東西在他店裡修理，現在要去拿回來。我們到了鐵匠店裡，看見我們的東西已經修好了，好像新的一樣。父親就給他修理費；他堅持不受，父親一定要他收。鐵匠回答的話，就是經過一千年，我也會記得。他說，『朋友，你不容讓我有時作一、兩件事，叫我的靈鬆一鬆麼？』」"],["P","你是否常常服事別人，叫你的靈鬆一鬆呢？你是否把你的財物供給缺少的人，叫你的靈鬆一鬆呢？"],["H","奉獻－同主爭戰（詩350）"],["L","誰是在主這邊？|誰要跟隨主？"],["L","誰要為主活著，|走祂的道路？"],["L","誰要撇開世界，|去為主爭戰？"],["L","誰是在主這邊，|跟隨主向前？"],["L","（副）藉著你的救贖，|並借你恩典，"],["L","可愛、榮耀救主，|我在你這邊。"]]},{"no":302,"t":"比政府救濟還快","b":[["V","他們按照門徒中間，無論是誰得昌盛的情況，各自定意贈送，去供給住在猶太的弟兄們。（徒11:29-30）"],["E","And the disciples, according to how one was prospered, determined, each one of them, to send things for dispensing to the brothers dwelling in Judea. (Acts 11:29-30)"],["P","從前在大西洋一個島上，住著好些弟兄。有一次颳大風，島上房屋倒了很多，有許多弟兄的家和聚會所都倒了。然而在幾個鐘點之內，從英國有弟兄匯去了二十萬鎊，比政府的救濟還快。"],["P","「當那些日子，有幾位申言者從耶路撒冷下到安提阿。其中有一位，名叫亞迦布，站起來，藉著那靈指明普天下將有大饑荒，這事到革老丟年間果然發生了。於是他們按照門徒中間，無論是誰得昌盛的情況，各自定意贈送，去供給住在猶太的弟兄們。他們就這樣行了，由巴拿巴和掃羅經手，送到眾長老那裡。」（徒十一27～30。）"]]}]},{"n":"對付罪","i":7,"intro":[["V","我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。（約翰一書一章九節）"],["E","If we confess our sins, He is faithful and righteous to forgive us our sins and cleanse us from all unrighteousness. (1 John 1:9)"]],"a":[{"no":303,"t":"奉獻與對付罪","b":[["V","所以人若潔淨自己，脫離這些卑賤的，就必成為貴重的器皿，分別為聖，合乎主人使用，預備行各樣的善事。（提後2:21）"],["E","If therefore anyone cleanses himself from these, he will be a vessel unto honor, sanctified, useful to the master, prepared unto every good work. (2 Timothy 2:21)"],["P","對付罪乃是信徒奉獻之後，一個自然的結果。我們一把自己奉獻給神，要讓神使用，神就必須在我們身上有所清理和對付，好除去我們身上的難處，使我們合於祂的使用。就如我們要使用一隻玻璃杯，總是先把杯子清潔一下，整理一番，直到杯子完全乾淨，才能成為合用的杯子。當我們還沒有奉獻，或是離開了奉獻的地位，我們不大會覺得自己有什麼該對付的；乃是等到我們奉獻了，或是回到奉獻的地位上了，立刻就會發覺自己身上有許多難處，叫神根本無法使用。我們若要達到這奉獻的目的，就必須把這些難處，一一的對付清楚。我們惟有這樣自潔，才能成為貴重的器皿，合乎神用。（提後二21。）所以，我們奉獻之後，應當緊接著有對付。在我們身上所有該對付的難處，以罪為最粗暴，也最為明顯。所以我們在奉獻之後，首先必須對付的，就是罪。（生命的經歷）"]]},{"no":304,"t":"交通與對付罪","b":[["V","我們若在光中行，如同神在光中，就彼此有交通，祂兒子耶穌的血也洗淨我們一切的罪。（約壹1:7）"],["E","If we walk in the light as He is in the light, we have fellowship with one another, and the blood of Jesus His Son cleanses us from every sin. (1 John 1:7)"],["P","我們要對付罪，先要認識罪有裡面的罪性，和外面的罪行。罪性就是我們裡面罪的性情，是單數的罪。這單數的罪性，就是撒但在我們裡面的生命，我們沒有法子對付；因為越對付，它就越活。所以，對付罪是指對付我們外面所犯的罪行，也就是我們在行為上的罪。什麼是行為上的罪？約壹五章十七節說，「一切的不義都是罪。」三章四節又說，凡「犯罪的，也行不法；罪就是不法」。凡是不義、不法的行為，都是我們行為上的罪，是我們該對付的。"],["P","約壹一章七節說，我們若與神有交通，就能在光中看見自己的罪，因而就能照著在光中所看見的，向神承認，向神對付，以得著神的赦免和洗淨。因此對付罪，是根據我們在與神交通時的感覺，向人、向神有所對付。人在交通時，若在光中看見了自己的罪，而不立刻對付，交通就會受阻礙，良心就會因為有了控告而有破口；這樣，屬靈的東西就都要漏盡。"],["P","對付罪是根據交通的感覺，而交通的感覺又是根據交通的程度。交通的程度深，交通的感覺就敏銳、就眾多；交通的程度淺，交通的感覺就遲鈍、就稀少。所以，我們要擴大與主交通的範圍，把每一件事都擺到主面前；這樣，我們就能在每一件事上有感覺，而在每一件事上有對付。同時，我們也要加深與主交通的程度，使我們對罪的感覺加深，而能更徹底的對付罪。（生命的經歷）"]]},{"no":305,"t":"對付罪的實行","b":[["V","不法得赦免，罪得遮蓋的人，是有福的。（羅4:7）"],["E","Blessed are they whose lawlessnesses have been forgiven, and whose sins have been covered over. (Romans 4:7)"],["P","我們在神面前罪案的消除，乃是因著主在十字架上的救贖。主替我們承擔了神公義的審判，祂的寶血為我們滿足了神律法的要求，我們在神面前所有的罪案就得以消除。然而，這客觀的事實，若要成為我們的經歷，就還需要我們來取用。"],["P","我們得救以前所有的罪，在我們信主時，就都得著了赦免。這是行傳十章四十三節所說，「凡信入祂的人，必藉著祂的名得蒙赦罪。」所以，我們得救前罪案的消除，乃是在於我們的信，在於我們憑信而取用。至於我們得救後所犯的罪，若是在光中覺得了，就要立即向神承認；這樣，就必得著赦免和洗淨。所以，我們得救後罪案的消除，在於我們的認，在於我們憑認而取用。我們若不認，神就無法赦免，無法洗淨。我們何時認了，何時就能得著赦免，得著洗淨。這個認，也就是我們向神的對付。"],["P","至於犯罪的事實，若是虧欠神的，就必須向神對付，求神赦免；若是得罪人的，就必須向人對付，求人饒恕。若牽涉到財物和利益上的損失，就還要照所虧欠的，如數賠償。這不僅是對於得救以後所犯的罪，就是得救之前所犯的罪，也該照著裡面的感覺去一一向人對付。（生命的經歷）"]]},{"no":306,"t":"對付罪與生命","b":[["V","當他進內院，進聖所，在聖所中事奉的日子，要獻自己的贖罪祭，這是主耶和華說的。（結44:27）"],["E","And on the day he enters the sanctuary, into the inner court to minister in the sanctuary, he shall present his sin offering, declares the Lord Jehovah. (Ezekiel 44:27)"],["P","對付罪這件事，並不是一個律法的規條，乃是神的生命在我們裡面，一個自然的要求和催促。我們若常在交通中，順著這生命要求的感覺去對付，我們屬靈的生活與事奉，就必剛強釋放。我們就能常得著亮光，認識屬靈的事；而神的生命在我們裡面，也就必定自由舒展，往前長進。反之，無論是聖徒個人，或是召會團體，若是屬靈的光景不正常，失去了亮光，裡面感覺軟弱、受壓、沉悶，其原因多半是由於缺少對罪的對付。這是一個很準確的測量。"],["P","對付罪既與我們屬靈的生命，有這樣密切的關係，我們就必須繼續不斷的，在這功課上有經歷。雖然這經歷並不算深，卻沒有一個人屬靈到一個地步，可以不需要對付罪。在這功課上，是難得畢業的。所以，我們不只要查問自己曾否有過這個經歷，更要查問現在是否仍舊活在這個經歷中。正如我們不只要洗臉，並且要天天洗臉。如果三年前洗過一次，直到今天還沒有再洗過，那真不知是一張什麼樣的臉。照樣，除非我們天天不犯一點的罪，否則我們就要天天對付罪。曾有一位少年信徒問道，怎樣能叫生命有長進？人就反問他說，「你有多少日子沒有對付罪了？」誠然，我們若要生命長進，就要對付罪。那一天不對付罪，那一天生命就沒有長進；天天對付罪，就天天生命有長進。（生命的經歷）"]]},{"no":307,"t":"對付罪的原則","b":[["V","我因此操練自己，對神對人常存無虧的良心。（徒24:16）"],["E","Because of this I also exercise myself to always have a conscience without offense toward God and men. (Acts 24:16)"],["P","我們要向人對付罪，有四點基本的原則：第一，在於消除人我之間一切不安、不妥的情形。我們每有罪行，無論是否侵害到別人，若被別人知道，總會使人我之間發生不安、不妥的情形。所以，當我們蒙了光照，覺察到這罪時，一面要向神認，求神赦免；一面還要向有關的人對付，以消除人我之間一切不安、不妥的情形。甚至我們的赦免人，以及向人尋求和睦，也都是在這個對付的原則裡，使我們在宇宙中，無論對神對人，都能平安無事，和諧融洽。"],["P","第二，在於使我們的良心清潔無虧。我們每犯一個罪，不只會引起別人的反感，也會招來自己良心的定罪，使我們自己的良心有一個虧欠的痕跡。對付罪能除去自己良心的虧欠，好叫良心清潔無虧。"],["P","第三，在於見證神的救恩。一個人肯不顧損失，不顧臉面，甘心自卑的對付罪，這實在是神的救恩臨到他身上一個有力的見證。每一次真實的對付罪，都是神恩典作工的結果，也都是神恩典有力的見證。"],["P","第四，在於叫別人得益處。我們總不可因著對付罪，反而叫別人受虧損，或有難處。我們對付罪的結果，總得叫自己平安，也叫別人平安，並且能叫別人在靈性或物質上得著益處，受到造就。（生命的經歷）"]]},{"no":308,"t":"保壽險","b":[["V","但要凡事察驗，善美的要持守，各種的惡事要遠離禁作。（帖前5:21-22）"],["E","But prove all things. Hold fast to what is good; abstain from every kind of evil. (1 Thessalonians 5:21-22)"],["P","有人常問說，「主耶穌的血既然可以隨時洗淨我們的罪，我們不就可以隨便犯罪了麼？一面犯罪，一面求血洗淨，耶穌的寶血豈不是像自來水一樣麼？」說這些話的人，是不認識神的恩典，也不知道罪有多痛苦。比如一個保壽險的人，保了二十年的壽險，若是在二十年內死了，可得一萬元的保險金。請問，人能不能因為保了壽險，死了之後可以得一萬元，便儘量的傷害自己的身體，不顧惜自己的性命呢？若有這樣的人，他就不認識保險的意義，也不知道死的痛苦。我們有了主的寶血，不過是我們的一個保護，在偶然被過犯所勝時，不得已使用罷了。"],["H","福音－寶血（詩684）"],["L","何能洗去我汙點？|無他，惟有耶穌寶血！"],["L","何能恢復我完全？|無他，惟有耶穌寶血！"],["L","（副）哦，這血泉何妙！|洗我如雪白皎！"],["L","別泉無此功效：|無他，惟有耶穌寶血！"]]},{"no":309,"t":"創傷藥","b":[["V","神阿，求你為我造清潔的心，使我裡面重新有正直的靈。（詩51:10）"],["E","Create in me a clean heart, O God, and renew a steadfast spirit within me. (Psalm 51:10)"],["P","有一次，我住在一位朋友家中。一天早晨，我用刮鬍刀刮臉，失手將臉割破。那位朋友家中備有許多醫藥用品，他一見我割破了臉，立刻拿出一瓶創傷藥，取出一些塗在我的傷處；並將該藥送我一瓶，告訴我說，無論什麼時候，割破了臉，或是割傷了手，可在傷處隨時塗上一些，免得細菌感染，發生危險。我的朋友還應許我，什麼時候用完這瓶藥，就還要再送給我。因為得了這樣有用的藥，可以避免受傷感染之危，我便十分感謝我的朋友。"],["P","之後，我回到自己屋裡，打開瓶子一看，瓶內的藥真是不少，計算一下，總可用上百多次。我不能因此拿起刮鬍刀，向自己臉的左右邊，橫豎割幾刀，然後將藥取出來，照著傷口數目一一塗上，說，「現在可好了，我有創傷藥，可以時常割破臉、手，無所顧慮了。」如果我真是這樣作，看見的人豈不以為我瘋了？創傷藥是有用的好東西，我感謝領受朋友的饋贈，並且好好保存這藥，以備失手割破皮肉之時可以使用；然而，我絕不肯因為有了創傷藥，就去任意割破皮肉。割破皮肉，自己要受傷害，要感痛苦，這除非是精神異常的人，否則有誰肯這樣作？"]]},{"no":310,"t":"銀鼠","b":[["V","借這榮耀和美德，祂已將又寶貴又極大的應許賜給我們，叫你們既逃離世上從情慾來的敗壞，就藉著這些應許，得有分於神的性情。（彼後1:4）"],["E","Through which He has granted to us precious and exceedingly great promises that through these you might become partakers of the divine nature, having escaped the corruption which is in the world by lust. (2 Peter 1:4)"],["P","銀鼠有一個習性，寧肯付出任何代價，也要保持它皮毛的清潔；所以老練的獵人，就利用它這習性來捕捉它。獵人先尋出銀鼠的巢穴，然後把極骯髒的東西放在巢穴口上。當銀鼠被獵犬追逐，逃回洞口之時，看見汙物攔阻去路，立即轉過身來，面對瘋狂的獵犬。銀鼠寧願流血，犧牲性命，也不容自己的身體被玷汙。"],["P","基督徒有一個聖潔的生命，喜歡過聖潔的生活，是最怕犯罪的。"],["H","經歷基督－作生命（詩381）"],["L","主，你是我生命，|活在我裡面；"],["L","帶著神的豐盛，|來將我充滿。"],["L","你的聖別性情，|使我能成聖；"],["L","你的復活大能，|使我能得勝。"]]},{"no":311,"t":"母親指頭流血","b":[["V","我的孩子們，我將這些事寫給你們，是要叫你們不犯罪。若有人犯罪，我們有一位與父同在的辯護者，就是那義者耶穌基督。（約壹2:1）"],["E","My little children, these things I write to you that you may not sin. And if anyone sins, we have an Advocate with the Father, Jesus Christ the Righteous. (1 John 2:1)"],["P","某地有一法規，凡賭博的，要罰五百盧比。有一次，官吏捉住兩個少年賭徒，把他們下在監裡。其中一個是財主的兒子，另一個是鄉間的窮人。五百盧比對財主而言，實在算不得什麼，所以財主立時繳納，他兒子就被釋放了。然而窮人無法繳納，只得留在監裡。窮人的母親終日勞苦，替人搬運石頭，為要湊足錢數，好繳罰款。辛勞中，石頭砸傷了她的手，就流出血來。一天母親來探監，從監獄的窗口，少年賭徒看見了母親的手，就問她說，「母親，你手上是什麼傷？你指頭上那來的血？」母親就把所作的事仔細告訴了他。最後她積攢了五百盧比，把她兒子保釋出來。"],["P","有一天，那個財主的兒子遇見了這個窮人的兒子，又邀他去賭博。他回答說，「從今以後，我不能再作那事了。你的赦免得來很容易；我卻因著母親的辛苦工作，並她受傷流血才得釋放。這種使我母親忍痛受苦的玩意，我連看也不願再看了。」主為我們流血捨命，也是付了極大的代價！"]]},{"no":312,"t":"巴不得地板開口","b":[["V","我差你到他們那裡去，叫他們的眼睛得開，從黑暗轉入光中，從撒但權下轉向神，又因信入我，得蒙赦罪，並在一切聖別的人中得著基業。（徒26:17-18）"],["E","To whom I send you, to open their eyes, to turn them from darkness to light and from the authority of Satan to God, that they may receive forgiveness of sins and an inheritance among those who have been sanctified by faith in Me. (Acts 26:17-18)"],["P","有位基督徒問一個猶太人，要不要得救？他回答說不要。但那位基督徒勉強他一同跪下禱告，求神使他認識自己。當神的光一照，他才知道自己的汙穢是多厲害；他看見自己的罪，巴不得地板開口，把他吞下去才是。這給我們看見，要叫人認識自己是一個罪人，也必須藉著神的光照。"],["H","得救的證實與快樂－借恩得救（詩251）"],["L","一切我所有，|無非是接受；"],["L","全是恩所賜，|在我信之後；"],["L","所以不自誇，|也不自尊，"],["L","我是一個罪人蒙主恩！"],["L","（副）我是個罪人蒙主恩！|我是個罪人蒙主恩！"],["L","這是我身分，榮耀歸給神，|我是個罪人蒙主恩！"]]},{"no":313,"t":"綵衣擦泥","b":[["V","祂便救了我們，並不是本於我們所成就的義行，乃是照著祂的憐憫，藉著重生的洗滌，和聖靈的更新。（多3:5）"],["E","Not out of works in righteousness which we did but according to His mercy He saved us, through the washing of regeneration and the renewing of the Holy Spirit. (Titus 3:5)"],["P","有一個孩子，家裡很有錢。有一天，他母親給他穿上一件簇新華麗的五彩衣服，和一雙新鞋。他便歡歡喜喜的出去逛街，要叫看見的人羨慕。他昂首闊步，一不小心，卻一腳踏入汙泥溝中，漂亮的一隻鞋就弄髒了。他急忙之中，用衣袖擦鞋子，那知鞋上的髒弄淨了，綵衣的袖子卻汙了。他覺得不對，連忙把袖子往衣襟上擦，結果越弄越髒；七弄八弄，弄得漂亮的五彩衣，都滿了汙泥。"],["P","人有了罪，自己是無法自救的；惟有認罪悔改，靠主寶血才得洗淨。"],["H","福音－呼求（詩731）"],["L","永久磐石為我開，|讓我藏身在你懷；"],["L","願你所流血與水，|解決我的雙重罪："],["L","贖我免去它永刑，|救我脫離它權能。"]]},{"no":314,"t":"最體面的人","b":[["V","因為只有一位神，在神和人中間，也只有一位中保，就是那人基督耶穌；祂舍了自己，為萬人作贖價，在適當的時期，這事就證明出來。（提前2:5-6）"],["E","For there is one God and one Mediator of God and men, the man Christ Jesus, who gave Himself as a ransom for all, the testimony to be borne in its own times. (1 Timothy 2:5-6)"],["P","有一個婦人，她的兒子被判了死刑。有人領她去見林肯總統，請求赦免。林肯總統應允了，赦免了她的兒子。這位母親由於過分驚喜，出了總統辦公室，半晌說不出話來。之後，突然對引領她的人說，「我知道這是謊言！」那人很驚訝的問：「怎麼是謊言？」婦人說，「人家告訴我，林肯相貌醜陋；可是他是我一生所見最體面的人。」"],["P","我們若是偶然犯了罪，在父那裡我們有一位中保，就是那義者耶穌基督。祂喜愛憐恤，只要我們到祂面前認罪，必蒙赦免，並會覺得祂是何等可愛可親。主耶穌說，「她許多的罪都赦免了，因為她愛得多。」（路七47。）"]]},{"no":315,"t":"悔改直到見主耶穌","b":[["V","基督耶穌降世，為要拯救罪人，這話是可信的，是值得完全接受的；在罪人中我是個罪魁。（提前1:15）"],["E","Faithful is the word and worthy of all acceptance, that Christ Jesus came into the world to save sinners, of whom I am foremost. (1 Timothy 1:15)"],["P","亨利腓力是主大用的僕人。有一天，一個青年人來問他：「一個人必須悔改多長多久呢？是否要一直的悔改呢？」亨利回答說，「我盼望帶著我的悔改，直到見主。我每天都發現我的罪，並且覺得自己需要悔改。我的意思是，藉著神的幫助，我是帶著我的悔改直到見主。」保羅說，「在罪人中我是個罪魁。」對於我們的每一個罪，豈不都有一個聲音催促我們悔改麼？"],["H","奉獻－全都獻主（詩339）"],["L","主，你得著我一生，|使它歸你成為聖；"],["L","得著我日與我時，|歸你使用永無止。"],["L","（副）"],["L","為我荊棘冠冕你肯戴，|為我釘死苦架你受害；"],["L","為你我願獻上我命與我愛，|事你、愛你到萬代。"]]},{"no":316,"t":"末次認罪在何時","b":[["V","神所要的祭，就是憂傷的靈；神阿，憂傷痛悔的心，你必不輕看。（詩51:17）"],["E","The sacrifices of God are a broken spirit; a broken and a contrite heart, O God, You will not despise. (Psalm 51:17)"],["P","有一次，亞謙向羅百思問起基督徒靈命長進的事。羅百思回答亞謙說，「你末了一次的認罪，是在什麼時候？」這一問亞謙不懂了。他想，難道認罪這件事是應當天天作的，如同吃飯一樣麼？他想到自己有好幾年沒有認罪了。以後他才知道，當時羅百思對他所說的是什麼意思。亞謙說，一個基督徒所以有進步，就是因為他認罪；得罪神的，向神認；得罪人的，向人認。這樣，就能使他的靈性有進步。"],["H","羨慕－在主裡的長進（詩298）"],["L","哦主，求你長在我心，|你外再無他求！"],["L","使我逐日與你更親，|逐日向罪自由。"],["L","（副）願你逐日維持的力，|仍然顧我軟弱，"],["L","你的亮光除我陰翳，|生命吞我死涸。"]]},{"no":317,"t":"只認偷繩不認偷牛","b":[["V","求你將我的罪孽洗滌淨盡，並潔淨我的罪。（詩51:2）"],["E","Wash me thoroughly from my iniquity, and from my sin cleanse me. (Psalm 51:2)"],["P","某地召會有一週的聚會，聖靈作工，結果受感蒙恩的人為數不少。聽眾之中，有一個生活窮苦的小偷，願意悔改，信靠耶穌。會後他跑到臺前，要求傳道人替他禱告；自己也在神前認罪說，「主阿，我是一個大罪人，不該偷了人家的牛橛子，求主赦免。」禱告完了，心中還是不得平安。第二天，他又走到臺前認罪：「主阿，求你赦免我的罪，因我偷過人家的一條牛韁繩。」認罪回來，心靈還是不得平安。第三天會後，又到臺前認罪說，「主阿，求你赦免我偷了一隻大牛，我要設法賠償。」這時，他心中宛如一塊大石掉了下來，立刻得到完全的平安。"],["P","事實的經過是這樣：一天夜裡，他乘人家不備，下手偷竊人家拴在牛棚裡的一隻牛。因為有動靜，他就顧不得解開韁繩，連忙拔起橛子，連繩帶牛牽著跑了。當他聽福音時，聖靈責備他；但他只在神面前承認偷了橛子、韁繩。他想借此能使良心平安，可是聖靈並不放過他，直到他承認偷牛的罪。"],["P","認罪必須徹底，才能得到真正的平安。"]]},{"no":318,"t":"扔包袱","b":[["V","所以親愛的，我們既有這些應許，就當潔淨自己，除去肉身和靈一切的玷汙，敬畏神，以成全聖別。（林後7:1）"],["E","Therefore since we have these promises, beloved, let us cleanse ourselves from all defilement of flesh and of spirit, perfecting holiness in the fear of God. (2 Corinthians 7:1)"],["P","有一個女人，拿著一大包汙穢的衣服，到河邊去洗。到了河邊，怕人家看見她的衣服都很汙穢，就不敢一件一件的洗。她將成包的衣服浸入水中，又趕快的拿起來；旋即又再浸下去，再拿起來；如此作了數次，就回家去了。當然，她的衣服沒有一件是洗得乾淨的。"],["P","基督徒在神面前認罪，不可只是籠統求神赦免一切的罪，猶如包袱在神面前一扔，就算了事；乃必須打開包袱，一件一件拿出來認，如同點交一樣，一一求主寶血洗淨。"],["H","挖透我（補408）"],["L","挖透我，挖透我，挖透我，|挖去我心裡所有硬石頭！"],["L","所有罪，皆脫落，|讓生命湧流！阿利路亞！"],["L","挖透我，挖透我，挖透我，|挖去我心裡所有硬石頭！"]]},{"no":319,"t":"禮貌的認罪","b":[["V","我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。（約壹1:9）"],["E","If we confess our sins, He is faithful and righteous to forgive us our sins and cleanse us from all unrighteousness. (1 John 1:9)"],["P","有一天，有一個人到畢爾撒弟兄那裡說，「我對不起你。我前天向你說謊，欺騙了你。」他說，「不要緊。過去的事，就算了吧。」第二天，那人又來對他說，「論到我對你撒的謊，我實在難過，求你赦免我。」他說，「我不是已經赦免了你麼？不用再題了。」第三天，那人又來對他說，「我對你撒了謊，欺騙了你，實在覺得不是，不配和你再講話。」又過了二天，又說這一套。畢爾撒就說，「你不要再來麻煩我了。你不相信我已經饒恕你了麼？」"],["P","信徒認罪必須裡面蒙光照，然後出於誠心，只要一次就夠，無須重複，否則只是徒具形式而已。聖經說，「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。」"]]},{"no":320,"t":"吃擦禱","b":[["V","我若心裡注重罪孽，主必不聽。（詩66:18）"],["E","If I regarded iniquity in my heart, the Lord did not hear. (Psalm 66:18)"],["P","有一對夫婦，生了一個小孩，名叫莉莉，聰明伶俐。一天，夫婦倆都出去，只留小孩在家。小孩玩了一會，就跑到桌子那裡，拿了一瓶麥芽糖，吃了幾口。她知道這樣偷吃東西，不但爸媽不喜歡，天父也不喜歡；於是小手就在衣服上擦擦，跪下禱告，求天父饒恕她偷吃的罪。誰知沒過一會兒，又想起麥芽糖好吃，再回去吃了幾口；吃後，又去禱告。直到她父母回來，看見她衣裳黏滿麥芽糖，就對她說，「莉莉，你今天又犯罪了。」「媽媽，對不起，我每次吃完，就去擦手，擦後就去禱告，求主赦免。因為麥芽糖太好吃，我忍不住就偷吃起來。」"],["P","多少時候，我們又何嘗不是如此，屢次犯罪，屢次禱告；屢次禱告，屢次犯罪。大衛說，「我若心裡注重罪孽，主必不聽。」"],["H","禱告－告訴主（詩571）"],["L","何等朋友，我主耶穌！|擔我罪孽負我憂；"],["L","何等權利，|能將難處到主面前去祈求。"],["L","多少平安屢屢喪失，|多少痛苦無須受；"],["L","無非我們未將萬事|到主面前去祈求。"]]},{"no":321,"t":"天性如此","b":[["V","犯罪的是出於魔鬼，因為魔鬼從起初就犯罪。為此，神的兒子顯現出來，是要消除魔鬼的作為。（約壹3:8）"],["E","He who practices sin is of the devil, because the devil has sinned from the beginning. For this purpose the Son of God was manifested, that He might destroy the works of the devil. (1 John 3:8)"],["P","有一個寓言說到，一條毒蛇被困在一圈火焰中間，無法逃脫，就對在旁觀看的一個少年人說，「先生，請你挑我出來。」那人說，「我若這樣作，你會咬我。」毒蛇再三請求，並且發誓不咬那人。最後，那人把蛇挑了出來。忽然間，蛇就露出犀利的毒牙，預備要咬噬那人。那人連忙對蛇說道：「你曾答應不咬我的。」蛇說，「我知道我答應過你，但我天性如此。對不起，我不能控制自己。」結果，那少年終於死在毒蛇口中。"],["P","罪和世界的試探也是這樣，必須開頭就不容讓。"],["H","禱告－告訴主（詩571）"],["L","我們有否苦難、艱辛？|有否試探和引誘？"],["L","不能因此失望、灰心，|應當向主去祈求。"],["L","誰能像祂忠實、穩妥，|揹我重擔分我愁？"],["L","惟祂知我每一軟弱，|故當向主去祈求。"]]},{"no":322,"t":"種一次收一次","b":[["V","為著自己的肉體撒種的，必從肉體收敗壞；為著那靈撒種的，必從那靈收永遠的生命。（加6:8）"],["E","For he who sows unto his own flesh will reap corruption of the flesh, but he who sows unto the Spirit will of the Spirit reap eternal life. (Galatians 6:8)"],["P","從前有一個修道士，希望取得毗連修道院的一片田地，但那地主拒絕出售。經過多次勸說、協商，總算答應了；但只答應租給修道院種植一次，收成一次。契約訂好之後，豈知那位修道士竟撒下橡樹的種子；這次的種收不是一年，而是三百年。"],["P","同樣的，撒但先是要求我們的心田，容讓一點過犯和汙穢。他告訴我們，這是一個不關緊要的罪。結果，他把種子種下去，就永遠佔據了那片心田。是的，小罪的危險就在於它不會永遠「小」。"],["H","試煉中的安慰－信靠主（詩519）"],["L","當我在我路上遇見試探時，|撒但就在耳語叫我可放弛；"],["L","但是負擔雖重我已不發愁，|只要一點相信就趕難處走。"],["L","（副）"],["L","主，我相信！主，我相信！|求提高我信你的心，"],["L","使我能以移山；主，我相信！|主，我相信！"],["L","我的疑慮全投在你身畔。"]]},{"no":323,"t":"小榆樹","b":[["V","私慾懷了胎，就生出罪；罪既長成，就產生死。（雅1:15）"],["E","The lust, having conceived, gives birth to sin; and the sin, when it is fully grown, brings forth death. (James 1:15)"],["P","有一位姓趙的人，在城牆腳下蓋了一間房子。有一天，他父親對他說，城牆上頭那棵小榆樹，必須要拔掉，免得將來長大，弄崩城牆，壓倒房子，傷害性命。兒子不聽，以為樹小，無關緊要。後來父親去世，自己又忙於作生意，一直沒去理會。十年之後，榆樹長大。適有一天，狂風暴雨，榆樹被吹，搖動甚烈。結果城牆崩潰，壓倒他的房子。小兒子立刻被砸死，妻子的腿被壓斷，自己也受了重傷。每一個罪都得對付，不要以為小罪無關緊要，不去對付。雅各說，「私慾懷了胎，就生出罪；罪既長成，就產生死。」"],["H","鼓勵－警醒（詩486）"],["L","警醒阿，黑夜已深！|警醒，莫戀紅塵；"],["L","警醒阿，白晝將近！|警醒，莫睡沉。"],["L","警醒阿，主就要來！|警醒，莫松腰帶；"],["L","警醒阿，主在等待！|警醒，莫懈怠。"]]},{"no":324,"t":"射死一隻鴨子","b":[["V","遮掩自己罪過的，必不亨通；承認離棄罪過的，必蒙憐憫。（箴28:13）"],["E","He who covers his transgressions will not prosper, but whoever confesses and forsakes them will obtain mercy. (Proverbs 28:13)"],["P","一位弟兄到非洲傳道。那裡生活便宜，他便請了幾個工人。一個黑人小孩，他會拿橡皮作成弓箭，射無不中。有一天，一箭射死主人的一隻鴨子。不得了，主人若要他賠，他賠不起，怎麼辦呢？他就想了一個辦法，快快挖一個坑，把那死鴨埋掉。雖然沒人看見，心裡卻是常常不安，時時記起那隻死鴨。有一天，廚子對他說，「快去替我挑水。」他說，「挑水不是我的事。」廚子說，「你要小心阿，我看見你射死鴨子，我要告訴主人。」他害怕了，便快快去挑水。廚子叫他去劈柴，他說，「我沒有力氣。」廚子說，「你射死鴨子，我去告訴主人。」他又害怕，就去劈柴；他天天作廚子的奴僕，心裡又不安，因為有個死鴨子。"],["P","日子這樣過得很不安寧，有一天，他乾脆到主人面前跪下，痛哭流涕。主人問他什麼事？他就告訴主人，自己怎樣射死了一隻鴨子，怎樣把鴨子埋了。主人說，「知罪認罪，我赦免你。」他心裡從此平安了。"],["P","有一天，廚子又叫他挑水。他說，「我不挑。」廚子問他記不記得那隻死鴨子。他說，「我不怕你。」廚子說，「我去告訴主人。」他說，「你去告吧，我不怕。我認罪了，我心裡平安了。」信徒若是有罪不肯承認，就會受撒但控告，晝夜心裡不安，以致落在他的手中。然而，什麼時候向主認罪，什麼時候心裡立刻得到平安，那惡者也就無能為力了。"]]},{"no":325,"t":"只留一畝","b":[["V","生氣卻不要犯罪，不可含怒到日落，也不可給魔鬼留地步。（弗4:26-27）"],["E","Be angry, yet do not sin; do not let the sun go down on your indignation, neither give place to the devil. (Ephesians 4:26-27)"],["P","有一個人名叫貝遜，他說，「我從前讀法律時，記得法律裡有一種『保留權』。比方我有十萬畝的地皮，賣了九萬九千九百九十九畝給人，自己只留下一畝。按著法律，雖然九萬九千九百九十九畝都已屬乎別人；買主總得留一條路，讓我出入，這就是『保留權』。」照樣，信徒若有一點罪保留不肯對付，也會給撒但留地步，自由出入。"],["H","得救的證實與快樂－生命改變（詩242）"],["L","聖靈充滿我！|充滿我！充滿我！"],["L","聖靈充滿我！|除去我罪過，"],["L","消滅我軟弱，|使我結義果，"],["L","並過聖潔生活：|聖靈充滿我！"],["L","充滿我！充滿我！"]]},{"no":326,"t":"見人問得救","b":[["V","主…不願任何人遭毀壞，乃願人人都趨前悔改。（彼後3:9）"],["E","The Lord …not intending that any perish but that all advance to repentance. (2 Peter 3:9)"],["P","山東平度地方有一位姓孟的教士，有一天，她感覺需對信徒講到罪。然而，她從小就是基督徒家庭長大的人，對罪沒有什麼經歷。她就開始禱告，禱告幾天以後，忽然有一天，聖靈給她看見異象，看見罪的汙穢可憎；彷彿眼看的是罪，聞的是罪，坐的也是罪，整個人都在罪的空氣裡，非常厭惡。從此以後，她講道的題目改了，每次都講罪，極有聖靈的能力，並摸著人的最深處，結果帶進了那地方的一次大復興。"],["P","有一次，一位侯小姐的三哥，前去參加那裡的特別聚會。會後，孟教士走來問他說，「你得救了沒有？」他說，「得救了。」孟教士說，「聽聽你的聲音，不像得救的。」第二天照樣又問他得救沒有？他說，「得救了。」孟教士就說，「看看你的眼睛，還是死的，不像得救的，還有罪。」第三天仍舊找他問了一陣。他被這位孟教士弄得很厭煩，自己也覺得自己的眼睛好像是死的。在那一天，他就回家求神光照。結果聖靈把他所犯的罪，都陳列在他面前，好像流水賬一樣，越看越覺得汙穢，他就認罪悔改。末了，聖靈又給他看見十字架的拯救，祂的血已經洗淨了所有的罪。他便得了大釋放。第四天再去聚會時，他說，我不告訴孟教士，我已清楚得救；我要她對我說我是得救了。到第四天，他坐在前排聽道。孟教士講道講到中途，注目看他，突然說道：「有一個人已經得救，請他上來作個見證。」孟教士又找到他，對他說，「恭喜你，你真是蒙恩得救了。」"]]},{"no":327,"t":"不敢抬頭看老師","b":[["V","我向你陳明我的罪，不遮瞞我的罪孽。我說，我要向耶和華承認我的過犯；你就赦免我的罪孽。（詩32:5）"],["E","I acknowledged my sin to You, and I did not cover my iniquity. I said, I will confess my transgressions to Jehovah. Then You forgave the iniquity of my sin. (Psalm 32:5)"],["P","在一所小學裡，有一天，學生下課離開教室，到操場遊玩，只有一個學生留在教室。他看見一把美麗的小刀，就起了貪心，把它偷去。等到大家都回到教室時，失主發現小刀不見了，就報告老師。老師追究的結果，大家都說沒有偷取。老師便一面講課，一面暗中觀察。其中有位學生一直不敢抬頭看老師，老師立刻問他說，「你為什麼不敢抬頭看我，莫非你偷了小刀？」這位小孩許久不敢開口，後來才戰戰兢兢的承認說，「是的。」"],["P","信徒若是有罪不認，也會靈裡不能昂首，以致沉悶，爬不起來，羞澀不敢見主。"]]},{"no":328,"t":"靠傳道吃飯","b":[["V","凡住在祂裡面的，就不犯罪；凡犯罪的，是未曾看見祂，也未曾認識祂。（約壹3:6）"],["E","Everyone who abides in Him does not sin; everyone who sins has not seen Him or known Him. (1 John 3:6)"],["P","齊先生雖然作了多年牧師，卻還沒有得救。然而，他所預備的講章有一百多篇，他說，「我的講臺稿夠三年用，每一個地方作三年牧師，走十個地方就可以作三十年牧師。三十年後就可以得到一筆養老金，這輩子的生活問題就解決了。」他聚會的辦法，是用電影和詩歌班來吸引人聽道，可是沒有聖靈的能力。電影散了，人也散了；詩歌班唱完了，人也走了；工作沒有果效。神要他退去，他急得走投無路，牧師飯吃不成了。有一天，他看見自己的罪，就大大悔改，果然真得救了。從此，他的講臺改變了，聽的人也得造就。"],["H","與基督的聯合－聯於祂死與復活（詩366）"],["L","人哪！你愛何物，|你就變成該物："],["L","成神，你若愛神；|成塵，你若愛塵；"],["L","你出，神就進入；|你死，神就生蘇；"],["L","無你，就有基督；|無物，就得萬物。"],["L","（副）"],["L","哦！基督的十字架，|我接你進我心，"],["L","使我脫自己管轄，|完全憑主而生存。"]]},{"no":329,"t":"有膽量了","b":[["V","求你用牛膝草潔淨我的罪，我就潔淨；求你洗滌我，我就比雪更白。（詩51:7）"],["E","Purge my sin with hyssop, and I will be clean; wash me, and I will be whiter than snow. (Psalm 51:7)"],["P","一位得救多年的弟兄，聽見負責弟兄報告有受浸聚會，就要求幫助施浸；聽見有按手的事，就要求被按手；但都未蒙答應。在按手聚會之前的一次聚會中，他聽到負責弟兄講到按手的信息，其中有兩句話說，「按手不可急促，不可在別人的罪上有分。」這兩句話，深深摸著這位要求施浸與按手的弟兄，立刻看見兩件罪。進而就由兩件看見四件、六件、八件、十件，以致看見一大堆的罪。從此他不敢去聚會，因為他想，如果再去聚會，和弟兄們拉手，不是要把弟兄玷汙了麼？他也不敢去擘餅，因為有罪尚未對付。"],["P","所以，他就開始操練，看見書，就想起曾經拿了圖書館的書；用錢，就想起曾經私自挪用了公款；穿衣，就想起曾把別人託他轉交的毛衣拿來穿用。已往許多不義，主都在環境中給他點出來；他也都一一對付了。事後，他在聚會中見證說，「未了結對付時，我雖常來聚會，總是憂悶回去。有時朋友要和我談談靈魂的事，撒但就控告說，我這樣的人，那配傳揚福音，於是常常藉故推辭脫身。感謝主，現在我有膽量對人傳福音了。」哦，我們作見證沒有力量，在別人蒙恩時被關在門外沒有分，常是因為我們有罪沒有對付。如果我們有心要對付，神必在環境中給我們興起事情，叫我們想起多年忘記的罪。"]]},{"no":330,"t":"鞋錢還未給我","b":[["V","持守信心和無虧的良心；有人丟棄這些，就在信仰上猶如船破。（提前1:19）"],["E","Holding faith and a good conscience, concerning which some, thrusting these away, have become shipwrecked regarding the faith. (1 Timothy 1:19)"],["P","從前有一個人很會講道。有一天，他在一個大聚會裡講道，講得正得意時，就作見證說，「你們知道，我實在蒙了重生。現在我腳所站之處，就是以賽亞二十六章四節所說的『永久的磐石』。」聽眾之中忽有一人站了起來說，「這位作見證的先生，說他是站在『永久的磐石』上，這話完全不對；他的腳是站在一雙鞋子裡面。這鞋子是在我鋪子裡買的，價錢十二元五角。這鞋子很結實，他差不多穿了一年。我向他要鞋價，至今尚未給我。這樣，他所站的豈是『永久的磐石』麼？」當你說你是蒙恩的人時，你是否還有不義在你身上呢？若是有，請快快對付，否則你的見證並不榮耀主名，因為給撒但留了地步。"]]},{"no":331,"t":"臺上講道路上戲言","b":[["V","還有淫辭、妄語、或是粗鄙的戲言，都不相宜，寧可說感謝的話。（弗5:4）"],["E","And obscenity and foolish talking or sly, filthy jesting, which are not becoming, but rather the giving of thanks. (Ephesians 5:4)"],["P","有一個農夫在病危時，把傳道人請到家中。寒暄完後，農夫說，「遠在二十年前，我曾聽過先生講道，當時我心裡頗受感動，覺得我是一個罪大惡極的人，若不悔改，必遭沉淪。散會回家途中，你我恰巧同走一路，本想就近先生聆聽教誨，好開我的迷濛；但先生途中與一位友人所談的，多是戲謔之辭。於是我想，先生所講的道，定規不是真的，不然何以途中所說的話，和講臺上所說的話如此懸殊呢？因此，我不再為罪存有惶恐的心。然而，現在死期將至，為罪惶恐的心又復萌了，不知先生可否教我？」"],["P","信徒們，當你與人接觸時，所有淫辭、妄語、和戲笑的話都不相宜；因為一句不檢點的話，就能把人絆倒。我們總要說感謝的話，說造就人的話，才合聖徒的體統。"]]},{"no":332,"t":"加萊燈塔","b":[["V","你們的光也當這樣照在人前，叫他們看見你們的好行為，就榮耀你們在諸天之上的父。（太5:16）"],["E","In the same way, let your light shine before men, so that they may see your good works and glorify your Father who is in the heavens. (Matthew 5:16)"],["P","一個遊客，問一位加萊海岸的燈塔管理員說，「假若有一支燈偶然熄滅了，怎麼辦呢？」管理員回答說，「不，絕不可能。因為全世界人的眼睛都在注視著我。雖然我們的眼看不見什麼，但是每時每刻都有船舶駛往世界各處。如果今晚塔上燈光暗了，或是熄了；幾個月後，就會有信由外國寄來，責問某晚某時，管理的人失職…。加萊燈塔不亮，某某輪船險些遇險。」"],["P","照樣，世人的眼睛每時每刻都在看著神的兒女，看著他們行事為人，是否像光明的兒女。"],["H","我是世上光（兒1101）"],["L","我是世上光，純淨又明亮，|像一枝小蠟燭，在夜裡發光，"],["L","要將黑暗世界照耀輝煌，|我是世上明光，純淨明亮。"]]},{"no":333,"t":"三個金鎊十八個先令","b":[["V","他若被發現，就要賠還七倍，要將家中所有的盡都交出。（箴6:31）"],["E","But if he is found out, he shall restore sevenfold; he must give over all the substance of his house. (Proverbs 6:31)"],["P","在英國，有一次梅爾講道，忽然指著臺下聽道的人說，「看哪，這裡有一個少年人，偷了他主人三個金鎊十八個先令。他若不去償還，永遠沒有平安。」到了第二天，果真有一少年人，來見梅爾，說，「昨天你在臺上所說的人就是我，我實在曾經偷了主人三個金鎊十八個先令，心裡一直沒有平安。看哪，這是一張支票，我要以此全數償還。」"],["P","這些賠償的事乃是神所喜歡的，也常是聖靈特別的工作。因為所有用不義、不正當的方法得來的，在我們得救的人手中，都像屍首一樣，使我們不能好好過屬靈的生活。所以，我們應該清理一切不義的財物，按著正路一一償還。"],["H","羨慕－恩典（詩319）"],["L","我無能力，我的主，|無法孤獨、孤獨的站立；"],["L","我的軟弱成祝福，|如果完全、完全倚靠你。"],["L","（副）每一點，每一天，|我是一樣需恩典，"],["L","我仍一樣是無倚，|求你更多、更多顯自己。"]]},{"no":334,"t":"珍珠項鍊和馬克","b":[["V","你同告你的對頭還在路上，要趕緊與他和息，免得他把你交給審判官，審判官交給差役，你就下在監裡了。我實在告訴你，非到你還清最後一分錢，你絕不能從那裡出來。（太5:25-26）"],["E","Be well disposed quickly toward your opponent at law, while you are with him on the way, lest the opponent deliver you to the judge, and the judge to the officer, and you be thrown into prison. Truly I say to you, You shall by no means come out from there until you pay the last quadrans. (Matthew 5:25-26)"],["P","有個當保母的姊妹，得救以前，竊取主人一串很美麗的珍珠項鍊。當人控告她時，她竟然在警官面前起誓，說她沒有拿那項鍊。過了兩、三年，事情已經被遺忘，但她得救了，這個被遺忘了的罪案，開始叫她苦惱不安。以後，她向主人承認這事，並把項鍊還給主人，她就非常喜樂。然而過了不久，她又垂頭喪氣；因為聖靈再光照，原來她不單偷了那串項鍊，而且還竊取十五個馬克。後來她又把那十五個馬克還給主人，從此才有真正的喜樂。"],["P","在我們所對付的罪中，若剩下一件沒有對付，這件必追上你，苦苦纏著你。"]]},{"no":335,"t":"挨家還毛線","b":[["V","要讓基督的平安在你們心裡作仲裁。（西3:15）"],["E","Let the peace of Christ arbitrate in your hearts. (Colossians 3:15)"],["P","有位姊妹生活貧寒，但她有一個手藝，會打毛線衣。到了秋天，她就靠著替人打毛線衣維持生活。然而，每次剩下的毛線，她都不還給原主。積存多了，就用各色積存的毛線，為她兒子打毛線衣。有一天，她蒙到聖靈光照，看見她拿了人家的手工錢，還留下人家的東西，實在是不義，覺得該將毛線還給各人。可是，這些毛線已經打成毛衣，穿在她兒子身上，若是把這毛衣脫了下來，可能會使她兒子因此生病；但不還給人，心裡又不平安。於是十分為難。掙扎許久，還是順服聖靈的光照，將她兒子的衣服脫下，所有的毛線都拆下，清洗乾淨，挨家送還原來的主人。送的時候，真是覺得難為情，但送完之後，那個喜樂實在無法形容。"]]},{"no":336,"t":"抵銷不是對付","b":[["V","你們要以恩慈相待，心存慈憐，彼此饒恕，正如神在基督裡饒恕了你們一樣。（弗4:32）"],["E","And be kind to one another, tenderhearted, forgiving one another, even as God in Christ also forgave you. (Ephesians 4:32)"],["P","有位弟兄在服裝店作了一件大衣，作好後送來，才發覺衣料被服裝店老闆賺了，大不滿意，就不給老闆工價。兩人因而發生口角。三年後，這位服裝店的老闆得救受浸了。每逢聚會，這兩位弟兄因為已往的口角，彼此都覺得有些難為情。這位得救多年的弟兄，就去問一位負責弟兄說，「弟兄，我和一位服裝店的弟兄，三年前有一件事還沒解決。他給我作了一件大衣，因為賺了我的衣料，我就沒有付他工價。現在我有引導，要去對付這個不義。可是我又想到，他所賺下我的衣料怎麼辦？你看，我是給他工價好呢，還是不給他工價好？」負責弟兄回答說，「你是得救多年的弟兄，並且你的經濟狀況比他富裕，既然有了引導要對付，你就付他工價好了。至於他賺你的衣料，那是他的不義。」"],["P","第二天，這位弟兄就到服裝店去，向那位弟兄認罪，並且付還工價。第三天，那服裝店的弟兄，拿著昨天送還的工價，和三年前賺下的衣料，來向這位弟兄說，「弟兄，按照成衣公會的規章，給人作壞了衣服，不許要工價。那一次我的確給你作壞了，並且賺下你的衣料。工錢我是不能收，衣料請你收下，並且求你饒恕我這偷賺衣料的罪。」他們兩人就在主面前和睦，跪下禱告，彼此認罪。"],["P","我們不能因為對方對不起我，我也就對不起他；對方虧欠我，我也就虧欠對方，以作為彼此的抵銷，而不對付。這種抵銷絕不是對付。"]]},{"no":337,"t":"神不用賊錢","b":[["V","凡稱呼主名的人，總要離開不義。（提後2:19）"],["E","Let everyone who names the name of the Lord depart from unrighteousness. (2 Timothy 2:19)"],["V","凡事都不可虧欠人。（羅13:8）"],["E","Owe nothing to anyone. (Romans 13:8)"],["P","福建有一個女傭，曾經偷她主人價值六十元左右的東西。後來她信了主，覺得這件事是罪，就積存了七十塊錢為著賠償之用。她把這筆款項送給一位作工的弟兄，並且把經過的緣由告訴了他，請他收下此款，為神工作之用。這位弟兄就問她說，「你的主人還在麼？」她說，「在。」這位弟兄說，「你為何不拿去還給他呢？」接著頂嚴重的對她說，「神用不著作賊的錢，供給祂的工作。」"],["P","若有人在物質上得罪了人，當找物主償還；若物主不在了，就找家族；沒有家族，就可交給召會。總得對付得徹底，了結這些得罪人的事。"]]},{"no":338,"t":"水銀秤","b":[["V","詭詐的天平為耶和華所憎惡；足重的法碼為祂所喜悅。（箴11:1）"],["E","A false balance is an abomination to Jehovah, but a full weight is His delight. (Proverbs 11:1)"],["P","煙臺有一位弟兄，作買賣使用一把水銀秤，秤桿裡裝了水銀，用來欺騙買主，以取厚利。他甚至對別人誇耀說，「我是信耶穌的，絕不欺騙人，這是耶和華的法碼。」有一天，神的手臨到他，死了一頭驢，他還不悔改。後來，他兒子在腳踏車上撞斷了一條腿，這才認罪悔改，把水銀秤也銷燬了。"],["P","無論如何，「遮掩自己罪過的，必不亨通；承認離棄罪過的，必蒙憐憫。」（箴二八13。）"],["H","與基督的聯合－聯於祂死與復活（詩366）"],["L","基督雖能千回|降生於伯利恆，"],["L","若未活你心內，|救恩仍是無成。"],["L","各各他的十架，|還不會拯救你；"],["L","在你裡的十架，|才有能醫治你。"],["L","（副）哦！基督的十字架，|我接你進我心，"],["L","使我脫自己管轄，|完全憑主而生存。"]]},{"no":339,"t":"空機照相","b":[["V","那說我認識祂，卻不遵守祂誡命的，便是說謊的，真理也不在這人裡面了。（約壹2:4）"],["E","He who says, I know Him, and does not keep His commandments is a liar, and the truth is not in this one. (1 John 2:4)"],["P","有位弟兄雖然信主，但是惡性仍舊時常發動，曾經空手騙了好幾個人。有一次，他向一位弟兄借一部照相機。他說，「會所裡有受浸，受浸的人要照相，請你把照相機借我用。」照相機借來沒有底片，他就用空照相匣子，給受浸的人照相，故弄玄虛，叫人站好，叫人笑；並且虛卷空片，另給一對夫婦照一張。照完之後，就把這個照相機拿給另外一位弟兄，說，「我現在需要買一批貨，急需一筆款項，請即刻週轉一下，我以照相機作抵押。」於是騙去一筆款。過了二天，又到那位弟兄那裡，說，「我前天押給你的照相機再借給我用一下，我照過相就給你。」拿去之後，又把那個照相機押給另外一位弟兄。起初這位弟兄利用這種手段，生活好像富裕起來；但是不久，神的手臨到他身上，他便潦倒下去，無人幫助。"]]},{"no":340,"t":"蒙光照得重生","b":[["V","世人矇昧無知的時候，神並不鑑察，如今卻吩咐各處的人都要悔改。（徒17:30）"],["E","Therefore, having overlooked the times of ignorance, God now charges all men everywhere to repent. (Acts 17:30)"],["P","有一天，孟教士對一位高牧師說，「我看你還沒有重生。」高牧師非常氣憤，心想：我作傳道人已經二十年，我重生不重生礙你什麼事呢？然而第二天，孟教士還是問他，問得他簡直要發起脾氣。有一天，聖靈光照了他，給他看見，他是個假冒為善的人，沒有真實得救。他就徹底悔改，當眾認罪。這一次高牧師的轉變，影響了二十個教會得著復興。"],["P","認罪與召會的復興，實在有莫大的關係。"],["H","得救的證實與快樂－一般（詩262）"],["L","今有榮光照耀我魂間，|勝於星月太陽；"],["L","光線清新，輝煌又燦爛，|因主就是這光。"],["L","（副）"],["L","榮耀之光！福樂之光！|帶來平安喜樂滾滾浪；"],["L","當主耶穌笑臉欣欣放，|榮耀之光照明亮。"]]},{"no":341,"t":"不知何為不義","b":[["V","孩子們，不要讓人迷惑你們，行義的人才是義的，正如祂是義的一樣。（約壹3:7）"],["E","Little children, let no one lead you astray; he who practices righteousness is righteous, even as He is righteous. (1 John 3:7)"],["P","有一位弟兄見證說，「在我剛得救時，第一年就寫了一百多封信，向人認罪，第二年也寫了一百多封信向人認罪。雖然如此，我卻只知道罪，而不知道不義。我知道我曾騙過人，曾毀謗過人，也曾用過手段對待人；這些罪，我都對付，但我還沒有看見什麼叫作不義。後來讀到一個講不義的故事，才看見什麼叫作不義。」"],["P","不義就是越過你的境界，踐踏別人，叫別人受虧。"],["H","與基督的聯合－聯於祂死與復活（詩366）"],["L","你若要得著神，|切勿跟從智慧；"],["L","「愛」是最短路徑，|使你免去紆迴。"],["L","你若不為自己|尋求什麼利益，"],["L","神的榮耀自己，|就要充滿了你。"]]},{"no":342,"t":"腳踢雨衣袖","b":[["V","我的弟兄們，若有人說自己有信心，卻沒有行為，有什麼益處？難道這信心能救他麼？（雅2:14）"],["E","What is the profit, my brothers, if anyone says he has faith but does not have works? Can that faith save him? (James 2:14)"],["P","有個地方開特會，聚會那天下雨。有一個人坐在第一排，把他的雨衣放在第一排的椅背上。另外有一個人，輪到他上講臺講道，無意中把第一排椅背上那件雨衣碰了一下，雨衣的一隻袖子落在地上。他沒有看見，他的泥腳就踏在這一隻袖子上。這時他覺得了，但他不過用腳把它一踢就走了。坐在後面有一個人看見，就說，「不管他講得好不好，我就是要看他下來的時候，對這件雨衣的袖子怎麼處理。」等他講完道下臺時，竟然照舊把那件雨衣的袖子一踢，就坐下了。那人看見這事，就說，「不把人家的袖子弄乾淨，至少也得向雨衣的主人賠不是；他那樣作是不義。」"],["P","神既然叫我們成為神的義，顯出神的義，叫人看見我們的時候，就看見神的義，那麼我們在生活中就不能不義。"]]},{"no":343,"t":"脫謊善法","b":[["V","說謊言的嘴為耶和華所憎惡；行事忠信的，為祂所喜悅。（箴12:22）"],["E","Lying lips are an abomination to Jehovah, but those who deal faithfully are His delight. (Proverbs 12:22)"],["P","美國有一個貴婦，問慕迪說，「我和人談論時，出言往往不知不覺流於太過，有時離事實甚且太遠，結果自己也不知所說的話，有多少成分是真的，多少成分是假的。請先生指示我一條路，得以脫去這樣惡劣的習慣。」慕迪說，「這很容易。你以後與人言談時，若一發覺話語有不確實，立即去見那人，求他赦免你說謊的罪。」貴婦說，「若是如此，人必笑我是個說謊的人，這是我所不願意的。」慕迪說，「人之所以不能脫去說謊的劣習，原因就是在此。所以，你若想脫去此一惡習，舍此並無他法。況且說謊的罪，必須逕向對方承認，才能得著赦免。所以，認罪實在是一舉兩得的事，你何不為之？」"],["P","說謊乃是出於撒但。如果撒但的種子還在神兒女身上，這是最可憐的事。人一旦信了主，起頭就該對付謊言的罪，學習說準確的話。"]]},{"no":344,"t":"懷恨八年","b":[["V","我向你犯罪，惟獨得罪了你；我在你眼前行了這惡。因此你責備的時候，顯為公義；判斷的時候，顯為清正。（詩51:4）"],["E","Against You and You alone have I sinned, and I have done what is evil in Your sight. Therefore You are righteous when You speak; You are clear when You judge. (Psalm 51:4)"],["P","有一位女子，在會中承認自己懶惰的罪。服事聚會的姊妹，知道這還不是她所必須承認的根本大罪；因為她承認此罪的次數已經太多。那天晚上，她就懇切求神，使那位女子確實知道自己的偽善，並且引導她作一個真實的認罪。第二天，那位女子果然用一個真誠痛悔的心，承認她懷恨某太太，並有八年之久不和她說話了。"],["P","許多人認罪的時候，對於別人所看得見的罪，總是滔滔不絕的說了一大套；對那只有自己知道的罪，卻始終隻字不肯題及。這是表面的認罪，不是徹底的認罪。"],["H","得救的證實與快樂－被主釋放（詩244）"],["L","我因歸耶穌，|全人得著釋放；"],["L","耶穌我救主，|今在我心作王；"],["L","聖靈充滿我，|使我終日歡唱；"],["L","主耶穌已把我釋放！"],["L","（副）釋放！釋放！|榮耀釋放！"],["L","我不再被罪惡捆綁；|寶血洗淨我，"],["L","全人明亮、清爽；|主耶穌已把我釋放！"]]}]},{"n":"對付世界","i":8,"intro":[["V","藉著祂，就我而論，世界已經釘了十字架；就世界而論，我也已經釘了十字架。（加拉太書六章十四節）"],["E","Through whom the world has been crucified to me and I to the world. (Galatians 6:14)"]],"a":[{"no":345,"t":"世界玷汙人","b":[["V","因為凡從神生之物，就勝過世界，勝過世界的，就是我們的信。（約壹5:4）"],["E","For everything that has been begotten of God overcomes the world; and this is the victory which has overcome the world — our faith. (1 John 5:4)"],["P","人把自己奉獻給神以後，接著要對付的事物，第一是罪，第二就是世界。罪所給我們的玷汙，是野蠻的、粗暴的，也是醜陋的。世界所給我們的玷汙，卻是文明的、細雅的，很多時候在人看來還是很好看的。"],["P","罪對我們的玷汙，好像一件白襯衫上，沾染了大塊黑墨，或是汙泥。世界對我們的玷汙，好比一件白襯衫上，印了花花綠綠的圖案。在一般人看，襯衫上有了汙點，那是骯髒，是不該有的；而有花色，不是骯髒，乃是正常的。但在神看，這兩個都是不該有的。神不要有汙點的襯衫，也不要有花色的襯衫，祂只要純白的襯衫。照樣，雖然世界的汙點，比罪的汙點好看些，但對於純潔的性質，這兩個都是玷汙的，所以都需要對付。"],["P","罪和世界所給人的侵害，也有很大的分別。罪侵害人，乃是把人玷汙了。世界侵害人，卻不僅把人玷汙了，更是把人霸佔了。所以，可說罪是玷汙人的，世界是霸佔人的。這就如一個小孩，原是在他父母看顧之下，天真純潔。若有人來教他撒謊、偷竊，引誘他作許多壞事，就使他純潔的品性，受到玷汙和敗壞。但這時他還是在父母的身邊，還是屬於他的父母。等到有一天，那人若更進一步，送他兩件好衣服，就會把他騙去而得著了他，使他離開父母而失落了。照樣，撒但用罪來玷汙人，不過只把人敗壞了；但他用世界來霸佔人，就把人得著了，叫人離開神而失喪了。（生命的經歷）"]]},{"no":346,"t":"聖別歸神","b":[["V","你們這些淫亂的人，豈不知與世界為友，就是與神為敵麼？所以凡想要與世界為友的，就成了神的仇敵。（雅4:4）"],["E","Adulteresses, do you not know that the friendship of the world is enmity with God? Therefore whoever determines to be a friend of the world is constituted an enemy of God. (James 4:4)"],["P","凡是是神的，和一切屬於神、歸於神、為著神的，都是聖的；凡是不是神的，和一切不屬於神、不歸於神、不為著神的，就都是不聖的。我們對付世界的對象，就是這些不聖的。所以測量世界的標準，就是神自己。凡和神合不來的、對不起的、構不上的，那就是世界，就是不聖，也就該對付。"],["P","所以我們該在我們的身上，在我們的環境中，在我們的家庭中，在我們的工作裡，在我們的事業上，把每一件人、事、物，都擺到神跟前，看這一個人、這一件事、這一個物，是否是神的？是否是屬於神的？是否是歸於神的？是否是為著神的？如果還有一點是構不上神的，是與神合不來的，就需要對付，叫它構得上神，與神合得來。"],["P","此外還有兩件事，最影響我們對世界的感覺，就是愛神與生命的程度。我們一遠離神，就不覺得身上有世界；一親近神，就發覺身上有許多事物都是世界。而只有愛神的人，才願親近神。所以我們要對付世界，就要先愛神。我們愛神越深，對世界的感覺就越敏銳，世界也就從我們身上顯出來得越多。一顯出來，就會掉下去。這個顯出來，就是光照。愛叫我們碰著神，而神就是光，光一來了，就把我們身上的世界照掉了。所以對付世界，並沒有律法，只有神是我們的準則，是我們的度量。我們愛神到什麼地步，對付我們身上的世界也就能到什麼地步。（生命的經歷）"]]},{"no":347,"t":"世界大學","b":[["V","我們曉得我們是屬神的，而整個世界都臥在那惡者裡面。（約壹5:19）"],["E","We know that we are of God, and the whole world lies in the evil one. (1 John 5:19)"],["P","世界是撒但的一個組織，是撒但的一個系統，裡面分出各種科系，好像大學一樣，有各種院系。世界裡有服裝系、娛樂系、年節系、家庭系、商業系等等，不勝枚舉，用來消耗你的財力、時間和精力。妻子、丈夫、婚姻、孩子、食、衣、住、行，都不是世界；若是想出花樣來吃，想出花樣來穿、來住，就是世界；生孩子吃紅蛋，滿月吃滿月酒，過生日大請客，端午節吃粽子，中秋節吃月餅，過年吃年糕，隨從世風世俗，都是世界。婚姻不是世界，是神的定規，但是把喜事辦得熱鬧、鋪張、奢侈，便是世界。"],["P","如果這些事情霸佔了我們的心，這就是我們的「世界」，我們需要棄絕、恨惡、定罪它，使我們的心不受它的影響。從前一些東西也許是我們的世界，我們對付過後，以後雖然仍舊與這些東西接觸，但這些東西不再摸到我們的心了。一個東西是否成為你的世界，要看那個東西是否霸佔你的心。"]]},{"no":348,"t":"編著字典成重量","b":[["V","就當脫去各樣的重擔，和容易纏累我們的罪，憑著忍耐奔那擺在我們前頭的賽程。（來12:1）"],["E","Put away every encumbrance and the sin which so easily entangles us and run with endurance the race which is set before us. (Hebrews 12:1)"],["P","十九世紀有位主所大用的僕人，他曾花了許多工夫，編著一本希伯來文字典。寫好之後，送給他的朋友們看。朋友們都大加讚許，以為這本書一出版，他一定會成為有名的學者。但是，這位弟兄卻將書稿燒掉了。他說，他在編著這本字典時，對主的愛、以及愛人靈魂的心，已經逐漸減少；印書校稿，更要費去許多力量，所以不如燒了。印書校稿並不是罪，在他裡面卻是一個重量。他脫離了他的重量。重量不是罪，重量在許多時候是合法的，但它究竟是個重量，會減低你前進的速率。"],["P","也許你的重量，是你所追求的地位，是一個捨不得的朋友，是一點屬世的雄心，是一間可留戀的房屋，是一碗可口的小菜，是一件華麗的衣裳。這些東西和其他千百件東西，雖然不是罪，卻會攔阻你走屬靈的道路。"]]},{"no":349,"t":"小木碗","b":[["V","他們的心幾時轉向主，帕子就幾時除去了。（林後3:16）"],["E","Whenever their heart turns to the Lord, the veil is taken away. (2 Corinthians 3:16)"],["P","有一個木匠一有空就去作工藝。一次，他作了一個非常精細的木碗。有一天，他在禱告中竟然想起這個木碗的精細，這事使他非常懊悔，便說，「誰料得到這個不要緊的小東西，竟有這麼大的能力使我分心。既是這樣，就將它奉獻給神吧！」說著就將那隻精細好看的木碗投在火裡燒了。"],["H","福音－相信接受（詩734）"],["L","罪惡全洗淨，肉體都脫清，|接受基督作我的救主；"],["L","撒但已無能，世界也失形，|接受基督作我的救主。"],["L","（副）接受！接受！|相信接受，不再延誤；"],["L","接受！接受！|接受基督作我的救主。"]]},{"no":350,"t":"樸素衣服","b":[["V","凡世界上的事，就是肉體的情慾、眼目的情慾、並今生的驕傲，都不是出於父，乃是出於世界。（約壹2:16）"],["E","All that is in the world, the lust of the flesh and the lust of the eyes and the vainglory of life, is not of the Father but is of the world. (1 John 2:16)"],["P","一位姊妹有件很樸素的衣服，在家喜歡穿它，出門也喜歡穿它，除了這件衣服以外，似乎不願穿別的衣服。這件樸素的衣服就成了她的霸佔，她的世界。她以為只有好看的、紅紅綠綠的、高貴華麗的衣服才是世界。"],["P","有一天，她餵小孩喝湯，湯汁倒在衣服上面。她花了許多時間，用了許多氣力去洗掉這些汙漬，卻總洗不掉。這時，她才醒悟過來：是神對付她，要脫離這件衣服的霸佔。"],["P","在我們的日常生活中，只要稍微查究一下，就必發現許多特別得著我們心愛的事物，成了我們的霸佔；我們是否一一對付過這些東西？如果我們總是不對付，恐怕神的手就要伸出來提醒我們。"]]},{"no":351,"t":"十五塊錢天天數","b":[["V","不要愛世界，和世界上的事。人若愛世界，愛父的心就不在他裡面了。（約壹2:15）"],["E","Do not love the world nor the things in the world. If anyone loves the world, love for the Father is not in him. (1 John 2:15)"],["P","有位老太太只有十五塊錢，天天都要把它數一數。人們都笑她是個財迷。但是有人有滿箱的房契、地契，當他檢視這些契約，以為十分寶貴之時，神在天上也要這樣笑他，好像我們笑那老太太一樣。"],["P","在我們看，十五元有什麼了不得；在神看，滿箱契約也沒有什麼了不得。可是十五塊錢，成了老太太的世界；滿箱契約，也成了富翁的世界。世界就是這樣藉著這些財物，霸佔了神在人裡頭的地位。"],["H","羨慕－一般（詩328）"],["L","主，你榮面是我所羨，|開啟我眼使我看見；"],["L","願你榮光照我眼前，|消除我的一切黑暗。"],["L","恩主，我今尋求你面，|願你不再向我隱瞞；"],["L","開啟我眼，|使我看見你的榮面！"]]},{"no":352,"t":"你事奉神我事奉瑪門","b":[["V","沒有人能事奉兩個主；因為他不是恨這個愛那個，就是忠於這個輕視那個。你們不能事奉神，又事奉瑪門。（太6:24）"],["E","No one can serve two masters, for either he will hate the one and love the other, or he will hold to one and despise the other. You cannot serve God and mammon. (Matthew 6:24)"],["P","香港一位弟兄，前去看望一位很富有的人，這個人是一位掛名的教友。這人告訴看望他的弟兄說，你下一次不要來找我了；因為你是事奉神的，我是事奉瑪門的，你盡心盡意的去事奉神，我盡心盡意的去事奉瑪門，你走你的路，我走我的路。豈不知他的路，乃是滅亡的路。"],["H","奉獻－分別歸主（詩335）"],["L","我已轉身背向俗世，|和它一切的歡娛；"],["L","我已心向更美的事，|就是天上的儲蓄；"],["L","一切虛榮、一切揚顯，|不能使我再逗遛；"],["L","我已越過分別界線，|世界已丟在背後。"],["L","（副）遠遠丟背後，|遠遠丟背後，"],["L","我已越過分別界線，|世界已丟在背後。"]]},{"no":353,"t":"漏世事不漏基督事","b":[["V","孩子們，你們是出於神的，並且勝了他們；因為那在你們裡面的，比那在世界上的更大。（約壹4:4）"],["E","You are of God, little children; and you have overcome them because greater is He who is in you than he who is in the world. (1 John 4:4)"],["P","有位弟兄記性很不好，你對他講這句話，他就忘了那句話，很容易忘記事情。他信主已經六年，他把所有的事情都漏掉了，但是對於主的事一點都不漏。如果你對他說主的事情，他記性好得很；如果你對他說世界的事情，他一下子就忘了。他說，「我不能關心那麼多的事情。」世界和其上的事若不從你漏出去，基督和基督的事，就必被你漏出去。"],["H","得救的證實與快樂－為主所愛（詩231）"],["L","主愛溫柔又堅剛，|我要永遠頌揚："],["L","主比強者還要強，|主愛也是這樣；"],["L","雖然天地會改遷，|雖然海枯石爛；"],["L","主愛至終不消減，|主愛歷久不變。"],["L","（副）主的愛歷久不變，|主的愛歷久不變；"],["L","堅定遠勝日月，|我要頌揚不絕。"],["L","主的愛歷久不變。"]]},{"no":354,"t":"生作財主死作拉撒路","b":[["V","你們知道我們主耶穌基督的恩典，祂本來富足，卻為你們成了貧窮，叫你們因祂的貧窮，可以成為富足。（林後8:9）"],["E","For you know the grace of our Lord Jesus Christ, that though He was rich, for your sakes He became poor in order that you, because of His poverty, might become rich. (2 Corinthians 8:9)"],["P","有一位教師說完了路加十六章財主和拉撒路的故事後，問一班孩子們說，你們誰願意作拉撒路？誰願意作財主？有的小孩說，我願意作拉撒路，因為將來可以享福。有的小孩說，我願意作財主，因為將來如何還不知道，現在享福再說。有一個小孩說，我活在世上時願意作財主，死後願意作拉撒路。"],["P","多少基督徒，也是這樣想：最好活在世上時享福，死後也享福。"],["H","福音－勸導（詩722）"],["L","飄渺人生何短暫，|好似浮雲現即散，"],["L","又似幻夢醒就完：要及時！|時日飛逝在宣言："],["L","轉瞬就到死亡線，|再遲必在地獄間：要及時！"],["L","（副）要及時！要及時！|當今耶穌在召喚：要及時！"],["L","若在罪中仍流連，|只怕恩門向你關，"],["L","那時呼救已太晚：要及時！"]]},{"no":355,"t":"只醫一隻眼","b":[["V","因為你的財寶在那裡，你的心也必在那裡。（太6:21）"],["E","For where your treasure is, there will your heart be also. (Matthew 6:21)"],["P","有個財主，兩隻眼睛都出了毛病，去請醫生診治。醫生查看之後，就對他說，「這種眼病可以醫治，不過稍微費事，治療費一隻眼睛一百元，二隻眼睛二百元。」財主心想，二百元太花費了一點，沒有眼睛又不行，就說，「我願出一百元醫治一隻眼睛，有一隻眼睛可以看見我的財寶就夠了。」"],["P","許多基督徒也是這樣，只要主來開他一隻眼睛，能夠得救就心滿意足了；另一隻眼睛卻是不願主來為他打開，怕被打開，要走十字架的道路，要對付世界，對付肉體…，對付得吃不消。"],["H","福音－見證（詩738）"],["L","救我恩何等豐滿，|救我恩何等豐滿，"],["L","救我恩何等豐滿，|救我恩無量！"],["L","（副）主斷開一切鎖鏈，|主斷開一切鎖鏈，"],["L","主斷開一切鎖鏈，|主把我釋放！"]]},{"no":356,"t":"你是西塞羅信徒","b":[["V","你們若屬世界，世界必愛屬自己的；只因你們不屬世界，乃是我從世界中把你們揀選出來，所以世界就恨你們。（約15:19）"],["E","If you were of the world, the world would love its own; but because you are not of the world, but I chose you out of the world, therefore the world hates you. (John 15:19)"],["P","奧古斯丁（St. Aurelius Augustine）是一位著名的神學家。在他著的「懺悔錄」中，記述他少年時的一個夢。當他十九歲時，很佩服西塞羅的學說，他的一切言語行動都是西塞羅化。他夢見他死了，靈魂來到天堂門口。守門的天使問他說，「你是誰？來作什麼？」他回答說，「我是一個基督徒，是米蘭地的奧古斯丁。」守門的天使說，「不是！你是一個西塞羅信徒。」奧古斯丁大吃一驚，求他解釋。天使說，「一切靈魂在世界被誰治理，他便成為什麼。你的裡面充滿的不是基督，乃是羅馬的西塞羅。所以你不能進去。」奧古斯丁一驚而醒。從此，他的生活、思想、心靈，完全讓基督治理。"],["P","基督徒不是屬世界的，不要讓世界的東西來充滿。基督徒乃是屬基督的，該讓基督來充滿，在凡事上讓祂居首位，這樣才能配進祂的國度。"]]},{"no":357,"t":"愚人金","b":[["V","人若賺得全世界，卻喪失自己，賠上自己，有什麼益處？（路9:25）"],["E","For what is a man profited if he gains the whole world but loses or forfeits himself? (Luke 9:25)"],["P","許多年前，有人在美國一座山上，找到一具人的骸骨。那人手骨旁邊有塊大黃石，看去如同黃金，在太陽光下發出燦爛光輝，而且又很沉重。這石顏色如金，俗稱「愚人金」，凡有礦學知識的人，一看便知它是毫不值錢的。"],["P","原來這人旅行，來到這座山上，看見這塊大石，以為是塊大黃金，就將這塊石頭帶著走了許多路程。心裡想著，既然得到這麼一塊大金子，就要成為富翁了。但他越走越覺得疲乏，前進越來越難。但他不肯丟棄這個重擔，仍然拼命抱著它走，雖然已經十分疲乏無力，還是不肯放手。最後，他在路旁倒下，仍然緊抱這塊「愚人金」。"],["P","世界上許多東西都像「愚人金」一樣，不少神的兒女因為缺少認識，也被欺騙，一直貪戀，不肯割捨，結果在屬靈的路上跟不上去，半途而廢，豈不知人若賺得全世界，卻喪失自己，賠上自己，有什麼益處呢？"]]},{"no":358,"t":"不為腳憂卻為錢哭","b":[["V","然而敬虔又知足，便是大利了；因為我們沒有帶什麼到世界來，也不能帶什麼去。（提前6:6-7）"],["E","But godliness with contentment is great gain; for we have brought nothing into the world, because neither can we carry anything out. (1 Timothy 6:6-7)"],["P","八一三上海戰役爆發的次日，空襲擊中一間戲院，死傷慘重。有一位老婦人正巧經過戲院門口，也被炸掉一隻腳。她被救護隊送到醫院，經過醫師、護士洗滌治療，包紮完畢送回病房。但她還是痛哭不已，並且掙扎要爬起來。"],["P","醫師叫她安臥靜養，但她還是痛哭掙扎。醫生問她到底想要起來作些什麼？她說，「在炸掉的那隻腳鞋子裡，裝著三十元鈔票，我一定要去找回來。」說完，又很傷心的痛哭起來。醫生無法可想，只好派人去找她炸掉的那隻腳。後來終於找到了，在那小鞋底下，真有這位老婦人所珍藏的三十元鈔票。這位老婦人不為失去的腳傷心，卻為失去的鈔票哭泣。"],["P","有些基督徒太愛財寶而忽略生命，也是如此。只知追求財寶，積攢財寶，關心自己的錢財；對於自己屬靈的生命殘缺不全、貧窮、幼稚、軟弱，卻漠不關心。"]]},{"no":359,"t":"樣樣都有缺謙卑","b":[["V","你要囑咐那些今世富足的人，不要心思高傲，也不要寄望於無定的錢財，只要寄望於那將百物豐富的供給我們享受的神。（提前6:17）"],["E","Charge those who are rich in the present age not to be high-minded, nor to set their hope on the uncertainty of riches but on God, who affords us all things richly for our enjoyment. (1 Timothy 6:17)"],["P","美國鋼鐵大王加尼奇，貧寒出身，幼年失學，全靠自修苦學，加上他十分勤儉，於是漸漸成為豪富，且成一位飽學的學者。一次，他到英國蘇格蘭遊歷。因為他曾經捐了鉅款，在英國創立圖書館；所以蘇格蘭的四個大學校長開會歡迎，設筵款待他。席終大家圍爐談話。加尼奇自述他的成功史，說得高興時，就問來賓：「我現在樣樣都有，什麼也不缺，都是我一手建立的。請問你們，我還缺少什麼？那一樣神還未賜給我呢？」當時大家靜默無聲。忽然一位老校長低聲的說，「恐怕還缺少一樣，缺少謙卑。」"],["P","像他這樣的人，在地上很富足，可說樣樣都有；但是在神面前卻很貧窮，生命極其幼稚。"]]},{"no":360,"t":"不再說與不能說","b":[["V","神豈不是揀選了世上貧窮的人，叫他們在信上富足，並承受祂所應許給那些愛祂之人的國麼？（雅2:5）"],["E","Did not God choose the poor in the world to be rich in faith and heirs of the kingdom, which He promised to those who love Him? (James 2:5)"],["P","有位弟兄前往西班牙，想要參觀那裡的大教堂。有一位修道士招待他，領他瀏覽幾處頂莊嚴、頂富麗的大教堂。每到一處，那位修道士就將堂內的稀世奇珍指給他看，說這一件是純金的，那一件是純銀的，那一件是鑲著寶石的，那一件是有歷史典故的。"],["P","後來，他十分得意的對那位弟兄說，「今天我們可以不再和使徒彼得一樣說，『金銀我都沒有，』那樣寒酸的話了。」那位弟兄卻冷冷的答道：「不錯，但你們也不能和他一樣說，『我在拿撒勒人耶穌基督的名裡，叫你起來行走！』那樣的話了。」"],["H","福音－救主（詩677）"],["L","憐憫、慈愛、寬恕、|溫柔又謙和；"],["L","為了罪人忍辱，|甘負十架軛；"],["L","捨命、流血、受苦，|為救失喪者："],["L","這是基督耶穌，|對祂你如何？"]]},{"no":361,"t":"棄物登山","b":[["V","這樣，你們每個人，若不捨棄一切所有的，就不能作我的門徒。（路14:33）"],["E","In the same way therefore everyone of you who does not forsake all his own possessions cannot be My disciple. (Luke 14:33)"],["P","瑞士的風景優美，高山常年積雪。一個少年人預備上山，帶了很多東西－煙、酒、衣服、書籍、毯子、照相機。有人勸他不要攜帶這麼多的東西上去。他說，「不行，菸酒是我的嗜好，少不得的。書籍我要用來讀書，得以成名，也是不可少的。衣服、毯子是護身的，非有不可。」那人就說，「你要上山，這些東西實在不能帶去。」他說，「山我要上，東西我也要帶。」於是他便揹著這些東西上山。走了不久，他就不能再往上爬了。因為東西太重，他就把煙和幾瓶酒丟掉，但還覺得不行，心裡便想：「把一切東西丟掉而上山呢？還是不上山而把東西帶回來呢？」他再上前，越上越難，又問自己：「上前？還是退後？」於是再把書籍丟棄，繼續上去。後來又把衣服丟棄。山下的人都開始笑他，但是見他勇往上前，又很佩服。雖然起頭他很糊塗，但他到底丟棄一切，上到山頂。"],["P","這象徵基督徒的生活，你是願意登上高峰？或是捨不得丟棄名利、罪惡、煙、酒、嗜好，而馬馬虎虎的混下去。"]]},{"no":362,"t":"跳舞能否見證主","b":[["V","你們是地上的鹽；鹽若失了味，可用什麼叫它再鹹？既無任何用處，只好丟在外面，任人踐踏了。（太5:13）"],["E","You are the salt of the earth. But if the salt has become tasteless, with what shall it be salted? It is no longer good for anything except to be cast out and trampled underfoot by men. (Matthew 5:13)"],["P","有位年輕女孩，在傳福音的聚會中受感動信了主。她就問說，「我該不該放棄跳舞？」人就反問她說，「你能不能在跳舞時見證基督？」可是她仍然硬著頸項去跳舞。"],["P","在舞會中，她碰見第一個舞伴，就問他：「你是不是基督徒？」那人答說，「我不是！」舞伴接著問她：「你是基督徒麼？」她說，「是的。」那舞伴就說，「那麼你到這裡來幹什麼呢？」這叫她哭笑不得。從此以後，那個年輕女孩再也不去跳舞了。在我們的日常生活中，是否能在每一件事上見證主？"],["P","基督徒乃是世上的鹽。鹽必須溶化了，才能使別的東西有滋味。假使我們放些鹽在一鍋的米裡，若是鹽不溶化，能有什麼用處呢？若是溶化了，它的滋味就能進入全鍋的米粒裡。於是這些米粒，都因鹽的溶化而得了滋味。這個我們雖然看不出來，卻能嘗得出來。基督徒必須有所撇棄，有所犧牲，才能影響別人。不然，就會像羅得的妻子，因為貪戀世界，變成一根鹽柱。不化的鹽，究竟有什麼用處呢？"]]},{"no":363,"t":"還未享盡世福","b":[["V","神既不吝惜自己的兒子，為我們眾人舍了，豈不也把萬有和祂一同白白的賜給我們麼？（羅8:32）"],["E","Indeed, He who did not spare His own Son, but delivered Him up for us all, how shall He not also with Him freely give us all things? (Romans 8:32)"],["P","有個少年信徒，說他不能丟下世界。一次，他對一位年長信徒說，「世界上的福樂你享過了，所以你能犧牲；但是我還年輕，還沒享盡世界的福樂，所以我不能犧牲。」"],["P","是的，這少年相信神，但他不會愛神。要知道，信神可以拯救你脫離罪惡；愛神才能叫你脫離世界。我們要讓神的愛進入我們裡面。神的愛一進入，世界就不知去向了。"],["H","奉獻－分別歸主（詩335）"],["L","我今永遠不再返回|舊日愚昧的境地；"],["L","惟獨在此才不定罪，|在此才會有安息；"],["L","我今已經更換主人，|對祂我要永伺候；"],["L","地的捆綁就此脫盡，|世界已丟在背後。"],["L","（副）遠遠丟背後，|遠遠丟背後，"],["L","地的捆綁就此脫盡，|世界已丟在背後。"]]},{"no":364,"t":"不要利息不討債","b":[["V","你創造了萬有，並且萬有是因你的旨意存在並被創造的。（啟4:11）"],["E","You have created all things, and because of Your will they were, and were created. (Revelation 4:11)"],["P","有一位婦人，丈夫出門作生意，久無音信，不知是生是死；她手邊只有幾百元，便拿去銀行放利息來維持生活。這些錢像她的命一樣寶貴。所以這位婦人，只認錢，不認人；天天在家裡打算，趙某欠我多少，張某欠我多少，利息幾分，幾時收利，真是愛錢如命。有一天，丈夫從南洋來信說，他在南洋發了大財，叫她前去享福；另外匯了一千塊錢作她的路費。"],["P","從此這位婦人的看法完全變了；對趙某說，你欠我的錢不必還利息了；對張某說，你欠我的錢，若是沒有錢，可以不必還了。她不但不向人討錢，還把家裡的東西送給鄰居。大家都覺得很奇怪，愛錢如命的人，怎會把東西送人呢？她說，「我的丈夫在南洋所有的，不知比這裡多多少倍，這一點送出去算什麼？」"],["P","我們信主的人，若是看見我們在基督裡的豐富，就不至於被這世上的事物抓住了。"]]},{"no":365,"t":"不沾塵的白花","b":[["V","那能保守你們不失腳，並使你們無瑕無疵，歡歡樂樂站在祂榮耀之前的，獨一的神我們的救主。（猶24）"],["E","But to Him who is able to guard you from stumbling and to set you before His glory without blemish in exultation. (Jude 24)"],["P","在一個煤礦的進口通道旁邊，長了一株開著白花的植物。參觀礦坑的人都很希奇，何以在這滿布煤灰之處，這株植物仍能保持如此純淨潔白。一個礦工隨手抓了一把煤灰，撒在花上；但是沒有一點汙垢能夠沾住，每粒灰塵都滾落了。因為這株植物表面有層蠟質，能使黑色細塵滾落，不至沾留。"],["P","祂既能保守那花一塵不染，豈不也能照樣保守我們不沾世俗麼？"],["H","奉獻－分別歸主（詩336）"],["L","聖潔、歡樂，何等分別！|惟有如此能蒙福；"],["L","脫開主外一切事物，|惟主是我所愛所慕，"],["L","單單安息在基督，|單單安息在基督。"]]}]}]</script>
<script>
(function(){
const THEMES=JSON.parse(document.getElementById('data').textContent);
const NUMS='一二三四五六七八九', TOTAL=365;
const ARTS=[]; THEMES.forEach(th=>th.a.forEach(a=>{a.th=th; ARTS[a.no]=a;}));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(3,'0');
const PALETTES=[['r','石榴紅',['#ffffff','#7a1f2b','#b08a4a']],['b','晴空淡藍',['#f5f7fb','#3b6ea8','#90b8ea']],['a','晨霧青綠',['#f4f8f7','#2f7f73','#86cdbd']],['c','薰衣草灰紫',['#f7f6fb','#5f5aa2','#b7b2ec']],['y','向日葵黃',['#ffffff','#f2b705','#a26f00']]];

/* ---------- storage ---------- */
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let state=Object.assign({start:null,read:{}}, lsGet('sl-progress')||{});
let prefs=Object.assign({fs:18,theme:'system',palette:'r'}, lsGet('sl-prefs')||{});
let ui=Object.assign({welcomed:false,firstToast:false,snoozeUntil:0,milestones:{},iosHint:0}, lsGet('sl-ui')||{});
const saveUI=()=>lsSet('sl-ui',ui);

/* ---------- cloud (Firebase, optional) ---------- */
const cloud={ready:false,user:null,fs:null,auth:null,ref:null};
const CLOUD_ON=!!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey);
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function initCloud(){
  if(!CLOUD_ON) return;
  const V='10.12.2', base='https://www.gstatic.com/firebasejs/'+V+'/';
  try{
    await loadScript(base+'firebase-app-compat.js');
    await Promise.all([loadScript(base+'firebase-auth-compat.js'),loadScript(base+'firebase-firestore-compat.js')]);
    firebase.initializeApp(window.FIREBASE_CONFIG);
    cloud.auth=firebase.auth(); cloud.fs=firebase.firestore();
    try{await cloud.auth.getRedirectResult()}catch(e){}
    cloud.ready=true; refreshChrome();
    cloud.auth.onAuthStateChanged(async u=>{
      cloud.user=u||null; cloud.ref=u?cloud.fs.collection('users').doc(u.uid):null;
      if(u) await pullAndMerge();
      refreshChrome(); rerender();
    });
  }catch(e){ cloud.ready=false; }
}
async function pullAndMerge(){
  try{
    const snap=await cloud.ref.get(); const d=snap.exists?snap.data():{};
    const read=Object.assign({}, d.read||{}, state.read);
    Object.keys(read).forEach(k=>{if(!read[k]) delete read[k]});
    state.read=read; state.start=d.start||state.start;
    if(d.palette) prefs.palette=d.palette; if(d.theme) prefs.theme=d.theme;
    lsSet('sl-progress',state); applyPrefs(false);
    await cloud.ref.set({start:state.start||null, read:state.read, palette:prefs.palette, theme:prefs.theme, updatedAt:Date.now()},{merge:true});
  }catch(e){}
}
function cloudWrite(patch){ if(cloud.ref) cloud.ref.set(Object.assign({updatedAt:Date.now()},patch),{merge:true}).catch(()=>{}); }
function cloudUnread(n){ if(cloud.ref) cloud.ref.update({['read.'+n]:firebase.firestore.FieldValue.delete(),updatedAt:Date.now()}).catch(()=>{}); }
async function signIn(){
  if(!cloud.ready) return;
  const p=new firebase.auth.GoogleAuthProvider();
  const okMsg=()=>toast('<div>✓ 已登入！你的閱讀進度會自動保存在 Google 帳號裡，換手機、平板或電腦，用同一個帳號登入就會回來。</div><div class="btns"><button class="btn ghost small" id="t-ok">好</button></div>');
  const failMsg=e=>{ const c=(e&&e.code)||'unknown';
    if(/popup-closed-by-user|cancelled-popup-request|user-cancelled/.test(c)) return;   // 使用者自己關掉，不用提示
    const why=/network-request-failed/.test(c)?'好像沒有連上網路，請確認網路後再試一次。'

/* 加入主畫面教學動畫：播一次，播完顯示「重新播放」；點步驟可跳到該步並暫停。
   initA2HS(scope, played)：scope 內每個 .a2hs 啟動；played[種類] 為 true 時直接停在播完畫面（避免網頁重畫時一直重播）。 */
function initA2HS(scope, played){
  played=played||{};
  (scope||document).querySelectorAll('.a2hs').forEach(function(root){
    if(root.dataset.ready||(root.closest&&root.closest('details:not([open])'))) return; root.dataset.ready='1';
    var kind=root.classList.contains('and')?'and':(root.classList.contains('ipad')?'ipad':'ios');
    var f=root.querySelector('.finger'), scr=root.querySelector('.scr');
    var plan=JSON.parse(root.dataset.plan), last=Math.max.apply(null,Object.keys(plan).map(Number));
    var s=1, timer=null, ptimer=null, playing=true, btn=root.querySelector('[data-a2="toggle"]');
    var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    function pointAt(k){
      var el=k&&root.querySelector('[data-k="'+k+'"]');
      if(!el||!root.isConnected){f.style.opacity=0;return}
      var a=el.getBoundingClientRect(), b=scr.getBoundingClientRect();
      f.style.left=(a.left-b.left+a.width/2-13)+'px'; f.style.top=(a.top-b.top+a.height/2-13)+'px'; f.style.opacity=1;
      setTimeout(function(){f.classList.remove('tap');void f.offsetWidth;f.classList.add('tap');el.classList.remove('hl');void el.offsetWidth;el.classList.add('hl')},650);
    }
    function setBtn(){btn.textContent=root.classList.contains('ended')?'▶ 重新播放':(playing?'暫停':'▶ 繼續播放')}
    function end(){ playing=false; played[kind]=true; root.classList.add('ended'); f.style.opacity=0; setBtn(); }
    function mark(n){ s=n; root.setAttribute('data-s',n); var c=plan[n].c;
      root.querySelectorAll('.cap li').forEach(function(li,i){li.classList.toggle('on',i===c)}); }
    function go(n){
      if(!root.isConnected) return;
      mark(n); var p=plan[n];
      clearTimeout(ptimer); ptimer=setTimeout(function(){pointAt(p.k)}, p.d);
      clearTimeout(timer);
      if(playing) timer=setTimeout(function(){ if(n>=last) end(); else go(n+1); }, p.t);
    }
    function restart(){ root.classList.remove('ended'); playing=true; setBtn(); go(1); }
    root.querySelector('[data-a2="replay"]').addEventListener('click',restart);
    root.querySelectorAll('.cap li').forEach(function(li){li.addEventListener('click',function(){ root.classList.remove('ended'); playing=false; setBtn(); go(+li.dataset.go); })});
    btn.addEventListener('click',function(){
      if(root.classList.contains('ended')) return restart();
      playing=!playing; setBtn(); if(playing) go(s); else clearTimeout(timer);
    });
    if(played[kind]){ mark(last); end(); return; }
    if(reduce) playing=false;
    setBtn(); go(1);
  });
}
