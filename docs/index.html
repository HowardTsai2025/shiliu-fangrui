    : `<div class="pop"><div>⚠ 你的閱讀進度目前只存在${THIS_DEV}的瀏覽器裡。清除瀏覽器資料或換${DEV}，紀錄會不見。</div><div>${saveWay()}</div><div class="btns">${cloud.ready?'<button class="btn small" id="p-login">用 Google 登入保存</button>':''}<button class="btn ghost small" id="p-set">${cloud.ready?'不登入，改用進度碼':'去產生進度碼'}</button></div></div>`;
  const l=$('#p-login'); if(l) l.onclick=()=>{p.hidden=true; signIn();};
  const s=$('#p-set'); if(s) s.onclick=()=>{p.hidden=true; $('#savechip').setAttribute('aria-expanded','false'); show('set');};
}
$('#savechip').onclick=()=>{const p=$('#popwrap'); p.hidden=!p.hidden; $('#savechip').setAttribute('aria-expanded',String(!p.hidden)); if(!p.hidden) renderPop();};

/* ---------- content rendering ---------- */
function splitRef(v){const m=String(v).match(/[（(]([^（）()]+)[）)]\s*$/); return m?[v.slice(0,m.index).trim(),m[1].trim()]:[v,''];}
function body(items, opener){
  let h='';
  for(let i=0;i<items.length;i++){
    const [k,v]=items[i];
    if(k==='V'){
      let en=''; if(items[i+1]&&items[i+1][0]==='E'){en=items[i+1][1]; i++;}
      if(opener){const [zt,zr]=splitRef(v),[et,er]=splitRef(en);
        h+=`<div class="verse"><div class="zh">${esc(zt)}</div><div class="ref">${esc(zr)}</div>${en?`<div class="en">${esc(et)}</div><div class="eref">${esc(er)}</div>`:''}</div>`;}
      else h+=`<div class="verse"><div class="zh">${esc(v)}</div>${en?`<div class="en">${esc(en)}</div>`:''}</div>`;
    } else if(k==='E'){ h+=`<div class="verse"><div class="en">${esc(v)}</div></div>`; }
    else if(k==='P'){ h+=`<p>${esc(v)}</p>`; }
    else if(k==='H'||k==='L'){
      let x='<div class="hymn">'; if(k==='H'){x+=`<div class="ht">詩歌　${esc(v)}</div>`; i++;}
      while(i<items.length&&items[i][0]==='L'){ const parts=items[i][1].split('|');
        x+='<div class="lyric">'+parts.map((p,j)=>`<span${parts.length===3&&j===0?' class="n"':''}>${esc(p)}</span>`).join('')+'</div>'; i++; }
      h+=x+'</div>'; i--;
    }
  }
  return h;
}
const themeLabel=th=>`（${NUMS[th.i]}）${th.n}`;

function welcomeCard(){
  return `<div class="card"><h2>歡迎使用《石榴放蕊》</h2>
  <p>一天一篇，共 365 篇。</p>
  ${saved()?`<p class="note">✓ 已用 Google 帳號登入（${esc(cloud.user.email||'')}），你的閱讀進度會自動保存。</p>`
    :(A2_FIRST()?`<p class="note">📱建議把網站先加到主畫面，從主畫面打開後再登入，這樣只要登入一次。</p>`:`<p class="note">📌 你的閱讀進度目前只存在${THIS_DEV}。${saveWay()}</p>`)}
  <div class="btns"><button class="btn" id="startnow">從今天開始讀</button>${cloud.ready&&!saved()&&!A2_FIRST()?'<button class="btn ghost" id="w-login">用 Google 登入保存</button>':''}</div></div>`;
}
function a2Card(kind){
  return `<div class="card"><h2>加入主畫面變成 App！</h2>
  ${a2Body(kind)}
  <div class="btns"><button class="btn ghost small" id="ios-ok">知道了，先不用</button></div></div>`;
}
function renderArticle(no){
  const a=ARTS[no], th=a.th, tn=todayNo(), isToday=!!state.start&&no===tn;
  let h='';
  if(!state.start){ if(A2_FIRST()) h+=a2Card(a2Kind()); h+=welcomeCard(); }
  else if(back||!isToday) h+=`<div class="backtoday">${back?`<button class="btn small" id="goback">‹ ${back.v==='search'?`回到搜尋結果「${esc(query.trim())}」`:'回到目錄'}</button>`:''}${!isToday?`<button class="btn ghost small" id="gotoday">回到今日進度（第 ${pad(tn)} 篇）</button>`:''}</div>`;
  if(state.start && a2Kind() && Date.now()>ui.iosHint) h+=a2Card(a2Kind());
  if(th.a[0].no===no) h+=`<section class="opener"><div class="t">${esc(th.n)}</div><div class="note">第 ${pad(th.a[0].no)} 篇 – 第 ${pad(th.a[th.a.length-1].no)} 篇　共 ${th.a.length} 篇</div>${body(th.intro,true)}</section>`;
  h+=`<article class="art"><div class="meta"><span class="num">第 ${pad(no)} 篇</span><span class="tagline">${themeLabel(th)}${isToday?'・今日進度':''}</span></div>
  <h1>${esc(a.t)}</h1><div class="reading">${body(a.b,false)}</div>
  <div class="done-row"><button class="check" id="mark" aria-pressed="${!!state.read[no]}">${state.read[no]?'✓ 已讀完':'○ 標記為已讀'}</button>
  <div class="nav"><button class="btn plain small" id="prev" ${no<=1?'disabled':''}>‹ 上一篇</button><button class="btn plain small" id="next" ${no>=TOTAL?'disabled':''}>下一篇 ›</button></div></div></article>`;
  return h;
}
function renderTOC(){
  const tn=todayNo();
  let h=`<p class="note" style="margin:0 0 14px">已讀 ${readCount()} / ${TOTAL} 篇。</p>`;
  THEMES.forEach(th=>{ const done=th.a.filter(a=>state.read[a.no]).length;
    h+=`<section class="theme-block"><div class="theme-head"><h2>${themeLabel(th)}</h2><span class="c">第 ${pad(th.a[0].no)}–${pad(th.a[th.a.length-1].no)} 篇・已讀 ${done}/${th.a.length}</span><span class="prog" aria-hidden="true"><i style="width:${done/th.a.length*100}%"></i></span></div><ul class="list">`;
    th.a.forEach(a=>{h+=`<li><button data-no="${a.no}" class="${state.start&&a.no===tn?'today':''}"><span class="n">${pad(a.no)}</span><span class="tt">${esc(a.t)}</span>${state.read[a.no]?'<span class="d">✓</span>':''}</button></li>`});
    h+='</ul></section>'; });
  return h;
}
const plainText=a=>a.b.map(x=>String(x[1]).replace(/\|/g,' ')).join(' ');
let query='';
function renderSearch(){ return `<form class="sbox" id="sform"><input class="inp" id="q" type="search" placeholder="輸入關鍵字，例如：慕勒、禱告、詩篇" value="${esc(query)}" autocomplete="off"><button class="btn" type="submit">搜尋</button></form><div id="hits"></div>`; }
function doSearch(){
  const q=query.trim(), box=$('#hits'); if(!box) return;
  if(!q){box.innerHTML='<p class="empty">可以搜尋篇名、內文、經文或詩歌。</p>';return}
  const res=[]; for(let n=1;n<=TOTAL;n++){const a=ARTS[n],t=plainText(a),idx=t.indexOf(q); if(a.t.includes(q)||idx>=0) res.push({a,idx,t});}
  if(!res.length){box.innerHTML=`<p class="empty">找不到「${esc(q)}」。試試較短的關鍵字。</p>`;return}
  const hl=s=>esc(s).split(esc(q)).join(`<mark>${esc(q)}</mark>`);
  box.innerHTML=`<p class="note">找到 ${res.length} 篇</p>`+res.slice(0,200).map(r=>{
    const s=r.idx>=0?(r.idx>20?'…':'')+r.t.slice(Math.max(0,r.idx-20),r.idx+q.length+40)+'…':'';
    return `<button class="hit" data-no="${r.a.no}"><div class="h"><span class="num" style="font-size:calc(12px*var(--k))">${pad(r.a.no)}</span>　${hl(r.a.t)}</div>${s?`<div class="s">${hl(s)}</div>`:''}</button>`}).join('');
}

/* backup code */
function b64u(bytes){let b='';bytes.forEach(x=>b+=String.fromCharCode(x));return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function makeCode(){ const bytes=new Uint8Array(46); let last=-1;
  for(let n=1;n<=TOTAL;n++) if(state.read[n]){bytes[(n-1)>>3]|=1<<((n-1)&7); last=(n-1)>>3;}
  return 'SL1-'+(state.start?state.start.replace(/-/g,''):'00000000')+'-'+(last<0?'0':b64u(bytes.slice(0,last+1))); }
function readCode(raw){ const m=String(raw||'').replace(/\s+/g,'').match(/^SL1-(\d{8})-([A-Za-z0-9_-]+)$/i); if(!m) return null;
  let start=null; if(m[1]!=='00000000'){const y=m[1].slice(0,4),mo=m[1].slice(4,6),d=m[1].slice(6,8),t=new Date(+y,+mo-1,+d); if(t.getMonth()!==+mo-1) return null; start=`${y}-${mo}-${d}`;}
  const read={}; if(m[2]!=='0'){let bytes; try{bytes=unb64u(m[2])}catch(e){return null}
    for(let n=1;n<=TOTAL;n++){const i=(n-1)>>3; if(i<bytes.length&&bytes[i]&(1<<((n-1)&7))) read[n]=true;}}
  return {start,read}; }

function renderSettings(){
  const acct = !cloud.ready ? '' : saved()
    ? `<div class="panel"><h3>帳號</h3><div>✓ 已用 Google 帳號登入：${esc(cloud.user.email||'')}</div><div class="note">你的開始日期、已讀紀錄和配色選擇都存在這個帳號，換手機、平板或電腦，用同一個帳號登入就會回來。</div><div class="btns"><button class="btn ghost small" id="signout">登出</button></div></div>`
    : `<div class="panel"><h3>帳號</h3><div>⚠ 尚未登入，進度只存在${THIS_DEV}。</div><div class="note">登入 Google 帳號是為了保存你的閱讀進度，換${DEV}或清除瀏覽器資料也不會不見。不登入也可以照常閱讀。</div>${IS_IOS&&!STANDALONE?`<div class="note">📱 ${IS_IPAD?'iPad':'iPhone'} 的主畫面 App 和 Safari 是分開的，在這裡登入後，加到主畫面時要再登入一次。</div>`:''}<div class="btns"><button class="btn small" id="signin">用 Google 登入保存</button></div></div>`;
  return acct + `<div class="panel"><h3>閱讀進度</h3>
   <div class="row"><label class="l" for="startd">開始日期</label><label class="datebox"><span id="startshow">${state.start?state.start.replace(/-/g,'/'):'尚未開始'}</span><input type="date" id="startd" value="${state.start||''}" aria-label="開始日期"></label><button class="btn small" id="savestart">儲存</button></div>
   <div class="row"><span class="note">已讀 ${readCount()} 篇</span><span id="resetwrap"><button class="btn ghost small" id="reset">清除已讀紀錄</button></span></div></div>
  ${a2Kind()?`<div class="panel"><h3>加入主畫面變成 App！</h3>${a2Body(a2Kind())}</div>`:''}
  <div class="panel"><h3>外觀</h3>
   <div class="row"><label class="l">配色</label><div class="sw">${PALETTES.map(([k,n,c])=>`<button data-pal="${k}" aria-pressed="${prefs.palette===k}"><i>${c.map(x=>`<b style="background:${x}"></b>`).join('')}</i>${n}</button>`).join('')}</div></div>
   <div class="row"><label class="l">深淺</label><div class="seg">${[['system','跟隨系統'],['light','淺色'],['dark','深色']].map(([k,n])=>`<button data-th="${k}" aria-pressed="${prefs.theme===k}">${n}</button>`).join('')}</div></div>
   <div class="row"><label class="l">字體大小</label><div class="seg">${[16,18,20,22].map((s,i)=>`<button data-fs="${s}" aria-pressed="${prefs.fs===s}">${['小','中','大','特大'][i]}</button>`).join('')}</div></div>
   <div class="note">預覽（文章的字會是這個大小）：</div>
   <div class="fsprev">耶和華阿，早晨你必聽我的聲音；早晨我必向你陳明我的心意，並要守望。</div></div>
  <div class="panel"><h3>進度碼（不登入也能備份）</h3>
   <div class="note">換${DEV}或清除瀏覽器資料前，先按「產生進度碼」，把那串碼存到 LINE 或備忘錄。之後貼回下面就能還原開始日期和已讀紀錄。</div>
   <div class="row"><button class="btn small" id="mkcode">產生進度碼</button></div>
   <div class="row" id="coderow" hidden><input class="inp" id="codeout" readonly style="font-family:monospace"><button class="btn ghost small" id="copycode">複製</button></div>
   <div class="row"><input class="inp" id="codein" placeholder="貼上進度碼，例如 SL1-20261024-…"><button class="btn small" id="usecode">還原</button></div>
   <div class="note" id="restoremsg" role="status"></div></div>
  <div class="note" style="text-align:center;opacity:.7">版本 v14</div>
`;
}

/* ---------- views ---------- */
let view='today', cur=null;
function show(v,no){
  view=v; if(no) cur=no;
  ['today','toc','search','set'].forEach(k=>$('#t-'+k).setAttribute('aria-pressed',String(k===v)));
  const el=$('#view');
  if(v==='today') el.innerHTML=renderArticle(cur||todayNo());
  else if(v==='toc') el.innerHTML=renderTOC();
  else if(v==='search'){el.innerHTML=renderSearch(); doSearch();}
  else el.innerHTML=renderSettings();
  el.classList.remove('view'); void el.offsetWidth; el.classList.add('view');
  bind();
}
/* 目錄和搜尋結果的點擊統一在這裡處理（搜尋結果是打字時才產生的，逐一綁定會漏掉） */
let back=null; // 從搜尋或目錄點進文章時，記住要回去哪裡、捲到哪
document.getElementById('view').addEventListener('click',e=>{ const b=e.target.closest('[data-no]'); if(!b) return;
  if(view==='search'||view==='toc') back={v:view,y:window.scrollY}; open(+b.dataset.no); });
const rerender=()=>show(view, view==='today'?(cur||todayNo()):undefined);
function open(no){ cur=no; show('today',no); window.scrollTo({top:0}); try{history.replaceState(null,'','#a'+no)}catch(e){} }
function setRead(n,on){ if(on) state.read[n]=true; else delete state.read[n]; lsSet('sl-progress',state);
  if(on) cloudWrite({read:{[n]:true}}); else cloudUnread(n); }

function bind(){
  const on=(id,f)=>{const e=document.getElementById(id); if(e) e.onclick=f;};
  on('startnow',()=>{state.start=todayStr(); lsSet('sl-progress',state); cloudWrite({start:state.start}); cur=todayNo(); show('today',cur)});
  on('w-login',signIn); on('signin',signIn); on('signout',signOut);
  on('ios-ok',()=>{ui.iosHint=Date.now()+30*86400000; saveUI(); rerender();});
  on('gotoday',()=>{back=null; open(todayNo())});
  on('goback',()=>{const b=back; back=null; if(!b) return; show(b.v); window.scrollTo({top:b.y});});
  on('a2-install',async()=>{ const p=installPrompt; if(!p) return; installPrompt=null; p.prompt(); try{ await p.userChoice; }catch(e){} rerender(); });
  const more=document.getElementById('a2-more'); if(more) more.addEventListener('toggle',()=>{ if(more.open) initA2HS(more,A2PLAYED); });
  initA2HS(document.getElementById('view'),A2PLAYED);
  on('prev',()=>open((cur||todayNo())-1)); on('next',()=>open((cur||todayNo())+1));
  on('mark',()=>{const n=cur||todayNo(), was=!!state.read[n]; setRead(n,!was); show('today',n); if(!was) afterMark(n);});
  const f=$('#sform'); if(f){ f.onsubmit=e=>{e.preventDefault(); query=$('#q').value; doSearch()}; $('#q').oninput=e=>{query=e.target.value; doSearch()}; }
  const sd=$('#startd'); if(sd){ sd.addEventListener('input',()=>{$('#startshow').textContent=sd.value?sd.value.replace(/-/g,'/'):'尚未開始'});
    sd.addEventListener('click',()=>{try{sd.showPicker&&sd.showPicker()}catch(e){}}); }
  on('savestart',()=>{const v=$('#startd').value; if(v){state.start=v; cur=null; lsSet('sl-progress',state); cloudWrite({start:v}); show('set')}});
  document.querySelectorAll('[data-pal]').forEach(b=>b.onclick=()=>{prefs.palette=b.dataset.pal; applyPrefs(true); show('set')});
  document.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{prefs.theme=b.dataset.th; applyPrefs(true); show('set')});
  document.querySelectorAll('[data-fs]').forEach(b=>b.onclick=()=>{const y0=b.getBoundingClientRect().top; prefs.fs=+b.dataset.fs; applyPrefs(false); show('set');
    const nb=document.querySelector('[data-fs="'+prefs.fs+'"]'); if(nb) window.scrollBy(0,nb.getBoundingClientRect().top-y0); });
  on('reset',()=>{$('#resetwrap').innerHTML='<span class="confirm">確定清除全部已讀紀錄？<button class="btn small" id="resetyes">清除</button><button class="btn ghost small" id="resetno">取消</button></span>'; bind();});
  on('resetyes',()=>{state.read={}; lsSet('sl-progress',state); if(cloud.ref) cloud.ref.update({read:{},updatedAt:Date.now()}).catch(()=>{}); show('set')});
  on('resetno',()=>show('set'));
  on('mkcode',()=>{$('#coderow').hidden=false; $('#codeout').value=makeCode(); $('#codeout').select();});
  on('copycode',()=>{const el=$('#codeout'); const fail=()=>{el.select(); $('#restoremsg').textContent='請長按上面那串碼，選「複製」。'};
    try{navigator.clipboard.writeText(el.value).then(()=>{$('#copycode').textContent='已複製'}).catch(fail)}catch(e){fail()}});
  on('usecode',()=>{const r=readCode($('#codein').value);
    if(!r){$('#restoremsg').textContent='這串碼看起來不完整。請確認是從「產生進度碼」複製的整串文字，開頭是 SL1-。';return}
    state.start=r.start; state.read=r.read; cur=null; lsSet('sl-progress',state);
    if(cloud.ref) cloud.ref.set({start:r.start,read:r.read,updatedAt:Date.now()},{merge:false}).then(()=>cloudWrite({palette:prefs.palette,theme:prefs.theme})).catch(()=>{});
    show('set'); $('#restoremsg').textContent=`已還原：${r.start?'開始日期 '+r.start+'，':''}已讀 ${Object.keys(r.read).length} 篇。`;});
}
/* 分頁列：按一下切換頁面；連按兩下回到頁首 */
const SMOOTH=!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function toTop(){ const a=document.activeElement; if(a&&a.blur&&a!==document.body) a.blur(); window.scrollTo({top:0,behavior:SMOOTH?'smooth':'auto'}); }
let lastTap={id:'',t:0};
function tab(id,fn){ $('#'+id).onclick=()=>{ const now=Date.now();
  if(lastTap.id===id && now-lastTap.t<450){ lastTap={id:'',t:0}; toTop(); return; }
  lastTap={id,t:now}; fn(); }; }
const goToday=()=>{back=null; cur=todayNo(); show('today')};
tab('t-today',goToday);
tab('t-toc',()=>{back=null; show('toc')});
tab('t-search',()=>{back=null; show('search'); const q=$('#q'); if(q) q.focus()});
tab('t-set',()=>{back=null; show('set')});
/* 點標題「石榴放蕊」或 Logo：回到今日進度（像回首頁） */
const brand=$('#brand'); brand.onclick=()=>{ goToday(); window.scrollTo({top:0}); };
brand.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); brand.onclick(); } };

/* iPhone：在搜尋等輸入框打字、收起鍵盤後，固定在下方的分頁列有時會「漂浮」在畫面中間。
   鍵盤收起後把畫面輕推一下，讓 Safari 重新算位置。 */
const isField=el=>!!el&&el.matches&&el.matches('input:not([type=checkbox]):not([type=radio]):not([type=button]):not([type=submit]),textarea,select');
function settle(){ const max=Math.max(0,document.documentElement.scrollHeight-window.innerHeight); window.scrollTo(0,Math.min(window.scrollY,max)); }
document.addEventListener('focusout',e=>{ if(!isField(e.target)) return;
  setTimeout(()=>{ if(!isField(document.activeElement)){ settle(); setTimeout(settle,300); } },60); });
if(window.visualViewport) visualViewport.addEventListener('resize',()=>{ if(!isField(document.activeElement)) settle(); });

applyPrefs(false);
const hm=(location.hash||'').match(/^#a(\d{1,3})$/);
if(hm&&+hm[1]>=1&&+hm[1]<=TOTAL) cur=+hm[1];
show('today',cur||todayNo()); refreshChrome();
initCloud();
})();
</script>
